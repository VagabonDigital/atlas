<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Account</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20x%3D%275%27%20y%3D%275%27%20width%3D%2790%27%20height%3D%2790%27%20rx%3D%2724%27%20fill%3D%27%233F7FA3%27%2F%3E%3Cpath%20d%3D%27M20%2080V48C20%2028%2033%2015%2050%2015S80%2028%2080%2048V80H65V49C65%2039%2059%2033%2050%2033S35%2039%2035%2049V80Z%27%20fill%3D%27%23FFFFFF%27%2F%3E%3Cpath%20d%3D%27M16%2080H84%27%20stroke%3D%27%23DFF4FC%27%20stroke-width%3D%278%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E"
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #2b2926;
      background: #f3f0e9;
      --surface: #fffdf9;
      --border: rgba(49,45,38,.14);
      --muted: #7b7469;
      --accent: #4d7184;
      --accent-soft: #6f8e9e;
      --danger: #a43d32;
      --success: #4f7664;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 0%, rgba(77,113,132,.10), transparent 28rem),
        #f3f0e9;
    }

    .shell {
      width: min(500px, 100%);
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 2.3rem;
      font-weight: 400;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 18px 48px rgba(42,37,29,.08);
    }

    .status {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(77,113,132,.08);
      color: #4f4a43;
      line-height: 1.45;
      min-height: 46px;
    }

    .status.error {
      background: #fbf1f0;
      color: var(--danger);
    }


    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
      font-size: .9rem;
    }

    input, button {
      width: 100%;
      min-height: 46px;
      border-radius: 11px;
      font: inherit;
    }

    input {
      padding: 0 13px;
      border: 1px solid var(--border);
      background: white;
      color: #2b2926;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(77,113,132,.10);
    }

    button {
      margin-top: 16px;
      border: 0;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: .58;
      cursor: wait;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .primary:hover:not(:disabled) { background: var(--accent-soft); }

    .secondary {
      background: transparent;
      color: #4f4a43;
      border: 1px solid var(--border);
    }

    .actions { display: grid; gap: 10px; }

    .account-view[hidden],
    .login-view[hidden] { display: none; }

    .email {
      font-weight: 600;
      overflow-wrap: anywhere;
    }

  </style>

  <script src="../shared/atlas-cloud.js"></script>
  <script src="../shared/atlas-account.js"></script>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <h1>Atlas</h1>
      <p>Save and access your Atlas work.</p>
    </div>

    <section class="card">
      <div id="status" class="status">Checking your Atlas account…</div>

      <div id="login-view" class="login-view" hidden>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">

        <button id="sign-in" class="primary">Sign in</button>
      </div>

      <div id="account-view" class="account-view" hidden>
        <p>Signed in as</p>
        <p id="account-email" class="email"></p>

        <div class="actions">
          <button id="return" class="primary">Return to Atlas</button>
          <button id="sign-out" class="secondary">Sign out</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    'use strict';

    const Status = document.getElementById('status');
    const LoginView = document.getElementById('login-view');
    const AccountView = document.getElementById('account-view');
    const AccountEmail = document.getElementById('account-email');
    const Email = document.getElementById('email');
    const Password = document.getElementById('password');
    const SignIn = document.getElementById('sign-in');
    const SignOut = document.getElementById('sign-out');

    function setStatus(message, error = false) {
      Status.textContent = message;
      Status.classList.toggle('error', error);
    }

    function render(state) {
      LoginView.hidden = state.authenticated;
      AccountView.hidden = !state.authenticated;

      if (state.authenticated) {
        AccountEmail.textContent = state.email || state.userId || 'Atlas account';
        setStatus('Your Atlas account is connected.');
      } else if (state.ready) {
        AccountEmail.textContent = '';
        setStatus('Sign in to access your Atlas account.');
      }
    }

    AtlasAccount.subscribe(render);

    (async () => {
      try {
        await AtlasAccount.initialize();
      } catch (error) {
        setStatus(error.message || String(error), true);
      }
    })();

    SignIn.addEventListener('click', async () => {
      SignIn.disabled = true;
      setStatus('Signing in…');

      try {
        await AtlasAccount.signIn(Email.value, Password.value);
        Password.value = '';
      } catch (error) {
        setStatus(error.message || String(error), true);
      } finally {
        SignIn.disabled = false;
      }
    });

    SignOut.addEventListener('click', async () => {
      SignOut.disabled = true;
      setStatus('Signing out…');

      try {
        await AtlasAccount.signOut();
      } catch (error) {
        setStatus(error.message || String(error), true);
      } finally {
        SignOut.disabled = false;
      }
    });

    document.getElementById('return').addEventListener('click', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
