<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Inbox</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20x%3D%275%27%20y%3D%275%27%20width%3D%2790%27%20height%3D%2790%27%20rx%3D%2724%27%20fill%3D%27%233F7FA3%27%2F%3E%3Cpath%20d%3D%27M20%2080V48C20%2028%2033%2015%2050%2015S80%2028%2080%2048V80H65V49C65%2039%2059%2033%2050%2033S35%2039%2035%2049V80Z%27%20fill%3D%27%23FFFFFF%27%2F%3E%3Cpath%20d%3D%27M16%2080H84%27%20stroke%3D%27%23DFF4FC%27%20stroke-width%3D%278%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root{--surface:#f5f1e9;--raised:#fffdf9;--muted-surface:#ece7de;--border:rgba(61,56,48,.14);--heading:#1e1b16;--body:#514b42;--muted:#7a7268;--accent:#4f7772;--danger:#b43b32;--display:'DM Serif Display',Georgia,serif;--font:'DM Sans',system-ui,sans-serif}
    *{box-sizing:border-box}html{-webkit-tap-highlight-color:transparent}html,body{min-height:100%}body{margin:0;background:var(--surface);color:var(--body);font-family:var(--font)}[hidden]{display:none!important}
    .memory-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 1.5rem;border-bottom:1px solid rgba(49,45,38,.10);background:rgba(243,240,233,.88);backdrop-filter:blur(18px) saturate(1.08);-webkit-backdrop-filter:blur(18px) saturate(1.08)}
    .memory-brand{font-family:var(--display);font-size:1.22rem;color:#211f1b;letter-spacing:-.01em;text-decoration:none}.memory-brand span{color:#4d7184}.inbox-lock{display:inline-flex;align-items:center;gap:.42rem;padding:.42rem .62rem;border:1px solid transparent;border-radius:999px;background:transparent;color:#7b7469;font-size:.76rem;font-weight:600;letter-spacing:.01em;transition:color .18s ease,background .18s ease,border-color .18s ease,transform .18s ease}.inbox-lock svg{width:13px;height:13px;transition:transform .18s ease}.inbox-lock:hover{border-color:rgba(77,113,132,.14);background:rgba(77,113,132,.07);color:#315568;transform:translateY(-1px)}.inbox-lock:hover svg{transform:translateY(-1px)}.inbox-lock:focus-visible{outline:2px solid rgba(77,113,132,.34);outline-offset:2px}
    .inbox-main{min-height:calc(100svh - 56px)}.access-screen{min-height:calc(100svh - 56px);display:grid;place-items:center;padding:2.5rem 1rem 5rem}.access-inner{width:min(540px,100%);text-align:center;transform:translateY(-2vh)}.access-kicker{margin-bottom:.75rem;color:var(--accent);font-size:.68rem;font-weight:600;letter-spacing:.17em;text-transform:uppercase}.access-title{margin:0;color:var(--heading);font-family:var(--display);font-size:clamp(2.9rem,7vw,4.65rem);font-weight:400;line-height:1.02;letter-spacing:-.02em}.access-copy{max-width:34rem;margin:1rem auto 1.8rem;color:var(--muted);font-size:1rem;line-height:1.6}.access-form{width:min(430px,100%);margin:0 auto}.access-row{display:flex;align-items:stretch;gap:.6rem}.password-wrap{position:relative;flex:1;min-width:0}.password-wrap input{height:48px;padding-right:3rem}.password-toggle{position:absolute;top:50%;right:.42rem;width:38px;height:38px;padding:0;transform:translateY(-50%);display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--muted);box-shadow:none}.password-toggle:hover{background:var(--muted-surface);color:var(--heading)}.password-toggle svg{display:block}.password-toggle .eye-off{display:none}.password-toggle.is-visible .eye-on{display:none}.password-toggle.is-visible .eye-off{display:block}.open-inbox{min-width:118px;white-space:nowrap}.login-status{min-height:1.3rem;margin:.8rem 0 0;color:var(--muted);font-size:.82rem}.login-status:empty{visibility:hidden}.login-status.error{color:var(--danger)}
    .inbox-shell{width:min(860px,calc(100% - 2rem));margin:0 auto;padding:4rem 0 6rem}.inbox-title{margin:0;color:var(--heading);font-family:var(--display);font-size:clamp(2.8rem,7vw,4.8rem);font-weight:400;line-height:1}.lede{margin:1rem 0 2.25rem;color:var(--muted)}.inbox-status{margin:-1.25rem 0 1.5rem;color:var(--muted);font-size:.86rem}.inbox-status:empty{display:none}.inbox-status.error{color:var(--danger)}
    input{width:100%;min-width:0;padding:.78rem .88rem;border:1px solid var(--border);border-radius:10px;outline:none;background:var(--raised);color:var(--heading);font:inherit}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,119,114,.08)}
    button{padding:.78rem 1rem;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.55;cursor:default}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem}.count{color:var(--muted);font-size:.84rem;font-weight:500}.toolbar-action{padding:.52rem .72rem;border:1px solid var(--border);background:transparent;color:var(--accent);font-size:.8rem}
    .message-list{display:grid;gap:1rem}.message-card{padding:1.35rem 1.4rem;border:1px solid var(--border);border-radius:16px;background:var(--raised)}.message-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.45rem}.sender{color:var(--heading);font-size:.92rem;font-weight:600}.date{color:var(--muted);font-size:.76rem}.message{margin:.65rem 0 1rem;color:var(--heading);font-size:1rem;line-height:1.65;white-space:pre-wrap}.footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem;min-height:1.5rem}.reply-link{color:var(--accent);font-size:.82rem;font-weight:500;text-decoration:none}.reply-link:hover{text-decoration:underline}.delete-action{padding:.35rem 0;border:0;border-radius:0;background:transparent;color:var(--danger);font-size:.78rem;font-weight:500}.delete-action:hover:not(:disabled){text-decoration:underline}.empty{padding:2rem;border:1px dashed var(--border);border-radius:16px;color:var(--muted);text-align:center}
    dialog{padding:0;border:1px solid var(--border);border-radius:16px;background:var(--raised);color:var(--body);box-shadow:0 24px 70px rgba(20,17,12,.18)}dialog::backdrop{background:rgba(30,27,22,.42);backdrop-filter:blur(3px)}.confirm-dialog{width:min(380px,calc(100% - 2rem))}.dialog-content{padding:1.4rem}.dialog-title{margin:0;color:var(--heading);font-family:var(--display);font-size:1.55rem;font-weight:400}.dialog-copy{margin:.5rem 0 1.25rem;color:var(--muted);font-size:.88rem;line-height:1.55}.dialog-actions{display:flex;justify-content:flex-end;gap:.65rem}.dialog-cancel{border:1px solid var(--border);background:transparent;color:var(--body)}.dialog-delete{background:var(--danger)}
    @media(max-width:680px){.memory-header{padding:0 1rem}.access-screen{padding:2rem 1rem 4rem}.access-inner{transform:none}.access-row{flex-direction:column}.open-inbox{width:100%}.inbox-shell{padding-top:2.5rem}.toolbar{align-items:flex-start}}
  </style>
</head>
<body>
  <header class="memory-header">
    <a class="memory-brand" href="../index.html">Atlas<span>.</span></a>
    <button class="inbox-lock" id="lock-inbox" type="button" hidden aria-label="Lock Atlas inbox">
      <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <rect x="2.5" y="6" width="9" height="6" rx="2" stroke="currentColor" stroke-width="1.25"/>
        <path d="M4.5 6V4.7a2.5 2.5 0 0 1 5 0V6" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
      <span>Lock inbox</span>
    </button>
  </header>

  <main class="inbox-main">
    <section class="access-screen" id="access" aria-labelledby="access-title">
      <div class="access-inner">
        <div class="access-kicker">Atlas inbox</div>
        <h1 class="access-title" id="access-title">Welcome back.</h1>
        <p class="access-copy">Enter the Atlas inbox password to continue.</p>
        <form class="access-form" id="access-form" autocomplete="off">
          <div class="access-row">
            <div class="password-wrap">
              <input id="inbox-key" type="password" autocomplete="off" placeholder="Enter inbox password" aria-label="Inbox password" spellcheck="false">
              <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
                <svg class="eye-on" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                  <path d="M2 9s2.5-4 7-4 7 4 7 4-2.5 4-7 4-7-4-7-4Z" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.35"/>
                </svg>
                <svg class="eye-off" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                  <path d="M3 3l12 12" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
                  <path d="M7.1 5.3A8.4 8.4 0 0 1 9 5c4.5 0 7 4 7 4a10.8 10.8 0 0 1-2.3 2.5M10.9 12.7A8.5 8.5 0 0 1 9 13c-4.5 0-7-4-7-4a10.7 10.7 0 0 1 2.4-2.6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <button class="open-inbox" id="load-button" type="submit">Open inbox</button>
          </div>
        </form>
        <div class="login-status" id="login-status" role="status" aria-live="polite"></div>
      </div>
    </section>

    <div class="inbox-shell" id="inbox-shell" hidden>
      <h1 class="inbox-title">Atlas inbox.</h1>
      <p class="lede">Messages sent to the Atlas team.</p>
      <div class="inbox-status" id="inbox-status" role="status" aria-live="polite"></div>
      <div class="toolbar">
        <span class="count" id="message-count"></span>
        <button class="toolbar-action" id="refresh-button" type="button">Refresh</button>
      </div>
      <div class="message-list" id="message-list"></div>
    </div>
  </main>

  <dialog class="confirm-dialog" id="confirm-dialog">
    <div class="dialog-content">
      <h2 class="dialog-title" id="confirm-title">Delete this message?</h2>
      <p class="dialog-copy" id="confirm-copy">This can’t be undone.</p>
      <div class="dialog-actions">
        <button class="dialog-cancel" id="confirm-cancel" type="button">Keep it</button>
        <button class="dialog-delete" id="confirm-delete" type="button">Delete</button>
      </div>
    </div>
  </dialog>

  <script>
  (function(){
    'use strict';

    const ENDPOINT='https://atlas-ai.savvy989.workers.dev/feedback';
    const KEY_STORE='atlas::feedbackAdminKey';
    const $=id=>document.getElementById(id);

    const access=$('access');
    const accessForm=$('access-form');
    const keyInput=$('inbox-key');
    const passwordToggle=$('password-toggle');
    const lockInboxButton=$('lock-inbox');
    const loadButton=$('load-button');
    const loginStatus=$('login-status');
    const shell=$('inbox-shell');
    const inboxStatus=$('inbox-status');
    const messageCount=$('message-count');
    const messageList=$('message-list');
    const refreshButton=$('refresh-button');
    const confirmDialog=$('confirm-dialog');
    const confirmCancel=$('confirm-cancel');
    const confirmDelete=$('confirm-delete');

    let messages=[];
    let activeKey='';

    const clean=value=>typeof value==='string'?value.trim():'';
    const headers=()=>({Authorization:'Bearer '+activeKey});
    const readJson=async response=>{try{return await response.json()}catch{return null}};
    const formatDate=value=>{const date=new Date(value);return Number.isNaN(date.getTime())?clean(value):date.toLocaleString()};

    function setLoginStatus(message,error=false){
      loginStatus.className='login-status'+(error?' error':'');
      loginStatus.textContent=message||'';
    }

    function setInboxStatus(message,error=false){
      inboxStatus.className='inbox-status'+(error?' error':'');
      inboxStatus.textContent=message||'';
    }

    function askDelete(){
      return new Promise(resolve=>{
        const finish=value=>{
          confirmDialog.close();
          confirmCancel.removeEventListener('click',cancel);
          confirmDelete.removeEventListener('click',confirm);
          confirmDialog.removeEventListener('cancel',cancel);
          resolve(value);
        };
        const cancel=event=>{event?.preventDefault();finish(false)};
        const confirm=()=>finish(true);
        confirmCancel.addEventListener('click',cancel);
        confirmDelete.addEventListener('click',confirm);
        confirmDialog.addEventListener('cancel',cancel);
        confirmDialog.showModal();
      });
    }

    function renderMessages(){
      messageList.innerHTML='';
      messageCount.textContent=messages.length+' message'+(messages.length===1?'':'s');

      if(!messages.length){
        messageList.innerHTML='<div class="empty">No messages yet.</div>';
        return;
      }

      messages.forEach(item=>{
        const card=document.createElement('article');
        card.className='message-card';

        const head=document.createElement('div');
        head.className='message-head';

        const sender=document.createElement('span');
        sender.className='sender';
        sender.textContent=clean(item?.replyName)||clean(item?.replyEmail)||'Unknown sender';

        const date=document.createElement('time');
        date.className='date';
        date.dateTime=clean(item?.submittedAt);
        date.textContent=formatDate(item?.submittedAt||item?.clientTimestamp);

        head.append(sender,date);

        const message=document.createElement('p');
        message.className='message';
        message.textContent=clean(item?.message)||'Empty message';

        const footer=document.createElement('div');
        footer.className='footer';

        const email=clean(item?.replyEmail);
        if(email){
          const reply=document.createElement('a');
          reply.className='reply-link';
          reply.href='mailto:'+email;
          reply.textContent='Reply to '+email;
          footer.appendChild(reply);
        }else{
          footer.appendChild(document.createElement('span'));
        }

        const remove=document.createElement('button');
        remove.className='delete-action';
        remove.type='button';
        remove.textContent='Delete';
        remove.addEventListener('click',()=>deleteMessage(item,remove));
        footer.appendChild(remove);

        card.append(head,message,footer);
        messageList.appendChild(card);
      });
    }

    async function loadMessages(){
      refreshButton.disabled=true;
      try{
        const response=await fetch(ENDPOINT,{headers:headers()});
        const result=await readJson(response);
        if(!response.ok||result?.ok!==true)throw new Error(result?.error||'Could not load messages.');
        messages=Array.isArray(result.feedback)?result.feedback:[];
        renderMessages();
      }finally{
        refreshButton.disabled=false;
      }
    }

    async function authenticate(secret,silent=false){
      const candidate=clean(secret);
      if(!candidate)return false;

      activeKey=candidate;
      loadButton.disabled=true;
      if(!silent)setLoginStatus('Opening…');

      try{
        await loadMessages();
        sessionStorage.setItem(KEY_STORE,candidate);
        keyInput.value='';
        keyInput.type='password';
        passwordToggle.classList.remove('is-visible');
        passwordToggle.setAttribute('aria-pressed','false');
        passwordToggle.setAttribute('aria-label','Show password');
        passwordToggle.title='Show password';
        access.hidden=true;
        shell.hidden=false;
        lockInboxButton.hidden=false;
        setLoginStatus('');
        setInboxStatus('');
        window.scrollTo({top:0});
        return true;
      }catch(error){
        activeKey='';
        if(silent){
          sessionStorage.removeItem(KEY_STORE);
          keyInput.value='';
          setLoginStatus('');
        }else{
          setLoginStatus(error?.message||'Could not open Atlas inbox.',true);
        }
        return false;
      }finally{
        loadButton.disabled=false;
      }
    }

    function lockInbox(){
      sessionStorage.removeItem(KEY_STORE);
      activeKey='';
      messages=[];
      messageList.innerHTML='';
      messageCount.textContent='';
      shell.hidden=true;
      access.hidden=false;
      lockInboxButton.hidden=true;
      keyInput.value='';
      keyInput.type='password';
      passwordToggle.classList.remove('is-visible');
      passwordToggle.setAttribute('aria-pressed','false');
      passwordToggle.setAttribute('aria-label','Show password');
      passwordToggle.title='Show password';
      setInboxStatus('');
      setLoginStatus('');
      window.scrollTo({top:0});
      requestAnimationFrame(()=>keyInput.focus({preventScroll:true}));
    }

    async function openInbox(){
      const secret=clean(keyInput.value);
      if(!secret){
        setLoginStatus('Enter the inbox password.',true);
        keyInput.focus();
        return;
      }
      await authenticate(secret,false);
    }

    async function deleteMessage(item,button){
      const submittedAt=clean(item?.submittedAt);
      const id=clean(item?.id);

      if(!submittedAt||!id){
        setInboxStatus('This message cannot be deleted.',true);
        return;
      }

      if(!await askDelete())return;

      button.disabled=true;
      button.textContent='Deleting…';

      try{
        const params=new URLSearchParams({submittedAt,id});
        const response=await fetch(ENDPOINT+'?'+params.toString(),{method:'DELETE',headers:headers()});
        const result=await readJson(response);
        if(!response.ok||result?.ok!==true)throw new Error(result?.error||'Could not delete message.');
        messages=messages.filter(message=>message!==item);
        renderMessages();
        setInboxStatus('');
      }catch(error){
        setInboxStatus(error?.message||'Could not delete message.',true);
        button.disabled=false;
        button.textContent='Delete';
      }
    }

    passwordToggle.addEventListener('click',()=>{
      const visible=keyInput.type==='text';
      keyInput.type=visible?'password':'text';
      passwordToggle.classList.toggle('is-visible',!visible);
      passwordToggle.setAttribute('aria-pressed',String(!visible));
      passwordToggle.setAttribute('aria-label',visible?'Show password':'Hide password');
      passwordToggle.title=visible?'Show password':'Hide password';
      keyInput.focus({preventScroll:true});
    });

    accessForm.addEventListener('submit',event=>{event.preventDefault();openInbox()});
    lockInboxButton.addEventListener('click',lockInbox);
    refreshButton.addEventListener('click',async()=>{
      try{
        setInboxStatus('Refreshing…');
        await loadMessages();
        setInboxStatus('');
      }catch(error){
        setInboxStatus(error?.message||'Could not refresh messages.',true);
      }
    });

    keyInput.value='';
    const remembered=clean(sessionStorage.getItem(KEY_STORE));
    if(remembered)authenticate(remembered,true);
  })();
  </script>
</body>
</html>
