<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine One workbench</title>
<link rel="stylesheet" href="../shared-plan/stage/kits/tokens.css" data-sp-stage>
<link rel="stylesheet" href="../shared-plan/stage/render/stage.css" data-sp-stage>
<link rel="stylesheet" href="./workbench.css">
<script type="module" src="./workbench.js"></script>
</head>
<body>
<header class="wb-bar">
  <h1>Engine One <span>workbench</span></h1>
  <form class="wb-controls" id="controls">
    <label>Revision
      <select name="revision" id="revision"></select>
    </label>
    <label>Frame
      <select name="frame" id="frame"></select>
    </label>
    <label>Appearance
      <select name="appearance" id="appearance">
        <option value="light">Day</option>
        <option value="night">Night</option>
      </select>
    </label>
  </form>
</header>

<main class="wb-main">
  <div class="wb-stage-column">
    <section class="wb-stage" id="stage" aria-label="Stage"></section>
    <p class="wb-error" id="error" hidden></p>
    <p class="wb-note" id="note"></p>
  </div>

  <aside class="wb-side">
    <section>
      <h2>Revision</h2>
      <dl id="identity" class="wb-facts"></dl>
    </section>
    <section>
      <h2>Beat Control</h2>
      <p class="wb-aside-note">Tutor chrome. Core draws this outside the world; the Stage never does.</p>
      <div id="beat" class="wb-beat"></div>
    </section>
    <section>
      <h2>Frame</h2>
      <dl id="frame-facts" class="wb-facts"></dl>
    </section>
  </aside>
</main>
</body>
</html>
