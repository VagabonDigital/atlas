<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Two Keys · Atlas Arcade</title>
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='5' y='5' width='90' height='90' rx='24' fill='%23DF572F'/%3E%3Ccircle cx='50' cy='28' r='9' fill='%23FFF1E9'/%3E%3Cpath d='M50 38V62' stroke='%23FFF1E9' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M30 61H70L77 79H23L30 61Z' fill='%23FFF1E9'/%3E%3Ccircle cx='64' cy='69' r='4.2' fill='%23F2C6B5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../shared/arcade-game-chrome.css" />
    <link rel="stylesheet" href="../../shared/atlas-modal-theme.css" />
    <link rel="stylesheet" href="../../shared/atlas-session-panel.css" />
    <link rel="stylesheet" href="../../shared/atlas-search.css" />
    <link rel="stylesheet" href="game.css" />
    <style>
      /* Two Keys is an authored night experience. Keep shared Arcade chrome
         subordinate to the heist cover instead of turning it into a toolbar. */
      #landing-chrome .arcade-game-chrome-appearance {
        display: none;
      }

      #landing-chrome .arcade-game-chrome-back,
      #landing-chrome .arcade-game-chrome-session {
        min-height: 32px;
        box-shadow: none;
        transform: none;
      }

      #landing-chrome .arcade-game-chrome-back {
        top: 1.35rem;
        left: 7%;
        padding: 0.4rem 0.62rem;
        border-color: rgba(255, 255, 255, 0.08);
        background: rgba(8, 14, 20, 0.52);
      }

      #landing-chrome .arcade-game-chrome-actions {
        top: 1.35rem;
        right: 7%;
      }

      #landing-chrome .arcade-game-chrome-session {
        height: 32px;
        padding: 0.4rem 0.72rem;
        border-color: rgba(255, 255, 255, 0.14);
        background: rgba(8, 14, 20, 0.62);
        color: rgba(231, 237, 241, 0.72);
      }

      #landing-chrome .arcade-game-chrome-back:hover,
      #landing-chrome .arcade-game-chrome-session:hover {
        border-color: rgba(217, 174, 102, 0.42);
        background: rgba(15, 24, 32, 0.82);
        color: #eef4f7;
        box-shadow: none;
      }

      @media (min-width: 801px) {
        .entrance {
          min-height: 100svh;
          padding: 72px 7% 26px;
        }

        .hero-copy {
          min-height: 0;
        }

        .hero-copy h1 {
          font-size: clamp(52px, 5vw, 78px);
          margin: 12px 0 8px;
        }

        .tagline {
          font-size: clamp(38px, 3.2vw, 50px);
        }

        .intro {
          margin: 14px 0;
        }

        .hero-meta {
          margin-top: 14px;
        }

        .library {
          margin-top: 18px;
        }

        .section-title {
          margin-bottom: 12px;
        }

        .mission-art {
          height: 128px;
        }
      }

      @media (min-width: 1600px) {
        .entrance {
          padding-top: 72px;
        }

        .hero-copy {
          min-height: 0;
        }

        .mission-art {
          height: 132px;
        }
      }

      @media (max-width: 800px) {
        #landing-chrome .arcade-game-chrome-back {
          left: 20px;
        }

        #landing-chrome .arcade-game-chrome-actions {
          right: 20px;
        }
      }
    </style>
  </head>
  <body
    data-player="tutor"
    data-atlas-world="arcade"
    data-atlas-surface="content"
  >
    <div id="landing-chrome"></div>
    <div id="atlas-session-panel-root"></div>
    <main id="app"><div class="loading">Connecting the two keys…</div></main>
    <p id="notice" role="status" aria-live="polite"></p>
    <dialog id="utility">
      <button class="close" data-action="close" aria-label="Close">×</button>
      <div id="dialog-body"></div>
    </dialog>
    <script src="../../shared/atlas-bridge.js"></script>
    <script>
      document.documentElement.dataset.theme = "night";
    </script>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
