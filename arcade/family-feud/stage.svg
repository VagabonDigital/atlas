<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc9f3"/>
      <stop offset="0.52" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#f8e7cf"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e4"/>
      <stop offset="0.58" stop-color="#efd5b4"/>
      <stop offset="1" stop-color="#d9b58d"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="0.46" stop-color="#f5dfc0"/>
      <stop offset="1" stop-color="#ddb990"/>
    </linearGradient>
    <radialGradient id="floor" cx="50%" cy="8%" r="82%">
      <stop offset="0" stop-color="#fff7e9"/>
      <stop offset="0.58" stop-color="#f3dcc0"/>
      <stop offset="1" stop-color="#dcb88f"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#78553d" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="105" rx="560" ry="215" fill="#fff7d8" opacity=".28" filter="url(#soft)"/>

  <!-- distant greenery -->
  <g opacity=".7" filter="url(#soft)">
    <ellipse cx="110" cy="250" rx="170" ry="125" fill="#758746"/>
    <ellipse cx="260" cy="235" rx="120" ry="100" fill="#a4ad69"/>
    <ellipse cx="1490" cy="248" rx="175" ry="125" fill="#738540"/>
    <ellipse cx="1340" cy="225" rx="120" ry="100" fill="#a2ab68"/>
  </g>

  <!-- large pale architecture -->
  <g fill="none" stroke="url(#stone)" stroke-width="54" filter="url(#shadow)">
    <path d="M35 325V165Q35 38 180 38Q325 38 325 165V325"/>
    <path d="M650 315V145Q650 30 800 30Q950 30 950 145V315"/>
    <path d="M1275 325V165Q1275 38 1420 38Q1565 38 1565 165V325"/>
  </g>
  <path d="M0 0H1600V60Q1280 92 800 86Q320 92 0 60Z" fill="#f5dec1" opacity=".96"/>

  <!-- amphitheatre bowls -->
  <g filter="url(#shadow)">
    <path d="M-130 290Q800 120 1730 290L1700 370Q800 210 -100 370Z" fill="url(#step)" stroke="#fff8e9" stroke-width="8"/>
    <path d="M-170 390Q800 210 1770 390L1730 485Q800 320 -130 485Z" fill="url(#step)" stroke="#fff8e9" stroke-width="8"/>
    <path d="M-210 505Q800 315 1810 505L1760 615Q800 445 -160 615Z" fill="url(#step)" stroke="#fff8e9" stroke-width="8"/>
    <path d="M-240 630Q800 455 1840 630L1790 748Q800 590 -190 748Z" fill="url(#step)" stroke="#fff8e9" stroke-width="8"/>
  </g>

  <!-- abstract audience -->
  <g stroke="#fff7e8" stroke-width="3">
    <g transform="translate(0 0)">
      <circle cx="95" cy="328" r="22" fill="#f0a154"/><circle cx="175" cy="316" r="21" fill="#c1b7f2"/><circle cx="260" cy="310" r="22" fill="#f5e7d5"/><circle cx="350" cy="303" r="20" fill="#efa65e"/>
      <circle cx="1250" cy="303" r="20" fill="#c1b7f2"/><circle cx="1340" cy="310" r="22" fill="#f4e7d7"/><circle cx="1425" cy="316" r="21" fill="#efa35b"/><circle cx="1505" cy="328" r="22" fill="#bcb4ee"/>
    </g>
    <g>
      <circle cx="55" cy="430" r="25" fill="#f4e4d0"/><circle cx="145" cy="420" r="24" fill="#f0a055"/><circle cx="245" cy="410" r="24" fill="#bfb5ee"/><circle cx="345" cy="400" r="23" fill="#f4e6d4"/><circle cx="445" cy="394" r="23" fill="#eca15b"/>
      <circle cx="1155" cy="394" r="23" fill="#c1b7f2"/><circle cx="1255" cy="400" r="23" fill="#f0a45e"/><circle cx="1355" cy="410" r="24" fill="#f4e7d6"/><circle cx="1455" cy="420" r="24" fill="#bab2ec"/><circle cx="1545" cy="430" r="25" fill="#f1a158"/>
    </g>
    <g>
      <circle cx="15" cy="545" r="28" fill="#ef9e52"/><circle cx="120" cy="535" r="27" fill="#f6e7d3"/><circle cx="225" cy="523" r="27" fill="#beb4ed"/><circle cx="335" cy="512" r="26" fill="#f0a45d"/><circle cx="450" cy="500" r="26" fill="#f6e8d5"/>
      <circle cx="1150" cy="500" r="26" fill="#bfb6ee"/><circle cx="1265" cy="512" r="26" fill="#f0a45e"/><circle cx="1375" cy="523" r="27" fill="#f6e8d5"/><circle cx="1480" cy="535" r="27" fill="#bdb4ee"/><circle cx="1585" cy="545" r="28" fill="#ef9e52"/>
    </g>
    <g>
      <circle cx="35" cy="675" r="31" fill="#f3e4d0"/><circle cx="155" cy="662" r="30" fill="#efa158"/><circle cx="280" cy="650" r="29" fill="#bdb4ec"/><circle cx="405" cy="636" r="29" fill="#f4e6d3"/>
      <circle cx="1195" cy="636" r="29" fill="#ef9f55"/><circle cx="1320" cy="650" r="29" fill="#c0b6ef"/><circle cx="1445" cy="662" r="30" fill="#f3e4d0"/><circle cx="1565" cy="675" r="31" fill="#efa158"/>
    </g>
  </g>

  <!-- foreground court -->
  <path d="M-120 760Q800 650 1720 760V900H-120Z" fill="url(#floor)" stroke="#fff7e6" stroke-width="8"/>
  <ellipse cx="800" cy="855" rx="665" ry="105" fill="none" stroke="#ffe29a" stroke-width="4" opacity=".95"/>
  <ellipse cx="800" cy="855" rx="535" ry="78" fill="none" stroke="#fff7e7" stroke-width="2" opacity=".65"/>
</svg>