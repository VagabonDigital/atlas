  <style>
    /* Family Feud environment plate. Keep the procedural arena beneath as a fallback. */
    .arena::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 7;
      background: url('./assets/arena-background.png') center center / cover no-repeat;
      pointer-events: none;
    }

    /* Normal play reserves the top chrome zone; the machine owns the remaining height. */
    .stage:not(.entrance) {
      width: min(1180px, 95vw);
      height: calc(100dvh - 64px);
      max-height: none;
      min-height: 0;
      margin: 56px auto 8px;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto 28px;
      justify-items: center;
      align-items: stretch;
    }
    .stage:not(.entrance) .machine {
      width: 82%;
      height: auto;
      max-height: none;
      min-height: 0;
      flex: none;
      padding: 18px 27px 11px;
    }
    .stage:not(.entrance) .question {
      height: 108px;
      min-height: 108px;
      flex: 0 0 108px;
      margin-bottom: 12px;
    }
    .stage:not(.entrance) .board {
      gap: 7px;
      padding: 7px;
    }
    .stage:not(.entrance) .row {
      border-radius: 20px;
    }
    .stage:not(.entrance) .rank,
    .stage:not(.entrance) .answer,
    .stage:not(.entrance) .value {
      line-height: 1;
    }
    .stage:not(.entrance) .provenance {
      margin-top: 9px;
    }
    .stage:not(.entrance) .console {
      min-height: 150px;
      padding: 16px 25px 14px;
    }
    .stage:not(.entrance) .feedback {
      height: 28px;
    }

    /* Entrance composition: detached physical player pods and start control. */
    .entrance .machine {
      width: 64%;
      max-height: 590px;
      padding-top: 18px;
    }
    .entrance .console {
      width: 78%;
      min-height: 112px;
      grid-template-columns: minmax(150px, 1fr) minmax(220px, 1.25fr) minmax(150px, 1fr);
      gap: clamp(36px, 6vw, 86px);
      align-items: center;
      padding: 12px 0 4px;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .entrance .contestant {
      min-height: 72px;
      border-width: 4px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,249,239,.98), var(--tint));
      box-shadow: inset 0 3px 7px rgba(113,80,57,.18), 0 5px 0 rgba(180,143,102,.55), 0 10px 22px rgba(78,50,48,.12);
    }
    .entrance .dock {
      align-self: center;
      min-height: 76px;
      gap: 8px;
    }
    .entrance .primary {
      min-width: 210px;
      font-size: 24px;
      padding: 13px 30px;
      border: 3px solid #f7d9b8;
      background: linear-gradient(180deg,#66445d,#30152d);
      color: #fff0d9;
      box-shadow: inset 0 2px 1px rgba(255,255,255,.18), 0 4px 0 #b48b65, 0 9px 18px rgba(61,31,51,.2);
    }
    .entrance .dock small {
      color: #6b5065;
      font-weight: 800;
      text-shadow: 0 1px rgba(255,255,255,.7);
    }

    @media (max-height: 760px) {
      .stage:not(.entrance) {
        height: calc(100dvh - 60px);
        margin-top: 52px;
        grid-template-rows: minmax(0, 1fr) auto 24px;
      }
      .stage:not(.entrance) .machine {
        height: auto;
        min-height: 0;
      }
      .stage:not(.entrance) .question {
        height: 88px;
        min-height: 88px;
        flex-basis: 88px;
      }
      .stage:not(.entrance) .board {
        gap: 5px;
        padding: 6px;
      }
      .stage:not(.entrance) .console {
        min-height: 132px;
        padding-top: 13px;
        padding-bottom: 11px;
      }
      .stage:not(.entrance) .feedback {
        height: 24px;
      }
    }
    @media (max-width: 1050px) {
      .entrance .console {
        width: 90%;
        gap: clamp(18px, 4vw, 48px);
      }
      .stage:not(.entrance) .machine {
        width: 86%;
      }
    }
    @media (max-width: 700px) {
      .entrance .console {
        width: 100%;
        grid-template-columns: 1fr 1.25fr 1fr;
        gap: 8px;
        padding: 10px 2px 2px;
      }
      .entrance .contestant {
        min-height: 60px;
        border-width: 3px;
        border-radius: 18px;
      }
      .entrance .primary {
        min-width: 0;
        width: 100%;
        font-size: 18px;
        padding: 11px 10px;
      }
      .stage:not(.entrance) {
        width: 96vw;
      }
      .stage:not(.entrance) .machine {
        width: 96%;
      }
    }

    /* Desktop cover: fixed 16:9 composition. Only entrance-state selectors live here. */
    @media (min-width: 900px) {
      .stage.entrance {
        width: min(100vw, 177.78dvh);
        height: 100dvh;
        max-height: none;
        min-height: 0;
        margin: 0 auto;
        position: relative;
        display: block;
        overflow: visible;
      }
      .entrance .machine {
        position: absolute;
        top: 1.5%;
        left: 50%;
        transform: translateX(-50%);
        width: 50%;
        height: 82%;
        max-height: none;
        min-height: 0;
        padding: clamp(8px,1.8dvh,14px) 20px clamp(8px,1.5dvh,12px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
        gap: clamp(14px, 2.2dvh, 22px);
        flex: none;
      }
      .entrance .question {
        min-height: 0;
        height: auto;
        flex: none;
        overflow: visible;
        padding: 0;
        margin: 0;
      }
      .entrance .question h1 {
        font-size: clamp(42px, 7.2dvh, 84px);
        line-height: .84;
        letter-spacing: -3px;
        padding: clamp(7px,1.4dvh,11px) 28px clamp(10px,2.1dvh,17px);
        margin-bottom: clamp(5px,1.1dvh,9px);
        border-width: clamp(5px,.9dvh,8px);
        border-radius: clamp(42px,7dvh,64px);
      }
      .entrance .question p {
        font-size: clamp(16px, 2.35dvh, 25px);
        line-height: 1.1;
      }
      .entrance .board {
        width: 82%;
        height: clamp(190px, 34dvh, 285px);
        min-height: 190px;
        align-self: center;
        flex: none;
        display: grid;
        grid-template-rows: repeat(6, minmax(0, 1fr));
        gap: clamp(4px,.9dvh,7px);
        padding: clamp(4px,.9dvh,7px);
        border-radius: 28px;
      }
      .entrance .row {
        min-height: 0;
        height: auto;
        border-radius: 19px;
      }
      .entrance .rank {
        font-size: clamp(18px, 3dvh, 30px);
      }
      .entrance .provenance {
        display: none;
      }
      .entrance .console {
        position: absolute;
        left: 50%;
        top: 72%;
        transform: translateX(-50%);
        width: 100%;
        height: 22%;
        min-height: 0;
        grid-template-columns: 22% 30% 22%;
        justify-content: space-between;
        align-items: start;
        gap: 0;
        padding: 0 2%;
        margin: 0;
      }
      .entrance .contestant {
        height: clamp(64px, 13dvh, 104px);
        min-height: 0;
        transform: translateY(clamp(8px,2dvh,16px));
        border-radius: 28px;
      }
      .entrance .dock {
        height: clamp(58px, 11dvh, 92px);
        min-height: 0;
        align-self: start;
        transform: translateY(clamp(30px, 8dvh, 66px));
        gap: clamp(4px,1dvh,8px);
      }
      .entrance .primary {
        min-width: clamp(190px, 27vw, 270px);
        font-size: clamp(19px, 3dvh, 27px);
        padding: clamp(9px,1.7dvh,14px) clamp(22px,3vw,34px);
      }
      .entrance .dock small {
        font-size: clamp(8px,1.25dvh,11px);
        letter-spacing: 1.4px;
      }
      .entrance .feedback {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="landing-chrome"></div>
  <header id="game-chrome" hidden><div id="return-slot"></div><span class="small-brand">FAMILY FEUD</span><div></div></header>
  <button id="sound" class="sound" type="button" aria-pressed="false">Sound off</button>
  <div class="arena" aria-hidden="true"><div class="sky"></div><div class="architecture"><i></i><i></i><i></i><i></i></div><div class="garden left"></div><div class="garden right"></div><div id="crowd" class="crowd"></div><div class="floor"></div></div>
  <main id="stage" class="stage entrance">
    <section class="machine" aria-label="Survey Machine">
      <div id="heading" class="question"></div>
      <div id="board" class="board" role="group" aria-label="Ranked responses"></div>
      <p class="provenance">ILLUSTRATIVE BOARDS · NOT SURVEY DATA</p>
    </section>
    <section class="console" aria-label="Contestants and answer controls">
      <div id="player-0" class="contestant player-a"></div>
      <div id="dock" class="dock"></div>
      <div id="player-1" class="contestant player-b"></div>
    </section>
    <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
  <div id="atlas-session-panel-root"></div>
  <script src="../../shared/atlas-bridge.js"></script>
  <script src="../../shared/atlas-session-panel.js"></script>
  <script src="../shared/arcade-game-chrome.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
