<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Family Feud · Atlas Arcade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect width='60' height='60' rx='16' fill='%23371b35'/%3E%3Cpath d='M14 17h32M14 30h32M14 43h32' stroke='%23fff0db' stroke-width='7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../shared/arcade-game-chrome.css">
  <link rel="stylesheet" href="../../shared/atlas-modal-theme.css">
  <link rel="stylesheet" href="../../shared/atlas-session-panel.css">
  <link rel="stylesheet" href="game.css">
  <style>
    /* Entrance-only composition: preserve the gameplay machine, but stage the
       two contestants and start control as detached physical objects. */
    .entrance .console {
      width: 78%;
      min-height: 112px;
      grid-template-columns: minmax(150px, 1fr) minmax(220px, 1.25fr) minmax(150px, 1fr);
      gap: clamp(36px, 6vw, 86px);
      align-items: center;
      padding: 12px 0 4px;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .entrance .contestant {
      min-height: 72px;
      border-width: 4px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,249,239,.98), var(--tint));
      box-shadow: inset 0 3px 7px rgba(113,80,57,.18), 0 5px 0 rgba(180,143,102,.55), 0 10px 22px rgba(78,50,48,.12);
    }
    .entrance .dock {
      align-self: center;
      min-height: 76px;
      gap: 8px;
    }
    .entrance .primary {
      min-width: 210px;
      font-size: 24px;
      padding: 13px 30px;
      border: 3px solid #f7d9b8;
      background: linear-gradient(180deg,#66445d,#30152d);
      color: #fff0d9;
      box-shadow: inset 0 2px 1px rgba(255,255,255,.18), 0 4px 0 #b48b65, 0 9px 18px rgba(61,31,51,.2);
    }
    .entrance .dock small {
      color: #6b5065;
      font-weight: 800;
      text-shadow: 0 1px rgba(255,255,255,.7);
    }
    @media (max-width: 1050px) {
      .entrance .console {
        width: 90%;
        gap: clamp(18px, 4vw, 48px);
      }
    }
    @media (max-width: 700px) {
      .entrance .console {
        width: 100%;
        grid-template-columns: 1fr 1.25fr 1fr;
        gap: 8px;
        padding: 10px 2px 2px;
      }
      .entrance .contestant {
        min-height: 60px;
        border-width: 3px;
        border-radius: 18px;
      }
      .entrance .primary {
        min-width: 0;
        width: 100%;
        font-size: 18px;
        padding: 11px 10px;
      }
    }
  </style>
</head>
<body>
  <div id="landing-chrome"></div>
  <header id="game-chrome" hidden><div id="return-slot"></div><span class="small-brand">FAMILY FEUD</span><div></div></header>
  <button id="sound" class="sound" type="button" aria-pressed="false">Sound off</button>
  <div class="arena" aria-hidden="true"><div class="sky"></div><div class="architecture"><i></i><i></i><i></i><i></i></div><div class="garden left"></div><div class="garden right"></div><div id="crowd" class="crowd"></div><div class="floor"></div></div>
  <main id="stage" class="stage entrance">
    <section class="machine" aria-label="Survey Machine">
      <div id="heading" class="question"></div>
      <div id="board" class="board" role="group" aria-label="Ranked responses"></div>
      <p class="provenance">ILLUSTRATIVE BOARDS · NOT SURVEY DATA</p>
    </section>
    <section class="console" aria-label="Contestants and answer controls">
      <div id="player-0" class="contestant player-a"></div>
      <div id="dock" class="dock"></div>
      <div id="player-1" class="contestant player-b"></div>
    </section>
    <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
  <div id="atlas-session-panel-root"></div>
  <script src="../../shared/atlas-bridge.js"></script>
  <script src="../../shared/atlas-session-panel.js"></script>
  <script src="../shared/arcade-game-chrome.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
