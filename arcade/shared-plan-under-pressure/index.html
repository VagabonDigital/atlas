<!DOCTYPE html>
<!--
  ==========================================================================
  SHARED PLAN UNDER PRESSURE · ENGINE ONE V1
  --------------------------------------------------------------------------
  First permanent Arcade engine slice.
  Hand-authored Definition → deterministic Session → real-lesson proof.
  ==========================================================================
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twenty Kilos — Arcade</title>

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='5' y='5' width='90' height='90' rx='24' fill='%23DF572F'/%3E%3Ccircle cx='50' cy='28' r='9' fill='%23FFF1E9'/%3E%3Cpath d='M50 38V62' stroke='%23FFF1E9' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M30 61H70L77 79H23L30 61Z' fill='%23FFF1E9'/%3E%3Ccircle cx='64' cy='69' r='4.2' fill='%23F2C6B5'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="../../shared/atlas-modal-theme.css?v=20260721-world-modals">
    <link rel="stylesheet" href="../../shared/atlas-search.css?v=20260721-world-modals">
    <link rel="stylesheet" href="../../shared/atlas-session-panel.css?v=20260721-world-modals">
    <link rel="stylesheet" href="../shared/arcade-game-chrome.css?v=20260721">
    <link rel="stylesheet" href="./engine.css?v=20260915-engine-one-v1">

    <script src="../../shared/atlas-bridge.js"></script>

    <!-- Anti-flash: apply the active session theme before first paint. -->
    <script>
        (function () {
            var mode = null;

            try {
                var sessionId =
                    sessionStorage.getItem('atlas::activeSessionId') ||
                    'default';

                var sessionModes = JSON.parse(
                    localStorage.getItem('atlas::appearanceBySession') ||
                    '{}'
                );

                mode =
                    sessionModes[sessionId] ||
                    localStorage.getItem('atlas::appearanceMode');
            } catch (e) { }

            document.documentElement.dataset.theme =
                mode === 'night'
                    ? 'night'
                    : 'light';
        })();
    </script>
</head>

<body data-atlas-world="arcade" data-atlas-surface="content">
    <main
        class="spp-launch"
        id="launch-screen"
        aria-label="Twenty Kilos introduction"
    >
        <div class="spp-launch-card">
            <span class="spp-launch-kicker">Shared Plan Under Pressure</span>
            <h1 id="launch-title">Twenty Kilos</h1>
            <p id="launch-premise">
                Prepare the expedition, commit to the plan, then adapt when the mountain changes the rules.
            </p>
            <div
                class="spp-launch-warning"
                id="launch-warning"
                role="status"
                hidden
            ></div>
            <button
                class="spp-launch-button"
                id="launch-button"
                type="button"
            >
                Begin expedition
            </button>
        </div>
    </main>

    <main class="spp-game" id="game-screen" hidden>
        <header class="spp-header" id="shared-plan-header">
            <div class="spp-header-left" id="arcade-game-return-root"></div>

            <div class="spp-header-center">
                <span class="spp-header-title">Twenty Kilos</span>
                <span class="spp-header-phase" id="shared-plan-phase">
                    Planning
                </span>
            </div>

            <div class="spp-header-right" id="arcade-game-actions-root"></div>
        </header>

        <div class="spp-stage-wrap">
            <section
                id="shared-plan-stage"
                aria-label="Twenty Kilos shared planning board"
            ></section>
        </div>
    </main>

    <div
        class="spp-toast"
        id="shared-plan-toast"
        role="status"
        aria-live="polite"
    ></div>

    <div id="atlas-session-panel-root"></div>

    <script src="../../shared/atlas-session-panel.js"></script>
    <script src="../../shared/compass-catalog-data.js"></script>
    <script src="../../shared/atlas-content-registry.js"></script>
    <script src="../../shared/atlas-search.js"></script>
    <script src="../shared/arcade-game-chrome.js?v=20260721"></script>
    <script src="./definitions/twenty-kilos.js?v=20260915-engine-one-v1"></script>
    <script src="./engine.js?v=20260915-engine-one-v1"></script>
</body>

</html>
