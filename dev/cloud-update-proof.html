<!doctype html><html><head><meta charset="utf-8"><title>Atlas Cloud Update Proof</title><script src="../shared/atlas-structured-subject.js"></script><script src="../shared/atlas-tutor-subjects.js"></script><script src="../shared/atlas-cloud.js"></script></head><body><h1>Atlas Cloud Update Proof</h1><select id="subjects"></select><button id="run">Verify ownership update boundary</button><pre id="out"></pre><script>'use strict';const s=document.getElementById('subjects'),o=document.getElementById('out');(async()=>{const subjects=await AtlasTutorSubjects.listSubjects();for(const subject of subjects){const option=document.createElement('option');option.value=subject.id;option.textContent=`${subject.metadata?.title||subject.id} · r${subject.revision}`;s.appendChild(option);}})();document.getElementById('run').onclick=async()=>{try{const local=await AtlasTutorSubjects.getSubject(s.value);if(!local)throw new Error('No local subject selected.');await AtlasCloud.updateOwnedSubject(local,local.revision);o.textContent='UPDATE WAS ALLOWED';}catch(error){o.textContent=`UPDATE BLOCKED\n${error.code||''}\n${error.message||error}`;}};</script></body></html>
