<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Family Feud</title>
  <desc id="desc">A warm survey game stage with six hidden answer shutters.</desc>
  <defs>
