    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#40223a" flood-opacity=".2"/></filter>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <g opacity=".96">
