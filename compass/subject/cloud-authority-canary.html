<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compass Subject Cloud Authority Canary</title>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:24px">Opening subject cloud-authority canary…</p>

  <script>
    'use strict';

    (async () => {
      try {
        const response = await fetch('./index.html?cloud-canary-source=1', {
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`Subject source returned ${response.status}.`);
        }

        let html = await response.text();
        const closeScript = '</scr' + 'ipt>';
        const readAdapter =
          '<script src="../../shared/atlas-tutor-subjects-cloud-read.js?v=20260914-1">' + closeScript;
        const authorityAdapter =
          '<script src="../../shared/atlas-tutor-subjects-cloud-authority.js?v=20260914-cloudwrite1">' + closeScript;

        if (!html.includes(readAdapter)) {
          throw new Error('Subject cloud-read bootstrap marker was not found.');
        }

        html = html.replace(
          '<head>',
          '<head><base href="/compass/subject/">'
        );

        html = html.replace(readAdapter, authorityAdapter);

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '';
        const pre = document.createElement('pre');
        pre.style.cssText = 'white-space:pre-wrap;padding:24px;font:14px/1.5 ui-monospace,monospace;color:#8b1e16';
        pre.textContent = `Subject cloud-authority canary failed:\n${error.message || String(error)}`;
        document.body.appendChild(pre);
      }
    })();
  </script>
</body>
</html>
