<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compass Subject</title>

    <script>
        (function () {
            try {
                if (
                    new URL(window.location.href)
                        .searchParams
                        .get('author') === 'generate'
                ) {
                    document.documentElement.dataset
                        .atlasSubjectBuildHandoff = 'true';
                }
            } catch {
                // Normal subject loading remains the safe fallback.
            }
        })();
    </script>

    <script>
        (function () {
            var mode = null;

            try {
                var sessionId =
                    sessionStorage.getItem(
                        'atlas::activeSessionId'
                    ) || 'default';

                var sessionModes =
                    JSON.parse(
                        localStorage.getItem(
                            'atlas::appearanceBySession'
                        ) || '{}'
                    );

                mode =
                    sessionModes[sessionId] ||
                    localStorage.getItem(
                        'atlas::appearanceMode'
                    );
            } catch { }

            document.documentElement.dataset.theme =
                mode === 'night'
                    ? 'night'
                    : 'light';
        })();
    </script>

    <script src="../../shared/atlas-bridge.js"></script>
    <script src="/shared/atlas-analytics.js?v=20260919-observability1"></script>
    <script src="../../shared/atlas-tutor-content.js"></script>
    <script src="../../shared/atlas-cloud.js"></script>
    <script src="../../shared/atlas-account.js"></script>
    <script src="../../shared/atlas-ai-subject-build-lifecycle.js?v=20260923-buildprojection1"></script>
    <script src="../../shared/atlas-subject-runtime-channel.js?v=20260924-workerrelay1"></script>
    <script src="../../shared/atlas-tutor-subjects.js"></script>
    <script src="../../shared/atlas-structured-subject.js?v=20260924-workerneutral1"></script>
    <script src="../../shared/atlas-ai.js?v=20260924-workerneutral1"></script>
    <script src="../../shared/compass-catalog-data.js"></script>
    <script src="../../shared/atlas-content-registry.js?v=20260925-workerinstance3"></script>

    <link rel="stylesheet" href="/shared/atlas-transition-state.css?v=20260920-transition1">
    <link rel="stylesheet" href="../shared/compass-subject.css">
    <link rel="stylesheet" href="../../shared/atlas-modal-theme.css?v=20260721-world-modals">
    <link rel="stylesheet" href="../../shared/atlas-search.css?v=20260721-world-modals">
    <link rel="stylesheet" href="../../shared/atlas-session-panel.css?v=20260721-world-modals">

    <style>
        html:has(body > #compass-subject-load-status),
        html[data-atlas-subject-build-handoff="true"] {
            height: 100%;
            overflow: hidden !important;
            overscroll-behavior: none;
            scrollbar-gutter: auto !important;
        }

        html[data-atlas-subject-build-handoff="true"] body {
            height: 100%;
            overflow: hidden !important;
            overscroll-behavior: none;
        }

        #compass-subject-load-status {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: var(--atlas-transition-canvas);
        }

        html:has(body > #compass-subject-load-status),
        body:has(> #compass-subject-load-status) {
            background: var(--atlas-transition-canvas) !important;
        }

        html[data-atlas-subject-build-handoff="true"]
            #compass-subject-load-status {
            position: fixed;
            inset: 0;
            z-index: 99999;
            min-height: 0;
            background: var(--atlas-transition-canvas);
        }

        html[data-atlas-subject-build-handoff="true"]
            .compass-subject-load-dot {
            background: var(--atlas-transition-accent);
        }

        html[data-atlas-subject-build-handoff="true"]
            .compass-subject-load-message {
            color: var(--atlas-transition-muted);
        }

        .compass-subject-load-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            text-align: center;
        }

        .compass-subject-load-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.42rem;
            height: 1rem;
        }

        .compass-subject-load-dot {
            width: 0.46rem;
            height: 0.46rem;
            border-radius: 50%;
            background: var(--atlas-transition-accent);
            animation: compass-subject-load-bounce 0.9s ease-in-out infinite;
        }

        .compass-subject-load-dot:nth-child(2) {
            animation-delay: 0.12s;
        }

        .compass-subject-load-dot:nth-child(3) {
            animation-delay: 0.24s;
        }

        .compass-subject-load-message {
            margin: 0;
            color: var(--atlas-transition-muted);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .compass-subject-load-actions {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            margin-top: 0.25rem;
            flex-wrap: wrap;
        }

        .compass-subject-load-action {
            min-height: 2.4rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.55rem 0.9rem;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            background: var(--surface-panel);
            color: var(--text-body);
            font: inherit;
            font-size: 0.82rem;
            line-height: 1;
            text-decoration: none;
            cursor: pointer;
            transition:
                border-color var(--transition),
                background var(--transition),
                color var(--transition);
        }

        .compass-subject-load-action:hover {
            border-color: var(--border-strong);
            background: var(--surface-raised);
            color: var(--text-heading);
        }

        #compass-subject-load-status.is-error .compass-subject-load-dots {
            display: none;
        }

        #compass-subject-load-status.is-error .compass-subject-load-message {
            color: var(--text-body);
        }

        #compass-subject-load-status.is-error .compass-subject-load-actions {
            display: flex;
        }

        @keyframes compass-subject-load-bounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-4px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .compass-subject-load-dot {
                animation: none;
            }
        }

        @media (min-width: 600px) {
            .discussion-sets:has(> .set-card + .set-card):not(:has(> .set-card + .set-card + .set-card)) {
                grid-template-columns: repeat(2, minmax(240px, 1fr));
            }
        }
    </style>
</head>

<body data-atlas-world="compass" data-atlas-surface="content">
    <main id="compass-subject-load-status" aria-live="polite" aria-busy="true">
        <div class="compass-subject-load-state">
            <div class="compass-subject-load-dots" aria-hidden="true">
                <span class="compass-subject-load-dot"></span>
                <span class="compass-subject-load-dot"></span>
                <span class="compass-subject-load-dot"></span>
            </div>

            <p class="compass-subject-load-message" id="compass-subject-load-message">
                Opening subject
            </p>

            <div class="compass-subject-load-actions">
                <button class="compass-subject-load-action" id="compass-subject-load-retry" type="button">
                    Retry
                </button>

                <a class="compass-subject-load-action" href="../">
                    Back to Compass
                </a>
            </div>
        </div>
    </main>

    <script>
        (function () {
            try {
                const building =
                    new URL(window.location.href)
                        .searchParams
                        .get('author') === 'generate';

                const message =
                    document.getElementById(
                        'compass-subject-load-message'
                    );

                if (message) {
                    message.textContent = building
                        ? 'Building your subject…'
                        : 'Opening subject';
                }
            } catch {
                // The static "Opening subject" fallback remains valid.
            }
        })();
    </script>

    <script src="../shared/compass-subject-shell.js"></script>
    <script src="../../shared/atlas-search.js"></script>
    <script src="../../shared/atlas-session-panel.js?v=20260916-runtime3"></script>
    <script src="../shared/compass-subject-loader.js?v=20260925-resumeux1"></script>
</body>

</html>
