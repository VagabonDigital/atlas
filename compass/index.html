    async function performHubCoverPickerSearch({ append = false } = {}) {
      if (hubCoverPickerLoading || hubCoverPickerProvider === 'url') return;

      const queryInput = document.getElementById('hub-cover-picker-query');
      const providerState = getHubCoverPickerProviderState();
      const query = String(
        append ? providerState.searchedQuery : queryInput?.value || ''
      ).trim();

      if (!query) {
        setHubCoverPickerError('Enter a search term.');
        return;
      }

      setHubCoverPickerError('');

      const page = append ? providerState.page + 1 : 1;
      const cacheKey = getHubCoverPickerCacheKey(
        hubCoverPickerProvider,
        query,
        page
      );

      hubCoverPickerLoading = true;

      if (!append) {
        providerState.page = 1;
        providerState.photos = [];
        providerState.hasMore = false;
        providerState.query = query;
        providerState.searchedQuery = query;
        providerState.scrollTop = 0;
      }

      renderHubCoverPickerResults();

      try {
        let response = hubCoverPickerCache.get(cacheKey);

        if (!response) {
          if (
            !window.AtlasAI ||
            typeof window.AtlasAI.searchCovers !== 'function'
          ) {
            throw new Error('Cover search is unavailable.');
          }

          response = await window.AtlasAI.searchCovers({
            provider: hubCoverPickerProvider,
            query,
            page
          });

          hubCoverPickerCache.set(cacheKey, response);
        }

        const incoming = Array.isArray(response?.photos)
          ? response.photos
          : [];

        const existingUrls = new Set(
          providerState.photos.map(photo => photo.imageUrl)
        );

        const uniqueIncoming = incoming.filter(
          photo =>
            photo?.imageUrl &&
            !existingUrls.has(photo.imageUrl)
        );

        providerState.photos = append
          ? [...providerState.photos, ...uniqueIncoming]
          : uniqueIncoming;

        providerState.page = Number(response?.page) || page;
        providerState.hasMore = Boolean(response?.hasMore);
        providerState.hasSearched = true;
        providerState.query = String(queryInput?.value || query).trim();
        providerState.searchedQuery = query;
      } catch (error) {
        console.error('[Compass] Hub cover search failed:', error);
        setHubCoverPickerError('Couldn’t load images. Try again.');

        if (!append) {
          providerState.photos = [];
          providerState.hasMore = false;
        }
      } finally {
        hubCoverPickerLoading = false;
        renderHubCoverPickerResults();
      }
    }

    function searchHubCoverPicker() {
      performHubCoverPickerSearch({ append: false });
    }

    function loadMoreHubCoverPicker() {
      const state = getHubCoverPickerProviderState();
      if (!state.hasMore) return;
      performHubCoverPickerSearch({ append: true });
    }

    function setHubCoverPickerProvider(provider) {
      if (
        provider !== 'web' &&
        provider !== 'pexels' &&
        provider !== 'url'
      ) {
        return;
      }

      if (provider === hubCoverPickerProvider || hubCoverPickerLoading) return;

      saveHubCoverPickerProviderState();
      hubCoverPickerProvider = provider;
      updateHubCoverPickerProviderUI();
      restoreHubCoverPickerProviderState();

      const state = getHubCoverPickerProviderState();
      if (provider !== 'url' && !state.hasSearched) {
        searchHubCoverPicker();
      }
    }

    function loadHubCoverPreviewImage(source) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () =>
          reject(new Error('Image could not be loaded.'));
        image.src = source;
      });
    }

    function renderHubCoverUploadDataUrl(
      image,
      { maxDimension, quality }
    ) {
      const sourceWidth = image.naturalWidth || image.width;
      const sourceHeight = image.naturalHeight || image.height;

      if (!sourceWidth || !sourceHeight) {
        throw new Error('Image dimensions are unavailable.');
      }

      const scale = Math.min(
        1,
        maxDimension / Math.max(sourceWidth, sourceHeight)
      );

      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const canvas = document.createElement('canvas');

      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext('2d');

      if (!context) {
        throw new Error('Image processing is unavailable.');
      }

      context.drawImage(image, 0, 0, width, height);
      return canvas.toDataURL('image/webp', quality);
    }

    async function compressHubCoverUpload(file) {
      const objectUrl = URL.createObjectURL(file);

      try {
        const image = await loadHubCoverPreviewImage(objectUrl);
        const attempts = [
          { maxDimension: 1600, quality: 0.80 },
          { maxDimension: 1450, quality: 0.74 },
          { maxDimension: 1280, quality: 0.68 },
          { maxDimension: 1100, quality: 0.62 }
        ];

        for (const attempt of attempts) {
          const dataUrl = renderHubCoverUploadDataUrl(image, attempt);

          if (dataUrl.length <= HUB_COVER_UPLOAD_MAX_DATA_URL_LENGTH) {
            return dataUrl;
          }
        }

        throw new Error(
          'That image is too large to store safely. Try a smaller image.'
        );
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    function showHubCoverPickerCustomPreview({
      imageUrl,
      meta = ''
    }) {
      const normalizedUrl = String(imageUrl || '').trim();
      if (!normalizedUrl) return;

      const preview = document.getElementById('hub-cover-picker-custom-preview');
      const image = document.getElementById('hub-cover-picker-custom-preview-image');
      const metaElement = document.getElementById('hub-cover-picker-custom-preview-meta');

      hubCoverPickerPendingCustomImage = { imageUrl: normalizedUrl };

      if (image) image.src = normalizedUrl;
      if (metaElement) metaElement.textContent = meta;
      if (preview) preview.hidden = false;
      setHubCoverPickerError('', true);
    }

    function openHubCoverPickerUpload() {
      const input = document.getElementById('hub-cover-picker-upload-input');
      if (!input) return;
      input.value = '';
      input.click();
    }

    async function previewHubCoverPickerUpload(file) {
      if (!hubCoverPickerState || hubCoverPickerState.saving || !file) return;

      resetHubCoverPickerCustomPreview();

      const button = document.getElementById('hub-cover-picker-upload-button');
      const fileName = document.getElementById('hub-cover-picker-upload-name');

      if (fileName) fileName.textContent = file.name;

      if (!HUB_COVER_UPLOAD_TYPES.has(file.type)) {
        setHubCoverPickerError(
          'Choose a JPG, PNG, WebP or AVIF image.',
          true
        );
        return;
      }

      if (file.size > HUB_COVER_UPLOAD_MAX_FILE_BYTES) {
        setHubCoverPickerError(
          'Choose an image smaller than 10 MB.',
          true
        );
        return;
      }

      if (button) {
        button.disabled = true;
        button.textContent = 'Preparing…';
      }

      try {
        const imageUrl = await compressHubCoverUpload(file);

        showHubCoverPickerCustomPreview({
          imageUrl,
          meta: file.name
        });
      } catch (error) {
        console.error('[Compass] Hub cover upload failed:', error);
        setHubCoverPickerError(
          error?.message ||
          'That image could not be prepared. Try another image.',
          true
        );
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = 'Choose image';
        }
      }
    }

    async function previewHubCoverPickerUrl() {
      if (!hubCoverPickerState || hubCoverPickerState.saving) return;

      resetHubCoverPickerCustomPreview();

      const input = document.getElementById('hub-cover-picker-manual-url');
      const button = document.getElementById('hub-cover-picker-url-preview');
      const rawUrl = String(input?.value || '').trim();

      let parsedUrl = null;

      try {
        parsedUrl = new URL(rawUrl);
      } catch {
        parsedUrl = null;
      }

      if (
        !parsedUrl ||
        (
          parsedUrl.protocol !== 'http:' &&
          parsedUrl.protocol !== 'https:'
        )
      ) {
        setHubCoverPickerError(
          'Enter a valid direct image URL.',
          true
        );
        input?.focus();
        return;
      }

      if (button) {
        button.disabled = true;
        button.textContent = 'Checking…';
      }

      try {
        await loadHubCoverPreviewImage(parsedUrl.href);

        showHubCoverPickerCustomPreview({
          imageUrl: parsedUrl.href,
          meta: 'Image URL'
        });
      } catch {
        setHubCoverPickerError(
          'That image could not be loaded. Try another direct image link.',
          true
        );
        input?.focus();
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = 'Preview';
        }
      }
    }

    function applyHubCoverPickerCustomPreview() {
      if (!hubCoverPickerPendingCustomImage) return;

      saveHubCoverPickerImage(
        hubCoverPickerPendingCustomImage.imageUrl
      );
    }

    async function saveHubCoverPickerImage(imageUrl) {
      const state = hubCoverPickerState;
      const normalizedUrl = String(imageUrl || '').trim();

      if (!state || state.saving || !normalizedUrl) return;

      const Subjects = window.AtlasTutorSubjects;

      if (
        !Subjects ||
        typeof Subjects.getSubject !== 'function' ||
        typeof Subjects.updateSubject !== 'function'
      ) {
        setHubCoverPickerError('Cover editing is unavailable.');
        return;
      }

      state.saving = true;

      const status = document.getElementById('hub-cover-picker-status');
      if (status) status.textContent = 'Saving cover…';

      try {
        const latest = await Subjects.getSubject(state.subjectId);

        if (!latest) {
          throw new Error('Subject unavailable.');
        }

        const nextDocument = {
          ...latest.document,
          module: {
            ...(latest.document?.module || {}),
            bgImage: normalizedUrl
          }
        };

        const saved = await Subjects.updateSubject(
          state.subjectId,
          {
            metadata: {
              ...latest.metadata,
              coverImage: normalizedUrl
            },
            document: nextDocument
          }
        );

        if (!saved) {
          throw new Error('Cover save failed.');
        }

        closeHubCoverPicker({ force: true });
        await renderHub();
        showToast('Cover updated.');
      } catch (error) {
        console.error('[Compass] Hub cover save failed:', error);
        state.saving = false;
        setHubCoverPickerError('Couldn’t save this cover.');
        renderHubCoverPickerResults();
      }
    }

    function getSubjectArtworkStudioColor() {

    function renderSubjectArtworkStudioColors() {
      const host =
        document.getElementById(
          'subject-artwork-color-options'
        );

      if (!host) return;

      const selected =
        getSubjectArtworkStudioColor();

      const presetSelected =
        SUBJECT_ARTWORK_COLORS.some(
          color => selected === color.value
        );

      host.innerHTML =
        SUBJECT_ARTWORK_COLORS
          .map(color => {
            const active =
              selected === color.value;

            const swatch =
              color.value === 'atlas'
                ? 'var(--accent)'
                : color.value;

            return (
              '<button ' +
              'class="subject-artwork-color-btn' +
              (active ? ' is-selected' : '') +
              '" type="button" ' +
              'style="--subject-artwork-swatch:' +
              escHtml(swatch) +
              ';" ' +
              'onclick="setSubjectArtworkStudioColor(' +
              jsArg(color.value) +
              ')">' +
              '<span class="subject-artwork-color-dot" aria-hidden="true"></span>' +
              escHtml(color.label) +
              '</button>'
            );
          })
          .join('');

      const customInput =
        document.getElementById(
          'subject-artwork-custom-color'
        );

      const customControl =
        customInput?.closest(
          '.subject-artwork-custom-color'
        );

      const customActive =
        selected !== 'atlas' &&
        !presetSelected;

      if (
        customInput &&
        customActive &&
        /^#[0-9a-f]{6}$/i.test(selected)
      ) {
        customInput.value = selected;
      }

      customControl?.classList.toggle(
        'is-selected',
        customActive
      );
    }

    function setSubjectArtworkStudioColor(color) {
      if (!subjectArtworkStudioState) return;

          ? Artwork.normalizeColor(color)
          : 'atlas';

      renderSubjectArtworkStudioColors();
      renderSubjectArtworkStudioPreview();

    function setSubjectArtworkStudioCustomColor(

      if (!subjectArtworkStudioState) return;

      subjectArtworkStudioState.color =

      renderSubjectArtworkStudioPreview();

    async function openSubjectArtworkStudio(
      subjectId,
      event,
      options = {}
    ) {
      event?.preventDefault();
      event?.stopPropagation();

      if (!options.skipCapabilityGate) {
        const access =
          await requireCompassSubjectCapability(
            'canEditSubject',
            'edit-subject',
            'open-subject-artwork',
            {
              subjectId: String(subjectId || '').trim()
            },
            event?.currentTarget || null
          );

        if (
          !compassSubjectCapabilityAllows(
            access,
            'Subject editing is unavailable right now.'
          )
        ) {
          return;
        }
      }

      subjectArtworkStudioReturnFocus =
        event?.currentTarget
          ?.closest('.subject-card-management')
          ?.querySelector(
            '.subject-card-manage-btn'
          ) ||
        document.activeElement;

      closeOwnedSubjectMenus();

      const Subjects =
        window.AtlasTutorSubjects;

      if (
        !Subjects ||
        typeof Subjects.getSubject !== 'function'
      ) {
        showToast(
          'Subject artwork is unavailable.'
        );
        return;
      }

      let record = null;

      try {
        record =
          await Subjects.getSubject(subjectId);
      } catch { }

      if (!record) {
        showToast(
          'That subject could not be loaded.'
        );
        return;
      }

      const metadata =
        record.metadata || {};

      const Artwork =
        window.AtlasSubjectArtwork;

      const existing =
        Artwork &&
        typeof Artwork.normalize === 'function'
          ? Artwork.normalize(
              metadata.artwork
            )
          : null;

      const title =
        getOwnedSubjectRecordTitle(record);

      let previewDescription =
        String(
          metadata.description ||
          record.document?.module
            ?.catalogDescription ||
          ''
        ).trim();

      if (
        !previewDescription &&
        typeof Subjects.getWorkingDraft ===
          'function'
      ) {
        try {
          const draft =
            await Subjects.getWorkingDraft(
              record.id
            );

          previewDescription =
            String(
              draft?.document?.module
                ?.catalogDescription ||
              ''
            ).trim();
        } catch { }
      }

      const subject = {
        subjectId: record.id,
        isOwned: true,
        title,
        hook: previewDescription,
        artwork: existing,
        artId: '',
        launchUrl:
          getOwnedSubjectLaunchUrl(record.id),
        status: 'new',
        state: null,
        provenance:
          record.provenance || {}
      };

      subjectArtworkStudioState = {
        subjectId: record.id,
        record,
        subject,
        svg: existing?.svg || '',
        color:
          existing?.color || 'atlas',
        idea:
          existing?.idea || ''
      };

      const backdrop =
        ensureSubjectArtworkStudio();

      const heading =
        backdrop.querySelector(
          '#subject-artwork-studio-title'
        );

      const ideaInput =
        backdrop.querySelector(
          '#subject-artwork-idea'
        );

      const useButton =
        backdrop.querySelector(
          '#subject-artwork-use'
        );

      const generateButton =
        backdrop.querySelector(
          '#subject-artwork-generate'
        );

      const removeButton =
        backdrop.querySelector(
          '#subject-artwork-remove'
        );

      const error =
        backdrop.querySelector(
          '#subject-artwork-studio-error'
        );

      if (heading) {
        heading.textContent =
          existing
            ? 'Change artwork'
            : 'Create artwork';
      }

      if (ideaInput) {
        ideaInput.value =
          existing?.idea || '';
      }

      if (useButton) {
        useButton.disabled =
          !existing?.svg;
      }

      if (generateButton) {
        generateButton.textContent =
          existing?.svg
            ? 'Try another'
            : 'Generate artwork';
      }

      if (removeButton) {
        removeButton.hidden =
          !existing?.svg;
      }

      if (error) {
        error.hidden = true;
        error.textContent = '';
      }

      renderSubjectArtworkStudioColors();
      renderSubjectArtworkStudioPreview();

      subjectArtworkStudioPreviousBodyOverflow =
        document.body.style.overflow;

      document.body.style.overflow =
        'hidden';

      backdrop.hidden = false;

      requestAnimationFrame(() => {
        backdrop
          .querySelector(
            '.subject-artwork-studio-close'
          )
          ?.focus();
      });
    }

    function closeSubjectArtworkStudio() {
      const backdrop =
        document.getElementById(
          'subject-artwork-studio-backdrop'
        );

      if (backdrop) {
        backdrop.hidden = true;
      }

      document.body.style.overflow =
        subjectArtworkStudioPreviousBodyOverflow;

      const returnFocus =
        subjectArtworkStudioReturnFocus;

      subjectArtworkStudioState = null;
      subjectArtworkStudioReturnFocus = null;

      returnFocus?.focus?.();
    }

    async function removeSubjectArtworkStudio() {
      const state =
        subjectArtworkStudioState;

      const Subjects =
        window.AtlasTutorSubjects;

      if (
        !state ||
        !Subjects ||
        typeof Subjects.updateSubject !==
          'function'
      ) {
        return;
      }

      const removeButton =
        document.getElementById(
          'subject-artwork-remove'
        );

      const error =
        document.getElementById(
          'subject-artwork-studio-error'
        );

      if (removeButton) {
        removeButton.disabled = true;
        removeButton.textContent =
          'Removing…';
      }

      try {
        const saved =
          await Subjects.updateSubject(
            state.subjectId,
            {
              metadata: {
                artwork: null
              }
            }
          );

        if (!saved) {
          throw new Error(
            'Artwork removal failed.'
          );
        }

        closeSubjectArtworkStudio();
        await renderHub();
        showToast('Artwork removed.');
      } catch {
        if (error) {
          error.hidden = false;
          error.textContent =
            'Couldn’t remove this artwork.';
        }

        if (removeButton) {
          removeButton.disabled = false;
          removeButton.textContent =
            'Remove artwork';
        }
      }
    }

    async function saveSubjectArtworkStudio() {
      const state =
        subjectArtworkStudioState;

      const backdrop =
        document.getElementById(
          'subject-artwork-studio-backdrop'
        );

      const useButton =
        backdrop?.querySelector(
          '#subject-artwork-use'
        );

      const error =
        backdrop?.querySelector(
          '#subject-artwork-studio-error'
        );

      const idea =
        String(
          backdrop?.querySelector(
            '#subject-artwork-idea'
          )?.value || ''
        ).trim();

      const Subjects =
        window.AtlasTutorSubjects;

      const Artwork =
        window.AtlasSubjectArtwork;

      if (
        !state ||
        !Subjects ||
        typeof Subjects.updateSubject !==
          'function' ||
        !Artwork ||
        typeof Artwork.normalize !==
          'function'
      ) {
        return;
      }

      const artwork =
        Artwork.normalize({
          type: 'atlas-svg',
          version: 1,
          svg: state.svg,
          color: state.color,
          idea
        });

      if (!artwork) {
        if (error) {
          error.hidden = false;
          error.textContent =
            'Generate artwork before saving.';
        }

        return;
      }

      if (useButton) {
        useButton.disabled = true;
        useButton.textContent = 'Saving…';
      }

      try {
        const latest =
          await Subjects.getSubject(
            state.subjectId
          );

        if (!latest) {
          throw new Error(
            'Subject unavailable.'
          );
        }

        const saved =
          await Subjects.updateSubject(
            state.subjectId,
            {
              metadata: {
                ...latest.metadata,
                artwork
              }
            }
          );

        if (!saved) {
          throw new Error(
            'Artwork save failed.'
          );
        }

        closeSubjectArtworkStudio();
        await renderHub();
        showToast('Artwork saved.');
      } catch {
        if (error) {
          error.hidden = false;
          error.textContent =
            'Couldn’t save this artwork.';
        }

        if (useButton) {
          useButton.disabled = false;
          useButton.textContent =
            'Use artwork';
        }
      }
    }

    async function moveShelfSubject(
      scope,
      subjectKind,
      subjectId,
      targetKind,
      targetSubjectId,
      offset,
      event,
      options = {}
    ) {
      event?.preventDefault();
      event?.stopPropagation();

      if (scope === 'category' && !options.skipCapabilityGate) {
        const access =
          await requireAccountLibraryAccess(
            'move-library-subject-order',
            {
              subjectKind,
              subjectId: String(subjectId || '').trim(),
              targetKind,
              targetSubjectId: String(targetSubjectId || '').trim(),
              offset: Number(offset)
            },
            event?.currentTarget || null
          );

        if (!(await accountLibraryAccessAllows(access))) {
          return;
        }
      }

      closeOwnedSubjectMenus();

      const Subjects = window.AtlasTutorSubjects;
      const movement = Number(offset);

      if (
        !Subjects ||
        (
          movement !== -1 &&
          movement !== 1
        )
      ) {
        showToast('Subject ordering is unavailable.');
        return;
      }

      try {
        let moved = null;

        if (scope === 'category') {
          if (
            subjectKind !== 'my-subject' ||
            targetKind !== 'my-subject' ||
            typeof Subjects.moveSubject !== 'function'
          ) {
            throw new Error(
              'Category ordering is unavailable.'
            );
          }

          moved =
            await Subjects.moveSubject(
              subjectId,
              movement,
              targetSubjectId
            );
        } else if (scope === 'session') {
          if (
            typeof Subjects.getSessionSubjects !== 'function' ||
            typeof Subjects.setSessionSubjects !== 'function'
          ) {
            throw new Error(
              'Session ordering is unavailable.'
            );
          }

          const session = getActiveSession();

          const refs =
            await Subjects.getSessionSubjects(
              session.id
            );

          const currentIndex =
            refs.findIndex(ref =>
              ref.kind === subjectKind &&
              ref.id === subjectId
            );

          const targetIndex =
            refs.findIndex(ref =>
              ref.kind === targetKind &&
              ref.id === targetSubjectId
            );

          if (
            currentIndex === -1 ||
            targetIndex === -1 ||
            (
              movement < 0 &&
              targetIndex >= currentIndex
            ) ||
            (
              movement > 0 &&
              targetIndex <= currentIndex
            )
          ) {
            throw new Error(
              'Invalid session movement.'
            );
          }

          [
            refs[currentIndex],
            refs[targetIndex]
          ] = [
            refs[targetIndex],
            refs[currentIndex]
          ];

          moved =
            await Subjects.setSessionSubjects(
              session.id,
              refs
            );
        } else {
          return;
        }

        if (!moved) {
          throw new Error(
            'Subject movement failed.'
          );
        }

        await renderHub();

        showToast(
          movement < 0
            ? 'Subject moved earlier.'
            : 'Subject moved later.'
        );
      } catch {
        showToast('Couldn’t move this subject.');
      }
    }

    const ATLAS_SESSION_DISMISSALS_KEY =
      'atlas::compass::atlasSessionDismissals';

    function getAtlasSubjectProgressCount(subject) {
      const progress = subject?.state?.progress || {};
      const raw = subject?.state?.progressRaw || {};

      return Math.max(
        Math.max(0, Number(progress.explored) || 0),
        Array.isArray(raw.exploredIds)
          ? raw.exploredIds.length
          : 0
      );
    }

    function readAtlasSessionDismissals() {
      try {
        const parsed = JSON.parse(
          localStorage.getItem(
            ATLAS_SESSION_DISMISSALS_KEY
          ) || '{}'
        );

        return parsed &&
          typeof parsed === 'object' &&
          !Array.isArray(parsed)
            ? parsed
            : {};
      } catch {
        return {};
      }
    }

    function writeAtlasSessionDismissal(
      sessionId,
      registryId,
      progressCount
    ) {
      try {
        const store = readAtlasSessionDismissals();
        const sessionKey = String(sessionId || '').trim();
        const subjectKey = String(registryId || '').trim();

        if (!sessionKey || !subjectKey) return false;

        store[sessionKey] =
          store[sessionKey] &&
          typeof store[sessionKey] === 'object' &&
          !Array.isArray(store[sessionKey])
            ? store[sessionKey]
            : {};

        store[sessionKey][subjectKey] = {
          progressCount: Math.max(
            0,
            Number(progressCount) || 0
          )
        };

        localStorage.setItem(
          ATLAS_SESSION_DISMISSALS_KEY,
          JSON.stringify(store)
        );

        return true;
      } catch {
        return false;
      }
    }

    function clearAtlasSessionDismissal(
      sessionId,
      registryId
    ) {
      try {
        const store = readAtlasSessionDismissals();
        const sessionKey = String(sessionId || '').trim();
        const subjectKey = String(registryId || '').trim();

        if (!store[sessionKey]?.[subjectKey]) {
          return;
        }

        delete store[sessionKey][subjectKey];

        if (!Object.keys(store[sessionKey]).length) {
          delete store[sessionKey];
        }

        localStorage.setItem(
          ATLAS_SESSION_DISMISSALS_KEY,
          JSON.stringify(store)
        );
      } catch { }
    }

    function getAtlasSessionDismissal(
      sessionId,
      registryId
    ) {
      const record =
        readAtlasSessionDismissals()
          ?.[String(sessionId || '').trim()]
          ?.[String(registryId || '').trim()];

      return record && typeof record === 'object'
        ? record
        : null;
    }

    async function syncAtlasOriginalSessionSubjects(
      session,
      atlasSubjects,
      sessionSubjectRefs
    ) {
      const Subjects = window.AtlasTutorSubjects;

      if (
        !Subjects ||
        typeof Subjects.addSessionSubject !== 'function'
      ) {
        return sessionSubjectRefs;
      }

      let refs = Array.isArray(sessionSubjectRefs)
        ? [...sessionSubjectRefs]
        : [];

      const activeAtlasIds = new Set(
        refs
          .filter(ref => ref.kind === 'atlas-subject')
          .map(ref => ref.id)
      );

      for (const subject of atlasSubjects) {
        if (
          !subject?.registryId ||
          activeAtlasIds.has(subject.registryId)
        ) {
          continue;
        }

        const progressCount =
          getAtlasSubjectProgressCount(subject);

        const dismissal =
          getAtlasSessionDismissal(
            session.id,
            subject.registryId
          );

        const dismissedAt = Math.max(
          0,
          Number(dismissal?.progressCount) || 0
        );

        if (dismissal && progressCount < dismissedAt) {
          writeAtlasSessionDismissal(
            session.id,
            subject.registryId,
            progressCount
          );
          continue;
        }

        if (
          progressCount <= 0 ||
          (dismissal && progressCount <= dismissedAt)
        ) {
          continue;
        }

        try {
          const saved =
            await Subjects.addSessionSubject(
              session.id,
              {
                kind: 'atlas-subject',
                id: subject.registryId
              }
            );

          if (Array.isArray(saved)) {
            refs = saved;
            activeAtlasIds.add(subject.registryId);
            clearAtlasSessionDismissal(
              session.id,
              subject.registryId
            );
          }
        } catch { }
      }

      return refs;
    }

      ) {

      for (const session of getSessions()) {
        try {
          const refs = await Subjects.getSessionSubjects(session.id);

          const next = (Array.isArray(refs) ? refs : []).map(ref => {

              ref.kind === 'atlas-subject' &&
              ref.id === registryId
            ) {
              changed = true;
              return {

            return ref;

          if (changed) {
            await Subjects.setSessionSubjects(session.id, next);
            clearAtlasSessionDismissal(session.id, registryId);
          }
        } catch { }

    function restoreAtlasVersionFromHub(registryId) {
      const subject = getAtlasOriginalSubject(registryId);

      if (!subject?.launchUrl) {
        return Promise.reject(
          new Error('The Atlas source could not be opened.')
        );
      }

      return new Promise((resolve, reject) => {
        const requestId =
          'atlas-hub-restore-' +
          Date.now().toString(36) +
          '-' +
          Math.random().toString(36).slice(2, 8);

        const actionUrl = getAtlasOriginalActionUrl(
          subject,
          'restore-version',
          requestId
        );

        if (!actionUrl) {
          reject(new Error('The Atlas source could not be prepared.'));
          return;
        }

        const frame = document.createElement('iframe');
        frame.hidden = true;
        frame.setAttribute('aria-hidden', 'true');
        frame.src = actionUrl;

        const timeout = window.setTimeout(() => {
          const pending = atlasOriginalActionRequests.get(requestId);

          if (!pending) return;

          atlasOriginalActionRequests.delete(requestId);
          pending.frame.remove();
          pending.reject?.(
            new Error('Restoring the Atlas source timed out.')
          );
        }, 20000);

        atlasOriginalActionRequests.set(requestId, {
          frame,
          timeout,
          registryId,
          action: 'restore-version',
          resolve,
          reject
        });

        document.body.appendChild(frame);
      });
    }

    function getOwnedAtlasSourceRegistryId(record) {
      const provenance =
        record?.provenance &&
        typeof record.provenance === 'object' &&
        !Array.isArray(record.provenance)
          ? record.provenance
          : null;

      if (
        !provenance ||
        provenance.sourceWorld !== COMPASS_ID ||
        !String(provenance.sourceSubjectId || '').trim()
      ) {
        return '';
      }

      return String(
        provenance.sourceContentId ||
        (
          COMPASS_ID + ':' +
          String(provenance.sourceSubjectId).trim()
        )
      ).trim();
    }

    async function runAtlasOriginalOwnershipAction(
      registryId,
      action,
      event,
      { categoryId = '' } = {}
    ) {
      event?.preventDefault();
      event?.stopPropagation();
      closeOwnedSubjectMenus();

      if (action !== 'own' && action !== 'duplicate') return;

      const subject = getAtlasOriginalSubject(registryId);

      if (!subject) {
        showToast('That Atlas subject could not be found.');
        return;
      }

      if (action === 'own') {
        const access =
          await requireAccountLibraryAccess(
            'add-atlas-original',
            {
              registryId: subject.registryId,
              categoryId
            },
            event?.currentTarget || null
          );

        if (!(await accountLibraryAccessAllows(access))) {
          return;
        }
      }

      const requestId =
        'atlas-hub-' +
        Date.now().toString(36) +
        '-' +
        Math.random().toString(36).slice(2, 8);

      const actionUrl = getAtlasOriginalActionUrl(
        subject,
        action,
        requestId
      );

      if (!actionUrl) {
        showToast('That subject could not be prepared.');
        return;
      }

      const frame = document.createElement('iframe');
      frame.hidden = true;
      frame.setAttribute('aria-hidden', 'true');
      frame.src = actionUrl;

      const timeout = window.setTimeout(() => {
        const pending = atlasOriginalActionRequests.get(requestId);

        if (!pending) return;

        atlasOriginalActionRequests.delete(requestId);
        pending.frame.remove();
        showToast('That subject took too long to prepare. Try again.');
      }, 20000);

      atlasOriginalActionRequests.set(requestId, {
        frame,
        timeout,
        registryId,
        action,
        categoryId: String(categoryId || '').trim()
      });

      document.body.appendChild(frame);
      showToast(
        action === 'duplicate'
          ? 'Duplicating subject…'
          : 'Adding to My Subjects…'
      );
    }

    window.addEventListener('message', async event => {
      if (event.origin !== window.location.origin) return;

      const data = event.data;

      if (
        !data ||
        data.type !== 'atlas:hub-subject-action-complete' ||
        !data.requestId
      ) {
        return;
      }

      const pending = atlasOriginalActionRequests.get(data.requestId);

      if (!pending) return;

      window.clearTimeout(pending.timeout);
      atlasOriginalActionRequests.delete(data.requestId);
      pending.frame.remove();

      if (pending.action === 'restore-version') {
        if (!data.ok) {
          pending.reject?.(
            new Error(
              data.message ||
              'Couldn’t restore the Atlas source.'
            )
          );
          return;
        }

        pending.resolve?.(true);
        return;
      }

      if (!data.ok || !data.subjectId) {
        showToast(data.message || 'Couldn’t prepare this subject.');
        return;
      }

      const Subjects = window.AtlasTutorSubjects;

      try {
        if (pending.action === 'own') {
          await migrateAtlasOriginalSessionHomes(
            pending.registryId,
            data.subjectId
          );

          if (
            pending.categoryId &&
            Subjects &&
            typeof Subjects.setSubjectLibraryPlacement === 'function'
          ) {
            await Subjects.setSubjectLibraryPlacement(
              data.subjectId,
              {
                libraryIncluded: true,
                categoryId: pending.categoryId
              }
            );
          }
        }

        await renderHub();

        showToast(
          pending.action === 'duplicate'
            ? 'Duplicate added to My Subjects.'
            : 'Added to My Subjects.'
        );
      } catch {
        await renderHub();
        showToast('Subject created, but its placement could not be updated.');
      }
    });

          'add-owned-subject',
          { subjectId },
          event?.currentTarget || null
        );

      if (!(await accountLibraryAccessAllows(access))) {
        return;
      }

      const Subjects = window.AtlasTutorSubjects;

      if (
        !Subjects ||
        typeof Subjects.setSubjectLibraryPlacement !== 'function'
      ) {
        showToast('My Subjects are unavailable.');
        return;
      }

      try {
        const saved =
          await Subjects.setSubjectLibraryPlacement(
            subjectId,
            {
              libraryIncluded: true
            }
          );

        if (!saved) {
          throw new Error(
            'Library placement failed.'
          );
        }

        await renderHub();

        showToast('Added to My Subjects.');
      } catch {
        showToast(
          'Couldn’t add this subject to My Subjects.'
        );
      }
    }

    async function removeOwnedSubjectFromLibrary(
      subjectId,
      event
    ) {
      event?.preventDefault();
      event?.stopPropagation();

      closeOwnedSubjectMenus();

      const access =
        await requireAccountLibraryAccess(
          'remove-owned-subject',
          { subjectId },
          event?.currentTarget || null
        );

      if (!(await accountLibraryAccessAllows(access))) {
        return;
      }

      const Subjects = window.AtlasTutorSubjects;

      if (
        !Subjects ||
        typeof Subjects.setSubjectLibraryPlacement !== 'function'
      ) {
        showToast('My Subjects are unavailable.');
        return;
      }

      try {
        const saved =
          await Subjects.setSubjectLibraryPlacement(
            subjectId,
            {
              libraryIncluded: false
            }
          );

        if (!saved) {
          throw new Error(
            'Library placement removal failed.'
          );
        }

        await renderHub();

        showToast('Removed from My Subjects.');
      } catch {
        showToast(
          'Couldn’t remove this subject from My Subjects.'
        );
      }
    }

    async function removeOwnedSubjectFromActiveSession(
      subjectId,
      event
    ) {
      event?.preventDefault();
      event?.stopPropagation();

      closeOwnedSubjectMenus();

      const Subjects = window.AtlasTutorSubjects;
      const session = getActiveSession();

      if (
        !Subjects ||
        typeof Subjects.removeSessionSubject !== 'function' ||
        typeof Subjects.getSubjectLibraryState !== 'function' ||
        typeof Subjects.getSubjectSessionIds !== 'function'
      ) {
        showToast('Session subjects are unavailable.');
        return;
      }

      try {
        const [
          placement,
          sessionIds
        ] = await Promise.all([
          Subjects.getSubjectLibraryState(
            subjectId
          ),
          Subjects.getSubjectSessionIds({
            kind: 'my-subject',
            id: subjectId
          })
        ]);

        if (
          placement &&
          placement.libraryIncluded === false &&
          placement.archived !== true &&
          sessionIds.length <= 1
        ) {
          await openOwnedSubjectLastHomeDialog(
            subjectId,
            event
          );
          return;
        }

        const saved =
          await Subjects.removeSessionSubject(
            session.id,
            {
              kind: 'my-subject',
              id: subjectId
            }
          );

        if (!saved) {
          throw new Error(
            'Session subject removal failed.'
          );
        }

        await renderHub();

        showToast(
          'Removed from ' +
          getActiveSessionSubjectCollectionTitle() +
          '.'
        );
      } catch {
        showToast('Couldn’t remove this subject.');
      }
    }

    /* ================================================================
       RENDER
       One curated operational collection containing only playable subjects.
       Progress and continuation state live directly on the standard cards.
       ================================================================ */

    let compassRecommendationContext = null;
    let compassRecommendationRequestId = 0;
    const compassSuggestionHistory = new Map();

    const COMPASS_IDEA_MODES = [
      {
        id: 'learner',
        label: 'For this learner',
        namedSessionOnly: true
      },
      {
        id: 'surprise',
        label: 'Surprise me'
      },
      {
        id: 'current-affairs',
        label: 'Current affairs'
      },
      {
        id: 'science-nature',
        label: 'Science & Nature'
      },
      {
        id: 'technology-future',
        label: 'Technology & Future'
      },
      {
        id: 'culture-society',
        label: 'Culture & Society'
      },
      {
        id: 'history-civilization',
        label: 'History & Civilization'
      },
      {
        id: 'business-politics',
        label: 'Business & Politics'
      },
      {
        id: 'travel-experiences',
        label: 'Travel & Experiences'
      }
    ];

    function getAvailableCompassIdeaModes(
      session
    ) {
      const learnerName =
        String(session?.name || '').trim();

      return COMPASS_IDEA_MODES
        .filter(
          mode =>
            !mode.namedSessionOnly ||
            !isDefaultSession(session)
        )
        .map(mode =>
          mode.id === 'learner' &&
          learnerName
            ? {
                ...mode,
                label: `For ${learnerName}`
              }
            : mode
        );
    }

    function getCompassIdeaMode(
      modeId,
      session = getActiveSession()
    ) {
      const id =
        String(modeId || '').trim();

      return (
        getAvailableCompassIdeaModes(
          session
        ).find(mode =>
          mode.id === id
        ) ||
        null
      );
    }

    function getCompassIdeaModeStorageKey(
      sessionId
    ) {
      return (
        'atlas::compassIdeaMode::' +
        String(sessionId || '').trim()
      );
    }

    function readCompassIdeaMode(
      session = getActiveSession()
    ) {
      try {
        const modeId =
          sessionStorage.getItem(
            getCompassIdeaModeStorageKey(
              session.id
            )
          ) || '';

        return getCompassIdeaMode(
          modeId,
          session
        )?.id || '';
      } catch {
        return '';
      }
    }

    function writeCompassIdeaMode(
      sessionId,
      modeId
    ) {
      try {
        sessionStorage.setItem(
          getCompassIdeaModeStorageKey(
            sessionId
          ),
          modeId
        );
      } catch { }
    }

    function syncCompassIdeaModeControl(
      dialog,
      modeId = ''
    ) {
      const session =
        getActiveSession();

      const mode =
        getCompassIdeaMode(
          modeId,
          session
        );

      const button =
        dialog?.querySelector(
          '[data-idea-mode-control]'
        );

      const label =
        button?.querySelector(
          '[data-idea-mode-label]'
        );

      if (!button || !label) {
        return;
      }

      button.hidden = !mode;
      label.textContent =
        mode?.label || '';

      if (mode) {
        button.setAttribute(
          'aria-label',
          'Change idea type. Current: ' +
            mode.label
        );
      }
    }

    function getCompassLearnerInterests(
      session
    ) {
      if (
        !session ||
        isDefaultSession(session) ||
        typeof Bridge
          .readLearnerMemory !==
        'function'
      ) {
        return '';
      }

      try {
        return String(
          Bridge.readLearnerMemory(
            session.id
          )?.interests || ''
        ).trim();
      } catch {
        return '';
      }
    }

    function getCompassSuggestionHistoryKey(
      sessionId,
      modeId,
      topicFocus = ''
    ) {
      return (
        String(sessionId || '') +
        '::' +
        String(modeId || '') +
        '::' +
        String(topicFocus || '')
          .trim()
          .toLowerCase()
      );
    }

    function getCompassIdeaContextSubject(
      subject
    ) {
      const title =
        String(
          subject?.title || ''
        ).trim();

      if (!title) {
        return null;
      }

      return {
        title,

        description:
          String(
            subject?.hook || ''
          ).trim()
      };
    }

    function buildCompassRecommendationContext(
      session,
      sessionSubjects,
      existingSubjects
    ) {
      return {
        sessionId:
          session.id,

        sessionSubjects:
          sessionSubjects
            .map(subject =>
              getCompassIdeaContextSubject(
                subject
              )
            )
            .filter(Boolean),

        existingSubjects:
          existingSubjects
            .map(subject =>
              getCompassIdeaContextSubject(
                subject
              )
            )
            .filter(Boolean)
      };
    }

    function renderCompassRecommendationResult(
      result
    ) {
      if (
        !Array.isArray(result.ideas) ||
        result.ideas.length !== 3
      ) {
        throw new Error(
          'Compass could not resolve its ideas.'
        );
      }

      return (
        '<section class="compass-recommendation-panel" aria-label="Compass suggestions">' +
        '<div class="compass-recommendation-head">' +
        '<div class="compass-recommendation-kicker">' +
        'Compass' +
        '<span class="compass-recommendation-count">3 ideas</span>' +
        '</div>' +
        '</div>' +
        '<div class="compass-recommendation-body">' +
        '<p class="compass-recommendation-message">' +
        escHtml(result.message) +
        '</p>' +
        result.ideas.map(
          idea =>
            '<button class="compass-recommendation-row" type="button" ' +
            'data-subject-idea="' +
            escHtml(
              idea.title
            ) +
            '" data-subject-premise="' +
            escHtml(
              idea.reason
            ) +
            '" data-subject-source="' +
            escHtml(
              JSON.stringify(
                idea.source || {}
              )
            ) +
            '" onclick="chooseCompassSubjectIdea(this)">' +
            '<span class="compass-recommendation-copy">' +
            '<span class="compass-recommendation-title">' +
            escHtml(
              idea.title
            ) +
            '</span>' +
            '<span class="compass-recommendation-reason">' +
            escHtml(
              idea.reason
            ) +
            '</span>' +
            (
              idea.source?.publisher
                ? '<span class="compass-recommendation-source">' +
                  'Source: ' +
                  escHtml(
                    idea.source.publisher
                  ) +
                  (
                    idea.source.publishedAt
                      ? ' · ' +
                        escHtml(
                          formatCompassSourceDate(
                            idea.source.publishedAt
                          )
                        )
                      : ''
                  ) +
                  '</span>'
                : ''
            ) +
            '</span>' +
            '<span class="compass-recommendation-arrow" aria-hidden="true">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none">' +
            '<path d="M4 8h8M9 5l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
            '</span>' +
            '</button>'
        ).join('') +
        '</div>' +
        '</section>'
      );
    }

    function showCompassIdeaModeChooser(
      button
    ) {
      const dialog =
        button?.closest(
          '.owned-subject-dialog-panel'
        );

      const region =
        dialog?.querySelector(
          '.compass-recommendation-region'
        );

      const label =
        dialog?.querySelector(
          '[data-idea-label]'
        );

      if (!region) {
        return;
      }

      const session =
        getActiveSession();

      const currentModeId =
        String(
          ownedSubjectDialogState
            ?.ideaMode || ''
        ).trim() ||
        readCompassIdeaMode(
          session
        );

      const modes =
        getAvailableCompassIdeaModes(
          session
        );

      const topicFocus =
        String(
          ownedSubjectDialogState
            ?.topicFocus || ''
        )
          .trim()
          .slice(0, 240);

      region.innerHTML =
        '<section class="compass-recommendation-panel compass-recommendation-panel--chooser" aria-label="Choose idea type">' +
        '<div class="compass-recommendation-head">' +
        '<div class="compass-recommendation-kicker">Compass</div>' +
        '</div>' +
        '<p class="compass-recommendation-message">What kind of subject are you looking for?</p>' +
        '<div class="compass-idea-mode-grid">' +
        modes.map(mode =>
          '<button class="compass-idea-mode-btn' +
          (
            mode.id === currentModeId
              ? ' is-current'
              : ''
          ) +
          '" type="button" ' +
          'aria-pressed="' +
          String(
            mode.id === currentModeId
          ) +
          '" onclick="chooseCompassIdeaMode(this, ' +
          jsArg(mode.id) +
          ')">' +
          escHtml(mode.label) +
          '</button>'
        ).join('') +
        '</div>' +
        '<label class="compass-idea-focus-field">' +
        '<span class="compass-idea-focus-label">Narrow the ideas — optional</span>' +
        '<input class="compass-idea-focus-input" id="compass-idea-topic-focus" ' +
        'type="text" maxlength="240" autocomplete="off" ' +
        'placeholder="e.g. a place, theme, industry, person or idea" ' +
        'value="' +
        escHtml(topicFocus) +
        '">' +
        '</label>' +
        '</section>';

      if (label) {
        label.textContent =
          'Choose a type';
      }
    }

    function chooseCompassIdeaMode(
      button,
      modeId
    ) {
      const session =
        getActiveSession();

      const mode =
        getCompassIdeaMode(
          modeId,
          session
        );

      if (!mode) {
        return;
      }

      if (
        ownedSubjectDialogState?.mode ===
        'create'
      ) {
        ownedSubjectDialogState.ideaMode =
          mode.id;
      }

      writeCompassIdeaMode(
        session.id,
        mode.id
      );

      const dialog =
        button?.closest(
          '.owned-subject-dialog-panel'
        );

      const ideaButton =
        dialog?.querySelector(
          '.owned-subject-dialog-idea-btn'
        );

      const region =
        dialog?.querySelector(
          '.compass-recommendation-region'
        );

      const label =
        dialog?.querySelector(
          '[data-idea-label]'
        );

      if (!ideaButton) {
        return;
      }

      syncCompassIdeaModeControl(
        dialog,
        mode.id
      );

      askCompassForSubjects(
        ideaButton,
        mode.id
      );
    }

    function chooseCompassSubjectIdea(
      button
    ) {
      const title =
        String(
          button?.dataset
            ?.subjectIdea ||
          ''
        ).trim();

      const premise =
        String(
          button?.dataset
            ?.subjectPremise ||
          ''
        ).trim();

      let source = null;

      try {
        const parsedSource =
          JSON.parse(
            String(
              button?.dataset
                ?.subjectSource ||
              ''
            ).trim() || '{}'
          );

        if (
          parsedSource &&
          typeof parsedSource === 'object' &&
          !Array.isArray(parsedSource) &&
          String(
            parsedSource.url || ''
          ).trim()
        ) {
          source = parsedSource;
        }
      } catch { }

      const dialog =
        button?.closest(
          '.owned-subject-dialog-panel'
        );

      const input =
        dialog?.querySelector(
          '#owned-subject-dialog-input'
        );

      const region =
        dialog?.querySelector(
          '.compass-recommendation-region'
        );

      const label =
        dialog?.querySelector(
          '[data-idea-label]'
        );

      if (!title || !input) {
        return;
      }

      if (
        ownedSubjectDialogState?.mode ===
        'create'
      ) {
        ownedSubjectDialogState.suggestion = {
          title,
          premise,
          source
        };
      }

      input.value = title;
      input.dispatchEvent(
        new Event(
          'input',
          {
            bubbles: true
          }
        )
      );

      syncAnonymousCreatePreviewState(
        dialog
      );

      if (region) {
        region.innerHTML = '';
      }

      if (label) {
        label.textContent =
          'Need another idea?';
      }

      input.focus();
    }

    async function askCompassForSubjects(
      button,
      requestedModeId = ''
    ) {
      const context =
        compassRecommendationContext;

      const dialog =
        button
          ?.closest(
            '.owned-subject-dialog-panel'
          );

      const region =
        dialog?.querySelector(
          '.compass-recommendation-region'
        );

      const label =
        button?.querySelector(
          '[data-idea-label]'
        );

      if (
        !context ||
        !region ||
        !window.AtlasAI ||
        typeof window.AtlasAI
          .suggestSubjectIdeas !== 'function'
      ) {
        showToast(
          'Compass suggestions are unavailable.'
        );
        return;
      }

      const activeSession =
        getActiveSession();

      const selectedMode =
        getCompassIdeaMode(
          requestedModeId ||
            (
              ownedSubjectDialogState?.mode ===
              'create'
                ? ownedSubjectDialogState
                    .ideaMode
                : ''
            ),
          activeSession
        );

      if (!selectedMode) {
        showCompassIdeaModeChooser(
          button
        );
        return;
      }

      const topicFocusInput =
        dialog?.querySelector(
          '#compass-idea-topic-focus'
        );

      const topicFocus =
        String(
          topicFocusInput
            ? topicFocusInput.value
            : ownedSubjectDialogState
                ?.topicFocus || ''
        )
          .trim()
          .slice(0, 240);

      if (
        ownedSubjectDialogState?.mode ===
        'create'
      ) {
        ownedSubjectDialogState.topicFocus =
          topicFocus;
      }

      writeCompassIdeaMode(
        activeSession.id,
        selectedMode.id
      );

      syncCompassIdeaModeControl(
        dialog,
        selectedMode.id
      );

      const anonymousSuggestionPreview =
        ownedSubjectDialogState?.mode ===
          'create' &&
        ownedSubjectDialogState
          .anonymousPreview === true;

      if (!anonymousSuggestionPreview) {
        const aiAccess =
          await requireCompassSubjectCapability(
            'canUseAI',
            'capability',
            'suggest-subject-ideas',
            { mode: selectedMode.id },
            button
          );

        if (
          !compassSubjectCapabilityAllows(
            aiAccess,
            'Compass suggestions are unavailable right now.'
          )
        ) {
          return;
        }
      }

      const requestId =
        ++compassRecommendationRequestId;

      button.disabled = true;

      if (label) {
        label.textContent =
          selectedMode.id ===
            'current-affairs'
            ? 'Checking…'
            : 'Thinking…';
      }

      region.innerHTML =
        '<div class="compass-recommendation-panel compass-recommendation-panel--state">' +
        '<div class="compass-recommendation-kicker">Compass</div>' +
        '<div class="compass-recommendation-state">' +
        (
          selectedMode.id ===
            'current-affairs'
            ? 'Checking what’s current… Usually takes about 15 seconds.'
            : 'Give me a second…'
        ) +
        '</div>' +
        '</div>';

      const historyKey =
        getCompassSuggestionHistoryKey(
          context.sessionId,
          selectedMode.id,
          topicFocus
        );

      const recentSuggestions =
        compassSuggestionHistory.get(
          historyKey
        ) || [];

      const interests =
        selectedMode.id ===
          'learner'
          ? getCompassLearnerInterests(
              activeSession
            )
          : '';

      try {
        const result =
          await window.AtlasAI
            .suggestSubjectIdeas({
              mode:
                selectedMode.id,

              interests,

              topicFocus,

              languageLevel:
                String(
                  dialog?.querySelector(
                    '#owned-subject-dialog-level'
                  )?.value || 'b2'
                ).trim(),

              sessionSubjects:
                context.sessionSubjects,

              existingSubjects:
                context.existingSubjects,

              recentSuggestions,

              allowAnonymous:
                anonymousSuggestionPreview
            });

        if (
          requestId !==
            compassRecommendationRequestId ||
          getActiveSession().id !==
            context.sessionId
        ) {
          return;
        }

        const nextSuggestionHistory = [
          ...recentSuggestions,

          ...result.ideas.map(idea => ({
            title:
              String(
                idea?.title || ''
              ).trim(),

            reason:
              String(
                idea?.reason || ''
              ).trim()
          }))
        ].slice(-18);

        compassSuggestionHistory.set(
          historyKey,
          nextSuggestionHistory
        );

        region.innerHTML =
          renderCompassRecommendationResult(
            result
          );

        if (label) {
          label.textContent =
            'Ask again';
        }
      } catch (error) {
        console.error(
          '[Compass] Recommendation failed:',
          error
        );

        if (
          requestId !==
          compassRecommendationRequestId
        ) {
          return;
        }

        region.innerHTML =
          '<div class="compass-recommendation-panel compass-recommendation-panel--state">' +
          '<div class="compass-recommendation-kicker">Compass</div>' +
          '<div class="compass-recommendation-state">I couldn’t get a clear answer just now. Try me again.</div>' +
          '</div>';

        if (label) {
          label.textContent =
            'Try again';
        }
      } finally {
        if (
          requestId ===
            compassRecommendationRequestId &&
          document.contains(button)
        ) {
          button.disabled = false;
        }
      }
    }

    let hubRenderRevision = 0;
    let lastCommittedHubContentMarkup = null;

    async function renderHub({
      initialSnapshot = null,
      diagnosticSource = 'direct'
    } = {}) {
      if (!Bridge) return;

      const renderRevision = ++hubRenderRevision;
      const useInitialSnapshot =
        Boolean(initialSnapshot);

      const main = document.getElementById('hub-main');

      CompassHoverForensics.noteRender(
        'start',
        {
          revision: renderRevision,
          source: diagnosticSource,
          initialSnapshot:
            useInitialSnapshot,
          cloudAuthorityPending:
            isCompassCloudAuthorityPending()
        }
      );
      const session = getActiveSession();
      const atlasSubjects = getAtlasSubjects();
      const authenticated =
        Boolean(getStoredCompassAccountUserId());

      document.documentElement.dataset
        .atlasCompassAccessState =
          authenticated
            ? 'authenticated'
            : 'anonymous';

      const ownedSubjects = authenticated
        ? await getOwnedSubjects({
            initialSnapshot
          })
        : [];

      const Subjects = authenticated
        ? window.AtlasTutorSubjects
        : null;

      const cloudAuthorityPending =
        authenticated &&
        isCompassCloudAuthorityPending();

      let sessionSubjectRefs = [];
      let libraryState =
        (
          useInitialSnapshot ||
          cloudAuthorityPending
        )
          ? getCompassInitialLibraryState(
              initialSnapshot ||
              undefined
            )
          : null;

      try {
        if (Subjects) {
          if (useInitialSnapshot) {
            sessionSubjectRefs =
              getCachedSessionSubjectRefs(
                session.id,
                initialSnapshot
              );
          } else if (cloudAuthorityPending) {
            sessionSubjectRefs =
              typeof Subjects.getSessionSubjects === 'function'
                ? await Subjects.getSessionSubjects(
                    session.id
                  )
                : [];
          } else {
            const results = await Promise.all([
              typeof Subjects.getSessionSubjects === 'function'
                ? Subjects.getSessionSubjects(session.id)
                : Promise.resolve([]),
              typeof Subjects.getLibraryState === 'function'
                ? Subjects.getLibraryState()
                : Promise.resolve(null)
            ]);

            sessionSubjectRefs =
              Array.isArray(results[0])
                ? results[0]
                : [];

            libraryState = results[1];
          }
        }
      } catch {
        sessionSubjectRefs = [];

        if (!cloudAuthorityPending) {
          libraryState = null;
        }
      }

      if (renderRevision !== hubRenderRevision) {
        return;
      }

      if (authenticated && !useInitialSnapshot) {
        sessionSubjectRefs =
          await syncAtlasOriginalSessionSubjects(
            session,
            atlasSubjects,
            sessionSubjectRefs
          );

        if (renderRevision !== hubRenderRevision) {
          return;
        }
      }

      const ownedById = new Map(
        ownedSubjects.map(subject => [
          subject.subjectId,
          subject
        ])
      );

      const atlasById = new Map(
        atlasSubjects.map(subject => [
          subject.registryId,
          subject
        ])
      );

      const sessionSubjects = [];
      const promotedAtlasIds = new Set();

      sessionSubjectRefs.forEach(ref => {
        if (
          ref.kind === 'my-subject' &&
          ownedById.has(ref.id) &&
          !ownedById.get(ref.id).archived
        ) {
          sessionSubjects.push({
            ...ownedById.get(ref.id),
            isSessionRelevant: true
          });

          return;
        }

        if (
          ref.kind === 'atlas-subject' &&
          atlasById.has(ref.id)
        ) {
          promotedAtlasIds.add(ref.id);

          sessionSubjects.push({
            ...atlasById.get(ref.id),
            isSessionRelevant: true,
            canMoveAtlasCategory:
              (libraryState?.categories?.length || 0) > 1
          });
        }
      });

      const remainingOwnedSubjects =
        ownedSubjects.filter(subject =>
          subject.libraryIncluded &&
          !subject.archived &&
          !subject.sessionIds.includes(session.id)
        );

      const ownedAtlasSourceIds = new Set(
        ownedSubjects
          .filter(subject => {
            const kind = String(
              subject.provenance?.kind || ''
            ).trim();

            return (
              kind === 'atlas-original-owned' ||
              kind === 'atlas-my-version'
            );
          })
          .map(subject =>
            String(
              subject.provenance?.sourceContentId ||
              (
                subject.provenance?.sourceSubjectId
                  ? COMPASS_ID + ':' +
                    subject.provenance.sourceSubjectId
                  : ''
              )
            ).trim()
          )
          .filter(Boolean)
      );

      const remainingAtlasSubjects =
        atlasSubjects
          .filter(subject =>
            !promotedAtlasIds.has(subject.registryId) &&
            !ownedAtlasSourceIds.has(subject.registryId)
          )
          .map(subject => ({
            ...subject,
            canMoveAtlasCategory:
              (libraryState?.categories?.length || 0) > 1
          }));

      compassRecommendationContext =
        buildCompassRecommendationContext(
          session,
          sessionSubjects,
          [
            ...atlasSubjects,
            ...ownedSubjects
          ]
        );

      const fallbackCategory = {
        id: 'default',
        name: 'My Subjects'
      };

      const libraryCategories =
        Array.isArray(libraryState?.categoryOrder)
          ? libraryState.categoryOrder
            .map(categoryId =>
              libraryState.categories?.find(category =>
                category.id === categoryId
              )
            )
            .filter(Boolean)
          : [fallbackCategory];

      if (!libraryCategories.length) {
        libraryCategories.push(fallbackCategory);
      }

      const ownedLibraryHtml =
        libraryCategories
          .map((category, index) =>
            renderSubjectCollection(
              remainingOwnedSubjects.filter(subject =>
                subject.categoryId === category.id
              ),
              category.name,
              {
                canCreate: true,
                categoryId: category.id,
                canManageCategory: true,
                isDefaultCategory:
                  category.id ===
                  libraryState?.defaultCategoryId,
                canMoveCategoryEarlier:
                  index > 0,
                canMoveCategoryLater:
                  index < libraryCategories.length - 1
              }
            )
          )
          .join('');

      setSessionLabels();
      renderSpineHubNav();
      renderDrawerHubNav();

      const nextHubContentMarkup =
        authenticated
          ? (
            renderSubjectCollection(
              sessionSubjects,
              getActiveSessionSubjectCollectionTitle(),
              {
                canAdd: true
              }
            ) +
            ownedLibraryHtml +
            renderSubjectCollection(
              remainingAtlasSubjects,
              'Atlas Subjects'
            )
          )
          : (
            renderAnonymousCreationHero() +
            renderSubjectCollection(
              remainingAtlasSubjects,
              'Atlas Subjects'
            )
          );

      /*
       * The intro contains a time-derived animation phase so the complete
       * Hub HTML is expected to differ across refreshes even when no subject
       * data changed. Compare only meaningful Hub content. Unchanged account
       * or lifecycle refreshes therefore leave the existing subject-card DOM
       * intact; real card/library/session changes still commit normally.
       */
      const hubMarkupChanged =
        nextHubContentMarkup !==
        lastCommittedHubContentMarkup;

      CompassHoverForensics
        .noteMarkupDecision(
          lastCommittedHubContentMarkup,
          nextHubContentMarkup,
          hubMarkupChanged,
          {
            revision:
              renderRevision,
            source:
              diagnosticSource
          }
        );

      if (!hubMarkupChanged) {
        return;
      }

      const nextHubMarkup =
        renderIntro(
          session,
          { anonymous: !authenticated }
        ) +
        nextHubContentMarkup;

      CompassHoverForensics.noteRender(
        'commit-before',
        {
          revision: renderRevision,
          source: diagnosticSource
        }
      );

      main.innerHTML = nextHubMarkup;
      sizeHubSubjectCards(main);
      prewarmHubCoverImages(main);
      lastCommittedHubContentMarkup =
        nextHubContentMarkup;

      CompassHoverForensics.noteRender(
        'commit-after',
        {
          revision: renderRevision,
          source: diagnosticSource
        }
      );
    }

    const COMPASS_TOPIC_CYCLE_MS = 80000;
    const COMPASS_TOPIC_SLOT_MS = 8000;
    const COMPASS_TOPIC_SETTLE_MS = 800;
    const COMPASS_TOPIC_STARTED_AT_KEY =
      'atlas::compassTopicCycleStartedAt';

    function getCompassTopicPhaseMs() {
      const now = Date.now();
      let startedAt = now;

      try {
        const storedStartedAt = Number(
          sessionStorage.getItem(
            COMPASS_TOPIC_STARTED_AT_KEY
          )
        );

        if (
          Number.isFinite(storedStartedAt) &&
          storedStartedAt > 0
        ) {
          startedAt = storedStartedAt;
        } else {
          sessionStorage.setItem(
            COMPASS_TOPIC_STARTED_AT_KEY,
            String(now)
          );
        }
      } catch (e) { }

      const rawPhase =
        (now - startedAt) % COMPASS_TOPIC_CYCLE_MS;

      const slotStart =
        Math.floor(
          rawPhase / COMPASS_TOPIC_SLOT_MS
        ) * COMPASS_TOPIC_SLOT_MS;

      const slotOffset =
        rawPhase - slotStart;

      const settledOffset = Math.min(
        Math.max(
          slotOffset,
          COMPASS_TOPIC_SETTLE_MS
        ),
        COMPASS_TOPIC_SLOT_MS -
          COMPASS_TOPIC_SETTLE_MS
      );

      return slotStart + settledOffset;
    }

    let hubCardResizeObserver;

    function prewarmHubCoverImages(main) {
      const images = [
        ...main.querySelectorAll(
          '.subject-card--cover .subject-card-cover img'
        )
      ];

      if (!images.length) return;

      window.AtlasContentRegistry
        ?.prewarmCompassCoverImages?.(
          images.map(image =>
            image.currentSrc ||
            image.src
          )
        );

      const viewportHeight =
        window.innerHeight ||
        document.documentElement.clientHeight ||
        0;
      const preloadDistance = Math.max(
        240,
        Math.min(600, viewportHeight * 0.75)
      );

      images.forEach(image => {
        const rect = image.getBoundingClientRect();

        if (
          rect.bottom < -preloadDistance ||
          rect.top > viewportHeight + preloadDistance
        ) {
          return;
        }

        image.loading = 'eager';

        if (typeof image.decode === 'function') {
          image.decode().catch(() => {});
        }
      });
    }

    function sizeHubSubjectCards(main) {
      hubCardResizeObserver?.disconnect();
      const grids = [...main.querySelectorAll('.subject-grid')];
      const measure = grid => {
        if (!grid.isConnected) return;
        const cards = [...grid.querySelectorAll('.subject-card--cover')];
        // Measure the unclamped copy at the actual column width. Reserve enough
        // space for even a long owned description before any interaction occurs.
        const sizes = cards.map(card => {
          const content = card.querySelector('.subject-card-content');
          const style = getComputedStyle(content);
          const header = card.querySelector('.subject-card-header');
          const hook = card.querySelector('.subject-card-hook');
          const footer = card.querySelector('.subject-card-footer');
          const fullHookHeight = hook?.scrollHeight || 0;
          const compactHookHeight = hook
            ? Math.min(fullHookHeight, parseFloat(getComputedStyle(hook).lineHeight) * 2)
            : 0;
          return {
            card,
            extraCopy: fullHookHeight - compactHookHeight,
            hookHidden:
              Math.max(
                0,
                fullHookHeight -
                compactHookHeight
              ),
            body: parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) +
              header.offsetHeight + parseFloat(getComputedStyle(header).marginBottom) +
              fullHookHeight + footer.offsetHeight
          };
        });
        const height = Math.ceil(Math.max(370, ...sizes.map(size =>
          Math.max(size.body + 82, size.body - size.extraCopy + 172))));
        grid.style.setProperty('--subject-card-height', height + 'px');
        sizes.forEach(({ card, body, hookHidden }) => {
          card.style.setProperty(
            '--subject-cover-expanded',
            Math.max(
              80,
              Math.min(
                124,
                height - body - 2
              )
            ) + 'px'
          );
          card.style.setProperty(
            '--subject-hook-hidden',
            hookHidden + 'px'
          );
        });
      };
      const widths = new WeakMap();
      hubCardResizeObserver = new ResizeObserver(entries => {
        entries.forEach(({ target, contentRect }) => {
          if (widths.get(target) === contentRect.width) return;
          widths.set(target, contentRect.width);
          measure(target);
        });
      });
      grids.forEach(grid => {
        measure(grid);
        hubCardResizeObserver.observe(grid);
      });
      document.fonts.ready.then(() => grids.forEach(measure));
    }
