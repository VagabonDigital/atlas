<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../shared/atlas-modal-theme.css">

  <script src="../shared/atlas-bridge.js"></script>

  <!-- Anti-flash: apply the active session theme before first paint -->
  <script>
    (function () {
      var m = null;
      try {
        var sessionId = sessionStorage.getItem('atlas::activeSessionId') || 'default';
        var sessionModes = JSON.parse(localStorage.getItem('atlas::appearanceBySession') || '{}');
        m = sessionModes[sessionId] || localStorage.getItem('atlas::appearanceMode');
      } catch (e) { }
      document.documentElement.dataset.theme = (m === 'night') ? 'night' : 'light';
    })();
  </script>
  <style>
    /* ============================================================
       THEME TOKENS
       Semantic day and night values for the Compass Hub.
       ============================================================ */
    :root {
      /* Canvas and surfaces */
      --surface-canvas: #f5f1e9;
      --surface-muted: #eee8de;
      --surface-panel: #ffffff;
      --surface-raised: #fffdf9;
      --surface-raised-hover: #ffffff;
      --surface-scrim: rgba(20, 17, 12, 0.50);

      /* Borders and text */
      --border-faint: rgba(61, 56, 48, 0.11);
      --border-subtle: #e2dacf;
      --border-strong: #c6bbad;
      --text-subtle: #8f8578;
      --text-muted: #7a7268;
      --text-body: #3d3830;
      --text-heading: #1e1b16;

      /* Compass accent */
      --accent: #4f7772;
      --accent-soft: #78a19c;
      --accent-pale: #d9e9e6;
      --accent-dim: #eaf3f1;
      --accent-rgb: 79, 119, 114;
      --accent-soft-rgb: 120, 161, 156;
      --accent-ink: #ffffff;
      --brand-dot: #18b98f;

      /* Page atmosphere */
      --page-bg-day:
        radial-gradient(circle at 12% 3%, rgba(255, 255, 255, 0.76), transparent 34rem),
        radial-gradient(circle at 88% 22%, rgba(79, 119, 114, 0.075), transparent 40rem),
        linear-gradient(145deg, #f7f3ec 0%, #f5f1e9 52%, #f0ebe2 100%);
      --page-bg-night:
        radial-gradient(circle at 12% 3%, rgba(166, 220, 211, 0.055), transparent 34rem),
        radial-gradient(circle at 88% 22%, rgba(132, 202, 191, 0.095), transparent 40rem),
        linear-gradient(145deg, #1d1a17 0%, #221f1b 52%, #2d2925 100%);
      --page-bg: var(--page-bg-day);

      /* Hub chrome and controls */
      --chrome-surface: rgba(247, 244, 238, 0.86);
      --chrome-surface-mobile: rgba(247, 244, 238, 0.88);
      --chrome-border: rgba(126, 112, 94, 0.14);
      --world-nav-surface: rgba(238, 232, 222, 0.58);
      --world-nav-border: rgba(173, 160, 143, 0.34);
      --world-nav-hover: rgba(255, 253, 249, 0.72);
      --world-nav-active: rgba(255, 255, 255, 0.86);
      --world-nav-active-border: rgba(var(--accent-rgb), 0.24);
      --world-nav-active-text: var(--accent);
      --world-nav-inset-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.46);
      --world-nav-hover-shadow: 0 5px 14px rgba(49, 42, 32, 0.045);
      --control-surface: #fffdf9;
      --control-hover: #fffdf9;
      --control-border: rgba(49, 45, 38, 0.10);
      --control-border-hover: rgba(49, 45, 38, 0.16);
      --control-text: #504b43;
      --control-icon: #7b7469;
      --control-text-hover: #211f1b;
      --control-shadow: 0 2px 8px rgba(42, 37, 29, 0.045);
      --control-hover-shadow: 0 10px 30px rgba(42, 37, 29, 0.075);
      --mobile-control-surface: var(--surface-panel);
      --mobile-control-hover: var(--border-subtle);
      --mobile-control-border: var(--border-subtle);
      --drawer-section-surface: transparent;
      --drawer-button-surface: var(--surface-muted);
      --drawer-scrim: rgba(0, 0, 0, 0.40);
      --drawer-shadow: 4px 0 24px rgba(20, 17, 12, 0.15);
      --navigation-hover: var(--border-subtle);

      /* Library and card states */
      --library-surface: rgba(255, 253, 250, 0.88);
      --library-border: rgba(126, 112, 94, 0.14);
      --library-border-width: 1px;
      --library-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.72),
        0 10px 30px rgba(61, 56, 48, 0.035);
      --card-surface: rgba(255, 253, 249, 0.91);
      --card-surface-hover: rgba(255, 255, 255, 0.97);
      --card-border: var(--border-faint);
      --card-border-width: 1px;
      --card-emphasis-ring-width: 0px;
      --card-hover-border: #ffffff;
      --card-inprogress-border: var(--card-border);
      --card-explored-border: var(--card-border);
      --card-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.74),
        0 11px 30px rgba(49, 42, 32, 0.06);
      --card-hover-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.90),
        0 16px 40px rgba(49, 42, 32, 0.08),
        0 12px 32px rgba(var(--accent-rgb), 0.08);
      --card-explored-surface: rgba(239, 247, 245, 0.82);
      --launch-surface: rgba(217, 233, 230, 0.76);
      --launch-border: rgba(var(--accent-rgb), 0.27);
      --launch-text: var(--accent);
      --launch-shadow: none;
      --launch-hover-surface: var(--accent);
      --launch-hover-border: var(--accent);
      --launch-hover-text: #ffffff;
      --launch-hover-shadow: 0 7px 17px rgba(var(--accent-rgb), 0.17);
      --launch-inprogress-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.22);
      /* Feedback states */
      --danger-bg: #fef2f2;
      --danger-bg-hover: #fee2e2;
      --danger-text: #dc2626;
      --danger-border: #fca5a5;
      --dialog-border: 0 solid transparent;

      /* Elevation, geometry, typography, and motion */
      --shadow-xs: 0 1px 2px rgba(30, 27, 22, 0.05);
      --shadow-md: 0 14px 38px rgba(49, 42, 32, 0.09);
      --shadow-lg: 0 24px 64px rgba(49, 42, 32, 0.13);
      --radius-sm: 6px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --t: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --hub-theme-motion: 280ms cubic-bezier(0.4, 0, 0.2, 1);

      /* Shared Atlas integration contract */
      --cream: var(--surface-canvas);
      --cream-warm: var(--surface-muted);
      --white: var(--surface-panel);
      --stone-light: var(--border-subtle);
      --stone: var(--border-strong);
      --stone-dark: var(--text-subtle);
      --ink-faint: var(--border-faint);
      --ink-light: var(--text-muted);
      --ink: var(--text-body);
      --ink-dark: var(--text-heading);
    }

    html[data-theme="night"] {
      /* Canvas and surfaces */
      --surface-canvas: #221f1b;
      --surface-muted: #2d2925;
      --surface-panel: #38332d;
      --surface-raised: #453f38;
      --surface-raised-hover: #524b42;
      --surface-scrim: rgba(14, 12, 10, 0.74);

      /* Borders and text */
      --border-faint: #4c453d;
      --border-subtle: #635a4e;
      --border-strong: #877b6b;
      --text-subtle: #bab2a6;
      --text-muted: #cfc7ba;
      --text-body: #e7e0d4;
      --text-heading: #f5f0e8;

      /* Compass accent */
      --accent: #84cabf;
      --accent-soft: #a6dcd3;
      --accent-pale: #33574f;
      --accent-dim: #2c4c47;
      --accent-rgb: 132, 202, 191;
      --accent-soft-rgb: 166, 220, 211;
      --accent-ink: #17201e;
      --brand-dot: var(--accent);

      /* Hub chrome and controls */
      --chrome-surface: rgba(34, 31, 27, 0.95);
      --chrome-surface-mobile: rgba(34, 31, 27, 0.96);
      --chrome-border: rgba(99, 90, 78, 0.72);
      --world-nav-surface: rgba(45, 41, 37, 0.88);
      --world-nav-border: rgba(99, 90, 78, 0.72);
      --world-nav-hover: var(--surface-raised);
      --world-nav-active: var(--surface-raised-hover);
      --world-nav-active-border: rgba(var(--accent-rgb), 0.42);
      --world-nav-active-text: var(--accent-soft);
      --world-nav-inset-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
      --world-nav-hover-shadow: none;
      --control-surface: var(--surface-raised);
      --control-hover: var(--surface-raised-hover);
      --control-border: var(--border-faint);
      --control-border-hover: var(--border-subtle);
      --control-text: var(--text-muted);
      --control-icon: var(--text-subtle);
      --control-text-hover: var(--text-heading);
      --control-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
      --control-hover-shadow: 0 2px 10px rgba(0, 0, 0, 0.30);
      --mobile-control-surface: var(--surface-raised);
      --mobile-control-hover: var(--surface-raised-hover);
      --mobile-control-border: var(--border-faint);
      --drawer-section-surface: var(--surface-muted);
      --drawer-button-surface: var(--surface-raised);
      --drawer-scrim: var(--surface-scrim);
      --drawer-shadow: 4px 0 32px rgba(0, 0, 0, 0.30);
      --navigation-hover: var(--surface-raised);

      /* Library and card states */
      --library-surface: var(--surface-muted);
      --library-border: var(--border-faint);
      --library-border-width: 1.5px;
      --library-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.035),
        0 18px 48px rgba(0, 0, 0, 0.14);
      --card-surface: var(--surface-raised);
      --card-surface-hover: var(--surface-raised-hover);
      --card-border: var(--border-faint);
      --card-border-width: 1.5px;
      --card-emphasis-ring-width: 0px;
      --card-hover-border: var(--accent);
      --card-inprogress-border: rgba(var(--accent-rgb), 0.72);
      --card-explored-border: rgba(var(--accent-rgb), 0.40);
      --card-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 14px 38px rgba(0, 0, 0, 0.17);
      --card-hover-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.065),
        0 19px 44px rgba(0, 0, 0, 0.23);
      --card-explored-surface: rgba(44, 76, 71, 0.78);
      --launch-surface: var(--accent);
      --launch-border: var(--accent);
      --launch-text: var(--accent-ink);
      --launch-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 4px 11px rgba(var(--accent-rgb), 0.13);
      --launch-hover-surface: var(--accent-soft);
      --launch-hover-border: var(--accent-soft);
      --launch-hover-text: var(--accent-ink);
      --launch-hover-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 7px 18px rgba(var(--accent-rgb), 0.20);
      --launch-inprogress-shadow: var(--launch-shadow);
      --page-bg: var(--page-bg-night);
      --dialog-border: 1px solid var(--border-faint);

      /* Elevation */
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 4px 18px rgba(0, 0, 0, 0.22);
      --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.30);
    }

    /* ============================================================
       RESET AND PAGE CANVAS
       ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--surface-canvas);
      scroll-behavior: smooth;
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    /* ============================================================
       THEMED SCROLLBARS
       Compass page and mobile drawer use the active Compass accent.
       ============================================================ */
    html,
    .drawer-nav {
      scrollbar-width: thin;
      scrollbar-color:
        rgba(var(--accent-rgb), 0.46)
        transparent;
    }

    html::-webkit-scrollbar,
    .drawer-nav::-webkit-scrollbar {
      width: 10px;
    }

    html::-webkit-scrollbar-track,
    .drawer-nav::-webkit-scrollbar-track {
      background: transparent;
    }

    html::-webkit-scrollbar-thumb,
    .drawer-nav::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: rgba(var(--accent-rgb), 0.46);
      background-clip: padding-box;
    }

    body {
      position: relative;
      isolation: isolate;
      font-family: var(--font-body);
      background: transparent;
      color: var(--text-body);
      font-size: 15px;
      line-height: 1.65;
      min-height: 100svh;
      overflow-x: hidden;
      padding-top: 56px;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-size: cover;
      background-position: center;
    }

    body::before {
      background: var(--page-bg-day);
      opacity: 1;
    }

    body::after {
      background: var(--page-bg-night);
      opacity: 0;
    }

    html[data-theme="night"] body::before {
      opacity: 0;
    }

    html[data-theme="night"] body::after {
      opacity: 1;
    }

    html.theme-changing body::before,
    html.theme-changing body::after {
      transition: opacity var(--hub-theme-motion);
    }

    /* ============================================================
       THEME MOTION
       Bridge owns theme state; the Hub owns surface interpolation.
       ============================================================ */

    html.theme-changing,
    html.theme-changing body,
    html.theme-changing .spine,
    html.theme-changing .spine-mark,
    html.theme-changing .spine-mark span,
    html.theme-changing .spine-worlds,
    html.theme-changing .spine-world-btn,
    html.theme-changing .spine-world-icon,
    html.theme-changing .spine-session-pill,
    html.theme-changing .spine-session-pill .pill-name,
    html.theme-changing .spine-btn,
    html.theme-changing .mobile-header,
    html.theme-changing .mobile-header-brand,
    html.theme-changing .mobile-header-mark,
    html.theme-changing .mobile-header-mark span,
    html.theme-changing .mobile-header-actions,
    html.theme-changing .mobile-header-btn,
    html.theme-changing .mobile-session-pill,
    html.theme-changing .mobile-session-pill span,
    html.theme-changing .drawer-header,
    html.theme-changing .drawer-footer,
    html.theme-changing .drawer-title,
    html.theme-changing .drawer-title span,
    html.theme-changing .drawer-close,
    html.theme-changing .drawer-nav-label,
    html.theme-changing .drawer-nav-item,
    html.theme-changing .drawer-nav-item .nav-soon,
    html.theme-changing .drawer-session-btn,
    html.theme-changing .drawer-session-btn span,
    html.theme-changing .drawer-appearance-btn,
    html.theme-changing .hub-intro,
    html.theme-changing .hub-eyebrow,
    html.theme-changing .hub-title,
    html.theme-changing .hub-desc,
    html.theme-changing .subject-library,
    html.theme-changing .subject-library-title,
    html.theme-changing .subject-card,
    html.theme-changing .subject-card-title,
    html.theme-changing .subject-card-version-badge,
    html.theme-changing .subject-card-hook,
    html.theme-changing .subject-card-progress-label,
    html.theme-changing .subject-card-progress-track,
    html.theme-changing .subject-card-progress-fill,
    html.theme-changing .btn-launch,
    html.theme-changing .empty-library,
    html.theme-changing .empty-library-icon,
    html.theme-changing .empty-library h2,
    html.theme-changing .empty-library p,
    html.theme-changing .bridge-error,
    html.theme-changing .bridge-error h2,
    html.theme-changing .bridge-error p,
    html.theme-changing .btn-primary,
    html.theme-changing .btn-ghost,
    html.theme-changing .hub-toast {
      transition:
        background-color var(--hub-theme-motion),
        background var(--hub-theme-motion),
        color var(--hub-theme-motion),
        border-color var(--hub-theme-motion),
        box-shadow var(--hub-theme-motion),
        opacity var(--hub-theme-motion),
        fill var(--hub-theme-motion),
        stroke var(--hub-theme-motion);
    }

    html.theme-changing .drawer {
      transition:
        transform 0.28s cubic-bezier(0.4, 0, 0.2, 1),
        background-color var(--hub-theme-motion),
        background var(--hub-theme-motion),
        color var(--hub-theme-motion),
        border-color var(--hub-theme-motion),
        box-shadow var(--hub-theme-motion),
        opacity var(--hub-theme-motion);
    }

    /* ============================================================
       DESKTOP SPINE AND WORLD NAVIGATION
       ============================================================ */
    .spine {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: var(--chrome-surface);
      backdrop-filter: blur(22px) saturate(1.12);
      border-bottom: 1px solid var(--chrome-border);
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 1.5rem;
      gap: 0.5rem;
    }

    .spine-mark {
      font-family: var(--font-display);
      font-size: 1.22rem;
      font-weight: 400;
      color: var(--text-heading);
      letter-spacing: -0.01em;
      flex: 1 1 0;
      cursor: default;
      user-select: none;
      white-space: nowrap;
      line-height: 1;
    }

    .spine-mark span {
      color: var(--brand-dot);
    }

    /* Hub shortcuts */
    .spine-worlds {
      display: flex;
      align-items: center;
      gap: 0.18rem;
      flex: 0 0 auto;
      padding: 0.2rem;
      border-radius: 999px;
      background: var(--world-nav-surface);
      border: 1px solid var(--world-nav-border);
      box-shadow: var(--world-nav-inset-shadow);
    }

    .spine-world-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      min-height: 32px;
      padding: 0.32rem 0.82rem;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .spine-world-icon {
      width: 13px;
      height: 13px;
      opacity: 0.72;
      flex-shrink: 0;
    }

    .spine-world-btn:hover {
      color: var(--text-body);
      background: var(--world-nav-hover);
      border-color: var(--world-nav-border);
      box-shadow: var(--world-nav-hover-shadow);
    }

    .spine-world-btn:hover .spine-world-icon {
      opacity: 1;
    }

    .spine-world-btn.is-active {
      color: var(--world-nav-active-text);
      background: var(--world-nav-active);
      border-color: var(--world-nav-active-border);
      box-shadow: var(--shadow-xs);
      cursor: default;
    }

    .spine-world-btn.is-active .spine-world-icon {
      opacity: 1;
    }

    .spine-world-btn[aria-disabled="true"] {
      opacity: 0.5;
      cursor: default;
    }

    .spine-world-btn[aria-disabled="true"]:hover {
      color: var(--text-muted);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    /* Header actions */
    .spine-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1 1 0;
      justify-content: flex-end;
    }

    .spine-session-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.48rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-surface);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--control-text);
      cursor: pointer;
      transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
    }

    .spine-session-pill:hover {
      border-color: var(--control-border-hover);
      background: var(--control-hover);
      color: var(--control-text-hover);
      box-shadow: var(--control-hover-shadow);
    }

    .spine-session-pill .pill-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spine-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--control-border);
      background: var(--control-surface);
      color: var(--control-icon);
      cursor: pointer;
      transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--control-shadow);
      flex-shrink: 0;
    }

    .spine-btn:hover {
      color: var(--control-text-hover);
      background: var(--control-hover);
      border-color: var(--control-border-hover);
      box-shadow: var(--control-hover-shadow);
    }

    .appearance-icon {
      display: block;
      flex-shrink: 0;
    }

    .appearance-icon--sun {
      display: none;
    }

    html[data-theme="night"] .appearance-icon--moon {
      display: none;
    }

    html[data-theme="night"] .appearance-icon--sun {
      display: block;
    }

    /* ============================================================
       MOBILE HEADER AND DRAWER
       ============================================================ */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: var(--chrome-surface-mobile);
      backdrop-filter: blur(20px) saturate(1.1);
      border-bottom: 1px solid var(--chrome-border);
      height: 56px;
      padding: 0 1rem;
      align-items: center;
      gap: 0.5rem;
    }

    .mobile-header-brand {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex: 1;
      min-width: 0;
    }

    .mobile-header-mark {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--text-heading);
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .mobile-header-mark span {
      color: var(--brand-dot);
    }

    .mobile-header-actions {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .mobile-header-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--mobile-control-border);
      background: var(--mobile-control-surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--t);
      flex-shrink: 0;
    }

    .mobile-header-btn:hover {
      color: var(--text-body);
      background: var(--mobile-control-hover);
    }

    .mobile-session-pill {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      border: 1px solid var(--mobile-control-border);
      background: var(--mobile-control-surface);
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      max-width: 130px;
      height: 40px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mobile-session-pill span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Mobile drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: var(--drawer-scrim);
      z-index: 400;
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.2s ease,
        visibility 0s linear 0.2s;
    }

    .drawer-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        opacity 0.2s ease,
        visibility 0s;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(300px, 85vw);
      background: var(--surface-panel);
      z-index: 500;
      display: flex;
      flex-direction: column;
      box-shadow: var(--drawer-shadow);
      transform: translate3d(-100%, 0, 0);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
      backface-visibility: hidden;
    }

    .drawer.open {
      transform: translate3d(0, 0, 0);
    }

    .drawer-header {
      padding: 1.2rem 1.2rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--drawer-section-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--text-heading);
    }

    .drawer-title span {
      color: var(--brand-dot);
    }

    .drawer-close {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
    }

    .drawer-close:hover {
      background: var(--surface-muted);
    }

    .drawer-nav {
      flex: 1;
      padding: 0.8rem;
      overflow-y: auto;
    }

    .drawer-nav-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.82;
      padding: 0.6rem 0.75rem 0.35rem;
    }

    .drawer-nav-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--t);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      min-height: 44px;
    }

    .drawer-nav-item:hover {
      background: var(--navigation-hover);
      color: var(--text-body);
    }

    .drawer-nav-item[aria-disabled="true"] {
      opacity: 0.5;
      cursor: default;
    }

    .drawer-nav-item[aria-disabled="true"]:hover {
      background: none;
      color: var(--text-muted);
    }

    .drawer-nav-item .nav-soon {
      margin-left: auto;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .drawer-nav-item.is-active {
      background: var(--accent-dim);
      color: var(--accent);
      cursor: default;
    }

    .drawer-nav-item.is-active:hover {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .drawer-footer {
      padding: 0.8rem;
      border-top: 1px solid var(--border-subtle);
      background: var(--drawer-section-surface);
    }

    .drawer-footer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.5rem;
    }

    .drawer-session-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--drawer-button-surface);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 44px;
      overflow: hidden;
    }

    .drawer-session-btn span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drawer-appearance-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--drawer-button-surface);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ============================================================
       MAIN HUB LAYOUT AND INTRODUCTION
       ============================================================ */
    .hub-main {
      position: relative;
      z-index: 1;
      max-width: 1020px;
      margin: 0 auto;
      padding: 3.35rem 1.75rem 6rem;
      animation: hubPageFadeIn 0.45s ease both;
    }

    /* Hub introduction */
    .hub-intro {
      padding: 0 0 1.25rem;
      margin-bottom: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hub-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4.4vw, 2.75rem);
      color: var(--text-heading);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 0.68rem;
    }

    .hub-topic-rotator {
      display: grid;
      margin-top: 0.08em;
      color: var(--accent);
    }

    .hub-topic {
      grid-area: 1 / 1;
      opacity: 0;
      animation: hub-topic-cycle 80s ease-in-out infinite;
      animation-delay: calc(
        var(--topic-delay) - var(--topic-phase, 0ms)
      );
    }

    @keyframes hub-topic-cycle {
      0% {
        opacity: 0;
      }

      1%,
      9% {
        opacity: 1;
      }

      10%,
      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hub-topic {
        animation: none;
        opacity: 0;
      }

      .hub-topic:first-child {
        opacity: 1;
      }
    }

    .hub-desc {
      font-size: 0.94rem;
      color: var(--text-body);
      opacity: 0.68;
      font-weight: 400;
      line-height: 1.7;
      max-width: 58ch;
    }

    .hub-intro-text {
      flex: 1 1 620px;
      min-width: 0;
    }

    .owned-subject-dialog-idea-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.62rem;
      min-height: 44px;
      padding: 0.48rem 1rem 0.48rem 0.5rem;
      overflow: hidden;
      border: 1px solid rgba(var(--accent-rgb), 0.34);
      border-radius: 999px;
      background:
        radial-gradient(
          circle at 18% 12%,
          rgba(255, 255, 255, 0.48),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          rgba(var(--accent-rgb), 0.14),
          rgba(var(--accent-rgb), 0.045) 58%,
          rgba(var(--accent-soft-rgb), 0.10)
        ),
        var(--surface-raised);
      color: var(--text-heading);
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: -0.005em;
      white-space: nowrap;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.58),
        0 3px 10px rgba(var(--accent-rgb), 0.08);
      transition:
        transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .owned-subject-dialog-idea-btn svg {
      width: 30px;
      height: 30px;
      padding: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 3px 9px rgba(var(--accent-rgb), 0.24);
      transition:
        transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 180ms ease;
    }

    .owned-subject-dialog-idea-btn:hover {
      border-color: rgba(var(--accent-rgb), 0.58);
      background:
        radial-gradient(
          circle at 18% 12%,
          rgba(255, 255, 255, 0.58),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          rgba(var(--accent-rgb), 0.20),
          rgba(var(--accent-rgb), 0.07) 58%,
          rgba(var(--accent-soft-rgb), 0.14)
        ),
        var(--surface-raised-hover);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.68),
        0 9px 24px rgba(var(--accent-rgb), 0.16);
      transform: translateY(-2px);
    }

    .owned-subject-dialog-idea-btn:hover svg {
      transform: rotate(9deg) scale(1.04);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.20),
        0 5px 14px rgba(var(--accent-rgb), 0.30);
    }

    .owned-subject-dialog-idea-btn:active {
      transform: translateY(0);
    }

    .owned-subject-dialog-idea-btn:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.32);
      outline-offset: 3px;
    }

    .owned-subject-dialog-idea-btn:disabled {
      opacity: 0.62;
      cursor: wait;
      transform: none;
    }

    .owned-subject-dialog-idea-btn:disabled svg {
      transform: none;
    }

    .compass-recommendation-region:empty {
      display: none;
    }

    .compass-recommendation-panel {
      margin-top: 0.15rem;
      padding: 1.35rem 1.45rem 0.25rem;
      border: 1px solid rgba(var(--accent-rgb), 0.20);
      border-radius: var(--radius-lg);
      background: var(--library-surface);
      box-shadow: var(--library-shadow);
      animation: hubPageFadeIn 0.28s ease both;
    }

    .compass-recommendation-kicker {
      margin-bottom: 0.35rem;
      color: var(--accent);
      font-size: 0.69rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .compass-recommendation-message {
      margin: 0 0 0.75rem;
      color: var(--text-heading);
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 2.3vw, 1.4rem);
      font-weight: 400;
      line-height: 1.3;
    }

    .compass-recommendation-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
      width: 100%;
      padding: 1rem 0;
      border: 0;
      border-top: 1px solid var(--border-faint);
      background: transparent;
      color: inherit;
      font-family: var(--font-body);
      text-align: left;
      cursor: pointer;
    }

    .compass-recommendation-copy {
      min-width: 0;
    }

    .compass-recommendation-title {
      display: block;
      margin-bottom: 0.22rem;
      color: var(--text-heading);
      font-size: 0.94rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .compass-recommendation-reason {
      display: block;
      color: var(--text-muted);
      font-size: 0.83rem;
      line-height: 1.55;
    }

    .compass-recommendation-arrow {
      color: var(--accent);
      transition: transform var(--t);
    }

    .compass-recommendation-row:hover
    .compass-recommendation-title {
      color: var(--accent);
    }

    .compass-recommendation-row:hover
    .compass-recommendation-arrow {
      transform: translateX(3px);
    }

    .compass-recommendation-row:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.28);
      outline-offset: 4px;
      border-radius: var(--radius-sm);
    }

    .compass-recommendation-panel--state {
      padding-bottom: 1.25rem;
    }

    .compass-recommendation-state {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    /* ============================================================
       SUBJECT LIBRARY
       One curated operational collection.
       ============================================================ */

    .subject-library {
      margin-top: 1.45rem;
      padding: 1.7rem 1.75rem 1.85rem;
      border: var(--library-border-width) solid var(--library-border);
      border-radius: var(--radius-lg);
      background: var(--library-surface);
      box-shadow: var(--library-shadow);
    }

    .subject-library-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.15rem;
    }

    .subject-library-title {
      font-family: var(--font-display);
      font-size: 1.24rem;
      line-height: 1.25;
      font-weight: 400;
      color: var(--text-heading);
    }

    .subject-library-actions {
      display: flex;
      align-items: center;
      gap: 0.42rem;
      margin-left: auto;
    }

    .subject-category-management.subject-card-management {
      position: relative;
      top: auto;
      right: auto;
      z-index: 15;
    }

    .subject-category-manage-btn.subject-card-manage-btn {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .subject-category-manage-btn.subject-card-manage-btn:hover,
    .subject-category-manage-btn.subject-card-manage-btn[aria-expanded="true"] {
      border-color: var(--control-border);
      background: var(--control-surface);
      box-shadow: var(--shadow-xs);
    }

    .subject-category-menu.subject-card-menu {
      z-index: 20;
      width: 160px;
    }

    .subject-library-create-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.38rem;
      min-height: 34px;
      padding: 0.38rem 0.72rem;
      border: 1px solid rgba(var(--accent-rgb), 0.24);
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: var(--t);
      white-space: nowrap;
    }

    .subject-library-create-btn:hover {
      border-color: rgba(var(--accent-rgb), 0.42);
      background: var(--accent-pale);
      color: var(--accent);
    }

    .subject-library-create-plus {
      font-size: 1rem;
      font-weight: 400;
      line-height: 1;
    }

    .subject-library-empty-note {
      padding: 0.25rem 0 0.15rem;
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    /* ============================================================
       SUBJECT CARDS AND PROGRESS STATES
       ============================================================ */

    .subject-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 200px;
      padding: 1.4rem 1.4rem 1.35rem;
      overflow: hidden;
      border: var(--card-border-width) solid var(--card-border);
      border-radius: 20px;
      background: var(--card-surface);
      color: var(--text-body);
      text-align: left;
      text-decoration: none;
      box-shadow: var(--card-shadow);
      transition: var(--t);
    }

    .subject-card:hover {
      border-color: var(--card-hover-border);
      background: var(--card-surface-hover);
      box-shadow:
        0 0 0 var(--card-emphasis-ring-width) var(--card-hover-border),
        var(--card-hover-shadow);
      transform: translateY(-2px);
    }

    .subject-card:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.34);
      outline-offset: 3px;
    }

    /* Owned cards keep the same visual component, but separate
       the primary open action from subject-management actions. */
    .subject-card--owned {
      cursor: pointer;
    }

    .subject-card--owned:has(
      .subject-card-manage-btn[aria-expanded="true"]
    ) {
      overflow: visible;
      z-index: 30;
    }

    .subject-card-open-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      cursor: pointer;
    }

    .subject-card-open-layer:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.34);
      outline-offset: -4px;
    }

    .subject-card--owned .subject-card-header {
      padding-right: 2.7rem;
    }

    .subject-card-management {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 6;
    }

    .subject-card-manage-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--control-surface);
      color: var(--control-icon);
      cursor: pointer;
      box-shadow: var(--shadow-xs);
      transition: var(--t);
    }

    .subject-card-manage-btn:hover,
    .subject-card-manage-btn[aria-expanded="true"] {
      border-color: var(--control-border-hover);
      background: var(--control-hover);
      color: var(--control-text-hover);
      box-shadow: var(--control-hover-shadow);
    }

    .subject-card-manage-btn:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.34);
      outline-offset: 2px;
    }

    .subject-card-menu {
      position: absolute;
      top: calc(100% + 0.42rem);
      right: 0;
      width: 154px;
      padding: 0.32rem;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface-panel);
      box-shadow: var(--shadow-md);
    }

    .subject-card-menu[hidden] {
      display: none;
    }

    .subject-card-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 36px;
      padding: 0.45rem 0.62rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: var(--t);
    }

    .subject-card-menu button:hover,
    .subject-card-menu button:focus-visible {
      background: var(--surface-muted);
      color: var(--text-heading);
      outline: none;
    }

    .subject-card-menu button.is-danger {
      color: var(--danger-text);
    }

    .subject-card-menu button.is-danger:hover,
    .subject-card-menu button.is-danger:focus-visible {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .subject-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.72rem;
    }

    .subject-card-title {
      font-family: var(--font-display);
      font-size: 1.16rem;
      line-height: 1.28;
      font-weight: 400;
      color: var(--text-heading);
    }

    .subject-card-title-block {
      display: grid;
      gap: 0.34rem;
      min-width: 0;
    }

    .subject-card-version-badge {
      width: max-content;
      padding: 0.24rem 0.42rem;
      border: 1px solid rgba(var(--accent-rgb), 0.24);
      border-radius: 999px;
      background: rgba(var(--accent-rgb), 0.08);
      color: var(--accent);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .subject-card-hook {
      margin-bottom: 0.85rem;
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.58;
    }

    .subject-card-header,
    .subject-card-hook,
    .subject-card-footer {
      position: relative;
      z-index: 2;
    }

    .subject-card--has-art .subject-card-header,
    .subject-card--has-art .subject-card-hook {
      max-width: 68%;
    }

    .subject-card-art {
      position: absolute;
      z-index: 1;
      top: 1.05rem;
      right: 1.05rem;
      bottom: 4.15rem;
      width: 31%;
      max-width: 10.5rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: var(--accent);
      opacity: 0;
      pointer-events: none;
      transform: translate3d(9px, 1px, 0) scale(0.96);
      transform-origin: center right;
      transition:
        opacity 0.32s ease,
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .subject-card-art svg {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 7.6rem;
      overflow: visible;
    }

    .subject-card-art path,
    .subject-card-art circle,
    .subject-card-art rect,
    .subject-card-art line {
      vector-effect: non-scaling-stroke;
    }

    .subject-card:is(:hover, :focus-visible) .subject-card-art {
      opacity: 0.16;
      transform: translate3d(0, 0, 0) scale(1);
    }

    html[data-theme="night"]
    .subject-card:is(:hover, :focus-visible)
    .subject-card-art {
      opacity: 0.23;
    }

    .travel-map,
    .travel-pin,
    .travel-spark {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.3s ease;
    }

    .travel-route {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition:
        stroke-dashoffset 0.78s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .travel-pin {
      transform-origin: center bottom;
      transform: translateY(4px);
    }

    .travel-spark {
      opacity: 0.52;
      transform: rotate(-8deg) scale(0.84);
    }

    .subject-card:is(:hover, :focus-visible) .travel-map {
      transform: translateY(1px);
    }

    .subject-card:is(:hover, :focus-visible) .travel-route {
      stroke-dashoffset: 0;
    }

    .subject-card:is(:hover, :focus-visible) .travel-pin {
      transform: translateY(0);
    }

    .subject-card:is(:hover, :focus-visible) .travel-spark {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .food-pot,
    .food-lid,
    .food-bowl,
    .food-steam {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.34s ease,
        stroke-dashoffset 0.72s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .food-pot {
      transform-origin: center bottom;
      transform: translateY(3px) scale(0.98);
    }

    .food-lid {
      transform-origin: center bottom;
      transform: translateY(4px) rotate(-2deg);
    }

    .food-bowl--left {
      transform: translate(3px, 2px) rotate(2deg);
    }

    .food-bowl--right {
      transform: translate(-3px, 3px) rotate(-3deg);
    }

    .food-steam {
      opacity: 0.38;
    }

    .food-steam path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition:
        stroke-dashoffset 0.76s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.34s ease;
    }

    .subject-card:is(:hover, :focus-visible) .food-pot {
      transform: translateY(0) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .food-lid {
      transform: translateY(-4px) rotate(2deg);
    }

    .subject-card:is(:hover, :focus-visible) .food-bowl--left {
      transform: translate(-2px, 0) rotate(-1deg);
    }

    .subject-card:is(:hover, :focus-visible) .food-bowl--right {
      transform: translate(2px, 0) rotate(1deg);
    }

    .subject-card:is(:hover, :focus-visible) .food-steam {
      opacity: 1;
    }

    .subject-card:is(:hover, :focus-visible) .food-steam path {
      stroke-dashoffset: 0;
    }

    .humour-jester,
    .humour-jester-point,
    .humour-jester-band,
    .humour-jester-fold,
    .humour-jester-spark {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease;
    }

    .humour-jester {
      transform: translateY(3px) rotate(-2deg) scale(0.96);
    }

    .humour-jester-point {
      transform-origin: center bottom;
    }

    .humour-jester-point--left {
      transform: rotate(4deg) translateY(2px);
    }

    .humour-jester-point--centre {
      transform: translateY(4px) scaleY(0.96);
    }

    .humour-jester-point--right {
      transform: rotate(-4deg) translateY(2px);
    }

    .humour-jester-band {
      transform: scaleX(0.98);
    }

    .humour-jester-fold {
      opacity: 0.56;
    }

    .humour-jester-spark {
      opacity: 0.4;
      transform: rotate(-10deg) scale(0.8);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester {
      transform: translateY(0) rotate(0deg) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-point--left {
      transform: rotate(-2deg) translateY(-1px);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-point--centre {
      transform: translateY(-3px) scaleY(1);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-point--right {
      transform: rotate(2deg) translateY(-2px);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-band {
      transform: scaleX(1);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-fold {
      opacity: 1;
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-spark {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .work-briefcase,
    .work-handle,
    .work-document,
    .work-latch {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease;
    }

    .work-briefcase {
      transform-origin: center bottom;
      transform: translateY(2px) scale(0.98);
    }

    .work-handle {
      transform-origin: center bottom;
      transform: translateY(4px) scaleY(0.94);
    }

    .work-document {
      opacity: 0;
      transform: translateY(11px);
    }

    .work-latch {
      transform: scale(0.92);
    }

    .subject-card:is(:hover, :focus-visible) .work-briefcase {
      transform: translateY(0) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .work-handle {
      transform: translateY(-2px) scaleY(1);
    }

    .subject-card:is(:hover, :focus-visible) .work-document {
      opacity: 0.88;
      transform: translateY(0);
    }

    .subject-card:is(:hover, :focus-visible) .work-latch {
      transform: scale(1.04);
    }

    .technology-chip,
    .technology-core,
    .technology-trace,
    .technology-node,
    .technology-spark {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease,
        stroke-dashoffset 0.74s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .technology-chip {
      transform: translateY(2px) scale(0.98);
    }

    .technology-core {
      transform: scale(0.93);
    }

    .technology-trace {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .technology-node {
      opacity: 0.48;
      transform: scale(0.82);
    }

    .technology-spark {
      opacity: 0.44;
      transform: rotate(-9deg) scale(0.82);
    }

    .subject-card:is(:hover, :focus-visible) .technology-chip {
      transform: translateY(0) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .technology-core {
      transform: scale(1.03);
    }

    .subject-card:is(:hover, :focus-visible) .technology-trace {
      stroke-dashoffset: 0;
    }

    .subject-card:is(:hover, :focus-visible) .technology-node {
      opacity: 1;
      transform: scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .technology-spark {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .stories-screen,
    .stories-play,
    .stories-page,
    .stories-thread {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease,
        stroke-dashoffset 0.76s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stories-screen {
      transform: translateY(2px) scale(0.98);
    }

    .stories-play {
      opacity: 0.52;
      transform: scale(0.86);
    }

    .stories-page--left {
      transform-origin: right bottom;
      transform: rotate(1deg);
    }

    .stories-page--right {
      transform-origin: left bottom;
      transform: rotate(-1deg);
    }

    .stories-thread {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0.5;
    }

    .subject-card:is(:hover, :focus-visible) .stories-screen {
      transform: translateY(0) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .stories-play {
      opacity: 1;
      transform: scale(1.05);
    }

    .subject-card:is(:hover, :focus-visible) .stories-page--left {
      transform: rotate(-1.5deg);
    }

    .subject-card:is(:hover, :focus-visible) .stories-page--right {
      transform: rotate(2deg) translateY(-1px);
    }

    .subject-card:is(:hover, :focus-visible) .stories-thread {
      stroke-dashoffset: 0;
      opacity: 1;
    }

    .subject-card-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.8rem;
      margin-top: auto;
    }

    .subject-card-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.14rem;
      min-width: 0;
    }

    .subject-card-progress-label {
      color: var(--accent);
      font-size: 0.69rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .btn-launch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      min-width: 100px;
      min-height: 38px;
      padding: 0.44rem 0.9rem;
      flex-shrink: 0;
      margin-left: auto;
      border: 1px solid var(--launch-border);
      border-radius: 999px;
      background: var(--launch-surface);
      color: var(--launch-text);
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      transition: var(--t);
      box-shadow: var(--launch-shadow);
    }

    .subject-card:hover .btn-launch {
      border-color: var(--launch-hover-border);
      background: var(--launch-hover-surface);
      color: var(--launch-hover-text);
      box-shadow: var(--launch-hover-shadow);
      transform: translateY(-1px);
    }

    /* Progress states */

    .subject-card-progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      overflow: hidden;
      background: rgba(var(--accent-rgb), 0.09);
    }

    .subject-card-progress-fill {
      display: block;
      width: var(--subject-progress);
      height: 100%;
      background: var(--accent);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .subject-card--inprogress {
      border-color: var(--card-inprogress-border);
      box-shadow:
        0 0 0 var(--card-emphasis-ring-width) var(--card-inprogress-border),
        var(--card-shadow);
    }

    .subject-card--inprogress .btn-launch {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      box-shadow: var(--launch-inprogress-shadow);
    }

    .subject-card--inprogress:hover .btn-launch {
      background: var(--accent-soft);
      border-color: var(--accent-soft);
    }

    .subject-card--explored {
      background: var(--card-explored-surface);
      border-color: var(--card-explored-border);
    }

    /* ============================================================
       EMPTY AND ERROR STATES
       ============================================================ */
    .empty-library {
      text-align: center;
      padding: 4rem 1rem;
    }

    .empty-library-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      color: var(--accent);
    }

    .empty-library h2 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--text-heading);
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .empty-library p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 44ch;
      margin: 0 auto;
    }

    /* Bridge error */
    .bridge-error {
      max-width: 480px;
      margin: 4rem auto;
      text-align: center;
      padding: 0 1rem;
    }

    .bridge-error h2 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--text-heading);
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .bridge-error p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    /* ============================================================
       HUB-OWNED DIALOG AND ACTIONS
       ============================================================ */

    .owned-subject-dialog {
      position: fixed;
      inset: 0;
      z-index: 850;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: var(--surface-scrim);
      backdrop-filter: blur(6px);
    }

    .owned-subject-dialog[hidden] {
      display: none;
    }

    .owned-subject-dialog-panel {
      width: min(500px, 100%);
      padding: 1.45rem;
      border: var(--dialog-border);
      border-radius: var(--radius-lg);
      background: var(--surface-panel);
      box-shadow: var(--shadow-lg);
    }

    .owned-subject-dialog-kicker {
      margin-bottom: 0.48rem;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .owned-subject-dialog-title {
      margin-bottom: 0.55rem;
      color: var(--text-heading);
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.2;
    }

    .owned-subject-dialog-copy {
      margin-bottom: 1.15rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .owned-subject-dialog-field {
      display: grid;
      gap: 0.42rem;
      margin-bottom: 1.15rem;
    }

    .owned-subject-dialog-field[hidden],
    .owned-subject-dialog-error[hidden] {
      display: none;
    }

    .owned-subject-dialog-field span {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .owned-subject-dialog-field input {
      width: 100%;
      min-height: 44px;
      padding: 0.65rem 0.78rem;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--surface-raised);
      color: var(--text-heading);
      font: inherit;
      outline: none;
      transition: var(--t);
    }

    .owned-subject-dialog-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.10);
    }

    .owned-subject-dialog-create-fields {
      display: grid;
      gap: 0.9rem;
      margin-bottom: 1.15rem;
    }

    .owned-subject-dialog-create-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .owned-subject-dialog-create-fields[hidden] {
      display: none;
    }

    .owned-subject-dialog-create-field {
      display: grid;
      gap: 0.42rem;
    }

    .owned-subject-dialog-create-field > span {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .owned-subject-dialog-create-field select,
    .owned-subject-dialog-create-field textarea {
      width: 100%;
      padding: 0.65rem 0.78rem;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--surface-raised);
      color: var(--text-heading);
      font: inherit;
      outline: none;
      transition: var(--t);
    }

    .owned-subject-dialog-create-field select {
      min-height: 44px;
      padding-right: 2.5rem;
      appearance: none;
      -webkit-appearance: none;
      background-image:
        linear-gradient(
          45deg,
          transparent 50%,
          var(--text-muted) 50%
        ),
        linear-gradient(
          135deg,
          var(--text-muted) 50%,
          transparent 50%
        );
      background-position:
        calc(100% - 1.05rem) calc(50% - 0.1rem),
        calc(100% - 0.81rem) calc(50% - 0.1rem);
      background-size:
        0.28rem 0.28rem,
        0.28rem 0.28rem;
      background-repeat: no-repeat;
    }

    .owned-subject-dialog-create-field textarea {
      min-height: 82px;
      resize: vertical;
      line-height: 1.5;
    }

    .owned-subject-dialog-create-field select:focus,
    .owned-subject-dialog-create-field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.10);
    }

    .owned-subject-dialog-error {
      margin: -0.55rem 0 1rem;
      color: var(--danger-text);
      font-size: 0.76rem;
    }

    .owned-subject-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.55rem;
    }

    .owned-subject-dialog-choice-fields {
      display: grid;
      gap: 0.7rem;
      margin-bottom: 1.15rem;
    }

    .owned-subject-dialog-choice-fields[hidden] {
      display: none;
    }

    .owned-subject-dialog-choice-btn {
      display: grid;
      gap: 0.2rem;
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface-raised);
      color: var(--text-body);
      font-family: var(--font-body);
      text-align: left;
      cursor: pointer;
      transition: var(--t);
    }

    .owned-subject-dialog-choice-btn:hover,
    .owned-subject-dialog-choice-btn:focus-visible {
      border-color: rgba(var(--accent-rgb), 0.38);
      background: var(--accent-dim);
      outline: none;
    }

    .owned-subject-dialog-choice-btn strong {
      color: var(--text-heading);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .owned-subject-dialog-choice-btn span {
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .btn-danger {
      min-height: 42px;
      padding: 0.58rem 1.05rem;
      border: 1px solid var(--danger-border);
      border-radius: var(--radius-sm);
      background: var(--danger-bg);
      color: var(--danger-text);
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--t);
    }

    .btn-danger:hover {
      background: var(--danger-bg-hover);
    }

    .btn-primary {
      padding: 0.58rem 1.05rem;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--t);
      white-space: nowrap;
      min-height: 42px;
    }

    .btn-primary:hover {
      background: var(--accent-soft);
    }

    .btn-ghost {
      padding: 0.58rem 0.95rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--surface-muted);
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--t);
      min-height: 42px;
    }

    .btn-ghost:hover {
      border-color: var(--border-strong);
      color: var(--text-body);
    }

    /* ============================================================
       HUB TOAST
       ============================================================ */
    .hub-toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 0.65rem 1.15rem;
      font-size: 0.84rem;
      color: var(--text-muted);
      z-index: 900;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: calc(100vw - 2rem);
    }

    .hub-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================================
       UTILITIES AND KEYFRAMES
       ============================================================ */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    @keyframes hubPageFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================================
       MOTION PREFERENCES
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .subject-card--has-art .subject-card-header,
      .subject-card--has-art .subject-card-hook {
        max-width: none;
      }

      .subject-card-art {
        display: none;
      }
    }

    /* ============================================================
       RESPONSIVE LAYOUT
       ============================================================ */
    @media (min-width: 681px) and (max-width: 920px) {
      .subject-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {

      html,

  <script>
    'use strict';

    /* ================================================================
       COMPASS HUB V2
       Reads state through AtlasBridge. Catalog metadata comes from CompassCatalogData.
       ================================================================ */

    // ---- Bridge guard -----------------------------------------------
    if (!window.AtlasBridge) {
      document.getElementById('hub-main').innerHTML =
        '<div class="bridge-error">' +
        '<h2>Compass can\'t start</h2>' +
        '<p>The shared runtime didn\'t load. Reload the page, and check that <code>shared/atlas-bridge.js</code> is in place.</p>' +
        '</div>';
    }
    const Bridge = window.AtlasBridge;

    const ATLAS_ID = 'atlas';
    const COMPASS_ID = 'compass';
    const ARCADE_ID = 'arcade';
    const ACTIVE_HUB_ID = COMPASS_ID;

    const HUB_NAV = {
      atlas: {
        id: ATLAS_ID,
        name: 'Atlas',
        desc: 'Gateway',
        alwaysAvailable: true,
        launchUrl: '../index.html',
        smallIcon: '<svg class="spine-world-icon" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.5 12V6.4C2.5 3.7 4.5 1.7 7 1.7C9.5 1.7 11.5 3.7 11.5 6.4V12" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><path d="M5 12V6.8C5 5.65 5.9 4.75 7 4.75C8.1 4.75 9 5.65 9 6.8V12" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/><path d="M2 12H12" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>'
      },
      compass: {
        id: COMPASS_ID,
        name: 'Compass',
        desc: 'Deep conversation subjects for thoughtful English.',
        alwaysAvailable: true,
        launchUrl: window.location.href,
        smallIcon: '<svg class="spine-world-icon" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.2"/><path d="M9.55 4.45L7.85 7.85L4.45 9.55L6.15 6.15L9.55 4.45Z" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/><path d="M9.55 4.45L7.85 7.85L6.15 6.15Z" fill="currentColor"/></svg>'
      },
      arcade: {
        id: ARCADE_ID,
        name: 'Arcade',
        desc: 'Conversation games.',
        worldId: ARCADE_ID,
        smallIcon: '<svg class="spine-world-icon" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="2.8" r="1.45" stroke="currentColor" stroke-width="1.25"/><path d="M7 4.25V8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><path d="M3.1 8.1H10.9L12 11.7H2L3.1 8.1Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><circle cx="9.55" cy="9.85" r="0.68" fill="currentColor"/></svg>'
      }
    };

    /* ================================================================
       COMPASS CATALOG
       Shared catalog metadata comes from shared/compass-catalog-data.js.
       ================================================================ */

    const COMPASS_CATALOG_DATA = window.CompassCatalogData;

    const COMPASS_CATALOG = COMPASS_CATALOG_DATA
      ? COMPASS_CATALOG_DATA.getCompassCatalogMap()
      : {};

    const COMPASS_AVAILABLE_SUBJECT_SLUGS = COMPASS_CATALOG_DATA
      ? COMPASS_CATALOG_DATA.getBuiltCompassSubjectSlugs()
      : [];

    /* ================================================================
       REGISTRATION
       Compass world and subject items are registered idempotently on load.
       ================================================================ */

    function compassSubjectSlug(subject) {
      return String(subject.registryId || '')
        .replace(/^compass:/, '')
        .trim();
    }

    function getCompassSubjectLaunchUrl(subject) {
      const slug = compassSubjectSlug(subject);
      return slug ? './' + slug + '/index.html' : '';
    }

    function withLaunchOrigin(url, origin) {
      if (!url) return '';

      try {
        const destination = new URL(url, window.location.href);
        destination.searchParams.set('from', origin);
        return destination.href;
      } catch {
        return url;
      }
    }

    function registerWithBridge() {
      if (window.AtlasContentRegistry && typeof AtlasContentRegistry.registerCompass === 'function') {
        AtlasContentRegistry.registerCompass();
      }
    }

    /* ================================================================
       HELPERS
       ================================================================ */

    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function jsArg(value) {
      return escHtml(JSON.stringify(String(value)));
    }

    function resolveStatus(state) {
      if (!state || typeof state !== 'object') {
        return 'new';
      }

      const status = String(state.status || '').toLowerCase();
      const progress = state.progress || {};
      const raw = state.progressRaw || {};

      if (status === 'complete') {
        return 'explored';
      }

      const explored = Number(progress.explored) || 0;
      const exploredIds = Array.isArray(raw.exploredIds)
        ? raw.exploredIds.length
        : 0;

      if (explored > 0 || exploredIds > 0) {
        return 'inprogress';
      }

      return 'new';
    }

    function getSubjectCardState(subject) {
      const progress = subject.state && subject.state.progress
        ? subject.state.progress
        : {};

      const total = Math.max(0, Number(progress.total) || 0);
      const explored = Math.max(
        0,
        Math.min(Number(progress.explored) || 0, total || Infinity)
      );

      if (subject.status === 'explored') {
        return {
          mode: 'explored',
          actionLabel: 'Revisit',
          progressLabel: explored > 0
            ? explored + ' path' + (explored === 1 ? '' : 's') + ' explored'
            : 'Explored',
          progressPercent: 100
        };
      }

      if (subject.status === 'inprogress' && explored > 0) {
        return {
          mode: 'inprogress',
          actionLabel: 'Continue',
          progressLabel:
            explored + ' path' + (explored === 1 ? '' : 's') + ' explored',
          progressPercent: total > 0
            ? Math.round((explored / total) * 100)
            : 0
        };
      }

      return {
        mode: 'new',
        actionLabel: 'Explore',
        progressLabel: '',
        progressPercent: 0
      };
    }

    /* ================================================================
       SAFE BRIDGE READS
       ================================================================ */

    function getActiveSession() {
      try { return Bridge.readActiveSession(); }
      catch (e) { return { id: 'default', name: 'Default' }; }
    }
    function getSessions() {
      try { return Bridge.readSessions() || []; }
      catch (e) { return []; }
    }
    function getRegistry() {
      try { return Bridge.readRegistry(); }
      catch (e) { return { worlds: {}, items: {}, sessionStates: {}, recentActivity: [] }; }
    }
    function isDefaultSession(s) {
      return s && s.id === (Bridge.defaultSessionId || 'default');
    }

    /* ================================================================
       CATALOG MERGE
       Returns a flat array of merged subject objects.
       Only subjects registered in the bridge with world=compass,
       type=subject, status=available are included.
       ================================================================ */

    function getAtlasSubjects() {
      const reg = getRegistry();
      const session = getActiveSession();
      const sessionStates = ((reg.sessionStates || {})[session.id]) || {};

      return COMPASS_AVAILABLE_SUBJECT_SLUGS
        .map(slug => {
          const subject = Object.values(COMPASS_CATALOG).find(item =>
            compassSubjectSlug(item) === slug
          );

          if (!subject) return null;

          const relativeLaunchUrl = getCompassSubjectLaunchUrl(subject);
          const launchUrl = relativeLaunchUrl
            ? withLaunchOrigin(
              new URL(relativeLaunchUrl, window.location.href).href,
              'compass'
            )
            : '';

          if (!launchUrl) return null;

          const item = (reg.items || {})[subject.registryId] || null;
          const state = sessionStates[subject.registryId] || null;
          const hasMyVersion = item?.hasMyVersion === true;

          return {
            registryId: subject.registryId,
            title: item?.title || subject.title,
            launchUrl,
            artId: subject.artId || '',
            hook: item && Object.prototype.hasOwnProperty.call(
              item,
              'description'
            )
              ? item.description || ''
              : subject.hook || '',
            ownershipLabel: hasMyVersion
              ? 'My Version'
              : '',
            hasMyVersion,
            status: resolveStatus(state),
            state,
            contentVersion: item ? item.contentVersion || null : null
          };
        })
        .filter(Boolean);
    }

    function getOwnedSubjectLaunchUrl(
      subjectId,
      {
        authoringIntent = ''
      } = {}
    ) {
      const id = String(subjectId || '').trim();

      if (!id) return '';

      try {
        const destination = new URL(
          './subject/index.html',
          window.location.href
        );

        destination.searchParams.set('id', id);

        if (authoringIntent) {
          destination.searchParams.set(
            'author',
            authoringIntent
          );
        }

        return withLaunchOrigin(
          destination.href,
          'compass'
        );
      } catch {
        return '';
      }
    }

    async function getOwnedSubjects() {
      const Subjects = window.AtlasTutorSubjects;

      if (
        !Subjects ||
        typeof Subjects.listSubjects !== 'function'
      ) {
        return [];
      }

      let records = [];
      let libraryState = null;

      try {
        [
          records,
          libraryState
        ] = await Promise.all([
          Subjects.listSubjects(),
          typeof Subjects.getLibraryState === 'function'
            ? Subjects.getLibraryState()
            : Promise.resolve(null)
        ]);
      } catch {
        return [];
      }

      const subjectSessionIds = new Map();

      if (
        typeof Subjects.getSubjectSessionIds === 'function'
      ) {
        await Promise.all(
          (Array.isArray(records) ? records : [])
            .map(async record => {
              const id =
                String(record?.id || '').trim();

              if (!id) return;

              try {
                const sessionIds =
                  await Subjects.getSubjectSessionIds({
                    kind: 'my-subject',
                    id
                  });

                subjectSessionIds.set(
                  id,
                  Array.isArray(sessionIds)
                    ? sessionIds
                    : []
                );
              } catch {
                subjectSessionIds.set(id, []);
              }
            })
        );
      }

      const workingDraftDescriptions = new Map();

      if (
        typeof Subjects.getWorkingDraft === 'function'
      ) {
        await Promise.all(
          (Array.isArray(records) ? records : [])
            .map(async record => {
              const id =
                String(record?.id || '').trim();

              if (!id) return;

              const publishedDescription =
                String(
                  record?.metadata?.description ||
                  record?.document?.module?.catalogDescription ||
                  ''
                ).trim();

              if (publishedDescription) return;

              try {
                const draft =
                  await Subjects.getWorkingDraft(id);

                const draftDescription =
                  String(
                    draft?.document?.module?.catalogDescription ||
                    ''
                  ).trim();

                if (draftDescription) {
                  workingDraftDescriptions.set(
                    id,
                    draftDescription
                  );
                }
              } catch { }
            })
        );
      }

      const reg = getRegistry();
      const session = getActiveSession();
      const sessionStates =
        ((reg.sessionStates || {})[session.id]) || {};

      return (Array.isArray(records) ? records : [])
        .map(record => {
          const id = String(record?.id || '').trim();

          if (!id) return null;

          const metadata = record.metadata || {};
          const module = record.document?.module || {};

          const registryId =
            typeof Bridge.getContentRegistryId === 'function'
              ? Bridge.getContentRegistryId(COMPASS_ID, id)
              : COMPASS_ID + ':' + id;

          const launchUrl = getOwnedSubjectLaunchUrl(id);

          if (!launchUrl) return null;

          const state = sessionStates[registryId] || null;

          const title = String(
            metadata.title ||
            module.title ||
            'Untitled Subject'
          ).trim() || 'Untitled Subject';

          syncOwnedSubjectRegistryProjection(record);

          const placement =
            libraryState?.subjects?.[id] || {
              libraryIncluded: true,
              categoryId: 'default',
              archived: false
            };

          return {
            subjectId: id,
            isOwned: true,
            registryId,
            libraryIncluded:
              placement.libraryIncluded !== false,
            categoryId:
              placement.categoryId || null,
            canMoveCategory:
              placement.libraryIncluded !== false &&
              (libraryState?.categories?.length || 0) > 1,
            archived:
              placement.archived === true,
            sessionIds:
              subjectSessionIds.get(id) || [],
            hasSessionHome:
              (subjectSessionIds.get(id) || []).length > 0,
            title,
            launchUrl,
            artId: '',
            hook: String(
              workingDraftDescriptions.get(id) ||
