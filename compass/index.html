      min-width: 0;
      display: block;
      break-inside: avoid;
      overflow: hidden;
      margin: 0 0 1rem;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 11px;
      background: var(--surface-muted);
      cursor: pointer;
      transition:
        border-color 0.16s ease,
        transform 0.16s ease,
        box-shadow 0.16s ease;
    }

    .hub-cover-picker-result:hover,
    .hub-cover-picker-result:focus-visible {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
      outline: none;
    }

    .hub-cover-picker-result img {
      width: 100%;
      height: auto;
      display: block;
    }

    .hub-cover-picker-result span {
      position: absolute;
      right: 0.35rem;
      bottom: 0.35rem;
      left: 0.35rem;
      overflow: hidden;
      padding: 0.26rem 0.4rem;
      border-radius: 6px;
      background: rgba(15, 13, 11, 0.68);
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.62rem;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hub-cover-picker-more {
      display: block;
      min-height: 2.4rem;
      margin: 0.9rem auto 0.15rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.76rem;
    }

    .hub-cover-picker-url-panel {
      flex: 1;
      min-height: 0;
      padding: 1.25rem 0 0.25rem;
      overflow-y: auto;
    }

    .hub-cover-picker-search[hidden],
    .hub-cover-picker-layout[hidden],
    .hub-cover-picker-url-panel[hidden],
    .hub-cover-picker-custom-preview[hidden] {
      display: none !important;
    }

    .hub-cover-picker-your-image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .hub-cover-picker-url-card {
      width: 100%;
      height: 100%;
      padding: 1.35rem 1.4rem 1.45rem;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      background: var(--surface-raised);
    }

    .hub-cover-picker-url-title {
      margin: 0;
      color: var(--text-heading);
      font-family: var(--font-display);
      font-size: 1.25rem;
      line-height: 1.3;
    }

    .hub-cover-picker-url-help {
      max-width: 56ch;
      margin: 0.45rem 0 0;
      color: var(--text-muted);
      font-size: 0.84rem;
      line-height: 1.6;
    }

    .hub-cover-picker-upload-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-height: 2.7rem;
      margin-top: 1rem;
    }

    .hub-cover-picker-upload-name {
      min-width: 0;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hub-cover-picker-custom-preview {
      margin-top: 1.2rem;
      padding: 0.8rem;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      background: var(--surface-raised);
    }

    .hub-cover-picker-custom-preview-frame {
      width: 100%;
      height: min(38vh, 370px);
      min-height: 240px;
      overflow: hidden;
      border-radius: 12px;
      background: var(--surface-muted);
    }

    .hub-cover-picker-custom-preview-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
    }

    .hub-cover-picker-custom-preview-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 0.2rem 0.05rem;
    }

    .hub-cover-picker-custom-preview-label {
      margin: 0;
      color: var(--text-heading);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .hub-cover-picker-custom-preview-meta {
      margin: 0.12rem 0 0;
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    @media (max-width: 800px) {
      .hub-cover-picker-panel {
        width: calc(100vw - 1rem);
        height: calc(100dvh - 1rem);
        max-height: calc(100dvh - 1rem);
        padding: 1rem;
      }

      .hub-cover-picker-results {
        column-count: 1;
      }

      .hub-cover-picker-your-image-grid,
      .hub-cover-picker-manual-row {
        grid-template-columns: 1fr;
      }

      .hub-cover-picker-upload-row,
      .hub-cover-picker-custom-preview-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .hub-cover-picker-upload-button,
      .hub-cover-picker-custom-use,
      .hub-cover-picker-manual-row button {
        width: 100%;
      }

      .hub-cover-picker-custom-preview-frame {
        min-height: 200px;
        height: 32vh;
      }
    }

    /* ============================================================
       SUBJECT ARTWORK STUDIO
       ============================================================ */

    .subject-artwork-studio-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: rgba(20, 23, 22, 0.46);
      backdrop-filter: blur(10px);
    }

    .subject-artwork-studio-backdrop[hidden] {
      display: none;
    }

    .subject-artwork-studio {
      width: min(1040px, calc(100vw - 3rem));
      max-height: calc(100vh - 3rem);
      overflow: auto;
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      background: var(--surface-panel);
      box-shadow: var(--shadow-lg);
    }

    .subject-artwork-studio-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.6rem 1.7rem 0;
    }

    .subject-artwork-studio-kicker {
      margin-bottom: 0.42rem;
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .subject-artwork-studio-title {
      margin: 0;
      color: var(--text-heading);
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 400;
      line-height: 1.15;
    }

    .subject-artwork-studio-close {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .subject-artwork-studio-close:hover,
    .subject-artwork-studio-close:focus-visible {
      background: var(--surface-muted);
      color: var(--text-heading);
      outline: none;
    }

    .subject-artwork-studio-body {
      display: grid;
      grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr);
      gap: 1.8rem;
      padding: 1.4rem 1.7rem 1.25rem;
    }

    .subject-artwork-studio-controls {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-width: 0;
    }

    .subject-artwork-studio-copy {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.65;
    }

    .subject-artwork-field {
      display: grid;
      gap: 0.48rem;
    }

    .subject-artwork-field-label {
      color: var(--text-heading);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .subject-artwork-field-help {
      color: var(--text-subtle);
      font-size: 0.72rem;
      line-height: 1.45;
    }

    .subject-artwork-idea-input {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      padding: 0.8rem 0.9rem;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface-raised);
      color: var(--text-body);
      font: inherit;
      line-height: 1.5;
    }

    .subject-artwork-idea-input:focus {
      border-color: rgba(var(--accent-rgb), 0.55);
      outline: 3px solid rgba(var(--accent-rgb), 0.12);
    }

    .subject-artwork-field:has(#subject-artwork-color-options) {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .subject-artwork-field:has(#subject-artwork-color-options)
    > .subject-artwork-field-label {
      flex: 0 0 100%;
    }

    .subject-artwork-color-options {
      display: contents;
    }

    .subject-artwork-color-btn,
    .subject-artwork-custom-color {
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      min-height: 38px;
      padding: 0.42rem 0.68rem;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: var(--surface-raised);
      color: var(--text-muted);
      font: inherit;
      font-size: 0.76rem;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
    }

    .subject-artwork-color-btn:hover,
    .subject-artwork-color-btn.is-selected,
    .subject-artwork-custom-color:hover,
    .subject-artwork-custom-color.is-selected {
      border-color: rgba(var(--accent-rgb), 0.46);
      background: var(--accent-dim);
      color: var(--text-heading);
    }

    .subject-artwork-custom-color:has(input:focus-visible) {
      outline: 3px solid rgba(var(--accent-rgb), 0.22);
      outline-offset: 2px;
    }

    .subject-artwork-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--subject-artwork-swatch, var(--accent));
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    }

    .subject-artwork-custom-color input[type="color"] {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 50%;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .subject-artwork-custom-color input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .subject-artwork-custom-color input[type="color"]::-webkit-color-swatch,
    .subject-artwork-custom-color input[type="color"]::-moz-color-swatch {
      border: 0;
      border-radius: 50%;
    }

    .subject-artwork-studio-error {
      margin: -0.3rem 0 0;
      color: var(--danger-text);
      font-size: 0.76rem;
    }

    .subject-artwork-studio-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 1.35rem;
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      background: var(--library-surface);
    }

    .subject-artwork-preview-card {
      width: 100%;
      max-width: 500px;
    }

    .subject-artwork-preview-card .subject-card {
      width: 100%;
      min-height: 270px;
      pointer-events: none;
      transform: none !important;
    }

    .subject-artwork-preview-card .subject-card-art {
      opacity: var(--subject-art-preview-opacity);
      transform: none;
    }

    .subject-artwork-studio-actions {
      position: sticky;
      bottom: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.9rem 1.7rem 1.25rem;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-panel);
    }

    .subject-artwork-studio-edit-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0;
      margin-right: auto;
    }

    .subject-artwork-remove-btn {
      color: var(--danger-text);
    }

    @media (max-width: 760px) {
      .subject-artwork-studio-backdrop {
        padding: 0.75rem;
      }

      .subject-artwork-studio {
        width: calc(100vw - 1.5rem);
        max-height: calc(100vh - 1.5rem);
      }

      .subject-artwork-studio-body {
        grid-template-columns: 1fr;
        padding-bottom: 5.25rem;
      }

      .subject-artwork-studio-preview {
        order: -1;
      }

      .subject-artwork-studio-edit-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.55rem;
        margin-right: 0;
      }

      .subject-artwork-studio-edit-actions .btn-primary,
      .subject-artwork-studio-edit-actions .btn-ghost {
        width: 100%;
        justify-content: center;
      }

      .subject-artwork-studio-actions {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        gap: 0.6rem;
        padding: 0.75rem 1rem calc(0.85rem + env(safe-area-inset-bottom, 0px));
      }

      .subject-artwork-studio-actions .btn-primary,
      .subject-artwork-studio-actions .btn-ghost {
        width: 100%;
        min-width: 0;
        justify-content: center;
      }
    }

    @media (max-width: 680px) {
      .subject-artwork-studio-backdrop {
        display: block;
        overflow: hidden;
        padding: 0;
        background: var(--surface-panel);
        backdrop-filter: none;
        overscroll-behavior: none;
      }

      .subject-artwork-studio {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        overscroll-behavior: none;
      }

      .subject-artwork-studio-head {
        flex: 0 0 auto;
        padding:
          calc(0.95rem + env(safe-area-inset-top, 0px))
          1rem
          0;
      }

      .subject-artwork-studio-kicker {
        margin-bottom: 0.28rem;
      }

      .subject-artwork-studio-title {
        font-size: 1.5rem;
      }

      .subject-artwork-studio-body {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
        gap: 0.72rem;
        overflow-y: auto;
        padding: 0.9rem 1rem;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .subject-artwork-studio-controls {
        display: contents;
      }

      .subject-artwork-studio-actions {
        position: static;
        flex: 0 0 auto;
      }

      .subject-artwork-studio-copy {
        display: none;
      }

      .subject-artwork-field:has(#subject-artwork-idea) {
        order: 1;
        gap: 0.4rem;
      }

      .subject-artwork-field:has(#subject-artwork-color-options) {
        order: 2;
      }

      .subject-artwork-studio-preview {
        order: 3;
        padding: 0.75rem;
        border-radius: 16px;
      }

      .subject-artwork-studio-edit-actions {
        order: 4;
        gap: 0.5rem;
        margin-top: 0;
      }

      .subject-artwork-studio-error {
        order: 5;
        margin: 0;
      }

      .subject-artwork-field-help {
        display: none;
      }

      .subject-artwork-idea-input {
        min-height: 74px;
        max-height: 120px;
        resize: none;
        padding: 0.7rem 0.8rem;
      }

      .subject-artwork-color-btn,
      .subject-artwork-custom-color {
        min-height: 36px;
        padding: 0.38rem 0.62rem;
      }
    }

    /* ============================================================
       HUB TOAST
       ============================================================ */
    .hub-toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 0.65rem 1.15rem;
      font-size: 0.84rem;
      color: var(--text-muted);
      z-index: 900;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;

    /* Image-led Hub cards. SVG artwork previews retain their existing component. */
    .subject-card--cover {
      --subject-cover-border: rgba(74, 91, 84, 0.09);
      --subject-cover-surface: #fffefa;
      --subject-cover-rest: 170px;
      --subject-cover-shift:
        calc(
          var(--subject-cover-rest) -
          var(--subject-cover-expanded, 80px)
        );
      height: var(--subject-card-height, 370px);
      min-height: 0;
      padding: 0;
      border-radius: 18px;
      background: var(--subject-cover-surface);
      border-color: var(--subject-cover-border);
      box-shadow: 0 7px 24px rgba(52, 58, 48, 0.055);
      transition: box-shadow 320ms ease;
    }

    /*
     * Compositor-first reveal:
     * - the cover keeps a fixed 170px render box;
     * - content is laid out once at its expanded position;
     * - a surface layer and the copy translate between the two states.
     *
     * The moving image/content seam is therefore transform-driven rather
     * than a flex-basis layout animation.
     */
    .subject-card-cover {
      position: absolute;
      inset: 0 0 auto;
      z-index: 0;
      width: 100%;
      height: var(--subject-cover-rest);
      min-height: 0;
      overflow: hidden;
      border-radius: 17px 17px 0 0;
      background: var(--surface-muted);
    }

    .subject-card-cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
      transform: scale(1.035);
      transition:
        transform 420ms
        cubic-bezier(0.25, 0.8, 0.25, 1);
      will-change: transform;
    }

    .subject-card-content {
      position: absolute;
      inset:
        var(--subject-cover-expanded, 80px)
        0
        0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 1.1rem 1.2rem 1.15rem;
      background: transparent;
      isolation: isolate;
    }

    .subject-card-content::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: var(--subject-cover-surface);
      transform: translate3d(
        0,
        var(--subject-cover-shift),
        0
      );
      transition:
        transform 420ms
        cubic-bezier(0.25, 0.8, 0.25, 1);
      will-change: transform;
    }

    .subject-card-content > * {
      position: relative;
      z-index: 1;
    }

    .subject-card--cover .subject-card-header {
      padding: 0;
      margin: 0 0 0.55rem;
      transform: translate3d(
        0,
        var(--subject-cover-shift),
        0
      );
      transition:
        transform 420ms
        cubic-bezier(0.25, 0.8, 0.25, 1);
      will-change: transform;
    }

    .subject-card--cover .subject-card-title {
      font-size: 1.16rem;
      line-height: 1.24;

    .subject-card-ownership {

        transform: scale(1);

      }

  <!-- ============================================================ SCRIPTS -->
  <script src="../shared/atlas-structured-subject.js?v=20260911-1"></script>
  <script src="../shared/atlas-tutor-content.js"></script>
  <script src="../shared/atlas-ai-subject-build-lifecycle.js?v=20260923-buildprojection1"></script>
  <script src="../shared/atlas-subject-runtime-channel.js?v=20260923-buildcoord1"></script>
  <script src="../shared/atlas-tutor-subjects.js?v=20260911-1"></script>
  <script src="../shared/atlas-subject-artwork.js?v=20260921-artworkauth1"></script>
  <script src="../shared/atlas-original-curation.js?v=20260918-menufix1"></script>
  <script src="../shared/atlas-ai.js?v=20260921-artworkauth1"></script>
  <script src="../shared/compass-catalog-data.js?v=5"></script>

  <script src="/shared/atlas-pro-checkout.js?v=20260924-checkoutclean2"></script>

  <script src="../shared/atlas-search.js"></script>
  <script>
    'use strict';

    /* COMPASS HOVER FORENSICS — temporary diagnostic harness */
    const CompassHoverForensics = (() => {
      const PARAM = 'hoverDebug';
      const STORAGE_KEY =
        'atlas::compassHoverForensics::enabled';

      let enabled = false;

      try {
        const params =
          new URL(window.location.href).searchParams;

        if (params.get(PARAM) === '1') {
          sessionStorage.setItem(
            STORAGE_KEY,
            '1'
          );
        } else if (params.get(PARAM) === '0') {
          sessionStorage.removeItem(
            STORAGE_KEY
          );
        }

        enabled =
          sessionStorage.getItem(
            STORAGE_KEY
          ) === '1';
      } catch { }

      const noop = () => undefined;

      if (!enabled) {
        return {
          enabled: false,
          log: noop,
          noteRender: noop,
          noteMarkupDecision: noop,
          report: () => 'Compass hover forensics are disabled.'
        };
      }

      const startedAt = performance.now();
      const entries = [];
      const criticalEntries = [];
      const nodeIds = new WeakMap();
      let nextNodeId = 1;
      let nextEntrySeq = 1;
      let trackedCard = null;
      let trackedKey = '';
      let pointerX = null;
      let pointerY = null;
      let lastPointerMoveAt = performance.now();
      let incident = null;

      function elapsed() {
        return Number(
          (performance.now() - startedAt)
            .toFixed(1)
        );
      }

      function getNodeId(node) {
        if (!node || typeof node !== 'object') {
          return null;
        }

        if (!nodeIds.has(node)) {
          nodeIds.set(
            node,
            nextNodeId++
          );
        }

        return nodeIds.get(node);
      }

      function cardKey(card) {
        if (!card) return '';

        const title = String(
          card.querySelector(
            '.subject-card-title'
          )?.textContent || ''
        ).trim();

        const link =
          card.matches('a.subject-card')
            ? card
            : card.querySelector(
                '.subject-card-open-layer'
              );

        let href = '';

        try {
          href = link?.href
            ? new URL(link.href).pathname +
              new URL(link.href).search
            : '';
        } catch {
          href = String(
            link?.getAttribute('href') || ''
          );
        }

        return title + '|' + href;
      }

      function rectOf(node) {
        if (
          !node ||
          typeof node.getBoundingClientRect !==
            'function'
        ) {
          return null;
        }

        const rect =
          node.getBoundingClientRect();

        return {
          x: Number(rect.x.toFixed(1)),
          y: Number(rect.y.toFixed(1)),
          width:
            Number(rect.width.toFixed(1)),
          height:
            Number(rect.height.toFixed(1))
        };
      }

      function elementAtPointer() {
        if (
          !Number.isFinite(pointerX) ||
          !Number.isFinite(pointerY)
        ) {
          return null;
        }

        const element =
          document.elementFromPoint(
            pointerX,
            pointerY
          );

        const card =
          element?.closest?.(
            '.subject-card'
          ) || null;

        return {
          tag:
            element?.tagName || null,
          className:
            typeof element?.className ===
              'string'
              ? element.className
              : null,
          cardNodeId:
            getNodeId(card),
          cardKey:
            cardKey(card)
        };
      }

      function cardSnapshot(card = trackedCard) {
        return {
          nodeId: getNodeId(card),
          key: cardKey(card),
          connected:
            Boolean(card?.isConnected),
          hovered:
            Boolean(
              card?.matches?.(':hover')
            ),
          rect: rectOf(card),
          elementAtPointer:
            elementAtPointer()
        };
      }

      function safeDetail(value) {
        if (
          value === null ||
          value === undefined
        ) {
          return value;
        }

        if (
          typeof value === 'string' ||
          typeof value === 'number' ||
          typeof value === 'boolean'
        ) {
          return value;
        }

        try {
          return JSON.parse(
            JSON.stringify(value)
          );
        } catch {
          return String(value);
        }
      }

      function isCriticalType(type) {
        return (
          type === 'track-card' ||
          type === 'mutation' ||
          type === 'pointerover' ||
          type === 'pointerenter' ||
          type === 'pointerout' ||
          type === 'pointerleave' ||
          type === 'mouseover' ||
          type === 'mouseenter' ||
          type === 'mouseout' ||
          type === 'mouseleave' ||
          type.startsWith('render:') ||
          type === 'render-request' ||
          type.startsWith('event:') ||
          type.startsWith('fonts:')
        );
      }

      function log(type, detail = {}) {
        const entry = {
          seq: nextEntrySeq++,
          t: elapsed(),
          type,
          ...safeDetail(detail)
        };

        entries.push(entry);

        if (entries.length > 500) {
          entries.shift();
        }

        if (isCriticalType(type)) {
          criticalEntries.push(entry);

          if (criticalEntries.length > 250) {
            criticalEntries.shift();
          }
        }

        console.log(
          '[CompassHover]',
          entry
        );

        return entry;
      }

      function freezeIncident(
        reason,
        detail = {}
      ) {
        if (incident) {
          return incident;
        }

        incident = {
          reason,
          t: elapsed(),
          pointerStationaryMs:
            Number(
              (
                performance.now() -
                lastPointerMoveAt
              ).toFixed(1)
            ),
          detail:
            safeDetail(detail),
          tracked:
            cardSnapshot(),
          timeline:
            criticalEntries.slice(-80)
        };

        console.warn(
          '[CompassHover INCIDENT]',
          incident
        );

        return incident;
      }

      function relationKey(node) {
        return cardKey(
          node?.closest?.(
            '.subject-card'
          ) || null
        );
      }

      function trackCard(card, event) {
        if (!card) return;

        if (
          trackedCard === card &&
          trackedKey === cardKey(card)
        ) {
          return;
        }

        trackedCard = card;
        trackedKey = cardKey(card);

        log(
          'track-card',
          {
            event:
              event?.type || null,
            pointer: {
              x: pointerX,
              y: pointerY
            },
            card: cardSnapshot(card)
          }
        );
      }

      function updatePointer(event) {
        if (
          Number.isFinite(event?.clientX) &&
          Number.isFinite(event?.clientY)
        ) {
          const moved =
            event.clientX !== pointerX ||
            event.clientY !== pointerY;

          pointerX = event.clientX;
          pointerY = event.clientY;

          if (moved) {
            lastPointerMoveAt =
              performance.now();
          }
        }
      }

      [
        'pointerover',
        'pointerenter',
        'pointerout',
        'pointerleave',
        'mouseover',
        'mouseenter',
        'mouseout',
        'mouseleave'
      ].forEach(type => {
        document.addEventListener(
          type,
          event => {
            updatePointer(event);

            const card =
              event.target?.closest?.(
                '.subject-card'
              ) || null;

            if (
              (
                type === 'pointerover' ||
                type === 'pointerenter' ||
                type === 'mouseover' ||
                type === 'mouseenter'
              ) &&
              card
            ) {
              trackCard(card, event);
            }

            if (
              card === trackedCard ||
              relationKey(
                event.relatedTarget
              ) === trackedKey
            ) {
              log(
                type,
                {
                  targetNodeId:
                    getNodeId(card),
                  targetKey:
                    cardKey(card),
                  relatedKey:
                    relationKey(
                      event.relatedTarget
                    ),
                  tracked:
                    cardSnapshot()
                }
              );

              if (
                type === 'pointerout' ||
                type === 'pointerleave' ||
                type === 'mouseout' ||
                type === 'mouseleave'
              ) {
                const stationaryMs =
                  performance.now() -
                  lastPointerMoveAt;

                requestAnimationFrame(
                  () => {
                    const snapshot =
                      cardSnapshot();

                    log(
                      type +
                        ':next-frame',
                      {
                        tracked:
                          snapshot
                      }
                    );

                    if (
                      stationaryMs >= 250 &&
                      !snapshot.hovered
                    ) {
                      freezeIncident(
                        'stationary-pointer-hover-loss',
                        {
                          eventType: type,
                          stationaryMs:
                            Number(
                              stationaryMs
                                .toFixed(1)
                            ),
                          targetNodeId:
                            getNodeId(card),
                          targetKey:
                            cardKey(card),
                          relatedKey:
                            relationKey(
                              event.relatedTarget
                            ),
                          afterFrame:
                            snapshot
                        }
                      );
                    }
                  }
                );
              }
            }
          },
          true
        );
      });

      document.addEventListener(
        'pointermove',
        updatePointer,
        true
      );

      [
        'transitionrun',
        'transitionstart',
        'transitionend',
        'transitioncancel',
        'animationstart',
        'animationend',
        'animationcancel'
      ].forEach(type => {
        document.addEventListener(
          type,
          event => {
            if (
              !trackedCard ||
              event.target !== trackedCard
            ) {
              return;
            }

            log(
              type,
              {
                propertyName:
                  event.propertyName ||
                  null,
                animationName:
                  event.animationName ||
                  null,
                elapsedTime:
                  Number(
                    event.elapsedTime || 0
                  ),
                targetNodeId:
                  getNodeId(
                    trackedCard
                  ),
                tracked:
                  cardSnapshot()
              }
            );
          },
          true
        );
      });

      const lifecycleEvents = [
        'atlas:local-presentation-ready',
        'atlas:compass-first-paint-ready',
        'atlas:compass-cloud-authority-ready',
        'atlas:compass-hub-cache-refreshed',
        'atlas:compass-hub-refresh-request',
        'atlas:persistence-scope-change',
        'atlas:account-change',
        'atlas:session-change',
        'focus',
        'pageshow'
      ];

      lifecycleEvents.forEach(type => {
        window.addEventListener(
          type,
          event => {
            log(
              'event:' + type,
              {
                detail:
                  safeDetail(
                    event?.detail || null
                  ),
                tracked:
                  cardSnapshot()
              }
            );
          },
          true
        );
      });

      document.addEventListener(
        'visibilitychange',
        () => {
          log(
            'event:visibilitychange',
            {
              hidden:
                document.hidden,
              tracked:
                cardSnapshot()
            }
          );
        },
        true
      );

      if (document.fonts) {
        [
          'loading',
          'loadingdone',
          'loadingerror'
        ].forEach(type => {
          document.fonts.addEventListener?.(
            type,
            () => {
              log(
                'fonts:' + type,
                {
                  status:
                    document.fonts.status,
                  tracked:
                    cardSnapshot()
                }
              );
            }
          );
        });
      }

      const hubMain =
        document.getElementById(
          'hub-main'
        );

      if (hubMain) {
        const observer =
          new MutationObserver(
            records => {
              let removedTracked = false;
              let addedReplacement = null;
              const attributes = [];
              let childListCount = 0;

              records.forEach(record => {
                if (
                  record.type ===
                  'childList'
                ) {
                  childListCount += 1;

                  record.removedNodes
                    .forEach(node => {
                      if (
                        node ===
                          trackedCard ||
                        node
                          ?.contains?.(
                            trackedCard
                          )
                      ) {
                        removedTracked =
                          true;
                      }
                    });

                  record.addedNodes
                    .forEach(node => {
                      if (
                        !trackedKey ||
                        addedReplacement
                      ) {
                        return;
                      }

                      const candidates = [];

                      if (
                        node?.matches?.(
                          '.subject-card'
                        )
                      ) {
                        candidates.push(
                          node
                        );
                      }

                      node
                        ?.querySelectorAll?.(
                          '.subject-card'
                        )
                        .forEach(
                          candidate =>
                            candidates.push(
                              candidate
                            )
                        );

                      addedReplacement =
                        candidates.find(
                          candidate =>
                            cardKey(
                              candidate
                            ) ===
                            trackedKey
                        ) || null;
                    });
                } else if (
                  record.type ===
                    'attributes' &&
                  (
                    record.target ===
                      trackedCard ||
                    record.target
                      ?.closest?.(
                        '.subject-card'
                      ) ===
                      trackedCard
                  )
                ) {
                  attributes.push({
                    nodeId:
                      getNodeId(
                        record.target
                      ),
                    attribute:
                      record.attributeName,
                    value:
                      record.target
                        ?.getAttribute?.(
                          record.attributeName
                        )
                  });
                }
              });

              if (
                removedTracked ||
                addedReplacement ||
                attributes.length ||
                childListCount
              ) {
                const mutationDetail = {
                  childListCount,
                  removedTracked,
                  replacement:
                    addedReplacement
                      ? {
                          nodeId:
                            getNodeId(
                              addedReplacement
                            ),
                          key:
                            cardKey(
                              addedReplacement
                            ),
                          rect:
                            rectOf(
                              addedReplacement
                            )
                        }
                      : null,
                  attributes,
                  tracked:
                    cardSnapshot()
                };

                log(
                  'mutation',
                  mutationDetail
                );

                if (removedTracked) {
                  freezeIncident(
                    'tracked-card-removed',
                    mutationDetail
                  );
                }
              }
            }
          );

        observer.observe(
          hubMain,
          {
            subtree: true,
            childList: true,
            attributes: true,
            attributeFilter: [
              'class',
              'style',
              'hidden'
            ]
          }
        );
      }

      function markupDifference(
        previous,
        next
      ) {
        if (
          typeof previous !==
            'string' ||
          typeof next !== 'string'
        ) {
          return null;
        }

        const limit = Math.min(
          previous.length,
          next.length
        );

        let index = 0;

        while (
          index < limit &&
          previous.charCodeAt(index) ===
            next.charCodeAt(index)
        ) {
          index += 1;
        }

        if (
          index === limit &&
          previous.length === next.length
        ) {
          return null;
        }

        const start = Math.max(
          0,
          index - 100
        );
        const endPrevious =
          Math.min(
            previous.length,
            index + 180
          );
        const endNext =
          Math.min(
            next.length,
            index + 180
          );

        return {
          index,
          previousLength:
            previous.length,
          nextLength:
            next.length,
          previous:
            previous.slice(
              start,
              endPrevious
            ),
          next:
            next.slice(
              start,
              endNext
            )
        };
      }

      function noteRender(
        phase,
        detail = {}
      ) {
        log(
          'render:' + phase,
          {
            ...detail,
            tracked:
              cardSnapshot()
          }
        );
      }

      function noteMarkupDecision(
        previous,
        next,
        willCommit,
        detail = {}
      ) {
        log(
          willCommit
            ? 'render:markup-changed'
            : 'render:markup-unchanged',
          {
            ...detail,
            diff:
              willCommit
                ? markupDifference(
                    previous,
                    next
                  )
                : null,
            tracked:
              cardSnapshot()
          }
        );
      }

      function report() {
        const report = {
          startedAt:
            new Date(
              Date.now() -
                performance.now() +
                startedAt
            ).toISOString(),
          location:
            window.location.href,
          fontStatus:
            document.fonts?.status ||
            null,
          tracked:
            cardSnapshot(),
          incident,
          criticalEntries,
          entries
        };

        console.log(
          '[CompassHover report]',
          report
        );

        return JSON.stringify(
          report,
          null,
          2
        );
      }

      log(
        'forensics-enabled',
        {
          readyState:
            document.readyState,
          fontStatus:
            document.fonts?.status ||
            null,
          cloudAuthority:
            document.documentElement
              .dataset
              .atlasCompassCloudAuthority ||
            null
        }
      );

      return {
        enabled: true,
        log,
        noteRender,
        noteMarkupDecision,
        report,
        incident: () => {
          const result = {
            incident,
            criticalEntries
          };

          console.log(
            '[CompassHover incident]',
            result
          );

          return JSON.stringify(
            result,
            null,
            2
          );
        }
      };
    })();

    window.__atlasHoverForensics =
      CompassHoverForensics;

    /* ================================================================
       COMPASS HUB V2
       Reads state through AtlasBridge. Catalog metadata comes from CompassCatalogData.
       ================================================================ */

    // ---- Bridge guard -----------------------------------------------
    if (!window.AtlasBridge) {
      document.getElementById('hub-main').innerHTML =
        '<div class="bridge-error">' +
        '<h2>Compass can\'t start</h2>' +
        '<p>The shared runtime didn\'t load. Reload the page, and check that <code>shared/atlas-bridge.js</code> is in place.</p>' +
        '</div>';
    }
    const Bridge = window.AtlasBridge;

    const ATLAS_ID = 'atlas';
    const COMPASS_ID = 'compass';
    const ARCADE_ID = 'arcade';
    const ACTIVE_HUB_ID = COMPASS_ID;

    const HUB_NAV = {
      atlas: {
        id: ATLAS_ID,
        name: 'Atlas',
        desc: 'Gateway',
        alwaysAvailable: true,
        launchUrl: '../index.html',

      },
      compass: {

        smallIcon: '<svg class="spine-world-icon" width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.2"/><path d="M9.55 4.45L7.85 7.85L4.45 9.55L6.15 6.15L9.55 4.45Z" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/><path d="M9.55 4.45L7.85 7.85L6.15 6.15Z" fill="currentColor"/></svg>'

      }
    };

    /* ================================================================
       COMPASS CATALOG
       Shared catalog metadata comes from shared/compass-catalog-data.js.
       ================================================================ */

    const COMPASS_CATALOG_DATA = window.CompassCatalogData;

    const COMPASS_CATALOG = COMPASS_CATALOG_DATA
      ? COMPASS_CATALOG_DATA.getCompassCatalogMap()
      : {};

    const COMPASS_AVAILABLE_SUBJECT_SLUGS = COMPASS_CATALOG_DATA
      ? COMPASS_CATALOG_DATA.getBuiltCompassSubjectSlugs()
      : [];

    /* ================================================================
       REGISTRATION
       Compass world and subject items are registered idempotently on load.
       ================================================================ */

    function compassSubjectSlug(subject) {
      return String(subject.registryId || '')
        .replace(/^compass:/, '')
        .trim();
    }

    function getCompassSubjectLaunchUrl(subject) {
      const slug = compassSubjectSlug(subject);
      return slug ? './' + slug + '/index.html' : '';
    }

    function withLaunchOrigin(url, origin) {
      if (!url) return '';

      try {
        const destination = new URL(url, window.location.href);
        destination.searchParams.set('from', origin);
        return destination.href;
      } catch {
        return url;
      }
    }

    function registerWithBridge() {
      if (window.AtlasContentRegistry && typeof AtlasContentRegistry.registerCompass === 'function') {
        AtlasContentRegistry.registerCompass();
      }
    }

    /* ================================================================
       HELPERS
       ================================================================ */

    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function jsArg(value) {
      return escHtml(JSON.stringify(String(value)));
    }

    function formatCompassSourceDate(value) {
      const raw =
        String(value || '').trim();

      if (!raw) return '';

      const date =
        new Date(raw + 'T00:00:00Z');

      if (Number.isNaN(date.getTime())) {
        return raw;
      }

      return new Intl.DateTimeFormat(
        'en',
        {
          month: 'short',
          day: 'numeric'
        }
      ).format(date);
    }

    function resolveStatus(state) {
      if (!state || typeof state !== 'object') {
        return 'new';
      }

      const status = String(state.status || '').toLowerCase();
      const progress = state.progress || {};
      const raw = state.progressRaw || {};

      if (status === 'complete') {
        return 'explored';
      }

      const explored = Number(progress.explored) || 0;
      const exploredIds = Array.isArray(raw.exploredIds)
        ? raw.exploredIds.length
        : 0;

      if (explored > 0 || exploredIds > 0) {
        return 'inprogress';
      }

      return 'new';
    }

    function getSubjectCardState(subject) {
      if (
        !subject.isOwned &&
        subject.publicAccess === 'preview' &&
        !getStoredCompassAccountUserId()
      ) {
        return {
          mode: 'new',
          actionLabel: 'Preview',
          progressLabel: '',
          progressPercent: 0
        };
      }

      if (
        subject.isOwned &&
        subject.aiBuildIncomplete === true
      ) {
        if (subject.aiBuildLive === true) {
          return {
            mode: 'building',
            actionLabel: 'Open',
            progressLabel: '',
            progressPercent: 0
          };
        }

        return {
          mode: 'unfinished',
          actionLabel: 'Continue building',
          progressLabel: '',
          progressPercent: 0
        };
      }

      const progress = subject.state && subject.state.progress
        ? subject.state.progress
        : {};

      const total = Math.max(0, Number(progress.total) || 0);
      const explored = Math.max(
        0,
        Math.min(Number(progress.explored) || 0, total || Infinity)
      );

      if (subject.status === 'explored') {
        return {
          mode: 'explored',
          actionLabel: 'Revisit',
          progressLabel: explored > 0
            ? explored + ' path' + (explored === 1 ? '' : 's') + ' explored'
            : 'Explored',
          progressPercent: 100
        };
      }

      if (subject.status === 'inprogress' && explored > 0) {
        return {
          mode: 'inprogress',
          actionLabel: 'Continue',
          progressLabel:
            explored + ' path' + (explored === 1 ? '' : 's') + ' explored',
          progressPercent: total > 0
            ? Math.round((explored / total) * 100)
            : 0
        };
      }

      return {
        mode: 'new',
        actionLabel: 'Explore',
        progressLabel: '',
        progressPercent: 0
      };
    }

    /* ================================================================
       SAFE BRIDGE READS
       ================================================================ */

    function getActiveSession() {
      try { return Bridge.readActiveSession(); }
      catch (e) { return { id: 'default', name: 'Default' }; }
    }
    function getSessions() {
      try { return Bridge.readSessions() || []; }
      catch (e) { return []; }
    }
    function getRegistry() {
      try { return Bridge.readRegistry(); }
      catch (e) { return { worlds: {}, items: {}, sessionStates: {}, recentActivity: [] }; }
    }
    function isDefaultSession(s) {
      return s && s.id === (Bridge.defaultSessionId || 'default');
    }

    /* ================================================================
       CATALOG MERGE
       Returns a flat array of merged subject objects.
       Only subjects registered in the bridge with world=compass,
       type=subject, status=available are included.
       ================================================================ */

    function getAtlasSubjects({ includeCuratedHidden = false } = {}) {
      const reg = getRegistry();
      const session = getActiveSession();
      const sessionStates = ((reg.sessionStates || {})[session.id]) || {};
      const Curation = window.AtlasOriginalCuration;

      const subjects =
        COMPASS_AVAILABLE_SUBJECT_SLUGS
          .map(slug => {
            const subject = Object.values(COMPASS_CATALOG).find(item =>
              compassSubjectSlug(item) === slug
            );

            if (!subject) return null;

            if (
              !includeCuratedHidden &&
              Curation &&
              typeof Curation.isHidden === 'function' &&
              Curation.isHidden(subject.registryId)
            ) {
              return null;
            }

            const relativeLaunchUrl = getCompassSubjectLaunchUrl(subject);
            const launchUrl = relativeLaunchUrl
              ? withLaunchOrigin(
                new URL(relativeLaunchUrl, window.location.href).href,
                'compass'
              )
              : '';

            if (!launchUrl) return null;

            const item = (reg.items || {})[subject.registryId] || null;
            const state = sessionStates[subject.registryId] || null;
            const hasMyVersion = item?.hasMyVersion === true;

            return {
              registryId: subject.registryId,
              title: item?.title || subject.title,
              launchUrl,
              publicAccess:
                subject.publicAccess === 'full'
                  ? 'full'
                  : 'preview',
              artId: subject.artId || '',
              coverImage: String(item?.coverImage || '').trim() ||
                String(subject.coverImage || '').trim(),
              hook: hasMyVersion &&
                item &&
                Object.prototype.hasOwnProperty.call(
                  item,
                  'description'
                )
                  ? item.description || ''
                  : subject.hook || '',
              hasMyVersion,
              status: resolveStatus(state),
              state,
              contentVersion: item ? item.contentVersion || null : null
            };
          })
          .filter(Boolean);

      return (
        Curation &&
        typeof Curation.sortSubjects === 'function'
      )
        ? Curation.sortSubjects(subjects)
        : subjects;
    }

    getAtlasSubjects.__atlasCurationSorted = true;

    function getOwnedSubjectLaunchUrl(
      subjectId,
      {
        authoringIntent = ''
      } = {}
    ) {
      const id = String(subjectId || '').trim();

      if (!id) return '';

      try {
        const destination = new URL(
          './subject/index.html',
          window.location.href
        );

        destination.searchParams.set('id', id);

        if (authoringIntent) {
          destination.searchParams.set(
            'author',
            authoringIntent
          );
        }

        return withLaunchOrigin(
          destination.href,
          'compass'
        );
      } catch {
        return '';
      }
    }

    function syncCompassCloudAuthorityState() {
      const root = document.documentElement;

      if (root.dataset.atlasAccountHint !== 'account') {
        delete root.dataset.atlasCompassCloudAuthority;
        return false;
      }

      const ready = Boolean(
        window.AtlasTutorSubjectsCloudAuthority
      );

      root.dataset.atlasCompassCloudAuthority =
        ready ? 'ready' : 'pending';

      return !ready;
    }

    function isCompassCloudAuthorityPending() {
      return document.documentElement.dataset
        .atlasCompassCloudAuthority === 'pending';
    }

    let compassCloudAuthorityReadyPromise = null;

    function ensureCompassCloudAuthorityReady() {
      if (!isCompassCloudAuthorityPending()) {
        return Promise.resolve(true);
      }

      if (window.AtlasTutorSubjectsCloudAuthority) {
        syncCompassCloudAuthorityState();
        return Promise.resolve(true);
      }

      if (compassCloudAuthorityReadyPromise) {
        return compassCloudAuthorityReadyPromise;
      }

      compassCloudAuthorityReadyPromise =
        new Promise(resolve => {
          let settled = false;
          let timeout = null;

          const finish = ready => {
            if (settled) return;
            settled = true;

            window.removeEventListener(
              'atlas:compass-cloud-authority-ready',
              onReady
            );

            if (timeout) {
              window.clearTimeout(timeout);
            }

            if (ready) {
              syncCompassCloudAuthorityState();
            }

            resolve(ready);
          };

          const onReady = () => finish(true);

          window.addEventListener(
            'atlas:compass-cloud-authority-ready',
            onReady,
            { once: true }
          );

          timeout = window.setTimeout(
            () => finish(
              Boolean(
                window.AtlasTutorSubjectsCloudAuthority
              )
            ),
            8000
          );
        })
          .finally(() => {
            compassCloudAuthorityReadyPromise = null;
          });

      return compassCloudAuthorityReadyPromise;
    }

    document.addEventListener(
      'click',
      event => {
        if (!isCompassCloudAuthorityPending()) {
          return;
        }

        const target = event.target;

        if (
          !target ||
          typeof target.closest !== 'function'
        ) {
          return;
        }

        const button = target.closest(
          '.subject-library button'
        );

        if (
          !button ||
          button.classList.contains(
            'subject-card-manage-btn'
          )
        ) {
          return;
        }

        event.preventDefault();
        event.stopImmediatePropagation();

        void ensureCompassCloudAuthorityReady()
          .then(ready => {
            if (!ready) {
              showToast(
                'Your Atlas account is still getting ready. Try again.'
              );
              return;
            }

            if (document.contains(button)) {
              button.click();
            }
          });
      },
      true
    );

    function getStoredCompassAccountUserId() {
      try {
        const raw = localStorage.getItem(
          'sb-jnhjfpagectprceswvqn-auth-token'
        );

        if (!raw) return '';

        const parsed = JSON.parse(raw);
        const candidates = [
          parsed,
          parsed?.session,
          parsed?.currentSession,
          parsed?.data?.session
        ];

        for (const candidate of candidates) {
          const id = String(
            candidate?.user?.id || ''
          ).trim();

          if (id) return id;
        }
      } catch { }

      return '';
    }

    function isLocalPresentationScopeReady() {
      const userId =
        getStoredCompassAccountUserId();

      let owner = '';

      try {
        owner = String(
          localStorage.getItem(
            'atlas::persistenceTrust::scopeOwner::v1'
          ) || ''
        ).trim();
      } catch { }

      if (userId) {
        return owner === 'user:' + userId;
      }

      return !owner || owner === 'local';
    }

    function getCompassInitialAccountSnapshot() {
      const snapshot =
        window.AtlasCompassHubInitialSnapshot;

      const hintedUserId = String(
        snapshot?.userId || ''
      ).trim();

      const storedUserId =
        getStoredCompassAccountUserId();

      let scopeOwner = '';

      try {
        scopeOwner = String(
          localStorage.getItem(
            'atlas::persistenceTrust::scopeOwner::v1'
          ) || ''
        ).trim();
      } catch { }

      if (
        !snapshot ||
        snapshot.kind !==
          'compass-hub-presentation' ||
        snapshot.ready !== true ||
        !hintedUserId ||
        hintedUserId !== storedUserId ||
        scopeOwner !== 'user:' + hintedUserId ||
        !Array.isArray(snapshot.summaries) ||
        !Object.prototype.hasOwnProperty.call(
          snapshot,
          'library'
        )
      ) {
        return null;
      }

      return snapshot;
    }

    function getCompassInitialLibraryState(
      snapshot = getCompassInitialAccountSnapshot()
    ) {
      const candidate =
        snapshot?.library?.state?.library ||
        snapshot?.library?.library ||
        null;

      if (
        !candidate ||
        typeof candidate !== 'object' ||
        Array.isArray(candidate)
      ) {
        return null;
      }

      return candidate;
    }

    function getCompassInitialSubjectSummaries(
      snapshot = getCompassInitialAccountSnapshot()
    ) {
      return Array.isArray(snapshot?.summaries)
        ? snapshot.summaries
        : [];
    }

    function getCachedSessionSubjectRefs(
      sessionId,
      snapshot
    ) {
      const id = String(sessionId || '').trim();
      const userId = String(
        snapshot?.userId || ''
      ).trim();

      if (!id || !userId) {
        return [];
      }

      try {
        const scopeOwner = String(
          localStorage.getItem(
            'atlas::persistenceTrust::scopeOwner::v1'
          ) || ''
        ).trim();

        if (scopeOwner !== 'user:' + userId) {
          return [];
        }

        const key =
          'atlas::tutorSubjects::sessionSubjects::' +
          encodeURIComponent(id);

        const raw = JSON.parse(
          localStorage.getItem(key) || '[]'
        );

        if (!Array.isArray(raw)) {
          return [];
        }

        const seen = new Set();

        return raw
          .map(ref => {
            const kind = String(
              ref?.kind || ''
            ).trim();

            const subjectId = String(
              ref?.id || ''
            ).trim();

            if (
              !subjectId ||
              (
                kind !== 'my-subject' &&
                kind !== 'atlas-subject'
              )
            ) {
              return null;
            }

            return {
              kind,
              id: subjectId
            };
          })
          .filter(ref => {
            if (!ref) return false;

            const key =
              ref.kind + ':' + ref.id;

            if (seen.has(key)) {
              return false;
            }

            seen.add(key);
            return true;
          });
      } catch {
        return [];
      }
    }

    function getCachedOwnedSubjectSessionIds(
      records,
      snapshot
    ) {
      const result = new Map();
      const userId = String(
        snapshot?.userId || ''
      ).trim();

      const subjectIds = new Set(
        (Array.isArray(records) ? records : [])
          .map(record =>
            String(record?.id || '').trim()
          )
          .filter(Boolean)
      );

      subjectIds.forEach(id => {
        result.set(id, []);
      });

      if (!userId || !subjectIds.size) {
        return result;
      }

      try {
        const scopeOwner = String(
          localStorage.getItem(
            'atlas::persistenceTrust::scopeOwner::v1'
          ) || ''
        ).trim();

        if (scopeOwner !== 'user:' + userId) {
          return result;
        }

        const prefix =
          'atlas::tutorSubjects::sessionSubjects::';

        for (
          let index = 0;
          index < localStorage.length;
          index += 1
        ) {
          const key = localStorage.key(index);

          if (!key || !key.startsWith(prefix)) {
            continue;
          }

          let sessionId = '';

          try {
            sessionId = decodeURIComponent(
              key.slice(prefix.length)
            );
          } catch {
            continue;
          }

          if (!sessionId) continue;

          let refs = [];

          try {
            const raw = JSON.parse(
              localStorage.getItem(key) || '[]'
            );

            refs = Array.isArray(raw) ? raw : [];
          } catch {
            refs = [];
          }

          refs.forEach(ref => {
            if (
              ref?.kind !== 'my-subject'
            ) {
              return;
            }

            const id = String(
              ref?.id || ''
            ).trim();

            if (!subjectIds.has(id)) {
              return;
            }

            const homes =
              result.get(id) || [];

            if (!homes.includes(sessionId)) {
              homes.push(sessionId);
              result.set(id, homes);
            }
          });
        }
      } catch { }

      return result;
    }

    const ownedSubjectBuildLiveness =
      new Map();

    const OWNED_SUBJECT_BUILD_PROBE_TTL_MS =
      2200;

    function getOwnedSubjectBuildLifecycle(record) {
      const Lifecycle =
        window.AtlasAiSubjectBuildLifecycle;

      if (
        Lifecycle &&
        typeof Lifecycle.classify === 'function'
      ) {
        return Lifecycle.classify(record);
      }

      /*
       * Fail-safe only for a partially cached deploy. The shared lifecycle
       * module is canonical, but the Hub must never disguise a durable
       * unfinished build as a finished subject if that script failed to load.
       */
      const metadata =
        record?.metadata &&
        typeof record.metadata === 'object' &&
        !Array.isArray(record.metadata)
          ? record.metadata
          : {};

      const provenanceKind =
        String(
          record?.provenance?.kind || ''
        ).trim();

      const status =
        String(
          metadata.aiBuildStatus || ''
        ).trim();

      const legacyRecovery =
        metadata.legacyAiBuildRecovery === true;

      const knownAiLifecycle =
        provenanceKind === 'ai-subject-build' ||
        ['building', 'paused', 'complete']
          .includes(status);

      return {
        status,
        provenanceKind,
        legacyRecovery,
        incomplete:
          status === 'complete'
            ? false
            : (
                legacyRecovery ||
                knownAiLifecycle
              )
      };
    }

    function noteOwnedSubjectBuildLiveness(
      subjectId,
      live
    ) {
      const id =
        String(subjectId || '').trim();

      if (!id) return;

      ownedSubjectBuildLiveness.set(
        id,
        {
          live: live === true,
          checkedAt: Date.now()
        }
      );
    }

    async function resolveOwnedSubjectBuildLive(
      subjectId
    ) {
      const id =
        String(subjectId || '').trim();

      const Runtime =
        window.AtlasSubjectRuntimeChannel;

      if (
        !id ||
        !Runtime
      ) {
        return false;
      }

      if (
        typeof Runtime.isBuildActive ===
          'function' &&
        Runtime.isBuildActive(id)
      ) {
        noteOwnedSubjectBuildLiveness(
          id,
          true
        );

        return true;
      }

      const cached =
        ownedSubjectBuildLiveness.get(id);

      if (
        cached &&
        cached.live === false &&
        Date.now() - cached.checkedAt <
          OWNED_SUBJECT_BUILD_PROBE_TTL_MS
      ) {
        return false;
      }

      let live = false;

      if (
        typeof Runtime.probeActiveBuild ===
          'function'
      ) {
        try {
          live =
            await Runtime.probeActiveBuild(id);
        } catch {
          live = false;
        }
      }

      noteOwnedSubjectBuildLiveness(
        id,
        live
      );

      return live;
    }

    async function getOwnedSubjects({
      initialSnapshot = null
    } = {}) {
      const cloudAuthorityPending =
        isCompassCloudAuthorityPending();

      const useInitialSnapshot =
        Boolean(initialSnapshot);

      const Subjects = window.AtlasTutorSubjects;

      if (
        !Subjects ||
        typeof Subjects.listSubjects !== 'function'
      ) {
        return [];
      }

      let records = [];
      let libraryState = null;

      try {
        if (
          useInitialSnapshot ||
          cloudAuthorityPending
        ) {
          const snapshot =
            initialSnapshot ||
            getCompassInitialAccountSnapshot();

          records =
            getCompassInitialSubjectSummaries(
              snapshot
            );

          libraryState =
            getCompassInitialLibraryState(
              snapshot
            );
        } else {
          [
            records,
            libraryState
          ] = await Promise.all([
            Subjects.listSubjects(),
            typeof Subjects.getLibraryState === 'function'
              ? Subjects.getLibraryState()
              : Promise.resolve(null)
          ]);
        }
      } catch {
        return [];
      }

      const aiBuildStates =
        new Map();

      (Array.isArray(records) ? records : [])
        .forEach(record => {
          const id =
            String(record?.id || '').trim();

          if (!id) return;

          aiBuildStates.set(
            id,
            getOwnedSubjectBuildLifecycle(
              record
            )
          );
        });

      const liveBuildIds =
        new Set();

      const liveBuildPromise =
        Promise.all(
          (Array.isArray(records) ? records : [])
            .map(async record => {
              const id =
                String(record?.id || '').trim();

              if (
                !id ||
                aiBuildStates.get(id)
                  ?.incomplete !== true
              ) {
                return;
              }

              if (
                await resolveOwnedSubjectBuildLive(
                  id
                )
              ) {
                liveBuildIds.add(id);
              }
            })
        );

      let subjectSessionIds = new Map();

      if (
        useInitialSnapshot ||
        cloudAuthorityPending
      ) {
        subjectSessionIds =
          getCachedOwnedSubjectSessionIds(
            records,
            initialSnapshot ||
              getCompassInitialAccountSnapshot()
          );
      } else if (
        typeof Subjects.getSubjectSessionIds === 'function'
      ) {
        await Promise.all(
          (Array.isArray(records) ? records : [])
            .map(async record => {
              const id =
                String(record?.id || '').trim();

              if (!id) return;

              try {
                const sessionIds =
                  await Subjects.getSubjectSessionIds({
                    kind: 'my-subject',
                    id
                  });

                subjectSessionIds.set(
                  id,
                  Array.isArray(sessionIds)
                    ? sessionIds
                    : []
                );
              } catch {
                subjectSessionIds.set(id, []);
              }
            })
        );
      }

      const workingDraftDescriptions =
        new Map();

      const workingDraftCovers =
        new Map();

      if (
        !useInitialSnapshot &&
        !cloudAuthorityPending &&
        typeof Subjects.getWorkingDraft === 'function'
      ) {
        await Promise.all(
          (Array.isArray(records) ? records : [])
            .map(async record => {
              const id =
                String(record?.id || '').trim();

              if (!id) return;

              const aiBuild =
                aiBuildStates.get(id);

              const publishedDescription =
                String(
                  record?.metadata?.description ||
                  record?.document?.module?.catalogDescription ||
                  ''
                ).trim();

              const needsDescription =
                !publishedDescription;

              const needsBuildDraft =
                aiBuild?.incomplete === true;

              if (
                !needsDescription &&
                !needsBuildDraft
              ) {
                return;
              }

              try {
                const draft =
                  await Subjects.getWorkingDraft(id);

                const draftDescription =
                  String(
                    draft?.document?.module?.catalogDescription ||
                    ''
                  ).trim();

                if (
                  needsDescription &&
                  draftDescription
                ) {
                  workingDraftDescriptions.set(
                    id,
                    draftDescription
                  );
                }

                if (needsBuildDraft) {
                  const draftCover =
                    String(
                      draft?.document?.module?.bgImage ||
                      ''
                    ).trim();

                  if (draftCover) {
                    workingDraftCovers.set(
                      id,
                      draftCover
                    );
                  }
                }
              } catch { }
            })
        );
      }

      await liveBuildPromise;

      const reg = getRegistry();
      const session = getActiveSession();
      const sessionStates =
        ((reg.sessionStates || {})[session.id]) || {};

      return (Array.isArray(records) ? records : [])
        .map(record => {
          const id = String(record?.id || '').trim();

          if (!id) return null;

          const metadata = record.metadata || {};
          const module = record.document?.module || {};
          const aiBuild =
            aiBuildStates.get(id) ||
            getOwnedSubjectBuildLifecycle(
              record
            );

          const registryId =
            typeof Bridge.getContentRegistryId === 'function'
              ? Bridge.getContentRegistryId(COMPASS_ID, id)
              : COMPASS_ID + ':' + id;

          const launchUrl = getOwnedSubjectLaunchUrl(id);

          if (!launchUrl) return null;

          const state = sessionStates[registryId] || null;

          const title = String(
            metadata.title ||
            module.title ||
            'Untitled Subject'
          ).trim() || 'Untitled Subject';

          if (
            !useInitialSnapshot &&
            !cloudAuthorityPending
          ) {
            syncOwnedSubjectRegistryProjection(record);
          }

          const placement =
            libraryState?.subjects?.[id] || {
              libraryIncluded: true,
              categoryId: 'default',
              archived: false
            };

          const artwork =
            window.AtlasSubjectArtwork &&
            typeof AtlasSubjectArtwork.normalize === 'function'
              ? AtlasSubjectArtwork.normalize(
                  metadata.artwork
                )
              : null;

          const sourceRegistryId = record.provenance?.sourceWorld === COMPASS_ID
            ? record.provenance.sourceContentId ||
              (COMPASS_ID + ':' + record.provenance.sourceSubjectId)
            : '';

          return {
            subjectId: id,
            isOwned: true,
            isCachedProjection:
              useInitialSnapshot ||
              cloudAuthorityPending,
            provenance:
              record.provenance &&
              typeof record.provenance === 'object' &&
              !Array.isArray(record.provenance)
                ? record.provenance
                : {},
            artwork,
            registryId,
            libraryIncluded:
              placement.libraryIncluded !== false,
            categoryId:
              placement.categoryId || null,
            canMoveCategory:
              placement.libraryIncluded !== false &&
              (libraryState?.categories?.length || 0) > 1,
            archived:
              placement.archived === true,
            sessionIds:
              subjectSessionIds.get(id) || [],
            hasSessionHome:
              (subjectSessionIds.get(id) || []).length > 0,
            title,
            launchUrl,
            artId: '',
            hook: String(
              workingDraftDescriptions.get(id) ||
              metadata.description ||
              module.catalogDescription ||
              ''
            ).trim(),
            coverImage:
              String(
                workingDraftCovers.get(id) ||
                ''
              ).trim() ||
              String(metadata.coverImage || '').trim() ||
              String(module.bgImage || '').trim() ||
              String(COMPASS_CATALOG[sourceRegistryId]?.coverImage || '').trim(),
            aiBuildStatus:
              aiBuild.status,
            aiBuildIncomplete:
              aiBuild.incomplete === true,
            aiBuildLive:
              aiBuild.incomplete === true &&
              liveBuildIds.has(id),
            ownershipLabel: '',
            hasMyVersion: false,
            status: resolveStatus(state),
            state,
            contentVersion:
              'owned-r' +
              Math.max(
                1,
                Math.floor(Number(record.revision) || 1)
              ),
            updatedAt: Number(record.updatedAt) || 0
          };
        })
        .filter(Boolean);
    }
