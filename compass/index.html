    /* ================================================================
       NAVIGATION
       Matches Atlas hub navigation, adapted only for Compass host IDs.
       ================================================================ */

    function navigateTo(url) {
      if (!url) {
        showToast('That destination is not available on this device yet.');
        return;
      }

      if (window.AtlasSearch && typeof AtlasSearch.navigateTo === 'function') {
        AtlasSearch.navigateTo(url);
        return;
      }

      window.location.href = url;
    }

    function resolveWorld(reg, worldId) {
      const worlds = reg.worlds || {};
      if (worlds[worldId]) return worlds[worldId];

      return Object.values(worlds).find(w =>
        w && (w.registryId === worldId || w.id === worldId || w.world === worldId)
      ) || null;
    }

    function worldHasItems(reg, worldId) {
      const prefix = worldId + ':';
      return Object.keys(reg.items || {}).some(k => k.indexOf(prefix) === 0);
    }

    function getWorldLaunchUrl(reg, worldId) {
      if (worldId === ARCADE_ID) return '../arcade/index.html';

      const w = resolveWorld(reg, worldId);
      return (w && w.launchUrl) ? w.launchUrl : null;
    }

    function isWorldAvailable(reg, worldId) {
      return !!getWorldLaunchUrl(reg, worldId);
    }

    function openWorld(worldId) {
      const reg = getRegistry();
      const url = getWorldLaunchUrl(reg, worldId);

      if (url) {
        navigateTo(url);
        return;
      }

      if (worldId === COMPASS_ID && worldHasItems(reg, COMPASS_ID)) {
        showToast('Compass is registered, but its hub is not linked on this device yet.');
        return;
      }

      showToast('This world is coming soon.');
    }

    function isHubAvailable(hub, reg) {
      if (!hub) return false;
      if (hub.alwaysAvailable) return true;

      if (hub.worldId === COMPASS_ID) {
        return isWorldAvailable(reg, COMPASS_ID) || worldHasItems(reg, COMPASS_ID);
      }

      if (hub.worldId === ARCADE_ID) {
        return isWorldAvailable(reg, ARCADE_ID);
      }

      return false;
    }

    function openHub(hubId) {
      const hub = HUB_NAV[hubId];
      if (!hub) return;

      if (hub.id === ACTIVE_HUB_ID) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (hub.worldId) {
        openWorld(hub.worldId);
        return;
      }

      if (hub.launchUrl) {
        navigateTo(hub.launchUrl);
        return;
      }

      showToast('That destination is not available yet.');
    }

    function renderSpineHubNav() {
      const reg = getRegistry();
      const host = document.getElementById('spine-hub-nav');
      if (!host) return;

      host.querySelectorAll('[data-hub-id]').forEach(button => {
        const hubId = button.dataset.hubId;
        const hub = HUB_NAV[hubId];

        if (!hub) return;

        const active = hub.id === ACTIVE_HUB_ID;
        const available = isHubAvailable(hub, reg);

        button.classList.toggle('is-active', active);

        if (active) {
          button.setAttribute('aria-current', 'page');
          button.removeAttribute('aria-disabled');
          button.removeAttribute('onclick');
          button.title = hub.name;
          return;
        }

        button.removeAttribute('aria-current');
        button.title = available
          ? 'Open ' + hub.name
          : hub.name + ' — coming soon';

        if (available) {
          button.removeAttribute('aria-disabled');
          button.setAttribute('onclick', "openHub('" + hub.id + "')");
        } else {
          button.setAttribute('aria-disabled', 'true');
          button.removeAttribute('onclick');
        }
      });
    }

    function renderDrawerHubNav() {
      const reg = getRegistry();
      const host = document.getElementById('drawer-hub-nav');
      if (!host) return;

      host.innerHTML = Object.values(HUB_NAV).map(hub => {
        const active = hub.id === ACTIVE_HUB_ID;
        const available = isHubAvailable(hub, reg);
        const disabledAttr = available ? '' : ' aria-disabled="true"';
        const activeClass = active ? ' is-active' : '';
        const onclick = available ? ' onclick="closeDrawer();openHub(\'' + hub.id + '\')"' : '';

        return '<button class="drawer-nav-item' + activeClass + '"' +
          disabledAttr +
          onclick +
          (active ? ' aria-current="page"' : '') +
          '>' +
          hub.smallIcon +
          escHtml(hub.name) +
          (available ? '' : '<span class="nav-soon">Soon</span>') +
          '</button>';
      }).join('');
    }

    let toastTimer = null;
    function showToast(text) {
      let el = document.getElementById('hub-toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'hub-toast';
        el.className = 'hub-toast';
        el.setAttribute('role', 'status');
        document.body.appendChild(el);
      }
      el.textContent = text;
      requestAnimationFrame(() => el.classList.add('visible'));
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('visible'), 3200);
    }


    let compassCapabilityGatePromise = null;
    let accountLibraryResumeUnsubscribe = null;

    async function ensureCompassCapabilityGate() {
      if (window.AtlasCapabilityGate) {
        return window.AtlasCapabilityGate;
      }

      if (compassCapabilityGatePromise) {
        return compassCapabilityGatePromise;
      }

      compassCapabilityGatePromise =
        (async () => {
          const Bootstrap = window.AtlasAccessBootstrap;

          if (
            !Bootstrap ||
            typeof Bootstrap.prepareCapabilityGate !== 'function'
          ) {
            throw new Error(
              'Atlas capability enforcement is unavailable.'
            );
          }

          return Bootstrap.prepareCapabilityGate();
        })().catch(error => {
          compassCapabilityGatePromise = null;
          throw error;
        });

      return compassCapabilityGatePromise;
    }

    async function requireAccountLibraryAccess(
      operation,
      context = {},
      trigger = null
    ) {
      try {
        const Gate = await ensureCompassCapabilityGate();

        return Gate.requireCapability(
          'canAccessAccountLibrary',
          {
            action: 'open-account-library',
            destination: window.location.href,
            context: {
              operation,
              ...context
            },
            trigger
          }
        );
      } catch (error) {
        return {
          outcome: 'unavailable',
          error
        };
      }
    }

    async function ensureAccountLibraryAuthorityReady(access) {
      if (!access?.access?.authenticated) {
        return false;
      }

      if (window.AtlasTutorSubjectsCloudAuthority) {
        return true;
      }

      if (!isCompassCloudAuthorityPending()) {
        // A live anonymous → authenticated transition can currently reach
        // capability-ready state before the workspace cloud authorities that
        // were skipped at anonymous startup have been activated. Do not fall
        // through to the legacy local My Subjects object in that gap.
        return false;
      }

      const ready =
        await ensureCompassCloudAuthorityReady();

      return Boolean(
        ready &&
        window.AtlasTutorSubjectsCloudAuthority
      );
    }

    async function accountLibraryAccessAllows(access) {
      if (access?.outcome === 'allowed') {
        const authorityReady =
          await ensureAccountLibraryAuthorityReady(access);

        if (authorityReady) {
          return true;
        }

        showToast(
          'Your Atlas account is still getting ready. Try again.'
        );
        return false;
      }

      if (access?.outcome !== 'auth-required') {
        showToast(
          'My Subjects are unavailable right now.'
        );
      }

      return false;
    }

    async function installAccountLibraryResume() {
      try {
        const Gate = await ensureCompassCapabilityGate();

        accountLibraryResumeUnsubscribe?.();

        accountLibraryResumeUnsubscribe =
          Gate.subscribeResume(
            async payload => {
              const intent = payload?.intent || null;

              if (
                !intent ||
                intent.action !== 'open-account-library'
              ) {
                return;
              }

              const context = intent.context || {};

              if (
                context.operation === 'add-atlas-original' &&
                context.registryId
              ) {
                await runAtlasOriginalOwnershipAction(
                  context.registryId,
                  'own',
                  null,
                  {
                    categoryId: context.categoryId || ''
                  }
                );
                return;
              }

              if (
                context.operation === 'add-owned-subject' &&
                context.subjectId
              ) {
                await addOwnedSubjectToLibrary(
                  context.subjectId,
                  null
                );
                return;
              }

              if (
                context.operation === 'remove-owned-subject' &&
                context.subjectId
              ) {
                await removeOwnedSubjectFromLibrary(
                  context.subjectId,
                  null
                );
                return;
              }

              if (context.operation === 'create-category') {
                await openCreateCategoryDialog(
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                context.operation === 'rename-category' &&
                context.categoryId
              ) {
                await openRenameCategoryDialog(
                  context.categoryId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                context.operation === 'move-category' &&
                context.categoryId
              ) {
                await moveLibraryCategory(
                  context.categoryId,
                  Number(context.offset),
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                context.operation === 'delete-category' &&
                context.categoryId
              ) {
                await openDeleteCategoryDialog(
                  context.categoryId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                context.operation === 'move-owned-subject-category' &&
                context.subjectId
              ) {
                await openMoveOwnedSubjectCategoryDialog(
                  context.subjectId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                context.operation === 'archive-owned-subject' &&
                context.subjectId
              ) {
                await archiveOwnedSubject(
                  context.subjectId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (context.operation === 'open-archived-subjects') {
                await openArchivedSubjectsDialog(
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                context.operation === 'manage-last-home' &&
                context.subjectId
              ) {
                await openOwnedSubjectLastHomeDialog(
                  context.subjectId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                context.operation === 'move-library-subject-order' &&
                context.subjectId &&
                context.targetSubjectId
              ) {
                await moveShelfSubject(
                  'category',
                  context.subjectKind || 'my-subject',
                  context.subjectId,
                  context.targetKind || 'my-subject',
                  context.targetSubjectId,
                  Number(context.offset),
                  null,
                  { skipCapabilityGate: true }
                );
              }
            },
            {
              action: 'open-account-library',
              replay: true
            }
          );
      } catch (error) {
        console.warn(
          '[Compass] account-library resume unavailable:',
          error
        );
      }
    }

    function formatCompassCreationResetDate(value) {
      const resetAt =
        new Date(String(value || '').trim());

      if (!Number.isFinite(resetAt.getTime())) {
        return '';
      }

      return new Intl.DateTimeFormat(
        undefined,
        {
          month: 'short',
          day: 'numeric'
        }
      ).format(resetAt);
    }

    function resolveCompassCreationAllowance(
      access
    ) {
      const liveAccess =
        window.AtlasAccess?.getState?.() ||
        null;

      const accessState =
        access?.access &&
        typeof access.access === 'object'
          ? access.access
          : (
              access &&
              typeof access === 'object' &&
              access.tier
                ? access
                : liveAccess
            );

      const allowance =
        access?.allowance &&
        typeof access.allowance === 'object'
          ? access.allowance
          : (
              accessState?.creationAllowance &&
              typeof accessState.creationAllowance ===
                'object'
                ? accessState.creationAllowance
                : (
                    liveAccess?.creationAllowance &&
                    typeof liveAccess.creationAllowance ===
                      'object'
                      ? liveAccess.creationAllowance
                      : null
                  )
            );

      const remaining =
        Number(allowance?.remaining);
      const limit =
        Number(allowance?.limit);

      return {
        tier:
          String(
            accessState?.tier ||
            liveAccess?.tier ||
            ''
          ).trim(),
        allowance,
        remaining:
          Number.isFinite(remaining) &&
          remaining >= 0
            ? Math.floor(remaining)
            : null,
        limit:
          Number.isFinite(limit) &&
          limit > 0
            ? Math.floor(limit)
            : null,
        resetLabel:
          formatCompassCreationResetDate(
            allowance?.resetAt
          )
      };
    }

    function showCompassCreationExhausted(
      dialog,
      access
    ) {
      if (!dialog) return false;

      const panel = dialog.querySelector(
        '#owned-subject-dialog-upgrade'
      );
      const panelTitle = dialog.querySelector(
        '#owned-subject-dialog-upgrade-title'
      );
      const panelCopy = dialog.querySelector(
        '#owned-subject-dialog-upgrade-copy'
      );
      const allowanceStatus = dialog.querySelector(
        '#owned-subject-dialog-allowance-status'
      );
      const allowanceValue = dialog.querySelector(
        '#owned-subject-dialog-allowance-value'
      );
      const error = dialog.querySelector(
        '#owned-subject-dialog-error'
      );
      const secondary = dialog.querySelector(
        '#owned-subject-dialog-secondary'
      );
      const confirm = dialog.querySelector(
        '#owned-subject-dialog-confirm'
      );

      if (
        !panel ||
        !panelTitle ||
        !panelCopy ||
        !secondary ||
        !confirm ||
        ownedSubjectDialogState?.mode !== 'create'
      ) {
        return false;
      }

      const resolved =
        resolveCompassCreationAllowance(
          access
        );

      if (allowanceStatus) {
        allowanceStatus.hidden = true;
        allowanceStatus.classList.remove(
          'is-low'
        );
      }

      if (allowanceValue) {
        allowanceValue.textContent = '';
      }

      panel.hidden = false;
      panelCopy.hidden = false;

      if (error) {
        error.hidden = true;
        error.textContent = '';
      }

      secondary.hidden = false;
      secondary.className = 'btn-ghost';
      secondary.textContent = 'Start blank';
      secondary.disabled = false;

      if (resolved.tier === 'pro') {
        panelTitle.textContent =
          'Monthly creations used';

        panelCopy.textContent =
          resolved.resetLabel
            ? `You’ve used all ${resolved.limit || 100}. Fresh creations reset ${resolved.resetLabel}. You can still start blank.`
            : `You’ve used all ${resolved.limit || 100} for this billing month. You can still start blank.`;

        ownedSubjectDialogState.upgradePrompt =
          'pro-exhausted';

        confirm.hidden = true;

        requestAnimationFrame(() => {
          secondary.focus();
        });

        return true;
      }

      panelTitle.textContent =
        'Free creations used';

      panelCopy.textContent =
        `You’ve used all ${resolved.limit || 8}. Start blank, or upgrade to Pro for 100 creations each billing month.`;

      ownedSubjectDialogState.upgradePrompt =
        'free-exhausted';

      confirm.hidden = false;
      confirm.className = 'btn-primary';
      confirm.textContent =
        'Upgrade to Pro · $12/month';
      confirm.disabled = false;

      requestAnimationFrame(() => {
        confirm.focus();
      });

      return true;
    }

    function syncCompassCreationAllowanceNotice(
      dialog,
      access = null
    ) {
      if (!dialog) return false;

      const panel = dialog.querySelector(
        '#owned-subject-dialog-upgrade'
      );
      const panelTitle = dialog.querySelector(
        '#owned-subject-dialog-upgrade-title'
      );
      const panelCopy = dialog.querySelector(
        '#owned-subject-dialog-upgrade-copy'
      );
      const allowanceStatus = dialog.querySelector(
        '#owned-subject-dialog-allowance-status'
      );
      const allowanceValue = dialog.querySelector(
        '#owned-subject-dialog-allowance-value'
      );

      if (
        !panel ||
        !panelTitle ||
        !panelCopy ||
        !allowanceStatus ||
        !allowanceValue ||
        ownedSubjectDialogState?.mode !== 'create'
      ) {
        return false;
      }

      panel.hidden = true;
      panelTitle.textContent = '';
      panelCopy.textContent = '';
      panelCopy.hidden = true;

      allowanceStatus.hidden = true;
      allowanceValue.textContent = '';
      allowanceStatus.classList.remove(
        'is-low'
      );

      if (
        ownedSubjectDialogState
          ?.anonymousPreview
      ) {
        return false;
      }

      const resolved =
        resolveCompassCreationAllowance(
          access
        );

      if (
        resolved.remaining === null ||
        resolved.limit === null
      ) {
        return false;
      }

      if (resolved.remaining === 0) {
        return showCompassCreationExhausted(
          dialog,
          access
        );
      }

      if (
        resolved.tier === 'free' &&
        resolved.remaining <= 3
      ) {
        allowanceValue.textContent =
          `Free · ${resolved.remaining} left`;

        if (resolved.remaining <= 2) {
          allowanceStatus.classList.add(
            'is-low'
          );
        }

        allowanceStatus.hidden = false;
        return true;
      }

      if (
        resolved.tier === 'pro' &&
        resolved.remaining <= 10
      ) {
        allowanceValue.textContent =
          resolved.resetLabel
            ? `Pro · ${resolved.remaining} left · resets ${resolved.resetLabel}`
            : `Pro · ${resolved.remaining} left`;

        if (resolved.remaining <= 5) {
          allowanceStatus.classList.add(
            'is-low'
          );
        }

        allowanceStatus.hidden = false;
        return true;
      }

      return false;
    }

    async function openCompassCreationUpgradeCheckout(
      dialog
    ) {
      const confirm = dialog?.querySelector(
        '#owned-subject-dialog-confirm'
      );
      const error = dialog?.querySelector(
        '#owned-subject-dialog-error'
      );

      if (
        !dialog ||
        !confirm ||
        !window.AtlasProCheckout ||
        typeof window.AtlasProCheckout.open !==
          'function'
      ) {
        if (error) {
          error.hidden = false;
          error.textContent =
            'Secure checkout is unavailable right now.';
        }
        return false;
      }

      confirm.disabled = true;
      confirm.textContent =
        'Opening secure checkout…';

      const opened =
        await window.AtlasProCheckout.open({
          source:
            'compass-create',
          trigger:
            confirm,
          onStatus: (
            message,
            kind
          ) => {
            if (!error) return;

            if (
              kind === 'error' &&
              message
            ) {
              error.hidden = false;
              error.textContent = message;
              return;
            }

            error.hidden = true;
            error.textContent = '';
          },
          onActivated:
            accessState => {
              if (
                ownedSubjectDialogState?.mode !==
                  'create'
              ) {
                return;
              }

              ownedSubjectDialogState
                .upgradePrompt = false;

              const secondary =
                dialog.querySelector(
                  '#owned-subject-dialog-secondary'
                );

              if (secondary) {
                secondary.hidden = false;
                secondary.className =
                  'btn-ghost';
                secondary.textContent =
                  'Start blank';
                secondary.disabled = false;
              }

              confirm.hidden = false;
              confirm.className =
                'btn-primary';
              confirm.textContent =
                'Create subject';
              confirm.disabled = false;

              syncCompassCreationAllowanceNotice(
                dialog,
                accessState
              );
            }
        });

      if (
        ownedSubjectDialogState?.mode ===
          'create' &&
        ownedSubjectDialogState
          .upgradePrompt === 'free-exhausted'
      ) {
        confirm.disabled = false;
        confirm.textContent =
          'Upgrade to Pro · $12/month';
      }

      return opened;
    }

    function compassSubjectCapabilityAllows(
      access,
      unavailableMessage = 'This subject action is unavailable right now.'
    ) {
      if (access?.outcome === 'allowed') {
        return true;
      }

      if (access?.outcome === 'auth-required') {
        return false;
      }

      if (
        access?.outcome === 'limited' &&
        access?.reason === 'exhausted'
      ) {
        showToast(
          'You’ve used your current AI creation allowance.'
        );
        return false;
      }

      showToast(unavailableMessage);
      return false;
    }

    function setCompassResumeTransition(
      createMode = 'generate'
    ) {
      document.documentElement.dataset
        .atlasResumeTransition =
          createMode === 'blank'
            ? 'creating-subject'
            : 'building-subject';
    }

    function clearCompassResumeTransition() {
      delete document.documentElement.dataset
        .atlasResumeTransition;
    }

    async function installSubjectCapabilityResume() {
      try {
        const Gate = await ensureCompassCapabilityGate();

        subjectCapabilityResumeUnsubscribe?.();

        subjectCapabilityResumeUnsubscribe =
          Gate.subscribeResume(
            async payload => {
              const intent = payload?.intent || null;
              const context = intent?.context || {};

              if (
                intent?.action === 'create-subject' &&
                context.operation === 'open-create-dialog'
              ) {
                await openCreateSubjectDialog(
                  null,
                  context.sessionId || '',
                  null,
                  context.categoryId || '',
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                intent?.action === 'create-subject' &&
                context.operation ===
                  'continue-create-preview'
              ) {
                const draft =
                  consumeCompassCreatePreviewDraft(
                    context.draftId || ''
                  );

                const canAutoResume =
                  Boolean(
                    draft &&
                    String(
                      draft.title || ''
                    ).trim()
                  );

                const silentResume =
                  payload?.source ===
                    'account-confirmation' &&
                  canAutoResume;

                if (silentResume) {
                  setCompassResumeTransition(
                    draft.createMode
                  );
                } else if (
                  payload?.source ===
                    'account-confirmation'
                ) {
                  clearCompassResumeTransition();
                }

                await openCreateSubjectDialog(
                  null,
                  draft?.sessionId || '',
                  null,
                  draft?.categoryId || '',
                  {
                    initialDraft: draft,
                    silentResume
                  }
                );

                if (
                  canAutoResume &&
                  ownedSubjectDialogState?.mode ===
                    'create' &&
                  !ownedSubjectDialogState
                    .anonymousPreview
                ) {
                  await confirmOwnedSubjectDialog(
                    draft.createMode === 'blank'
                      ? 'blank'
                      : 'generate'
                  );
                }

                return;
              }

              if (
                intent?.action === 'create-subject' &&
                context.operation === 'duplicate-owned-subject' &&
                context.subjectId
              ) {
                await duplicateOwnedSubject(
                  context.subjectId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                intent?.action === 'edit-subject' &&
                context.operation === 'open-owned-subject' &&
                context.subjectId
              ) {
                await editOwnedSubject(
                  context.subjectId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                intent?.action === 'edit-subject' &&
                context.operation === 'rename-owned-subject' &&
                context.subjectId
              ) {
                await openOwnedSubjectRenameDialog(
                  context.subjectId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                intent?.action === 'edit-subject' &&
                context.operation === 'delete-owned-subject' &&
                context.subjectId
              ) {
                await openOwnedSubjectDeleteDialog(
                  context.subjectId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                intent?.action === 'edit-subject' &&
                context.operation === 'open-subject-cover' &&
                context.subjectId
              ) {
                await openOwnedSubjectCoverPicker(
                  context.subjectId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                intent?.action === 'edit-subject' &&
                context.operation === 'open-subject-artwork' &&
                context.subjectId
              ) {
                await openSubjectArtworkStudio(
                  context.subjectId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                intent?.action === 'edit-subject' &&
                context.operation === 'rename-atlas-subject' &&
                context.registryId
              ) {
                await openAtlasSubjectRenameDialog(
                  context.registryId,
                  null,
                  { skipCapabilityGate: true }
                );
                return;
              }

              if (
                intent?.action === 'edit-subject' &&
                context.operation === 'restore-atlas-original-dialog' &&
                context.registryId
              ) {
                await openRestoreAtlasOriginalHubDialog({
                  registryId: context.registryId,
                  subjectId: context.subjectId || '',
                  skipCapabilityGate: true
                });
              }
            },
            { replay: true }
          );
      } catch (error) {
        console.warn(
          '[Compass] subject capability resume unavailable:',
          error
        );
      }
    }

    let ownedSubjectDialogState = null;
    let ownedSubjectDialogReturnFocus = null;

    function getOwnedSubjectRegistryId(subjectId) {
      const id = String(subjectId || '').trim();

      if (!id) return '';

      return typeof Bridge.getContentRegistryId === 'function'
        ? Bridge.getContentRegistryId(COMPASS_ID, id)
        : COMPASS_ID + ':' + id;
    }

    function getOwnedSubjectRecordTitle(record) {
      return String(
        record?.metadata?.title ||
        record?.document?.module?.title ||
        'Untitled Subject'
      ).trim() || 'Untitled Subject';
    }

    function syncOwnedSubjectRegistryProjection(record) {
      if (!record?.id) return;

      try {
        const registryId =
          getOwnedSubjectRegistryId(record.id);

        const registry = getRegistry();
        const existing =
          (registry.items || {})[registryId] || null;

        const metadata = record.metadata || {};
        const module = record.document?.module || {};

        const title = getOwnedSubjectRecordTitle(record);

        const navTitle = String(
          metadata.navTitle ||
          module.navTitle ||
          title
        ).trim() || title;

        const description = String(
          metadata.description ||
          module.catalogDescription ||
          ''
        ).trim();

        const coverImage = String(
          metadata.coverImage ||
          module.bgImage ||
          ''
        ).trim();

        const contentVersion =
          'owned-r' +
          Math.max(
            1,
            Math.floor(Number(record.revision) || 1)
          );

        const launchUrl =
          getOwnedSubjectLaunchUrl(record.id);

        const projection = {
          registryId,
          world: COMPASS_ID,
          type: 'subject',
          schemaVersion: Math.max(
            1,
            Math.floor(
              Number(record.document?.schemaVersion) || 1
            )
          ),
          id: record.id,
          title,
          navTitle,
          description,
          hook: description,
          coverImage,
          contentVersion,
          ownershipKind: 'my-subject',
          hasMyVersion: false,
          status: 'available',
          launchUrl
        };

        const projectionKeys = [
          'world',
          'type',
          'schemaVersion',
          'id',
          'title',
          'navTitle',
          'description',
          'hook',
          'coverImage',
          'contentVersion',
          'ownershipKind',
          'hasMyVersion',
          'status',
          'launchUrl'
        ];

        const projectionChanged =
          !existing ||
          projectionKeys.some(key =>
            existing[key] !== projection[key]
          );

        if (projectionChanged) {
          Bridge.upsertItem({
            ...(existing || {}),
            ...projection
          });
        }

        Object.entries(
          registry.sessionStates || {}
        ).forEach(([sessionId, states]) => {
          const existingState =
            states && states[registryId];

          if (
            !existingState ||
            typeof Bridge.upsertSessionState !== 'function'
          ) {
            return;
          }

          const sessionProjection = {
            title,
            navTitle,
            description,
            hook: description,
            coverImage,
            contentVersion,
            ownershipKind: 'my-subject',
            hasMyVersion: false,
            launchUrl
          };

          const sessionChanged =
            Object.entries(sessionProjection)
              .some(([key, value]) =>
                existingState[key] !== value
              );

          if (!sessionChanged) return;

          Bridge.upsertSessionState(
            sessionId,
            registryId,
            {
              ...existingState,
              ...sessionProjection
            }
          );
        });
      } catch {
        /* The owned record remains canonical even if a projection
           has not yet been created. */
      }
    }

    function closeOwnedSubjectMenus() {
      let closed = false;

      document
        .querySelectorAll('.subject-card-menu')
        .forEach(menu => {
          if (!menu.hidden) {
            menu.hidden = true;
            closed = true;

          const button = menu

    function toggleOwnedSubjectMenu(button, event) {
      event?.preventDefault();
      event?.stopPropagation();

      const management = button?.closest(
        '.subject-card-management'
      );

      const menu = management?.querySelector(
        '.subject-card-menu'
      );

      if (!menu) return;

      const opening = menu.hidden;

      closeOwnedSubjectMenus();

      if (!opening) return;

      menu.classList.remove('is-flipped');
      menu.style.maxHeight = '';
      menu.style.overflowY = '';
      menu.hidden = false;

      const menuRect = menu.getBoundingClientRect();
      const buttonRect = button.getBoundingClientRect();
      const viewportHeight =
        window.innerHeight ||
        document.documentElement.clientHeight;
      const viewportPadding = 12;
      const menuGap = 8;

      const visibleHeaderBottom =
        ['.spine', '.mobile-header']
          .map(selector =>
            document.querySelector(selector)
          )
          .filter(header => {
            if (!header) return false;

            const style =
              window.getComputedStyle(header);

            return (
              style.display !== 'none' &&
              style.visibility !== 'hidden'
            );
          })
          .reduce(
            (bottom, header) =>
              Math.max(
                bottom,
                header.getBoundingClientRect().bottom
              ),
            0
          );

      const usableViewportTop =
        Math.max(
          viewportPadding,
          visibleHeaderBottom +
          viewportPadding
        );

      const spaceBelow =
        viewportHeight -
        buttonRect.bottom -
        viewportPadding;
      const spaceAbove =
        buttonRect.top -
        usableViewportTop;
      const openAbove =
        menuRect.height > spaceBelow &&
        spaceAbove > spaceBelow;

      if (openAbove) {
        menu.classList.add('is-flipped');
      }

      const availableHeight =
        Math.max(
          0,
          Math.floor(
            (openAbove ? spaceAbove : spaceBelow) -
            menuGap
          )
        );

      if (menuRect.height > availableHeight) {
        menu.style.maxHeight =
          availableHeight + 'px';
        menu.style.overflowY = 'auto';
      }

      button.setAttribute('aria-expanded', 'true');
    }

    const COMPASS_CREATE_PREVIEW_DRAFT_PREFIX =
      'atlas::compassCreatePreviewDraft::v1::';
    const COMPASS_CREATE_PREVIEW_DRAFT_MAX_AGE_MS =
      24 * 60 * 60 * 1000;

    function createCompassCreatePreviewDraftId() {
      try {
        if (
          window.crypto &&
          typeof window.crypto.randomUUID === 'function'
        ) {
          return window.crypto.randomUUID();
        }
      } catch { }

      return (
        Date.now().toString(36) +
        '-' +
        Math.random().toString(36).slice(2, 12)
      );
    }

    function collectCompassCreateDialogDraft(
      createMode = 'generate'
    ) {
      const dialog = document.getElementById(
        'owned-subject-dialog'
      );

      const state = ownedSubjectDialogState;

      if (
        !dialog ||
        state?.mode !== 'create'
      ) {
        return null;
      }

      const topicFocusInput =
        dialog.querySelector(
          '#compass-idea-topic-focus'
        );

      return {
        version: 1,
        createdAt: Date.now(),
        createMode:
          createMode === 'blank'
            ? 'blank'
            : 'generate',
        sessionId:
          String(state.sessionId || '').trim(),
        categoryId:
          String(state.categoryId || '').trim(),
        title:
          String(
            dialog.querySelector(
              '#owned-subject-dialog-input'
            )?.value || ''
          ).trim().slice(0, 120),
        languageLevel:
          String(
            dialog.querySelector(
              '#owned-subject-dialog-level'
            )?.value || 'b2'
          ).trim(),
        style:
          String(
            dialog.querySelector(
              '#owned-subject-dialog-style'
            )?.value || 'balanced'
          ).trim(),
        subjectSize:
          String(
            dialog.querySelector(
              '#owned-subject-dialog-size'
            )?.value || 'standard'
          ).trim(),
        languageSupport:
          String(
            dialog.querySelector(
              '#owned-subject-dialog-language-support'
            )?.value || 'key'
          ).trim(),
        brief:
          String(
            dialog.querySelector(
              '#owned-subject-dialog-brief'
            )?.value || ''
          ).trim().slice(0, 2400),
        ideaMode:
          String(state.ideaMode || '').trim(),
        topicFocus:
          String(
            topicFocusInput
              ? topicFocusInput.value
              : state.topicFocus || ''
          ).trim().slice(0, 240),
        suggestion:
          state.suggestion &&
          typeof state.suggestion === 'object'
            ? state.suggestion
            : null
      };
    }

    function storeCompassCreatePreviewDraft(
      createMode = 'generate'
    ) {
      const draft =
        collectCompassCreateDialogDraft(
          createMode
        );

      if (!draft) {
        return '';
      }

      const id =
        createCompassCreatePreviewDraftId();

      try {
        localStorage.setItem(
          COMPASS_CREATE_PREVIEW_DRAFT_PREFIX + id,
          JSON.stringify(draft)
        );

        return id;
      } catch {
        return '';
      }
    }

    function discardCompassCreatePreviewDraft(
      draftId
    ) {
      const id =
        String(draftId || '').trim();

      if (!id) return;

      try {
        localStorage.removeItem(
          COMPASS_CREATE_PREVIEW_DRAFT_PREFIX + id
        );
      } catch { }
    }

    function consumeCompassCreatePreviewDraft(
      draftId
    ) {
      const id =
        String(draftId || '').trim();

      if (!id) {
        return null;
      }

      let draft = null;

      try {
        const key =
          COMPASS_CREATE_PREVIEW_DRAFT_PREFIX + id;

        const raw =
          localStorage.getItem(key);

        localStorage.removeItem(key);

        draft = raw
          ? JSON.parse(raw)
          : null;
      } catch {
        return null;
      }

      if (
        !draft ||
        draft.version !== 1 ||
        !Number.isFinite(
          Number(draft.createdAt)
        ) ||
        Date.now() -
          Number(draft.createdAt) >
            COMPASS_CREATE_PREVIEW_DRAFT_MAX_AGE_MS
      ) {
        return null;
      }

      return draft;
    }

    async function requireAnonymousCreatePreviewAccess(
      createMode,
      trigger
    ) {
      const draftId =
        storeCompassCreatePreviewDraft(
          createMode
        );

      const access =
        await requireCompassSubjectCapability(
          'canCreateSubject',
          'create-subject',
          'continue-create-preview',
          {
            ...(draftId
              ? { draftId }
              : {})
          },
          trigger,
          'create'
        );

      if (access?.outcome === 'allowed') {
        discardCompassCreatePreviewDraft(
          draftId
        );

        if (
          ownedSubjectDialogState?.mode ===
          'create'
        ) {
          ownedSubjectDialogState
            .anonymousPreview = false;
        }

        return true;
      }

      if (access?.outcome !== 'auth-required') {
        discardCompassCreatePreviewDraft(
          draftId
        );
      }

      return compassSubjectCapabilityAllows(
        access,
        'Subject creation is unavailable right now.'
      );
    }

      const copy = dialog.querySelector(
        '#owned-subject-dialog-copy'
      );
      const field = dialog.querySelector(
        '#owned-subject-dialog-field'
      );
      const input = dialog.querySelector(
        '#owned-subject-dialog-input'
      );
      const fieldLabel = dialog.querySelector(
        '#owned-subject-dialog-field-label'
      );
      const createFields = dialog.querySelector(
        '#owned-subject-dialog-create-fields'
      );
      const error = dialog.querySelector(
        '#owned-subject-dialog-error'
      );
      const confirm = dialog.querySelector(
        '#owned-subject-dialog-confirm'
      );

      ownedSubjectDialogState = {
        mode: 'rename',
        subjectId: record.id
      };

      title.textContent = 'Rename subject';
      copy.textContent =
        'Change the name of this subject everywhere it appears in Atlas and Compass.';

      field.hidden = false;

      fieldLabel.textContent =
        'Subject title';

      input.value =
        getOwnedSubjectRecordTitle(record);

      input.placeholder = '';

      createFields.hidden = true;

      error.hidden = true;
      error.textContent = '';

      confirm.className = 'btn-primary';
      confirm.textContent = 'Save name';
      confirm.disabled = false;

      ownedSubjectDialogPreviousBodyOverflow =
        document.body.style.overflow;

      document.body.style.overflow = 'hidden';
      dialog.hidden = false;

      requestAnimationFrame(() => {
        input.focus();
        input.select();
      });
    }

    async function openOwnedSubjectDeleteDialog(
      subjectId,
      event,
      options = {}
    ) {
      event?.preventDefault();
      event?.stopPropagation();

      if (!options.skipCapabilityGate) {
        const access =
          await requireCompassSubjectCapability(
            'canEditSubject',
            'edit-subject',
            'delete-owned-subject',
            {
              subjectId: String(subjectId || '').trim()
            },
            event?.currentTarget || null
          );

        if (
          !compassSubjectCapabilityAllows(
            access,
            'Subject editing is unavailable right now.'
          )
        ) {
          return;
        }
      }

      ownedSubjectDialogReturnFocus =
        event?.currentTarget
          ?.closest('.subject-card-management')
          ?.querySelector('.subject-card-manage-btn') ||
        document.activeElement;

      closeOwnedSubjectMenus();

      const Subjects = window.AtlasTutorSubjects;

      if (
        !Subjects ||
        typeof Subjects.getSubject !== 'function'
      ) {
        showToast('My Subjects are unavailable.');
        return;
      }

      const record = await Subjects.getSubject(subjectId);

      if (!record) {
        showToast('That subject could not be found.');
        return;
      }

      const dialog = ensureOwnedSubjectDialog();
      const title = dialog.querySelector(
        '#owned-subject-dialog-title'
      );
      const copy = dialog.querySelector(
        '#owned-subject-dialog-copy'
      );
      const field = dialog.querySelector(
        '#owned-subject-dialog-field'
      );
      const createFields = dialog.querySelector(
        '#owned-subject-dialog-create-fields'
      );
      const error = dialog.querySelector(
        '#owned-subject-dialog-error'
      );
      const confirm = dialog.querySelector(
        '#owned-subject-dialog-confirm'
      );

      ownedSubjectDialogState = {
        mode: 'delete',
        subjectId: record.id
      };

      title.textContent = 'Delete subject?';
      copy.textContent =
        '“' +
        getOwnedSubjectRecordTitle(record) +
        '” will be permanently deleted from Atlas.';

      field.hidden = true;
      createFields.hidden = true;

      error.hidden = true;
      error.textContent = '';

      confirm.className = 'btn-danger';
      confirm.textContent = 'Delete subject';
      confirm.disabled = false;

      ownedSubjectDialogPreviousBodyOverflow =
        document.body.style.overflow;

      document.body.style.overflow = 'hidden';
      dialog.hidden = false;

      requestAnimationFrame(() => {
        confirm.focus();
      });
    }

    async function confirmOwnedSubjectDialog(
      createMode = 'generate',
      options = {}
    ) {
      const state = ownedSubjectDialogState;
      const dialog = document.getElementById(
        'owned-subject-dialog'
      );

      if (!state || !dialog) return;

      const Subjects = window.AtlasTutorSubjects;
      const input = dialog.querySelector(
        '#owned-subject-dialog-input'
      );

      const levelSelect = dialog.querySelector(
        '#owned-subject-dialog-level'
      );

      const styleSelect = dialog.querySelector(
        '#owned-subject-dialog-style'
      );

      const sizeSelect = dialog.querySelector(
        '#owned-subject-dialog-size'
      );

      const languageSupportSelect =
        dialog.querySelector(
          '#owned-subject-dialog-language-support'
        );

      const briefInput = dialog.querySelector(
        '#owned-subject-dialog-brief'
      );

      const error = dialog.querySelector(
        '#owned-subject-dialog-error'
      );

      const secondary = dialog.querySelector(
        '#owned-subject-dialog-secondary'
      );

      const confirm = dialog.querySelector(
        '#owned-subject-dialog-confirm'
      );

      if (!Subjects || !confirm) return;

      if (
        state.mode === 'create' &&
        state.upgradePrompt ===
          'free-exhausted' &&
        createMode !== 'blank'
      ) {
        await openCompassCreationUpgradeCheckout(
          dialog
        );
        return;
      }

      if (
        state.mode === 'create' &&
        state.upgradePrompt ===
          'pro-exhausted' &&
        createMode !== 'blank'
      ) {
        return;
      }

      if (state.mode === 'atlas-delete-original') {
        confirm.disabled = true;
        confirm.textContent = 'Deleting…';

        try {
          const id = String(state.registryId || '').trim();
          const subject = getAtlasOriginalSubject(id);
          const Curation = window.AtlasOriginalCuration;

          if (!id || !subject || subject.hasMyVersion) {
            throw new Error('Atlas Original is no longer eligible for deletion.');
          }

          if (!Curation || typeof Curation.deleteOriginal !== 'function') {
            throw new Error('Atlas Original curation is unavailable.');
          }

          if (!Curation.deleteOriginal(id)) {
            throw new Error('Delete persistence failed.');
          }

          await removeAtlasOriginalFromAllSessions(id);
          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Atlas Original deleted from your Atlas library.');
        } catch {
          error.hidden = false;
          error.textContent = 'Couldn’t delete this Atlas Original.';
          confirm.disabled = false;
          confirm.textContent = 'Delete Atlas Original';
        }

        return;
      }

      if (state.mode === 'atlas-restore-original') {
        confirm.disabled = true;
        confirm.textContent = 'Restoring…';

        try {
          const expectedRegistryId =
            String(state.registryId || '').trim();

          if (!expectedRegistryId) {
            throw new Error('Missing Atlas source identity.');
          }

          if (state.subjectId) {
            const record =
              typeof Subjects.getSubject === 'function'
                ? await Subjects.getSubject(state.subjectId)
                : null;

            const actualRegistryId =
              getOwnedAtlasSourceRegistryId(record);

            if (
              !record ||
              !actualRegistryId ||
              actualRegistryId !== expectedRegistryId
            ) {
              throw new Error('Atlas provenance could not be verified.');
            }

            const source =
              getAtlasOriginalSubject(actualRegistryId);

            if (!source) {
              throw new Error('The Atlas source is unavailable.');
            }

            if (source.hasMyVersion) {
              await restoreAtlasVersionFromHub(
                actualRegistryId
              );
            }

            await migrateOwnedSubjectSessionHomesToAtlas(
              state.subjectId,
              actualRegistryId
            );

            const ownedRegistryId =
              getOwnedSubjectRegistryId(state.subjectId);

            const deleted =
              await Subjects.deleteSubject(state.subjectId);

            if (!deleted) {
              throw new Error(
                'The owned subject could not be removed.'
              );
            }

            try {
              if (
                ownedRegistryId &&
                typeof Bridge.removeItem === 'function'
              ) {
                Bridge.removeItem(ownedRegistryId);
              }
            } catch { }
          } else {
            const source =
              getAtlasOriginalSubject(expectedRegistryId);

            if (!source || !source.hasMyVersion) {
              throw new Error('There is no My Version to restore.');
            }

            await restoreAtlasVersionFromHub(
              expectedRegistryId
            );
          }

          const Curation = window.AtlasOriginalCuration;
          if (Curation && typeof Curation.restore === 'function') {
            if (!Curation.restore(expectedRegistryId)) {
              throw new Error('Atlas source suppression could not be cleared.');
            }
          }

          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Atlas Original restored.');
        } catch (restoreError) {
          console.error(
            '[Compass Hub] Restore Atlas Original failed:',
            restoreError
          );

          error.hidden = false;
          error.textContent =
            'Couldn’t restore the Atlas Original.';
          confirm.disabled = false;
          confirm.textContent = 'Restore original';
        }

        return;
      }

      if (state.mode === 'atlas-rename') {
        const nextTitle = String(input?.value || '').trim();

        if (!nextTitle) {
          error.hidden = false;
          error.textContent = 'Give the subject a name.';
          input?.focus();
          return;
        }

        const Store = window.AtlasTutorContent;
        const subject = getAtlasOriginalSubject(state.registryId);

        if (!Store || typeof Store.saveVersion !== 'function' || !subject) {
          error.hidden = false;
          error.textContent = 'Couldn’t rename this subject.';
          return;
        }

        confirm.disabled = true;
        confirm.textContent = 'Saving…';

        try {
          const current = typeof Store.getVersion === 'function'
            ? await Store.getVersion(state.registryId)
            : null;

          const saved = await Store.saveVersion(
            state.registryId,
            {
              baseContentVersion:
                current?.baseContentVersion ||
                subject.contentVersion ||
                '',
              overrides: {
                'module.title': nextTitle
              },
              ...(current?.document
                ? { document: current.document }
                : {})
            }
          );

          if (!saved) throw new Error('Rename failed.');

          try {
            const registry = getRegistry();
            const existing = (registry.items || {})[state.registryId] || {
              registryId: state.registryId,
              world: COMPASS_ID,
              type: 'subject',
              status: 'available',
              launchUrl: subject.launchUrl
            };

            Bridge.upsertItem({
              ...existing,
              title: nextTitle,
              hasMyVersion: true
            });
          } catch { }

          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Subject renamed.');
        } catch {
          error.hidden = false;
          error.textContent = 'Couldn’t rename this subject.';
          confirm.disabled = false;
          confirm.textContent = 'Save name';
        }

        return;
      }

      if (state.mode === 'atlas-category-own') {
        const select = dialog.querySelector(
          '#owned-subject-dialog-session-subject'
        );

        const categoryId = String(select?.value || '').trim();

        if (!categoryId) {
          error.hidden = false;
          error.textContent = 'Choose a category.';
          return;
        }

        const registryId = state.registryId;
        closeOwnedSubjectDialog(false);
        runAtlasOriginalOwnershipAction(
          registryId,
          'own',
          null,
          { categoryId }
        );
        return;
      }

      if (state.mode === 'archive-restore') {
        const select = dialog.querySelector(
          '#owned-subject-dialog-session-subject'
        );

        const subjectId =
          String(select?.value || '').trim();

        if (!subjectId) {
          error.hidden = false;
          error.textContent =
            'Choose a subject to restore.';
          return;
        }

        confirm.disabled = true;
        confirm.textContent = 'Restoring…';

        try {
          const saved =
            await Subjects.setSubjectLibraryPlacement(
              subjectId,
              {
                archived: false
              }
            );

          if (!saved) {
            throw new Error(
              'Restore operation failed.'
            );
          }

          setOwnedSubjectRegistryArchived(
            subjectId,
            false
          );

          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Subject restored.');
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t restore this subject.';

          confirm.disabled = false;
          confirm.textContent = 'Restore subject';
        }

        return;
      }

      if (state.mode === 'orphan-remove') {
        confirm.disabled = true;
        confirm.textContent = 'Keeping…';

        try {
          const placed =
            await Subjects.setSubjectLibraryPlacement(
              state.subjectId,
              {
                libraryIncluded: true,
                archived: false
              }
            );

          if (!placed) {
            throw new Error(
              'Library placement failed.'
            );
          }

          const removed =
            await Subjects.removeSessionSubject(
              state.sessionId,
              {
                kind: 'my-subject',
                id: state.subjectId
              }
            );

          if (!removed) {
            throw new Error(
              'Session removal failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();

          showToast(
            'Kept in My Subjects.'
          );
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t move this subject to My Subjects.';

          confirm.disabled = false;
          confirm.textContent =
            'Keep in My Subjects';
        }

        return;
      }

      if (state.mode === 'category-move') {
        const select = dialog.querySelector(
          '#owned-subject-dialog-session-subject'
        );

        const categoryId =
          String(select?.value || '').trim();

        const categoryName =
          String(
            select?.selectedOptions?.[0]
              ?.textContent || ''
          ).trim();

        if (!categoryId) {
          error.hidden = false;
          error.textContent =
            'Choose a category.';
          return;
        }

        confirm.disabled = true;
        confirm.textContent = 'Moving…';

        try {
          const saved =
            await Subjects.setSubjectLibraryPlacement(
              state.subjectId,
              {
                libraryIncluded: true,
                categoryId
              }
            );

          if (!saved) {
            throw new Error(
              'Category movement failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();

          showToast(
            categoryName
              ? 'Moved to ' + categoryName + '.'
              : 'Subject moved.'
          );
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t move this subject.';

          confirm.disabled = false;
          confirm.textContent = 'Move subject';
        }

        return;
      }

      if (state.mode === 'session-add') {
        const select = dialog.querySelector(
          '#owned-subject-dialog-session-subject'
        );

        const selected =
          select?.selectedOptions?.[0];

        const kind =
          selected?.dataset?.kind || '';

        const id =
          String(selected?.value || '').trim();

        if (
          !id ||
          (
            kind !== 'my-subject' &&
            kind !== 'atlas-subject'
          )
        ) {
          error.hidden = false;
          error.textContent =
            'Choose a subject to add.';
          return;
        }

        confirm.disabled = true;
        confirm.textContent = 'Adding…';

        try {
          const session = getActiveSession();

          const saved =
            await Subjects.addSessionSubject(
              session.id,
              {
                kind,
                id
              }
            );

          if (!saved) {
            throw new Error(
              'Session subject assignment failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();

          showToast(
            'Added to ' +
            getActiveSessionSubjectCollectionTitle() +
            '.'
          );
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t add this subject.';
          confirm.disabled = false;
          confirm.textContent = 'Add subject';
        }

        return;
      }

      if (state.mode === 'category-delete') {
        confirm.disabled = true;
        confirm.textContent = 'Deleting…';

        try {
          const deleted =
            await Subjects.deleteLibraryCategory(
              state.categoryId
            );

          if (!deleted) {
            throw new Error(
              'Category deletion failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Category deleted.');
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t delete this category.';

          confirm.disabled = false;
          confirm.textContent =
            'Delete category';
        }

        return;
      }

      if (
        state.mode === 'category-create' ||
        state.mode === 'category-rename'
      ) {
        const nextName = String(
          input?.value || ''
        ).trim();

        if (!nextName) {
          error.hidden = false;
          error.textContent =
            'Give the category a name.';
          input?.focus();
          return;
        }

        confirm.disabled = true;
        confirm.textContent =
          state.mode === 'category-create'
            ? 'Creating…'
            : 'Saving…';

        try {
          const saved =
            state.mode === 'category-create'
              ? await Subjects.createLibraryCategory(
                nextName
              )
              : await Subjects.renameLibraryCategory(
                state.categoryId,
                nextName
              );

          if (!saved) {
            throw new Error(
              'Category operation failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();

          showToast(
            state.mode === 'category-create'
              ? 'Category created.'
              : 'Category renamed.'
          );
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t save this category. Check that the name is unique.';

          confirm.disabled = false;
          confirm.textContent =
            state.mode === 'category-create'
              ? 'Create category'
              : 'Save name';
        }

        return;
      }

      if (state.mode === 'create') {
        const nextTitle = String(
          input?.value || ''
        ).trim();

        if (!nextTitle) {
          error.hidden = false;
          error.textContent =
            'Give the subject a name.';
          input?.focus();
          return;
        }

        if (state.anonymousPreview) {
          const allowed =
            await requireAnonymousCreatePreviewAccess(
              createMode,
              confirm
            );

          if (!allowed) {
            return;
          }
        }

        const generateFullSubject =
          createMode !== 'blank';

        if (
          generateFullSubject &&
          !options.skipAICapabilityGate
        ) {
          const aiAccess =
            await requireCompassSubjectCapability(
              'canCreateWithAI',
              'capability',
              'create-subject-ai',
              { title: nextTitle },
              confirm
            );

          if (
            aiAccess?.outcome === 'limited' &&
            aiAccess?.reason === 'exhausted'
          ) {
            showCompassCreationExhausted(
              dialog,
              aiAccess
            );
            return;
          }

          if (
            !compassSubjectCapabilityAllows(
              aiAccess,
              'AI-assisted subject creation is unavailable right now.'
            )
          ) {
            return;
          }
        }

        const allowedLevels = new Set([
          'a1-a2',
          'b1',
          'b2',
          'c1-plus'
        ]);

        const allowedStyles = new Set([
          'balanced',
          'playful',
          'relaxed',
          'thoughtful',
          'practical'
        ]);

        const allowedLanguageSupport = new Set([
          'off',
          'key',
          'all'
        ]);

        const generationContext = {
          version: 1,

          ideaMode:
            String(
              state.ideaMode || ''
            ).trim(),

          languageLevel:
            allowedLevels.has(levelSelect?.value)
              ? levelSelect.value
              : 'b2',

          subjectSize:
            sizeSelect?.value === 'compact'
              ? 'compact'
              : 'standard',

          languageSupport:
            allowedLanguageSupport.has(
              languageSupportSelect?.value
            )
              ? languageSupportSelect.value
              : 'key',

          style:
            allowedStyles.has(styleSelect?.value)
              ? styleSelect.value
              : 'balanced',

          premise:
            state.suggestion &&
            String(
              state.suggestion.title || ''
            ).trim() === nextTitle
              ? String(
                state.suggestion.premise || ''
              ).trim()
              : '',

          source:
            state.suggestion &&
            String(
              state.suggestion.title || ''
            ).trim() === nextTitle &&
            state.suggestion.source &&
            typeof state.suggestion.source ===
              'object' &&
            !Array.isArray(
              state.suggestion.source
            )
              ? state.suggestion.source
              : null,

          brief: String(
            briefInput?.value || ''
          ).trim()
        };

        if (
          typeof Bridge.setSubjectLanguageSupport ===
            'function'
        ) {
          Bridge.setSubjectLanguageSupport(
            generationContext.languageSupport
          );
        }

        const targetSessionId =
          String(state.sessionId || '').trim();

        const Structured =
          window.AtlasStructuredSubject;

        if (
          !Structured ||
          typeof Structured.createBlankDocument !== 'function' ||
          typeof Structured.validateDocument !== 'function'
        ) {
          error.hidden = false;
          error.textContent =
            'Subject creation is unavailable.';
          return;
        }

        const document =
          Structured.createBlankDocument({
            title: nextTitle
          });

        if (generateFullSubject) {
          document.subjectCopy.cover.hook =
            'Finding the right angle…';
        }

        const validation =
          Structured.validateDocument(document);

        if (!validation.valid) {
          console.error(
            '[Compass] Blank Structured Subject validation failed:',
            validation.errors
          );

          error.hidden = false;
          error.textContent =
            'Couldn’t prepare this subject.';
          return;
        }

        confirm.disabled = true;

        confirm.textContent =
          generateFullSubject
            ? 'Preparing…'
            : 'Create subject';

        if (secondary) {
          secondary.disabled = true;

          if (!generateFullSubject) {
            secondary.textContent = 'Creating…';
          }
        }

        window.AtlasAnalytics?.subjectCreateAttempt({
          creationMode:
            generateFullSubject
              ? 'generate'
              : 'create'
        });

        /*
         * Leave the modal/hub immediately. Subject persistence can take long
         * enough for the blank registry projection to become visible behind
         * the dialog, which makes creation feel like a UI glitch.
         */
        setCompassResumeTransition(
          generateFullSubject
            ? 'generate'
            : 'blank'
        );

        try {
          const created =
            await Subjects.createSubject({
              format: 'structured',

              metadata: {
                title: nextTitle,
                navTitle: nextTitle,
                description: '',
                coverImage: '',
                generationContext,
                ...(generateFullSubject
                  ? {
                    aiBuildStatus: 'building'
                  }
                  : {})
              },

              libraryPlacement: state.sessionId
                ? {
                  libraryIncluded: false
                }
                : state.categoryId
                  ? {
                    libraryIncluded: true,
                    categoryId: state.categoryId
                  }
                  : {
                    libraryIncluded: true
                  },

              document,

              provenance: {
                kind:
                  generateFullSubject
                    ? 'ai-subject-build'
                    : 'blank-structured'
              }
            });

          if (!created) {
            throw new Error(
              'Create did not return a subject.'
            );
          }

          if (targetSessionId) {
            const promoted =
              await Subjects.addSessionSubject(
                targetSessionId,
                {
                  kind: 'my-subject',
                  id: created.id
                }
              );

            if (!promoted) {
              await Subjects.deleteSubject(
                created.id
              );

              throw new Error(
                'Created subject could not be added to the session.'
              );
            }
          }

          syncOwnedSubjectRegistryProjection(
            created
          );

          window.AtlasAnalytics?.subjectCreate({
            creationMode:
              generateFullSubject
                ? 'generate'
                : 'create'
          });

          const launchUrl =
            getOwnedSubjectLaunchUrl(
              created.id,
              {
                authoringIntent:
                  generateFullSubject
                    ? 'generate'
                    : 'edit'
              }
            );

          if (!launchUrl) {
            throw new Error(
              'Created subject has no launch URL.'
            );
          }

          closeOwnedSubjectDialog(false);
          navigateTo(launchUrl);
        } catch (creationError) {
          console.error(
            '[Compass] Subject creation failed:',
            creationError
          );

          clearCompassResumeTransition();

          if (state.silentResume) {
            state.silentResume = false;

            ownedSubjectDialogPreviousBodyOverflow =
              document.body.style.overflow;

            document.body.style.overflow =
              'hidden';

            dialog.hidden = false;

            requestAnimationFrame(() => {
              input?.focus();
            });
          }

          const creationLimitReached =
            String(
              creationError?.message || ''
            ).includes(
              'ATLAS_AI_CREATION_LIMIT_REACHED'
            );

          if (creationLimitReached) {
            try {
              await window.AtlasAccount
                ?.refreshEntitlement?.();
            } catch { }

            const access =
              window.AtlasAccess?.getState?.() ||
              null;

            if (
              showCompassCreationExhausted(
                dialog,
                {
                  outcome: 'limited',
                  reason: 'exhausted',
                  allowance:
                    access?.creationAllowance ||
                    null
                }
              )
            ) {
              return;
            }
          }

          error.hidden = false;
          error.textContent =
            'Couldn’t create this subject.';

          confirm.disabled = false;
          confirm.textContent = 'Create subject';

          if (secondary) {
            secondary.disabled = false;
            secondary.textContent = 'Start blank';
          }
        }

        return;
      }

      if (state.mode === 'rename') {
        const nextTitle = String(
          input?.value || ''
        ).trim();

        if (!nextTitle) {
          error.hidden = false;
          error.textContent =
            'Give the subject a name.';
          input?.focus();
          return;
        }

        confirm.disabled = true;
        confirm.textContent = 'Saving…';

        try {
          const saved = await Subjects.renameSubject(
            state.subjectId,
            nextTitle
          );

          if (!saved) {
            throw new Error(
              'Rename did not return a subject.'
            );
          }

          syncOwnedSubjectRegistryProjection(saved);
          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Subject renamed.');
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t rename this subject.';
          confirm.disabled = false;
          confirm.textContent = 'Save name';
        }

        return;
      }

      if (state.mode === 'delete') {
        confirm.disabled = true;
        confirm.textContent = 'Deleting…';

        try {
          const registryId =
            getOwnedSubjectRegistryId(
              state.subjectId
            );

          const deleted =
            await Subjects.deleteSubject(
              state.subjectId
            );

          if (!deleted) {
            throw new Error(
              'Delete operation failed.'
            );
          }

          try {
            if (
              registryId &&
              typeof Bridge.removeItem === 'function'
            ) {
              Bridge.removeItem(registryId);
            }
          } catch { }

          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Subject deleted.');
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t delete this subject.';
          confirm.disabled = false;
          confirm.textContent = 'Delete subject';
        }
      }

    function buildHubCoverSearchSeed(record) {
      const title = getOwnedSubjectRecordTitle(record);
      const context = [
        title,
        record?.metadata?.description,
        record?.document?.module?.catalogDescription
      ]
        .map(value => String(value || '').trim())
        .filter(Boolean)
        .join(' ')
        .toLowerCase();

      if (/(movie|film|cinema|screen|television|tv series|documentary|actor|actress|director)/.test(context)) {
        return title + ' movie wallpaper';
      }

      if (/(album|song|music|musician|singer|band|concert|festival)/.test(context)) {
        return title + ' music photography';
      }

      if (/(city|country|island|beach|mountain|forest|desert|ocean|river|lake|village|landscape|travel)/.test(context)) {
        return title + ' landscape photography';
      }

      if (/(history|historical|civilization|civilisation|ancient|empire)/.test(context)) {
        return title + ' historical art';
      }

      if (/(science|nature|animal|ocean|space|planet|biology|physics|environment)/.test(context)) {
        return title + ' nature photography';
      }

      return title + ' photography';
    }

        status.textContent = 'No images found. Try another search.';
      } else if (!state.photos.length) {
        status.textContent = hubCoverPickerProvider === 'web'
          ? 'Search Web images for a cover.'
