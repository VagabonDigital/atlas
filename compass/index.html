              ', ' +
              jsArg(subject.moveSubjectId) +
              ', ' +
              jsArg(subject.moveLaterTargetKind) +
              ', ' +
              jsArg(subject.moveLaterTargetId) +
              ', 1, event)">Move later</button>'
            )
            : '') +

          (
            subject.canMoveCategory
              ? (
                '<button type="button" role="menuitem" ' +
                'onclick="openMoveOwnedSubjectCategoryDialog(' +
                jsArg(subject.subjectId) +
                ', event)">Move to category…</button>'
              )
              : ''
          ) +

          (
            subject.isSessionRelevant &&
            !subject.libraryIncluded
              ? (
                '<button type="button" role="menuitem" ' +
                'onclick="addOwnedSubjectToLibrary(' +
                jsArg(subject.subjectId) +
                ', event)">Add to My Subjects</button>'
              )
              : ''
          ) +

          (
            subject.libraryIncluded &&
            subject.hasSessionHome
              ? (
                '<button type="button" role="menuitem" ' +
                'onclick="removeOwnedSubjectFromLibrary(' +
                jsArg(subject.subjectId) +
                ', event)">Remove from My Subjects</button>'
              )
              : ''
          ) +

          (subject.isSessionRelevant
            ? (
              '<button type="button" role="menuitem" ' +
              'onclick="removeOwnedSubjectFromActiveSession(' +
              jsArg(subject.subjectId) +
              ', event)">' +
              'Remove from ' +
              escHtml(
                getActiveSessionSubjectCollectionTitle()
              ) +
              '</button>'
            )
            : (
              '<button type="button" role="menuitem" ' +
              'onclick="addOwnedSubjectToActiveSession(' +
              jsArg(subject.subjectId) +
              ', event)">' +
              'Add to ' +
              escHtml(
                getActiveSessionSubjectCollectionTitle()
              ) +
              '</button>'
            )) +

          (subject.provenance &&
            subject.provenance.sourceWorld === COMPASS_ID &&
            subject.provenance.sourceSubjectId
              ? (
                '<button type="button" role="menuitem" ' +
                'onclick="openRestoreAtlasOriginalHubDialog({registryId:' +
                jsArg(
                  subject.provenance.sourceContentId ||
                  (COMPASS_ID + ':' + subject.provenance.sourceSubjectId)
                ) +
                ',subjectId:' +
                jsArg(subject.subjectId) +
                ',event:event})">Restore Atlas Original</button>'
              )
              : '') +


          '<button type="button" role="menuitem" ' +
          'onclick="archiveOwnedSubject(' +
          jsArg(subject.subjectId) +
          ', event)">Archive</button>' +

          '<button class="is-danger" type="button" role="menuitem" ' +
          'onclick="openOwnedSubjectDeleteDialog(' +
          jsArg(subject.subjectId) +
          ', event)">Delete</button>' +

          '</div>' +
          '</div>';

        return (
          '<article class="' +
          cardClasses +
          ' subject-card--owned" ' +
          'style="' +
          progressStyle +
          '">' +

          '<a class="subject-card-open-layer" ' +
          'href="' +
          escHtml(subject.launchUrl) +
          '" ' +
          'aria-label="' +
          actionLabel +
          '"></a>' +

          managementHtml +
          cardContents +
          '</article>'
        );
      }

      if (!subject.isOwned && subject.registryId) {
        const managementHtml =
          getStoredCompassAccountUserId()
            ? (
              '<div class="subject-card-management">' +

          '<button class="subject-card-manage-btn" ' +
          'type="button" ' +
          'aria-label="' +
          escHtml('Manage ' + subject.title) +
          '" aria-haspopup="menu" aria-expanded="false" ' +
          'onclick="toggleOwnedSubjectMenu(this, event)">' +
          '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
          '<circle cx="3.2" cy="8" r="1.15" fill="currentColor"/>' +
          '<circle cx="8" cy="8" r="1.15" fill="currentColor"/>' +
          '<circle cx="12.8" cy="8" r="1.15" fill="currentColor"/>' +
          '</svg>' +
          '</button>' +

          '<div class="subject-card-menu" role="menu" data-order-scope="' +
          escHtml(subject.moveScope || '') +
          '" hidden>' +

          (subject.hasMyVersion
            ? '<div class="subject-card-menu-meta">My Version</div>'
            : '') +

          '<button type="button" role="menuitem" onclick="editAtlasOriginal(' +
          jsArg(subject.registryId) +
          ', event)">Edit subject</button>' +

          '<button type="button" role="menuitem" onclick="openAtlasSubjectRenameDialog(' +
          jsArg(subject.registryId) +
          ', event)">Rename</button>' +

          '<button type="button" role="menuitem" onclick="runAtlasOriginalOwnershipAction(' +
          jsArg(subject.registryId) +
          ', \'duplicate\', event)">Duplicate</button>' +

          (subject.canMoveEarlier
            ? (
              '<button type="button" role="menuitem" onclick="moveShelfSubject(' +
              jsArg(subject.moveScope) + ', ' +
              jsArg(subject.moveSubjectKind) + ', ' +
              jsArg(subject.moveSubjectId) + ', ' +
              jsArg(subject.moveEarlierTargetKind) + ', ' +
              jsArg(subject.moveEarlierTargetId) +
              ', -1, event)">Move earlier</button>'
            )
            : '') +

          (subject.canMoveLater
            ? (
              '<button type="button" role="menuitem" onclick="moveShelfSubject(' +
              jsArg(subject.moveScope) + ', ' +
              jsArg(subject.moveSubjectKind) + ', ' +
              jsArg(subject.moveSubjectId) + ', ' +
              jsArg(subject.moveLaterTargetKind) + ', ' +
              jsArg(subject.moveLaterTargetId) +
              ', 1, event)">Move later</button>'
            )
            : '') +

          (subject.canMoveAtlasCategory
            ? (
              '<button type="button" role="menuitem" onclick="openMoveAtlasSubjectCategoryDialog(' +
              jsArg(subject.registryId) +
              ', event)">Move to category…</button>'
            )
            : '') +

          '<button type="button" role="menuitem" onclick="runAtlasOriginalOwnershipAction(' +
          jsArg(subject.registryId) +
          ', \'own\', event)">Add to My Subjects</button>' +

          (subject.isSessionRelevant
            ? (
              '<button type="button" role="menuitem" onclick="removeAtlasSubjectFromActiveSession(' +
              jsArg(subject.registryId) +
              ', event)">Remove from ' +
              escHtml(getActiveSessionSubjectCollectionTitle()) +
              '</button>'
            )
            : (
              '<button type="button" role="menuitem" onclick="addAtlasSubjectToActiveSession(' +
              jsArg(subject.registryId) +
              ', event)">Add to ' +
              escHtml(getActiveSessionSubjectCollectionTitle()) +
              '</button>'
            )) +

          (subject.hasMyVersion
            ? (
              '<button type="button" role="menuitem" onclick="openRestoreAtlasOriginalHubDialog({registryId:' +
              jsArg(subject.registryId) +
              ',event:event})">Restore Atlas Original</button>'
            )
            : (
              '<button type="button" role="menuitem" onclick="archiveAtlasOriginal(' +
              jsArg(subject.registryId) +
              ', event)">Archive</button>' +
              '<button class="is-danger" type="button" role="menuitem" onclick="openAtlasOriginalDeleteDialog(' +
              jsArg(subject.registryId) +
              ', event)">Delete</button>'
            )) +

          '</div>' +
          '</div>'
            )
            : '';

        return (
          '<article class="' +
          cardClasses +
          ' subject-card--owned" style="' +
          progressStyle +
          '">' +
          '<a class="subject-card-open-layer" href="' +
          escHtml(subject.launchUrl) +
          '" aria-label="' +
          actionLabel +
          '"></a>' +
          managementHtml +
          cardContents +
          '</article>'
        );
      }

      return (
        '<a class="' +
        cardClasses +
        '" ' +

        'href="' +
        escHtml(subject.launchUrl) +
        '" ' +

        'style="' +
        progressStyle +
        '" ' +

        'aria-label="' +
        actionLabel +
        '">' +

        cardContents +
        '</a>'
      );
    }

    function renderEmptyLibrary() {
      return (
        '<div class="empty-library">' +
        '<div class="empty-library-icon">' +
        '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
        '</div>' +
        '<h2>No subjects available</h2>' +
        '<p>Compass could not find any playable subjects on this device.</p>' +
        '</div>'
      );
    }

    /* ================================================================
       DRAWER
       ================================================================ */

    function openDrawer() {
      renderDrawerHubNav();
      const overlay = document.getElementById('drawer-overlay');
      overlay.style.display = 'block';
      document.getElementById('drawer').classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(() => overlay.classList.add('open'), 10);
    }
    function closeDrawer() {
      const overlay = document.getElementById('drawer-overlay');
      overlay.classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => { overlay.style.display = ''; }, 300);
    }

    /* ================================================================
       SESSION MODAL
       ================================================================ */

    function openSessionPanel(trigger = document.activeElement) {
      const Panel = window.AtlasSessionPanel;

      if (!Panel) return;

      if (
        !getStoredCompassAccountUserId() &&
        typeof Panel.openCreateLearner ===
          'function'
      ) {
        Panel.openCreateLearner(trigger);
        return;
      }

      Panel.open(trigger);
    }

    /* ================================================================
       GLOBAL KEYS
       ================================================================ */

    document.addEventListener('click', e => {
      if (!e.target.closest('.subject-card-management')) {
        closeOwnedSubjectMenus();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.defaultPrevented) return;

      if (e.key === 'Escape') {
        const coverPicker =
          document.getElementById(
            'hub-cover-picker-dialog'
          );

        if (
          coverPicker &&
          !coverPicker.hidden
        ) {
          closeHubCoverPicker();
          return;
        }

        const artworkStudio =
          document.getElementById(
            'subject-artwork-studio-backdrop'
          );

        if (
          artworkStudio &&
          !artworkStudio.hidden
        ) {
          closeSubjectArtworkStudio();
          return;
        }

        const ownedDialog =
          document.getElementById(
            'owned-subject-dialog'
          );

        if (ownedDialog && !ownedDialog.hidden) {
          closeOwnedSubjectDialog();
          return;
        }

        if (closeOwnedSubjectMenus()) return;
        if (window.AtlasSessionPanel && AtlasSessionPanel.isOpen()) return;
        if (document.getElementById('drawer').classList.contains('open')) { closeDrawer(); return; }
      }
    });

    /* ================================================================
       LIVE REFRESH
       Background state notifications share one repaint path. Rendering is
       deliberately read-only: it must never register/write persistent state.
       ================================================================ */

    let hubRenderQueued = false;
    let hubRenderPromise = Promise.resolve();
    let queuedHubRenderSources = [];

    function getHubRenderSource(trigger) {
      if (typeof trigger === 'string') {
        return trigger;
      }

      if (trigger?.type) {
        const detailSource =
          String(
            trigger?.detail?.source ||
            ''
          ).trim();

        return detailSource
          ? trigger.type +
            ':' +
            detailSource
          : trigger.type;
      }

      return 'direct';
    }

    function requestHubRender(trigger = null) {
      if (!Bridge) return Promise.resolve();

      const source =
        getHubRenderSource(trigger);

      queuedHubRenderSources.push(
        source
      );

      CompassHoverForensics.log(
        'render-request',
        {
          source,
          queued:
            hubRenderQueued
        }
      );

      if (hubRenderQueued) {
        return hubRenderPromise;
      }

      hubRenderQueued = true;

      let resolveRender;
      hubRenderPromise = new Promise(resolve => {
        resolveRender = resolve;
      });

      window.requestAnimationFrame(async () => {
        hubRenderQueued = false;

        const diagnosticSource =
          queuedHubRenderSources
            .splice(0)
            .join(',');

        try {
          await renderHub({
            diagnosticSource
          });
        } finally {
          resolveRender();
        }
      });

      return hubRenderPromise;
    }

    window.requestCompassHubRender = requestHubRender;

    window.addEventListener(
      'atlas:compass-hub-refresh-request',
      requestHubRender
    );

    window.addEventListener(
      'atlas:compass-cloud-authority-ready',
      event => {
        syncCompassCloudAuthorityState();
        requestHubRender(event);
      }
    );

    async function handleSubjectRuntimeMessage(
      event
    ) {
      const message =
        event?.detail;

      const subjectId =
        String(
          message?.subjectId || ''
        ).trim();

      if (!subjectId) return;

      if (
        message.type === 'build-heartbeat'
      ) {
        const wasLive =
          ownedSubjectBuildLiveness
            .get(subjectId)
            ?.live === true;

        noteOwnedSubjectBuildLiveness(
          subjectId,
          true
        );

        if (!wasLive) {
          requestHubRender(event);
        }

        return;
      }

      if (message.type === 'build-stop') {
        noteOwnedSubjectBuildLiveness(
          subjectId,
          false
        );

        requestHubRender(event);
        return;
      }

      if (
        message.type !==
          'subject-changed'
      ) {
        return;
      }

      if (
        message.detail?.change ===
          'committed'
      ) {
        try {
          await window.AtlasCloudCache
            ?.refreshOwnedSubjectSummaries
            ?.();
        } catch (error) {
          console.warn(
            '[Compass] Cross-tab subject refresh failed:',
            error
          );
        }

        window.AtlasTutorSubjectsCloudAuthority
          ?.refresh?.();
      }

      requestHubRender(event);
    }

    window.addEventListener(
      'atlas:subject-runtime-message',
      handleSubjectRuntimeMessage
    );

    window.addEventListener(
      'atlas:compass-hub-cache-refreshed',
      requestHubRender
    );

    function refresh(event = null) {
      if (!Bridge) return;
      const mode = Bridge.applyAppearanceMode(Bridge.readAppearanceMode());
      updateAppearanceButtons(mode);
      requestHubRender(event || 'refresh');
    }

    window.addEventListener('atlas:session-change', refresh);
    window.addEventListener('atlas:appearance-change', e => {
      const mode = (e.detail && e.detail.mode) || Bridge.readAppearanceMode();
      updateAppearanceButtons(mode);
    });
    window.addEventListener('focus', refresh);
    window.addEventListener('pageshow', refresh);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
    window.addEventListener('storage', e => {
      if (!e || !e.key) return;
      const k = e.key;
      if (k === Bridge.keys.appearance || k === Bridge.keys.appearanceBySession) {
        const mode = Bridge.applyAppearanceMode(Bridge.readAppearanceMode());
        updateAppearanceButtons(mode);
        return;
      }

      if (
        k === 'atlas::sessions' ||
        k === 'atlas::registry' ||
        k === 'learning::ledger' ||
        k.startsWith('atlas::tutorSubjects::subject::') ||
        k.startsWith('atlas::tutorSubjects::sessionSubjects::')
      ) {
        refresh();
      }
    });

    /* ================================================================
       INIT
       ================================================================ */

    let localPresentationInitStarted = false;
    let localPresentationScopeWaitInstalled = false;

    function waitForLocalPresentationScope() {
      if (localPresentationScopeWaitInstalled) {
        return;
      }

      localPresentationScopeWaitInstalled = true;

      const retry = () => {
        if (!isLocalPresentationScopeReady()) {
          return;
        }

        window.removeEventListener(
          'atlas:persistence-scope-change',
          retry
        );

        window.removeEventListener(
          'atlas:account-change',
          retry
        );

        localPresentationScopeWaitInstalled = false;
        void init();
      };

      window.addEventListener(
        'atlas:persistence-scope-change',
        retry
      );

      window.addEventListener(
        'atlas:account-change',
        retry
      );
    }

    function markLocalPresentationReady(source) {
      const root = document.documentElement;

      if (
        root.dataset.atlasLocalPresentationReady ===
        'true'
      ) {
        return;
      }

      root.dataset.atlasLocalPresentationReady =
        'true';
      root.dataset.atlasCompassFirstPaintReady =
        'true';

      try {
        window.dispatchEvent(
          new CustomEvent(
            'atlas:local-presentation-ready',
            {
              detail: {
                hub: 'compass',
                source:
                  String(source || 'local')
              }
            }
          )
        );

        window.dispatchEvent(
          new Event(
            'atlas:compass-first-paint-ready'
          )
        );
      } catch { }
    }

    async function init() {
      if (localPresentationInitStarted) {
        return;
      }

      if (!isLocalPresentationScopeReady()) {
        waitForLocalPresentationScope();
        return;
      }

      localPresentationInitStarted = true;

      if (!Bridge) {
        markLocalPresentationReady('error');
        return;
      }

      syncCompassCloudAuthorityState();

      // Registration belongs to startup, not rendering. The registry layer is
      // idempotent, so this is a safe fallback if its own bootstrap ran early.
      registerWithBridge();

      const mode = Bridge.readAppearanceMode();
      Bridge.applyAppearanceMode(mode);
      updateAppearanceButtons(mode);
      setSessionLabels();
      renderSpineHubNav();
      renderDrawerHubNav();

      if (window.AtlasSearch && typeof AtlasSearch.init === 'function') {
        AtlasSearch.init({
          activeHubId: 'compass',
          atlasUrl: '../index.html',
          compassUrl: './index.html',
          arcadeUrl: '../arcade/index.html'
        });
      }

      AtlasSessionPanel.mount({
        root: '#atlas-session-panel-root',
        initialView: 'manage'
      });

      void installAccountLibraryResume();
      void installSubjectCapabilityResume();

      const initialSnapshot =
        getCompassInitialAccountSnapshot();

      /*
       * A coherent account-scoped presentation snapshot owns the first
       * frame even if cloud authority happened to finish loading during
       * parsing. This makes cached-first rendering deterministic.
       */
      await renderHub({
        initialSnapshot,
        diagnosticSource: 'initial'
      });

      /*
       * Cached-first rendering must not leave Atlas's registry projection
       * behind the canonical owned-subject record. If cloud authority was
       * already ready before the initial snapshot render, no later ready
       * event is guaranteed to fire, so reconcile once from authoritative
       * subject data. When authority is still pending, the existing
       * atlas:compass-cloud-authority-ready listener owns that rerender.
       */
      if (
        initialSnapshot &&
        getStoredCompassAccountUserId() &&
        !isCompassCloudAuthorityPending()
      ) {
        void requestHubRender(
          'initial-authority-reconcile'
        );
      }

      markLocalPresentationReady(
        initialSnapshot
          ? 'account-snapshot'
          : 'bridge'
      );
    }

    void init();
  </script>
</body>

</html>
