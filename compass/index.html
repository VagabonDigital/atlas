    /* ================================================================
       NAVIGATION
       Matches Atlas hub navigation, adapted only for Compass host IDs.
       ================================================================ */

    function navigateTo(url) {
      if (!url) {
        showToast('That destination is not available on this device yet.');
        return;
      }

      if (window.AtlasSearch && typeof AtlasSearch.navigateTo === 'function') {
        AtlasSearch.navigateTo(url);
        return;
      }

      window.location.href = url;
    }

    function resolveWorld(reg, worldId) {
      const worlds = reg.worlds || {};
      if (worlds[worldId]) return worlds[worldId];

      return Object.values(worlds).find(w =>
        w && (w.registryId === worldId || w.id === worldId || w.world === worldId)
      ) || null;
    }

    function worldHasItems(reg, worldId) {
      const prefix = worldId + ':';
      return Object.keys(reg.items || {}).some(k => k.indexOf(prefix) === 0);
    }

    function getWorldLaunchUrl(reg, worldId) {
      if (worldId === ARCADE_ID) return '../arcade/index.html';

      const w = resolveWorld(reg, worldId);
      return (w && w.launchUrl) ? w.launchUrl : null;
    }

    function isWorldAvailable(reg, worldId) {
      return !!getWorldLaunchUrl(reg, worldId);
    }

    function openWorld(worldId) {
      const reg = getRegistry();
      const url = getWorldLaunchUrl(reg, worldId);

      if (url) {
        navigateTo(url);
        return;
      }

      if (worldId === COMPASS_ID && worldHasItems(reg, COMPASS_ID)) {
        showToast('Compass is registered, but its hub is not linked on this device yet.');
        return;
      }

      showToast('This world is coming soon.');
    }

    function isHubAvailable(hub, reg) {
      if (!hub) return false;
      if (hub.alwaysAvailable) return true;

      if (hub.worldId === COMPASS_ID) {
        return isWorldAvailable(reg, COMPASS_ID) || worldHasItems(reg, COMPASS_ID);
      }

      if (hub.worldId === ARCADE_ID) {
        return isWorldAvailable(reg, ARCADE_ID);
      }

      return false;
    }

    function openHub(hubId) {
      const hub = HUB_NAV[hubId];
      if (!hub) return;

      if (hub.id === ACTIVE_HUB_ID) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (hub.worldId) {
        openWorld(hub.worldId);
        return;
      }

      if (hub.launchUrl) {
        navigateTo(hub.launchUrl);
        return;
      }

      showToast('That destination is not available yet.');
    }

    function renderSpineHubNav() {
      const reg = getRegistry();
      const host = document.getElementById('spine-hub-nav');
      if (!host) return;

      host.querySelectorAll('[data-hub-id]').forEach(button => {
        const hubId = button.dataset.hubId;
        const hub = HUB_NAV[hubId];

        if (!hub) return;

        const active = hub.id === ACTIVE_HUB_ID;
        const available = isHubAvailable(hub, reg);

        button.classList.toggle('is-active', active);

        if (active) {
          button.setAttribute('aria-current', 'page');
          button.removeAttribute('aria-disabled');
          button.removeAttribute('onclick');
          button.title = hub.name;
          return;
        }

        button.removeAttribute('aria-current');
        button.title = available
          ? 'Open ' + hub.name
          : hub.name + ' — coming soon';

        if (available) {
          button.removeAttribute('aria-disabled');
          button.setAttribute('onclick', "openHub('" + hub.id + "')");
        } else {
          button.setAttribute('aria-disabled', 'true');
          button.removeAttribute('onclick');
        }
      });
    }

    function renderDrawerHubNav() {
      const reg = getRegistry();
      const host = document.getElementById('drawer-hub-nav');
      if (!host) return;

      host.innerHTML = Object.values(HUB_NAV).map(hub => {
        const active = hub.id === ACTIVE_HUB_ID;
        const available = isHubAvailable(hub, reg);
        const disabledAttr = available ? '' : ' aria-disabled="true"';
        const activeClass = active ? ' is-active' : '';
        const onclick = available ? ' onclick="closeDrawer();openHub(\'' + hub.id + '\')"' : '';

        return '<button class="drawer-nav-item' + activeClass + '"' +
          disabledAttr +
          onclick +
          (active ? ' aria-current="page"' : '') +
          '>' +
          hub.smallIcon +
          escHtml(hub.name) +
          (available ? '' : '<span class="nav-soon">Soon</span>') +
          '</button>';
      }).join('');
    }

    let toastTimer = null;
    function showToast(text) {
      let el = document.getElementById('hub-toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'hub-toast';
        el.className = 'hub-toast';
        el.setAttribute('role', 'status');
        document.body.appendChild(el);

      el.textContent = text;
      requestAnimationFrame(() => el.classList.add('visible'));

      toastTimer = setTimeout(() => el.classList.remove('visible'), 3200);

    function getOwnedSubjectRegistryId(subjectId) {
      const id = String(subjectId || '').trim();

      if (!id) return '';

      return typeof Bridge.getContentRegistryId === 'function'
        ? Bridge.getContentRegistryId(COMPASS_ID, id)
        : COMPASS_ID + ':' + id;
    }

    function getOwnedSubjectRecordTitle(record) {
      return String(
        record?.metadata?.title ||
        record?.document?.module?.title ||
        'Untitled Subject'
      ).trim() || 'Untitled Subject';
    }

    function syncOwnedSubjectRegistryProjection(record) {
      if (!record?.id) return;

      try {
        const registryId =
          getOwnedSubjectRegistryId(record.id);

        const registry = getRegistry();
        const existing =
          (registry.items || {})[registryId] || null;

        const metadata = record.metadata || {};
        const module = record.document?.module || {};

        const title = getOwnedSubjectRecordTitle(record);

        const navTitle = String(
          metadata.navTitle ||
          module.navTitle ||
          title
        ).trim() || title;

        const description = String(
          metadata.description ||
          module.catalogDescription ||
          ''
        ).trim();

        const coverImage = String(
          metadata.coverImage ||
          module.bgImage ||
          ''
        ).trim();

        const contentVersion =
          'owned-r' +
          Math.max(
            1,
            Math.floor(Number(record.revision) || 1)
          );

        const launchUrl =
          getOwnedSubjectLaunchUrl(record.id);

        const projection = {
          registryId,
          world: COMPASS_ID,
          type: 'subject',
          schemaVersion: Math.max(
            1,
            Math.floor(
              Number(record.document?.schemaVersion) || 1
            )
          ),
          id: record.id,
          title,
          navTitle,
          description,
          hook: description,
          coverImage,
          contentVersion,
          ownershipKind: 'my-subject',
          hasMyVersion: false,
          status: 'available',
          launchUrl
        };

        const projectionKeys = [
          'world',
          'type',
          'schemaVersion',
          'id',
          'title',
          'navTitle',
          'description',
          'hook',
          'coverImage',
          'contentVersion',
          'ownershipKind',
          'hasMyVersion',
          'status',
          'launchUrl'
        ];

        const projectionChanged =
          !existing ||
          projectionKeys.some(key =>
            existing[key] !== projection[key]
          );

        if (projectionChanged) {
          Bridge.upsertItem({
            ...(existing || {}),
            ...projection
          });
        }

        Object.entries(
          registry.sessionStates || {}
        ).forEach(([sessionId, states]) => {
          const existingState =
            states && states[registryId];

          if (
            !existingState ||
            typeof Bridge.upsertSessionState !== 'function'
          ) {
            return;
          }

          const sessionProjection = {
            title,
            navTitle,
            description,
            hook: description,
            coverImage,
            contentVersion,
            ownershipKind: 'my-subject',
            hasMyVersion: false,
            launchUrl
          };

          const sessionChanged =
            Object.entries(sessionProjection)
              .some(([key, value]) =>
                existingState[key] !== value
              );

          if (!sessionChanged) return;

          Bridge.upsertSessionState(
            sessionId,
            registryId,
            {
              ...existingState,
              ...sessionProjection
            }
          );
        });
      } catch {
        /* The owned record remains canonical even if a projection
           has not yet been created. */
      }
    }

    async function moveLibraryCategory(
      categoryId,
      offset,
      event
    ) {
      event?.preventDefault();
      event?.stopPropagation();

      closeOwnedSubjectMenus();

      const Subjects = window.AtlasTutorSubjects;
      const movement = Number(offset);

      if (
        !Subjects ||
        typeof Subjects.moveLibraryCategory !== 'function' ||
        (
          movement !== -1 &&
          movement !== 1
        )
      ) {
        showToast('Category ordering is unavailable.');
        return;
      }

      try {
        const moved =
          await Subjects.moveLibraryCategory(
            categoryId,
            movement
          );

        if (!moved) {
          return;
        }

        await renderHub();

        showToast(
          movement < 0
            ? 'Category moved earlier.'
            : 'Category moved later.'
        );
      } catch {
        showToast('Couldn’t move this category.');
      }
    }

    async function confirmOwnedSubjectDialog(
      createMode = 'generate'
    ) {
      const state = ownedSubjectDialogState;
      const dialog = document.getElementById(
        'owned-subject-dialog'
      );

      if (!state || !dialog) return;

      const Subjects = window.AtlasTutorSubjects;
      const input = dialog.querySelector(
        '#owned-subject-dialog-input'
      );

      const levelSelect = dialog.querySelector(
        '#owned-subject-dialog-level'
      );

      const styleSelect = dialog.querySelector(
        '#owned-subject-dialog-style'
      );

      const briefInput = dialog.querySelector(
        '#owned-subject-dialog-brief'
      );

      const error = dialog.querySelector(
        '#owned-subject-dialog-error'
      );

      const secondary = dialog.querySelector(
        '#owned-subject-dialog-secondary'
      );

      const confirm = dialog.querySelector(
        '#owned-subject-dialog-confirm'
      );

      if (!Subjects || !confirm) return;

      if (state.mode === 'archive-restore') {
        const select = dialog.querySelector(
          '#owned-subject-dialog-session-subject'
        );

        const subjectId =
          String(select?.value || '').trim();

        if (!subjectId) {
          error.hidden = false;
          error.textContent =
            'Choose a subject to restore.';
          return;
        }

        confirm.disabled = true;
        confirm.textContent = 'Restoring…';

        try {
          const saved =
            await Subjects.setSubjectLibraryPlacement(
              subjectId,
              {
                archived: false
              }
            );

          if (!saved) {
            throw new Error(
              'Restore operation failed.'
            );
          }

          setOwnedSubjectRegistryArchived(
            subjectId,
            false
          );

          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Subject restored.');
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t restore this subject.';

          confirm.disabled = false;
          confirm.textContent = 'Restore subject';
        }

        return;
      }

      if (state.mode === 'orphan-remove') {
        confirm.disabled = true;
        confirm.textContent = 'Keeping…';

        try {
          const placed =
            await Subjects.setSubjectLibraryPlacement(
              state.subjectId,
              {
                libraryIncluded: true,
                archived: false
              }
            );

          if (!placed) {
            throw new Error(
              'Library placement failed.'
            );
          }

          const removed =
            await Subjects.removeSessionSubject(
              state.sessionId,
              {
                kind: 'my-subject',
                id: state.subjectId
              }
            );

          if (!removed) {
            throw new Error(
              'Session removal failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();

          showToast(
            'Kept in My Subjects.'
          );
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t move this subject to My Subjects.';

          confirm.disabled = false;
          confirm.textContent =
            'Keep in My Subjects';
        }

        return;
      }

      if (state.mode === 'category-move') {
        const select = dialog.querySelector(
          '#owned-subject-dialog-session-subject'
        );

        const categoryId =
          String(select?.value || '').trim();

        const categoryName =
          String(
            select?.selectedOptions?.[0]
              ?.textContent || ''
          ).trim();

        if (!categoryId) {
          error.hidden = false;
          error.textContent =
            'Choose a category.';
          return;
        }

        confirm.disabled = true;
        confirm.textContent = 'Moving…';

        try {
          const saved =
            await Subjects.setSubjectLibraryPlacement(
              state.subjectId,
              {
                libraryIncluded: true,
                categoryId
              }
            );

          if (!saved) {
            throw new Error(
              'Category movement failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();

          showToast(
            categoryName
              ? 'Moved to ' + categoryName + '.'
              : 'Subject moved.'
          );
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t move this subject.';

          confirm.disabled = false;
          confirm.textContent = 'Move subject';
        }

        return;
      }

      if (state.mode === 'session-add') {
        const select = dialog.querySelector(
          '#owned-subject-dialog-session-subject'
        );

        const selected =
          select?.selectedOptions?.[0];

        const kind =
          selected?.dataset?.kind || '';

        const id =
          String(selected?.value || '').trim();

        if (
          !id ||
          (
            kind !== 'my-subject' &&
            kind !== 'atlas-subject'
          )
        ) {
          error.hidden = false;
          error.textContent =
            'Choose a subject to add.';
          return;
        }

        confirm.disabled = true;
        confirm.textContent = 'Adding…';

        try {
          const session = getActiveSession();

          const saved =
            await Subjects.addSessionSubject(
              session.id,
              {
                kind,
                id
              }
            );

          if (!saved) {
            throw new Error(
              'Session subject assignment failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();

          showToast(
            'Added to ' +
            getActiveSessionSubjectCollectionTitle() +
            '.'
          );
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t add this subject.';
          confirm.disabled = false;
          confirm.textContent = 'Add subject';
        }

        return;
      }

      if (state.mode === 'category-delete') {
        confirm.disabled = true;
        confirm.textContent = 'Deleting…';

        try {
          const deleted =
            await Subjects.deleteLibraryCategory(
              state.categoryId
            );

          if (!deleted) {
            throw new Error(
              'Category deletion failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Category deleted.');
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t delete this category.';

          confirm.disabled = false;
          confirm.textContent =
            'Delete category';
        }

        return;
      }

      if (
        state.mode === 'category-create' ||
        state.mode === 'category-rename'
      ) {
        const nextName = String(
          input?.value || ''
        ).trim();

        if (!nextName) {
          error.hidden = false;
          error.textContent =
            'Give the category a name.';
          input?.focus();
          return;
        }

        confirm.disabled = true;
        confirm.textContent =
          state.mode === 'category-create'
            ? 'Creating…'
            : 'Saving…';

        try {
          const saved =
            state.mode === 'category-create'
              ? await Subjects.createLibraryCategory(
                nextName
              )
              : await Subjects.renameLibraryCategory(
                state.categoryId,
                nextName
              );

          if (!saved) {
            throw new Error(
              'Category operation failed.'
            );
          }

          closeOwnedSubjectDialog(false);
          await renderHub();

          showToast(
            state.mode === 'category-create'
              ? 'Category created.'
              : 'Category renamed.'
          );
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t save this category. Check that the name is unique.';

          confirm.disabled = false;
          confirm.textContent =
            state.mode === 'category-create'
              ? 'Create category'
              : 'Save name';
        }

        return;
      }

      if (state.mode === 'create') {
        const nextTitle = String(
          input?.value || ''
        ).trim();

        if (!nextTitle) {
          error.hidden = false;
          error.textContent =
            'Give the subject a name.';
          input?.focus();
          return;
        }

        const generateFullSubject =
          createMode !== 'blank';

        const allowedLevels = new Set([
          'a1-a2',
          'b1',
          'b2',
          'c1-plus'
        ]);

        const allowedStyles = new Set([
          'balanced',
          'playful',
          'relaxed',
          'thoughtful',
          'practical'
        ]);

        const generationContext = {
          version: 1,

          languageLevel:
            allowedLevels.has(levelSelect?.value)
              ? levelSelect.value
              : 'b2',

          style:
            allowedStyles.has(styleSelect?.value)
              ? styleSelect.value
              : 'balanced',

          brief: String(
            briefInput?.value || ''
          ).trim()
        };

        const targetSessionId =
          state.sessionId ||
          getActiveSession().id;

        const Structured =
          window.AtlasStructuredSubject;

        if (
          !Structured ||
          typeof Structured.createBlankDocument !== 'function' ||
          typeof Structured.validateDocument !== 'function'
        ) {
          error.hidden = false;
          error.textContent =
            'Subject creation is unavailable.';
          return;
        }

        const document =
          Structured.createBlankDocument({
            title: nextTitle
          });

        const validation =
          Structured.validateDocument(document);

        if (!validation.valid) {
          console.error(
            '[Compass] Blank Structured Subject validation failed:',
            validation.errors
          );

          error.hidden = false;
          error.textContent =
            'Couldn’t prepare this subject.';
          return;
        }

        confirm.disabled = true;

        confirm.textContent =
          generateFullSubject
            ? 'Preparing…'
            : 'Generate subject';

        if (secondary) {
          secondary.disabled = true;

          if (!generateFullSubject) {
            secondary.textContent = 'Creating…';
          }
        }

        try {
          const created =
            await Subjects.createSubject({
              format: 'structured',

              metadata: {
                title: nextTitle,
                navTitle: nextTitle,
                description: '',
                coverImage: '',
                generationContext
              },

              libraryPlacement: state.sessionId
                ? {
                  libraryIncluded: false
                }
                : state.categoryId
                  ? {
                    libraryIncluded: true,
                    categoryId: state.categoryId
                  }
                  : {
                    libraryIncluded: true
                  },

              document,

              provenance: {
                kind: 'blank-structured'
              }
            });

          if (!created) {
            throw new Error(
              'Create did not return a subject.'
            );
          }

          const promoted =
            await Subjects.addSessionSubject(
              targetSessionId,
              {
                kind: 'my-subject',
                id: created.id
              }
            );

          if (!promoted) {
            await Subjects.deleteSubject(
              created.id
            );

            throw new Error(
              'Created subject could not be added to the session.'
            );
          }

          syncOwnedSubjectRegistryProjection(
            created
          );

          const launchUrl =
            getOwnedSubjectLaunchUrl(
              created.id,
              {
                authoringIntent:
                  generateFullSubject
                    ? 'generate'
                    : 'create'
              }
            );

          if (!launchUrl) {
            throw new Error(
              'Created subject has no launch URL.'
            );
          }

          closeOwnedSubjectDialog(false);
          navigateTo(launchUrl);
        } catch (creationError) {
          console.error(
            '[Compass] Subject creation failed:',
            creationError
          );

          error.hidden = false;
          error.textContent =
            'Couldn’t create this subject.';

          confirm.disabled = false;
          confirm.textContent = 'Generate subject';

          if (secondary) {
            secondary.disabled = false;
            secondary.textContent = 'Start blank';
          }
        }

        return;
      }

      if (state.mode === 'rename') {
        const nextTitle = String(
          input?.value || ''
        ).trim();

        if (!nextTitle) {
          error.hidden = false;
          error.textContent =
            'Give the subject a name.';
          input?.focus();
          return;
        }

        confirm.disabled = true;
        confirm.textContent = 'Saving…';

        try {
          const saved = await Subjects.renameSubject(
            state.subjectId,
            nextTitle
          );

          if (!saved) {
            throw new Error(
              'Rename did not return a subject.'
            );
          }

          syncOwnedSubjectRegistryProjection(saved);
          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Subject renamed.');
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t rename this subject.';
          confirm.disabled = false;
          confirm.textContent = 'Save name';
        }

        return;
      }

      if (state.mode === 'delete') {
        confirm.disabled = true;
        confirm.textContent = 'Deleting…';

        try {
          const registryId =
            getOwnedSubjectRegistryId(
              state.subjectId
            );

          const deleted =
            await Subjects.deleteSubject(
              state.subjectId
            );

          if (!deleted) {
            throw new Error(
              'Delete operation failed.'
            );
          }

          try {
            if (
              registryId &&
              typeof Bridge.removeItem === 'function'
            ) {
              Bridge.removeItem(registryId);
            }
          } catch { }

          closeOwnedSubjectDialog(false);
          await renderHub();
          showToast('Subject deleted.');
        } catch {
          error.hidden = false;
          error.textContent =
            'Couldn’t delete this subject.';
          confirm.disabled = false;
          confirm.textContent = 'Delete subject';
        }
      }
    }

    async function moveShelfSubject(
      scope,
      subjectKind,
      subjectId,
      targetKind,
      targetSubjectId,
      offset,
      event
    ) {
      event?.preventDefault();
      event?.stopPropagation();

      closeOwnedSubjectMenus();

      const Subjects = window.AtlasTutorSubjects;
      const movement = Number(offset);

      if (
        !Subjects ||
        (
          movement !== -1 &&
          movement !== 1
        )
      ) {
        showToast('Subject ordering is unavailable.');
        return;
      }

      try {
        let moved = null;

        if (scope === 'category') {
          if (
            subjectKind !== 'my-subject' ||
            targetKind !== 'my-subject' ||
            typeof Subjects.moveSubject !== 'function'
          ) {
            throw new Error(
              'Category ordering is unavailable.'
            );
          }

          moved =
            await Subjects.moveSubject(
              subjectId,
              movement,
              targetSubjectId
            );
        } else if (scope === 'session') {
          if (
            typeof Subjects.getSessionSubjects !== 'function' ||
            typeof Subjects.setSessionSubjects !== 'function'
          ) {
            throw new Error(
              'Session ordering is unavailable.'
            );
          }

          const session = getActiveSession();

          const refs =
            await Subjects.getSessionSubjects(
              session.id
            );

          const currentIndex =
            refs.findIndex(ref =>
              ref.kind === subjectKind &&
              ref.id === subjectId
            );

          const targetIndex =
            refs.findIndex(ref =>
              ref.kind === targetKind &&
              ref.id === targetSubjectId
            );

          if (
            currentIndex === -1 ||
            targetIndex === -1 ||
            (
              movement < 0 &&
              targetIndex >= currentIndex
            ) ||
            (
              movement > 0 &&
              targetIndex <= currentIndex
            )
          ) {
            throw new Error(
              'Invalid session movement.'
            );
          }

          [
            refs[currentIndex],
            refs[targetIndex]
          ] = [
            refs[targetIndex],
            refs[currentIndex]
          ];

          moved =
            await Subjects.setSessionSubjects(
              session.id,
              refs
            );
        } else {
          return;
        }

        if (!moved) {
          throw new Error(
            'Subject movement failed.'
          );
        }

        await renderHub();

        showToast(
          movement < 0
            ? 'Subject moved earlier.'
            : 'Subject moved later.'
        );
      } catch {
        showToast('Couldn’t move this subject.');
      }
    }

          await Subjects.removeSessionSubject(
            session.id,
            {
              kind: 'my-subject',
              id: subjectId
            }
          );

        if (!saved) {
          throw new Error(
            'Session subject removal failed.'
          );
        }

        await renderHub();

        showToast(
          'Removed from ' +
          getActiveSessionSubjectCollectionTitle() +
          '.'
        );
      } catch {
        showToast('Couldn’t remove this subject.');
      }
    }

    /* ================================================================
       RENDER
       One curated operational collection containing only playable subjects.
       Progress and continuation state live directly on the standard cards.
       ================================================================ */

    let compassRecommendationContext = null;
    let compassRecommendationRequestId = 0;

    function getCompassIdeaContextSubject(
      subject
    ) {
      const title =
        String(
          subject?.title || ''
        ).trim();

      if (!title) {
        return null;
      }

      return {
        title,

        description:
          String(
            subject?.hook || ''
          ).trim()
      };
    }

    function buildCompassRecommendationContext(
      session,
      sessionSubjects,
      existingSubjects
    ) {
      return {
        sessionId:
          session.id,

        sessionSubjects:
          sessionSubjects
            .map(subject =>
              getCompassIdeaContextSubject(
                subject
              )
            )
            .filter(Boolean),

        existingSubjects:
          existingSubjects
            .map(subject =>
              getCompassIdeaContextSubject(
                subject
              )
            )
            .filter(Boolean)
      };
    }

    function renderCompassRecommendationResult(
      result
    ) {
      if (
        !Array.isArray(result.ideas) ||
        result.ideas.length !== 3
      ) {
        throw new Error(
          'Compass could not resolve its ideas.'
        );
      }

      return (
        '<section class="compass-recommendation-panel" aria-label="Compass suggestions">' +
        '<div class="compass-recommendation-kicker">Compass</div>' +
        '<p class="compass-recommendation-message">' +
        escHtml(result.message) +
        '</p>' +
        result.ideas.map(
          idea =>
            '<button class="compass-recommendation-row" type="button" ' +
            'data-subject-idea="' +
            escHtml(
              idea.title
            ) +
            '" onclick="chooseCompassSubjectIdea(this)">' +
            '<span class="compass-recommendation-copy">' +
            '<span class="compass-recommendation-title">' +
            escHtml(
              idea.title
            ) +
            '</span>' +
            '<span class="compass-recommendation-reason">' +
            escHtml(
              idea.reason
            ) +
            '</span>' +
            '</span>' +
            '<span class="compass-recommendation-arrow" aria-hidden="true">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none">' +
            '<path d="M4 8h8M9 5l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
            '</span>' +
            '</button>'
        ).join('') +
        '</section>'
      );
    }

    function chooseCompassSubjectIdea(
      button
    ) {
      const title =
        String(
          button?.dataset
            ?.subjectIdea ||
          ''
        ).trim();

      const dialog =
        button?.closest(
          '.owned-subject-dialog-panel'
        );

      const input =
        dialog?.querySelector(
          '#owned-subject-dialog-input'
        );

      const region =
        dialog?.querySelector(
          '.compass-recommendation-region'
        );

      const label =
        dialog?.querySelector(
          '[data-idea-label]'
        );

      if (!title || !input) {
        return;
      }

      input.value = title;
      input.dispatchEvent(
        new Event(
          'input',
          {
            bubbles: true
          }
        )
      );

      if (region) {
        region.innerHTML = '';
      }

      if (label) {
        label.textContent =
          'Need another idea?';
      }

      input.focus();
    }

    async function askCompassForSubjects(
      button
    ) {
      const context =
        compassRecommendationContext;

      const region =
        button
          ?.closest(
            '.owned-subject-dialog-panel'
          )
          ?.querySelector(
            '.compass-recommendation-region'
          );

      const label =
        button?.querySelector(
          '[data-idea-label]'
        );

      if (
        !context ||
        !region ||
        !window.AtlasAI ||
        typeof window.AtlasAI
          .suggestSubjectIdeas !== 'function'
      ) {
        showToast(
          'Compass suggestions are unavailable.'
        );
        return;
      }

      const requestId =
        ++compassRecommendationRequestId;

      button.disabled = true;

      if (label) {
        label.textContent =
          'Thinking…';
      }

      region.innerHTML =
        '<div class="compass-recommendation-panel compass-recommendation-panel--state">' +
        '<div class="compass-recommendation-kicker">Compass</div>' +
        '<div class="compass-recommendation-state">Give me a second…</div>' +
        '</div>';

      let notes = '';

      try {
        if (
          typeof Bridge
            .readLearnerMemory ===
          'function'
        ) {
          notes =
            Bridge.readLearnerMemory(
              context.sessionId
            )?.notes || '';
        }
      } catch { }

      try {
        const result =
          await window.AtlasAI
            .suggestSubjectIdeas({
              notes,

              sessionSubjects:
                context.sessionSubjects,

              existingSubjects:
                context.existingSubjects
            });

        if (
          requestId !==
            compassRecommendationRequestId ||
          getActiveSession().id !==
            context.sessionId
        ) {
          return;
        }

        region.innerHTML =
          renderCompassRecommendationResult(
            result
          );

        if (label) {
          label.textContent =
            'Ask again';
        }
      } catch (error) {
        console.error(
          '[Compass] Recommendation failed:',
          error
        );

        if (
          requestId !==
          compassRecommendationRequestId
        ) {
          return;
        }

        region.innerHTML =
          '<div class="compass-recommendation-panel compass-recommendation-panel--state">' +
          '<div class="compass-recommendation-kicker">Compass</div>' +
          '<div class="compass-recommendation-state">I couldn’t get a clear answer just now. Try me again.</div>' +
          '</div>';

        if (label) {
          label.textContent =
            'Try again';
        }
      } finally {
        if (
          requestId ===
            compassRecommendationRequestId &&
          document.contains(button)
        ) {
          button.disabled = false;
        }
      }
    }

    let hubRenderRevision = 0;

    async function renderHub() {
      if (!Bridge) return;

      const renderRevision = ++hubRenderRevision;

      registerWithBridge();

      const main = document.getElementById('hub-main');
      const session = getActiveSession();
      const atlasSubjects = getAtlasSubjects();
      const ownedSubjects = await getOwnedSubjects();

      const Subjects = window.AtlasTutorSubjects;

      let sessionSubjectRefs = [];
      let libraryState = null;

      try {
        if (Subjects) {
          const results = await Promise.all([
            typeof Subjects.getSessionSubjects === 'function'
              ? Subjects.getSessionSubjects(session.id)
              : Promise.resolve([]),
            typeof Subjects.getLibraryState === 'function'
              ? Subjects.getLibraryState()
              : Promise.resolve(null)
          ]);

          sessionSubjectRefs =
            Array.isArray(results[0])
              ? results[0]
              : [];

          libraryState = results[1];
        }
      } catch {
        sessionSubjectRefs = [];
        libraryState = null;
      }

      if (renderRevision !== hubRenderRevision) {
        return;
      }

      const ownedById = new Map(
        ownedSubjects.map(subject => [
          subject.subjectId,
          subject
        ])
      );

      const atlasById = new Map(
        atlasSubjects.map(subject => [
          subject.registryId,
          subject
        ])
      );

      const sessionSubjects = [];
      const promotedAtlasIds = new Set();

      sessionSubjectRefs.forEach(ref => {
        if (
          ref.kind === 'my-subject' &&
          ownedById.has(ref.id) &&
          !ownedById.get(ref.id).archived
        ) {
          sessionSubjects.push({
            ...ownedById.get(ref.id),
            isSessionRelevant: true
          });

          return;
        }

        if (
          ref.kind === 'atlas-subject' &&
          atlasById.has(ref.id)
        ) {
          promotedAtlasIds.add(ref.id);

          sessionSubjects.push({
            ...atlasById.get(ref.id),
            isSessionRelevant: true
          });
        }
      });

      const remainingOwnedSubjects =
        ownedSubjects.filter(subject =>
          subject.libraryIncluded &&
          !subject.archived
        );

      const remainingAtlasSubjects =
        atlasSubjects.filter(subject =>
          !promotedAtlasIds.has(subject.registryId)
        );

      compassRecommendationContext =
        buildCompassRecommendationContext(
          session,
          sessionSubjects,
          [
            ...sessionSubjects,
            ...remainingOwnedSubjects,
            ...remainingAtlasSubjects
          ]
        );

      const fallbackCategory = {
        id: 'default',
        name: 'My Subjects'
      };

      const libraryCategories =
        Array.isArray(libraryState?.categoryOrder)
          ? libraryState.categoryOrder
            .map(categoryId =>
              libraryState.categories?.find(category =>
                category.id === categoryId
              )
            )
            .filter(Boolean)
          : [fallbackCategory];

      if (!libraryCategories.length) {
        libraryCategories.push(fallbackCategory);
      }

      const ownedLibraryHtml =
        libraryCategories
          .map((category, index) =>
            renderSubjectCollection(
              remainingOwnedSubjects.filter(subject =>
                subject.categoryId === category.id
              ),
              category.name,
              {
                canCreate: true,
                categoryId: category.id,
                canManageCategory: true,
                isDefaultCategory:
                  category.id ===
                  libraryState?.defaultCategoryId,
                canMoveCategoryEarlier:
                  index > 0,
                canMoveCategoryLater:
                  index < libraryCategories.length - 1
              }
            )
          )
          .join('');

      setSessionLabels();
      renderSpineHubNav();
      renderDrawerHubNav();

      if (
        !atlasSubjects.length &&
        !ownedSubjects.length
      ) {
        main.innerHTML =
          renderIntro(session) +
          ownedLibraryHtml +
          renderEmptyLibrary();

        return;
      }

      main.innerHTML =
        renderIntro(session) +
        renderSubjectCollection(
          sessionSubjects,
          getActiveSessionSubjectCollectionTitle(),
          {
            canAdd: true
          }
        ) +
        ownedLibraryHtml +
        renderSubjectCollection(
          remainingAtlasSubjects,
          'Atlas Subjects'
        );
    }

    const COMPASS_TOPIC_CYCLE_MS = 80000;
    const COMPASS_TOPIC_SLOT_MS = 8000;
    const COMPASS_TOPIC_SETTLE_MS = 800;
    const COMPASS_TOPIC_STARTED_AT_KEY =
      'atlas::compassTopicCycleStartedAt';

    function getCompassTopicPhaseMs() {
      const now = Date.now();
      let startedAt = now;

      try {
        const storedStartedAt = Number(
          sessionStorage.getItem(
            COMPASS_TOPIC_STARTED_AT_KEY
          )
        );

        if (
          Number.isFinite(storedStartedAt) &&
          storedStartedAt > 0
        ) {
          startedAt = storedStartedAt;
        } else {
          sessionStorage.setItem(
            COMPASS_TOPIC_STARTED_AT_KEY,
            String(now)
          );
        }
      } catch (e) { }

      const rawPhase =
        (now - startedAt) % COMPASS_TOPIC_CYCLE_MS;

      const slotStart =
        Math.floor(
          rawPhase / COMPASS_TOPIC_SLOT_MS
        ) * COMPASS_TOPIC_SLOT_MS;

      const slotOffset =
        rawPhase - slotStart;

      const settledOffset = Math.min(
        Math.max(
          slotOffset,
          COMPASS_TOPIC_SETTLE_MS
        ),
        COMPASS_TOPIC_SLOT_MS -
          COMPASS_TOPIC_SETTLE_MS
      );

      return slotStart + settledOffset;
    }

    function renderIntro(session) {

        getCompassTopicPhaseMs();

      return (

        '<span class="hub-topic" style="--topic-delay: 0s;">the science of why we laugh.</span>' +
        '<span class="hub-topic" style="--topic-delay: 8s;">how humans first made music.</span>' +
        '<span class="hub-topic" style="--topic-delay: 16s;">why dreams can feel completely real.</span>' +
        '<span class="hub-topic" style="--topic-delay: 24s;">how language changes the way we think.</span>' +
        '<span class="hub-topic" style="--topic-delay: 32s;">why time seems faster as we get older.</span>' +
        '<span class="hub-topic" style="--topic-delay: 40s;">whether our memories can be trusted.</span>' +
        '<span class="hub-topic" style="--topic-delay: 48s;">why humans believe in luck.</span>' +
        '<span class="hub-topic" style="--topic-delay: 56s;">what would happen in a world without money.</span>' +
        '<span class="hub-topic" style="--topic-delay: 64s;">whether AI can ever be truly original.</span>' +
        '<span class="hub-topic" style="--topic-delay: 72s;">why certain songs give us chills.</span>' +
        '</span>' +
        '</h1>' +

        '</div>' +

    function renderSubjectCollection(
      subjects,
      title,
      {
        canCreate = false,
        canAdd = false,
        categoryId = '',
        canManageCategory = false,
        isDefaultCategory = false,
        canMoveCategoryEarlier = false,
        canMoveCategoryLater = false
      } = {}
    ) {
      const items =
        Array.isArray(subjects)
          ? subjects
          : [];

      if (
        !items.length &&
        !canCreate &&
        !canAdd
      ) {
        return '';
      }

      const getMovementRef = subject => {
        if (
          subject?.isOwned &&
          subject.subjectId
        ) {
          return {
            kind: 'my-subject',
            id: String(subject.subjectId)
          };
        }

        if (subject?.registryId) {
          return {
            kind: 'atlas-subject',
            id: String(subject.registryId)
          };
        }

        return null;
      };

      const cards = items
        .map((subject, index) => {
          const subjectRef =
            getMovementRef(subject);

          const moveScope =
            canAdd &&
            subject.isSessionRelevant
              ? 'session'
              : (
                categoryId &&
                subject.isOwned &&
                subject.subjectId
                  ? 'category'
                  : ''
              );

          const canReorder =
            Boolean(
              moveScope &&
              subjectRef &&
              items.length > 1
            );

          const earlierRef =
            canReorder &&
            index > 0
              ? getMovementRef(
                items[index - 1]
              )
              : null;

          const laterRef =
            canReorder &&
            index < items.length - 1
              ? getMovementRef(
                items[index + 1]
              )
              : null;

          return renderSubjectCard({
            ...subject,

            moveScope,

            moveSubjectKind:
              subjectRef?.kind || '',

            moveSubjectId:
              subjectRef?.id || '',

            canMoveEarlier:
              Boolean(earlierRef),

            canMoveLater:
              Boolean(laterRef),

            moveEarlierTargetKind:
              earlierRef?.kind || '',

            moveEarlierTargetId:
              earlierRef?.id || '',

            moveLaterTargetKind:
              laterRef?.kind || '',

            moveLaterTargetId:
              laterRef?.id || ''

      const categoryManagement =
        canManageCategory && categoryId

            'aria-label="' +

            'aria-expanded="false" ' +
            'onclick="toggleOwnedSubjectMenu(this, event)">' +

            '</button>' +

            '<button type="button" role="menuitem" ' +
            'onclick="openRenameCategoryDialog(' +
            jsArg(categoryId) +
            ', event)">Rename category</button>' +

            '<button type="button" role="menuitem" ' +
            'onclick="openCreateCategoryDialog(event)">New category</button>' +

            (

                  '<button type="button" role="menuitem" ' +
                  'onclick="moveLibraryCategory(' +
                  jsArg(categoryId) +
                  ', -1, event)">Move earlier</button>'

            ) +

            (

                  'onclick="moveLibraryCategory(' +
                  jsArg(categoryId) +

                : ''

            '</div>'

      const headerAction = canAdd
        ? (

          'type="button" ' +
          'onclick="openAddSessionSubjectDialog(event)">' +
          '<span class="subject-library-create-plus" aria-hidden="true">+</span>' +

          : '';

        '<div class="subject-library-header">' +
        '<h2 class="subject-library-title">' +
        escHtml(title) +
        '</h2>' +
        headerActions +
        '</div>' +
        contents +
        '</section>'
      );

                '<button type="button" role="menuitem" ' +
                'onclick="addOwnedSubjectToLibrary(' +
                jsArg(subject.subjectId) +
                ', event)">Add to My Subjects</button>'
              )
              : ''
          ) +

          (
            subject.libraryIncluded &&
            subject.hasSessionHome
              ? (
                '<button type="button" role="menuitem" ' +
                'onclick="removeOwnedSubjectFromLibrary(' +
                jsArg(subject.subjectId) +
                ', event)">Remove from My Subjects</button>'
              )
              : ''
          ) +

          (subject.isSessionRelevant
            ? (
              '<button type="button" role="menuitem" ' +
              'onclick="removeOwnedSubjectFromActiveSession(' +
              jsArg(subject.subjectId) +
              ', event)">' +
              'Remove from ' +
              escHtml(
                getActiveSessionSubjectCollectionTitle()
              ) +
              '</button>'
            )
            : (
              '<button type="button" role="menuitem" ' +
              'onclick="addOwnedSubjectToActiveSession(' +
              jsArg(subject.subjectId) +
              ', event)">' +
              'Add to ' +
              escHtml(
                getActiveSessionSubjectCollectionTitle()
              ) +
              '</button>'
            )) +


          '<button type="button" role="menuitem" ' +
          'onclick="archiveOwnedSubject(' +
          jsArg(subject.subjectId) +
          ', event)">Archive</button>' +

          '<button class="is-danger" type="button" role="menuitem" ' +
          'onclick="openOwnedSubjectDeleteDialog(' +
          jsArg(subject.subjectId) +
          ', event)">Delete</button>' +

          '</div>' +
          '</div>';

        return (
          '<article class="' +
          cardClasses +
          ' subject-card--owned" ' +
          'style="' +
          progressStyle +
          '">' +

          '<a class="subject-card-open-layer" ' +
          'href="' +
          escHtml(subject.launchUrl) +
          '" ' +
          'aria-label="' +
          actionLabel +
          '"></a>' +

          managementHtml +
          cardContents +
          '</article>'
        );
      }

      if (
        subject.isSessionRelevant &&
        !subject.isOwned &&
        subject.registryId
      ) {
        const managementHtml =
          '<div class="subject-card-management">' +

          '<button class="subject-card-manage-btn" ' +
          'type="button" ' +
          'aria-label="' +
          escHtml('Manage ' + subject.title) +
          '" ' +
          'aria-haspopup="menu" ' +
          'aria-expanded="false" ' +
          'onclick="toggleOwnedSubjectMenu(this, event)">' +

          '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
          '<circle cx="3.2" cy="8" r="1.15" fill="currentColor"/>' +
          '<circle cx="8" cy="8" r="1.15" fill="currentColor"/>' +
          '<circle cx="12.8" cy="8" r="1.15" fill="currentColor"/>' +
          '</svg>' +
          '</button>' +

          '<div class="subject-card-menu" role="menu" hidden>' +

          '<button type="button" role="menuitem" ' +
          'onclick="removeAtlasSubjectFromActiveSession(' +
          jsArg(subject.registryId) +
          ', event)">' +
          'Remove from ' +
          escHtml(
            getActiveSessionSubjectCollectionTitle()
          ) +
          '</button>' +
          '</div>' +
          '</div>';

        return (
          '<article class="' +
          cardClasses +
          ' subject-card--owned" ' +
          'style="' +
          progressStyle +
          '">' +

          '<a class="subject-card-open-layer" ' +
          'href="' +
          escHtml(subject.launchUrl) +
          '" ' +
          'aria-label="' +
          actionLabel +
          '"></a>' +

          managementHtml +
          cardContents +
          '</article>'
        );
      }

      return (
        '<a class="' +
        cardClasses +
        '" ' +

        'href="' +
        escHtml(subject.launchUrl) +
        '" ' +

        'style="' +
        progressStyle +
        '" ' +

        'aria-label="' +
        actionLabel +
        '">' +

        cardContents +
        '</a>'
      );
    }

    function renderEmptyLibrary() {
      return (
        '<div class="empty-library">' +
        '<div class="empty-library-icon">' +
        '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
        '</div>' +
        '<h2>No subjects available</h2>' +
        '<p>Compass could not find any playable subjects on this device.</p>' +
        '</div>'
      );
    }

    /* ================================================================
       DRAWER
       ================================================================ */

    function openDrawer() {
      renderDrawerHubNav();
      const overlay = document.getElementById('drawer-overlay');
      overlay.style.display = 'block';
      document.getElementById('drawer').classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(() => overlay.classList.add('open'), 10);
    }
    function closeDrawer() {
      const overlay = document.getElementById('drawer-overlay');
      overlay.classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => { overlay.style.display = ''; }, 300);
    }

    /* ================================================================
       SESSION MODAL
       ================================================================ */

    function openSessionPanel(trigger = document.activeElement) {
      if (window.AtlasSessionPanel) AtlasSessionPanel.open(trigger);
    }

    /* ================================================================
       GLOBAL KEYS
       ================================================================ */

    document.addEventListener('click', e => {
      if (!e.target.closest('.subject-card-management')) {
        closeOwnedSubjectMenus();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.defaultPrevented) return;

      if (e.key === 'Escape') {
        const ownedDialog =
          document.getElementById(
            'owned-subject-dialog'
          );

        if (ownedDialog && !ownedDialog.hidden) {
          closeOwnedSubjectDialog();
          return;
        }

        if (closeOwnedSubjectMenus()) return;
        if (window.AtlasSessionPanel && AtlasSessionPanel.isOpen()) return;
        if (document.getElementById('drawer').classList.contains('open')) { closeDrawer(); return; }
      }
    });

    /* ================================================================
       LIVE REFRESH
       ================================================================ */

    function refresh() {
      if (!Bridge) return;
      const mode = Bridge.applyAppearanceMode(Bridge.readAppearanceMode());
      updateAppearanceButtons(mode);
      renderHub();
    }

    window.addEventListener('atlas:session-change', refresh);
    window.addEventListener('atlas:appearance-change', e => {
      const mode = (e.detail && e.detail.mode) || Bridge.readAppearanceMode();
      updateAppearanceButtons(mode);
    });
    window.addEventListener('focus', refresh);
    window.addEventListener('pageshow', refresh);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
    window.addEventListener('storage', e => {
      if (!e || !e.key) return;
      const k = e.key;
      if (k === Bridge.keys.appearance || k === Bridge.keys.appearanceBySession) {
        const mode = Bridge.applyAppearanceMode(Bridge.readAppearanceMode());
        updateAppearanceButtons(mode);
        return;
      }

      if (
        k === 'atlas::sessions' ||
        k === 'atlas::registry' ||
        k === 'learning::ledger' ||
        k.startsWith('atlas::tutorSubjects::subject::') ||
        k.startsWith('atlas::tutorSubjects::sessionSubjects::')
      ) {
        refresh();
      }
    });

    /* ================================================================
       INIT
       ================================================================ */

    function init() {
      if (!Bridge) return;

      const mode = Bridge.readAppearanceMode();
      Bridge.applyAppearanceMode(mode);
      updateAppearanceButtons(mode);
      setSessionLabels();
      renderSpineHubNav();
      renderDrawerHubNav();

      if (window.AtlasSearch && typeof AtlasSearch.init === 'function') {
        AtlasSearch.init({
          activeHubId: 'compass',
          atlasUrl: '../index.html',
          compassUrl: './index.html',
          arcadeUrl: '../arcade/index.html'
        });
      }

      AtlasSessionPanel.mount({
        root: '#atlas-session-panel-root',
        initialView: 'manage'
      });

      renderHub();
    }

    init();
  </script>
</body>

</html>
