  <script>
    (function () {
      try {
        var presentationKey =
          'atlas::returnHandoffPresentation::v1';

        var presentationRaw =
          sessionStorage.getItem(
            presentationKey
          );

        var presentation = null;

        if (presentationRaw) {
          try {
            presentation =
              JSON.parse(presentationRaw);
          } catch (e) {
            presentation = null;
          }

          /*
           * This marker exists only to own the destination's first paint.
           * Consume it immediately so a later ordinary Compass visit can
           * never inherit a stale loading state.
           */
          try {
            sessionStorage.removeItem(
              presentationKey
            );
          } catch (e) { }
        }

        var id = '';

        if (
          presentation &&
          presentation.version === 1 &&
          /^ri_[A-Za-z0-9_-]{20,80}$/.test(
            String(presentation.id || '')
          ) &&
          Number.isFinite(
            Number(presentation.queuedAt)
          ) &&
          Date.now() -
            Number(presentation.queuedAt) <=
              60 * 1000
        ) {
          var markedDestination =
            new URL(
              String(
                presentation.destination || ''
              ),
              window.location.href
            );

          var markedCurrent =
            new URL(window.location.href);

          if (
            markedDestination.origin ===
              markedCurrent.origin &&
            markedDestination.pathname ===
              markedCurrent.pathname &&
            markedDestination.search ===
              markedCurrent.search &&
            markedDestination.hash ===
              markedCurrent.hash
          ) {
            id = String(
              presentation.id || ''
            ).trim();
          }
        }

        if (!id) {
          var queueRaw =
            sessionStorage.getItem(
              'atlas::returnIntentResume::v1'
            );

          if (!queueRaw) return;

          var queued = JSON.parse(queueRaw);

          id = String(
            queued && queued.id || ''
          ).trim();
        }

        if (!/^ri_[A-Za-z0-9_-]{20,80}$/.test(id)) {
          return;
        }

        var intentRaw =
          localStorage.getItem(
            'atlas::returnIntent::v1::' + id
          );

        if (!intentRaw) return;

        var intent = JSON.parse(intentRaw);
        var context =
          intent && intent.context || {};

        if (
          !intent ||
          intent.action !== 'create-subject' ||
          context.operation !==
            'continue-create-preview'
        ) {
          return;
        }

        var destination =
          new URL(
            String(intent.destination || ''),
            window.location.href
          );

        var current =
          new URL(window.location.href);

        if (
          destination.origin !== current.origin ||
          destination.pathname !== current.pathname ||
          destination.search !== current.search ||
          destination.hash !== current.hash
        ) {
          return;
        }

        var draftId =
          String(context.draftId || '').trim();

        var draft = null;

        if (draftId) {
          var draftRaw =
            localStorage.getItem(
              'atlas::compassCreatePreviewDraft::v1::' +
              draftId
            );

          draft = draftRaw
            ? JSON.parse(draftRaw)
            : null;
        }

        document.documentElement.dataset
          .atlasResumeTransition =
            draft &&
            draft.createMode === 'blank'
              ? 'creating-subject'
              : 'building-subject';
      } catch (e) { }
    })();
  </script>

  <!-- Anti-flash: resolve the active-session theme before the transition
       canvas can paint. This keeps account returns and subject-build handoffs
       on the correct day/night canvas from their very first frame. -->
  <script>
    (function () {
      var mode = null;

      try {
        var sessionId =
          sessionStorage.getItem(
            'atlas::activeSessionId'
          ) || 'default';

        var sessionModes =
          JSON.parse(
            localStorage.getItem(
              'atlas::appearanceBySession'
            ) || '{}'
          );

        mode =
          sessionModes[sessionId] ||
          localStorage.getItem(
            'atlas::appearanceMode'
          );
      } catch (e) {
        mode = null;
      }

      document.documentElement.dataset.theme =
        mode === 'night'
          ? 'night'
          : 'light';
    })();
  </script>

        transform: translateY(0);
      }

        transform: translateY(-4px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .atlas-resume-handoff-dot {
        animation: none;
      }

  <script>
    (function () {
      var authStorageKey =
        'sb-jnhjfpagectprceswvqn-auth-token';
      var hubCachePrefix =
        'atlas::compassHubCache::v1::';
      var hubCacheVersion = 3;
      var hubCacheKind =
        'compass-hub-presentation';
      var authRaw = null;
      var userId = '';

      try {
        authRaw = localStorage.getItem(
          authStorageKey
        );

        if (authRaw) {
          var parsed = JSON.parse(authRaw);
          var candidates = [
            parsed,
            parsed && parsed.session,
            parsed && parsed.currentSession,
            parsed && parsed.data &&
              parsed.data.session
          ];

          for (
            var index = 0;
            index < candidates.length;
            index += 1
          ) {
            var candidate = candidates[index];
            var candidateId = String(
              candidate &&
              candidate.user &&
              candidate.user.id ||
              ''
            ).trim();

            if (candidateId) {
              userId = candidateId;
              break;
            }
          }
        }
      } catch (e) { }

      var oauthReturn = false;

      try {
        var oauthParams = new URLSearchParams(
          String(window.location.hash || '')
            .replace(/^#/, '')
        );

        oauthReturn = Boolean(
          oauthParams.get('access_token') &&
          oauthParams.get('refresh_token')
        );
      } catch (e) { }

      var h = Boolean(authRaw) || oauthReturn;

      document.documentElement.dataset.atlasAccountHint =
        h ? 'account' : 'anonymous';

      if (h) {
        document.documentElement.dataset.atlasCompassCloudAuthority =
          'pending';
      }

      if (!userId) return;

      try {
        var cachedRaw = localStorage.getItem(
          hubCachePrefix + userId
        );

        if (!cachedRaw) return;

        var cached = JSON.parse(cachedRaw);

        var scopeOwner = String(
          localStorage.getItem(
            'atlas::persistenceTrust::scopeOwner::v1'
          ) || ''
        ).trim();

        if (
          !cached ||
          cached.version !== hubCacheVersion ||
          cached.kind !== hubCacheKind ||
          cached.ready !== true ||
          String(cached.userId || '') !== userId ||
          scopeOwner !== 'user:' + userId ||
          !Array.isArray(cached.summaries) ||
          !Object.prototype.hasOwnProperty.call(
            cached,
            'library'
          ) ||
          (
            cached.library !== null &&
            (
              typeof cached.library !== 'object' ||
              Array.isArray(cached.library)
            )
          )
        ) {
          return;
        }

        window.AtlasCompassHubInitialSnapshot =
          cached;

        document.documentElement.dataset.atlasCompassCache =
          'ready';
      } catch (e) { }
    })();
  </script>

  <script>

      background: var(--surface-canvas);
      scroll-behavior: smooth;
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    /* ============================================================
       THEMED SCROLLBARS
       Compass page and mobile drawer use the active Compass accent.
       ============================================================ */
    html,
    .drawer-nav,
    .owned-subject-dialog-panel,
    .subject-artwork-studio,
    .subject-artwork-studio-body,
    .owned-subject-dialog-create-field textarea,
    .subject-artwork-idea-input {
      scrollbar-width: thin;
      scrollbar-color:
        rgba(var(--accent-rgb), 0.46)
        transparent;
    }

    html::-webkit-scrollbar,
    .drawer-nav::-webkit-scrollbar,
    .owned-subject-dialog-panel::-webkit-scrollbar,
    .subject-artwork-studio::-webkit-scrollbar,
    .subject-artwork-studio-body::-webkit-scrollbar,
    .owned-subject-dialog-create-field textarea::-webkit-scrollbar,
    .subject-artwork-idea-input::-webkit-scrollbar {
      width: 10px;
    }

    html::-webkit-scrollbar-track,
    .drawer-nav::-webkit-scrollbar-track,
    .owned-subject-dialog-panel::-webkit-scrollbar-track,
    .subject-artwork-studio::-webkit-scrollbar-track,
    .subject-artwork-studio-body::-webkit-scrollbar-track,
    .owned-subject-dialog-create-field textarea::-webkit-scrollbar-track,
    .subject-artwork-idea-input::-webkit-scrollbar-track {
      background: transparent;
    }

    html::-webkit-scrollbar-thumb,
    .drawer-nav::-webkit-scrollbar-thumb,
    .owned-subject-dialog-panel::-webkit-scrollbar-thumb,
    .subject-artwork-studio::-webkit-scrollbar-thumb,
    .subject-artwork-studio-body::-webkit-scrollbar-thumb,
    .owned-subject-dialog-create-field textarea::-webkit-scrollbar-thumb,
    .subject-artwork-idea-input::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: rgba(var(--accent-rgb), 0.46);
      background-clip: padding-box;
    }

    body {
      position: relative;
      isolation: isolate;
      font-family: var(--font-body);
      background: transparent;
      color: var(--text-body);
      font-size: 15px;
      line-height: 1.65;
      min-height: 100svh;
      overflow-x: clip;
      padding-top: 56px;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-size: cover;
      background-position: center;
    }

    body::before {
      background: var(--page-bg-day);
      opacity: 1;
    }

    body::after {
      background: var(--page-bg-night);
      opacity: 0;
    }

    html[data-theme="night"] body::before {
      opacity: 0;
    }

    html[data-theme="night"] body::after {
      opacity: 1;
    }

    /* ============================================================
       THEME MOTION
       Bridge owns theme state; the Hub owns surface interpolation.
       Theme changes are paint-only: geometry never participates.
       Keep expensive paint transitions on meaningful surfaces only.
       ============================================================ */

    html.theme-changing,
    html.theme-changing body,
    html.theme-changing body::before,
    html.theme-changing body::after,
    html.theme-changing .spine,
    html.theme-changing .spine-mark,
    html.theme-changing .spine-mark span,
    html.theme-changing .spine-worlds,
    html.theme-changing .spine-world-btn,
    html.theme-changing .spine-world-icon,
    html.theme-changing .spine-session-pill,
    html.theme-changing .spine-session-pill .pill-name,
    html.theme-changing .spine-btn,
    html.theme-changing .appearance-icon,
    html.theme-changing .mobile-header,
    html.theme-changing .mobile-header-mark,
    html.theme-changing .mobile-header-mark span,
    html.theme-changing .mobile-header-btn,
    html.theme-changing .mobile-session-pill,
    html.theme-changing .mobile-session-pill span,
    html.theme-changing .drawer-header,
    html.theme-changing .drawer-footer,
    html.theme-changing .drawer-title,
    html.theme-changing .drawer-title span,
    html.theme-changing .drawer-close,
    html.theme-changing .drawer-nav-label,
    html.theme-changing .drawer-nav-item,
    html.theme-changing .drawer-session-btn,
    html.theme-changing .drawer-appearance-btn,
    html.theme-changing .hub-intro,
    html.theme-changing .hub-title,
    html.theme-changing .hub-desc,
    html.theme-changing .subject-library,
    html.theme-changing .subject-library-header,
    html.theme-changing .subject-library-title,
    html.theme-changing .subject-card,
    html.theme-changing .subject-card-art,
    html.theme-changing .subject-card-manage-btn,
    html.theme-changing .subject-card-menu,
    html.theme-changing .subject-card-progress-track,
    html.theme-changing .subject-card-progress-fill,
    html.theme-changing .btn-launch,
    html.theme-changing .empty-library,
    html.theme-changing .bridge-error,
    html.theme-changing .btn-primary,
    html.theme-changing .btn-ghost,
    html.theme-changing .hub-toast,
    html.theme-changing .owned-subject-dialog-panel,
    html.theme-changing .subject-artwork-studio,
    html.theme-changing .subject-artwork-studio-preview,
    html.theme-changing .subject-artwork-studio-actions {
      transition:
        background-color var(--hub-theme-motion),
        color var(--hub-theme-motion),
        border-color var(--hub-theme-motion),
        box-shadow var(--hub-theme-motion),
        opacity var(--hub-theme-motion),
        fill var(--hub-theme-motion),
        stroke var(--hub-theme-motion);
    }

    html.theme-changing :where(
      .subject-library-title,
      .subject-library-empty-note,
      .subject-library-create-btn,
      .subject-card-title,
      .subject-card-version-badge,
      .subject-card-hook,
      .subject-card-progress-label,
      .subject-card-menu-meta,
      .subject-card-menu button
    ) {
      transition:
        background-color var(--hub-theme-motion),
        color var(--hub-theme-motion),
        border-color var(--hub-theme-motion),
        opacity var(--hub-theme-motion);
    }

    html.theme-changing :where(
      .owned-subject-dialog-panel *,
      .subject-artwork-studio *
    ) {
      transition:
        color var(--hub-theme-motion),
        border-color var(--hub-theme-motion),
        opacity var(--hub-theme-motion),
        fill var(--hub-theme-motion),
        stroke var(--hub-theme-motion);
    }

    html.theme-changing .drawer {
      transition:
        transform var(--hub-theme-motion),
        background-color var(--hub-theme-motion),
        color var(--hub-theme-motion),
        border-color var(--hub-theme-motion),
        box-shadow var(--hub-theme-motion),
        opacity var(--hub-theme-motion);
    }

    /*
     * Modal invariant: when a Compass Hub dialog is visible, only the
     * dialog may scroll. The document behind it stays fixed.
     */
    html:has(#owned-subject-dialog:not([hidden])),
    body:has(#owned-subject-dialog:not([hidden])),
    html:has(#hub-cover-picker-dialog:not([hidden])),
    body:has(#hub-cover-picker-dialog:not([hidden])),
    html:has(#subject-artwork-studio-backdrop:not([hidden])),
    body:has(#subject-artwork-studio-backdrop:not([hidden])) {
      overflow: hidden !important;
      overscroll-behavior: none;
    }

    /* ============================================================
       DESKTOP SPINE AND WORLD NAVIGATION
       ============================================================ */
    .spine {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: var(--chrome-surface);
      backdrop-filter: blur(22px) saturate(1.12);
      border-bottom: 1px solid var(--chrome-border);
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 1.5rem;
      gap: 0.5rem;
    }

    .spine-mark {
      font-family: var(--font-display);
      font-size: 1.22rem;
      font-weight: 400;
      color: var(--text-heading);
      letter-spacing: -0.01em;
      flex: 1 1 0;
      cursor: default;
      user-select: none;
      white-space: nowrap;
      line-height: 1;
    }

    .spine-mark span {
      color: var(--brand-dot);
    }

    /* Hub shortcuts */
    .spine-worlds {
      display: flex;
      align-items: center;
      gap: 0.18rem;
      flex: 0 0 auto;
      padding: 0.2rem;
      border-radius: 999px;
      background: var(--world-nav-surface);
      border: 1px solid var(--world-nav-border);
      box-shadow: var(--world-nav-inset-shadow);
    }

    .spine-world-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      min-height: 32px;
      padding: 0.32rem 0.82rem;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .spine-world-icon {
      width: 13px;
      height: 13px;
      opacity: 0.72;
      flex-shrink: 0;
    }

    .spine-world-btn:hover {
      color: var(--text-body);
      background: var(--world-nav-hover);
      border-color: var(--world-nav-border);
      box-shadow: var(--world-nav-hover-shadow);
    }

    .spine-world-btn:hover .spine-world-icon {
      opacity: 1;
    }

    .spine-world-btn.is-active {
      color: var(--world-nav-active-text);
      background: var(--world-nav-active);
      border-color: var(--world-nav-active-border);
      box-shadow: var(--shadow-xs);
      cursor: default;
    }

    .spine-world-btn.is-active .spine-world-icon {
      opacity: 1;
    }

    .spine-world-btn[aria-disabled="true"] {
      opacity: 0.5;
      cursor: default;
    }

    .spine-world-btn[aria-disabled="true"]:hover {
      color: var(--text-muted);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    /* Header actions */
    .spine-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1 1 0;
      justify-content: flex-end;
    }

    .spine-session-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.48rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-surface);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--control-text);
      cursor: pointer;
      transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
    }

    .spine-session-pill:hover {
      border-color: var(--control-border-hover);
      background: var(--control-hover);
      color: var(--control-text-hover);
      box-shadow: var(--control-hover-shadow);
    }

    .spine-session-pill .pill-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spine-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--control-border);
      background: var(--control-surface);
      color: var(--control-icon);
      cursor: pointer;
      transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--control-shadow);
      flex-shrink: 0;
    }

    .spine-btn:hover {
      color: var(--control-text-hover);
      background: var(--control-hover);
      border-color: var(--control-border-hover);
      box-shadow: var(--control-hover-shadow);
    }

    .appearance-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      flex-shrink: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .appearance-icon--moon {
      opacity: var(--appearance-moon-opacity);
    }

    .appearance-icon--sun {
      opacity: var(--appearance-sun-opacity);
    }

    /* ============================================================
       MOBILE HEADER AND DRAWER
       ============================================================ */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: var(--chrome-surface-mobile);
      backdrop-filter: blur(20px) saturate(1.1);
      border-bottom: 1px solid var(--chrome-border);
      height: 56px;
      padding: 0 1rem;
      align-items: center;
      gap: 0.5rem;
    }

    .mobile-header-brand {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex: 1;
      min-width: 0;
    }

    .mobile-header-mark {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--text-heading);
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .mobile-header-mark span {
      color: var(--brand-dot);
    }

    .mobile-header-actions {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .mobile-header-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--mobile-control-border);
      background: var(--mobile-control-surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--t);
      flex-shrink: 0;
    }

    .mobile-header-btn:hover {
      color: var(--text-body);
      background: var(--mobile-control-hover);
    }

    .mobile-session-pill {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      border: 1px solid var(--mobile-control-border);
      background: var(--mobile-control-surface);
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      max-width: 130px;
      height: 40px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mobile-session-pill span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Mobile drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: var(--drawer-scrim);
      z-index: 400;
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.2s ease,
        visibility 0s linear 0.2s;
    }

    .drawer-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        opacity 0.2s ease,
        visibility 0s;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(300px, 85vw);
      background: var(--surface-panel);
      z-index: 500;
      display: flex;
      flex-direction: column;
      box-shadow: var(--drawer-shadow);
      transform: translate3d(-100%, 0, 0);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
      backface-visibility: hidden;
    }

    .drawer.open {
      transform: translate3d(0, 0, 0);
    }

    .drawer-header {
      padding: 1.2rem 1.2rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--drawer-section-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--text-heading);
    }

    .drawer-title span {
      color: var(--brand-dot);
    }

    .drawer-close {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
    }

    .drawer-close:hover {
      background: var(--surface-muted);
    }

    .drawer-nav {
      flex: 1;
      padding: 0.8rem;
      overflow-y: auto;
    }

    .drawer-nav-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.82;
      padding: 0.6rem 0.75rem 0.35rem;
    }

    .drawer-nav-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--t);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      min-height: 44px;
    }

    .drawer-nav-item:hover {
      background: var(--navigation-hover);
      color: var(--text-body);
    }

    .drawer-nav-item[aria-disabled="true"] {
      opacity: 0.5;
      cursor: default;
    }

    .drawer-nav-item[aria-disabled="true"]:hover {
      background: none;
      color: var(--text-muted);
    }

    .drawer-nav-item .nav-soon {
      margin-left: auto;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .drawer-nav-item.is-active {
      background: var(--accent-dim);
      color: var(--accent);
      cursor: default;
    }

    .drawer-nav-item.is-active:hover {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .drawer-footer {
      padding: 0.8rem;
      border-top: 1px solid var(--border-subtle);
      background: var(--drawer-section-surface);
    }

    .drawer-footer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.5rem;
    }

    .drawer-session-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--drawer-button-surface);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 44px;
      overflow: hidden;
    }

    .drawer-session-btn span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drawer-appearance-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--drawer-button-surface);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ============================================================
       MAIN HUB LAYOUT AND INTRODUCTION
       ============================================================ */
    .hub-main {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 3.35rem 1.75rem 6rem;
      animation: hubPageFadeIn 0.45s ease both;
    }

    /* Hub introduction */
    .hub-intro {
      padding: 0 0 1.25rem;
      margin-bottom: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hub-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4.4vw, 2.75rem);
      color: var(--text-heading);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 0.68rem;
    }

    .hub-topic-rotator {
      display: grid;
      margin-top: 0.08em;
      color: var(--accent);
    }

    .hub-topic {
      grid-area: 1 / 1;
      opacity: 0;
      animation: hub-topic-cycle 80s ease-in-out infinite;
      animation-delay: calc(
        var(--topic-delay) - var(--topic-phase, 0ms)
      );
    }

    @keyframes hub-topic-cycle {
      0% {
        opacity: 0;
      }

      1%,
      9% {
        opacity: 1;
      }

      10%,
      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hub-topic {
        animation: none;
        opacity: 0;
      }

      .hub-topic:first-child {
        opacity: 1;
      }
    }

    .hub-desc {
      font-size: 0.94rem;
      color: var(--text-body);
      opacity: 0.68;
      font-weight: 400;
      line-height: 1.7;
      max-width: 58ch;
    }

    .hub-intro-text {
      flex: 1 1 620px;
      min-width: 0;
    }

    .owned-subject-dialog-idea {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .owned-subject-dialog-idea-mode-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      min-height: 44px;
      padding: 0.48rem 0.78rem;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--t);
    }

    .owned-subject-dialog-idea-mode-btn:hover,
    .owned-subject-dialog-idea-mode-btn:focus-visible {
      border-color: rgba(var(--accent-rgb), 0.38);
      background: var(--accent-dim);
      color: var(--accent);
      outline: none;
    }

    .owned-subject-dialog-idea-mode-btn svg {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      opacity: 0.72;
    }

    .owned-subject-dialog-idea-mode-btn[hidden] {
      display: none;
    }

    .owned-subject-dialog-idea-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.62rem;
      min-height: 44px;
      padding: 0.48rem 1rem 0.48rem 0.5rem;
      overflow: hidden;
      border: 1px solid rgba(var(--accent-rgb), 0.34);
      border-radius: 999px;
      background:
        radial-gradient(
          circle at 18% 12%,
          rgba(255, 255, 255, 0.48),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          rgba(var(--accent-rgb), 0.14),
          rgba(var(--accent-rgb), 0.045) 58%,
          rgba(var(--accent-soft-rgb), 0.10)
        ),
        var(--surface-raised);
      color: var(--text-heading);
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: -0.005em;
      white-space: nowrap;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.58),
        0 3px 10px rgba(var(--accent-rgb), 0.08);
      transition:
        transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .owned-subject-dialog-idea-btn svg {
      width: 30px;
      height: 30px;
      padding: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 3px 9px rgba(var(--accent-rgb), 0.24);
      transition:
        transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 180ms ease;
    }

    .owned-subject-dialog-idea-btn:hover {
      border-color: rgba(var(--accent-rgb), 0.58);
      background:
        radial-gradient(
          circle at 18% 12%,
          rgba(255, 255, 255, 0.58),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          rgba(var(--accent-rgb), 0.20),
          rgba(var(--accent-rgb), 0.07) 58%,
          rgba(var(--accent-soft-rgb), 0.14)
        ),
        var(--surface-raised-hover);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.68),
        0 9px 24px rgba(var(--accent-rgb), 0.16);
      transform: translateY(-2px);
    }

    .owned-subject-dialog-idea-btn:hover svg {
      transform: rotate(9deg) scale(1.04);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.20),
        0 5px 14px rgba(var(--accent-rgb), 0.30);
    }

    .owned-subject-dialog-idea-btn:active {
      transform: translateY(0);
    }

    .owned-subject-dialog-idea-btn:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.32);
      outline-offset: 3px;
    }

    .owned-subject-dialog-idea-btn:disabled {
      opacity: 0.62;
      cursor: wait;
      transform: none;
    }

    .owned-subject-dialog-idea-btn:disabled svg {
      transform: none;
    }

    .compass-recommendation-region:empty {
      display: none;
    }

    .compass-recommendation-panel {
      margin-top: 0.15rem;
      padding: 1.35rem 1.45rem 0.25rem;
      border: 1px solid rgba(var(--accent-rgb), 0.20);
      border-radius: var(--radius-lg);
      background: var(--library-surface);
      box-shadow: var(--library-shadow);
      animation: hubPageFadeIn 0.28s ease both;
    }

    .compass-recommendation-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.35rem;
    }

    .compass-recommendation-head
    .compass-recommendation-kicker {
      margin-bottom: 0;
    }

    .compass-recommendation-count {
      margin-left: 0.38rem;
      color: var(--text-subtle);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .compass-recommendation-actions {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .compass-recommendation-control {
      min-height: 28px;
      padding: 0.28rem 0.48rem;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.72rem;
      cursor: pointer;
      transition: var(--t);
    }

    .compass-recommendation-control:hover,
    .compass-recommendation-control:focus-visible {
      border-color: var(--border-subtle);
      background: var(--surface-raised);
      color: var(--text-heading);
      outline: none;
    }

    .compass-recommendation-control--change {
      min-height: 30px;
      padding: 0.32rem 0.68rem;
      border-color: rgba(var(--accent-rgb), 0.28);
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 600;
    }

    .compass-recommendation-control--change:hover,
    .compass-recommendation-control--change:focus-visible {
      border-color: rgba(var(--accent-rgb), 0.44);
      background: var(--accent-pale);
      color: var(--accent);
    }

    .compass-recommendation-kicker {
      margin-bottom: 0.35rem;
      color: var(--accent);
      font-size: 0.69rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .compass-recommendation-message {
      margin: 0 0 0.75rem;
      color: var(--text-heading);
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 2.3vw, 1.4rem);
      font-weight: 400;
      line-height: 1.3;
    }

    .compass-recommendation-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
      width: 100%;
      padding: 1rem 0;
      border: 0;
      border-top: 1px solid var(--border-faint);
      background: transparent;
      color: inherit;
      font-family: var(--font-body);
      text-align: left;
      cursor: pointer;
    }

    .compass-recommendation-copy {
      min-width: 0;
    }

    .compass-recommendation-title {
      display: block;
      margin-bottom: 0.22rem;
      color: var(--text-heading);
      font-size: 0.94rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .compass-recommendation-reason {
      display: block;
      color: var(--text-muted);
      font-size: 0.83rem;
      line-height: 1.55;
    }

    .compass-recommendation-source {
      display: block;
      margin-top: 0.32rem;
      color: var(--text-subtle);
      font-size: 0.72rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .compass-recommendation-arrow {
      color: var(--accent);
      transition: transform var(--t);
    }

    .compass-recommendation-row:hover
    .compass-recommendation-title {
      color: var(--accent);
    }

    .compass-recommendation-row:hover
    .compass-recommendation-arrow {
      transform: translateX(3px);
    }

    .compass-recommendation-row:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.28);
      outline-offset: 4px;
      border-radius: var(--radius-sm);
    }

    .compass-recommendation-panel--state {
      padding-bottom: 1.25rem;
    }

    .compass-recommendation-state {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .compass-recommendation-mode {
      margin-left: 0.18rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .compass-recommendation-panel--chooser {
      padding-bottom: 1.35rem;
    }

    .compass-idea-mode-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(150px, 1fr)
        );
      gap: 0.55rem;
      margin-top: 0.95rem;
    }

    .compass-idea-focus-field {
      display: grid;
      gap: 0.42rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-faint);
    }

    .compass-idea-focus-label {
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .compass-idea-focus-input {
      width: 100%;
      min-height: 42px;
      padding: 0.62rem 0.75rem;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--surface-raised);
      color: var(--text-heading);
      font: inherit;
      font-size: 0.84rem;
      outline: none;
      transition: var(--t);
    }

    .compass-idea-focus-input::placeholder {
      color: var(--text-subtle);
    }

    .compass-idea-focus-input:focus {
      border-color: var(--accent);
      box-shadow:
        0 0 0 3px
        rgba(var(--accent-rgb), 0.10);
    }

    .compass-idea-mode-btn {
      min-height: 46px;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--border-faint);
      border-radius: 12px;
      background: var(--surface-raised);
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-xs);
      transition: var(--t);
    }

    .compass-idea-mode-btn:hover,
    .compass-idea-mode-btn:focus-visible {
      border-color: rgba(var(--accent-rgb), 0.42);
      background: var(--surface-raised-hover);
      color: var(--accent);
      outline: none;
      transform: translateY(-1px);
    }

    .compass-idea-mode-btn.is-current {
      border-color: rgba(var(--accent-rgb), 0.36);
      background: var(--accent-dim);
      color: var(--accent);
    }

    /* ============================================================
       SUBJECT LIBRARY
       One curated operational collection.
       ============================================================ */

    .subject-library {
      margin-top: 2rem;
      padding: 0;
    }

    .subject-library-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.15rem;
    }

    .subject-library-title {
      font-family: var(--font-display);
      font-size: 1.65rem;
      line-height: 1.25;
      font-weight: 400;
      color: var(--text-heading);
    }

    .subject-library-actions {
      display: flex;
      align-items: center;
      gap: 0.42rem;
      margin-left: auto;
    }

    .subject-category-management.subject-card-management {
      position: relative;
      top: auto;
      right: auto;
      z-index: 15;
    }

    .subject-category-manage-btn.subject-card-manage-btn {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .subject-category-manage-btn.subject-card-manage-btn:hover,
    .subject-category-manage-btn.subject-card-manage-btn[aria-expanded="true"] {
      border-color: var(--control-border);
      background: var(--control-surface);
      box-shadow: var(--shadow-xs);
    }

    .subject-category-menu.subject-card-menu {
      z-index: 20;
      width: 160px;
    }

    .subject-library-create-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.38rem;
      min-height: 34px;
      padding: 0.38rem 0.72rem;
      border: 1px solid rgba(var(--accent-rgb), 0.24);
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: var(--t);
      white-space: nowrap;
    }

    .subject-library-create-btn:hover {
      border-color: rgba(var(--accent-rgb), 0.42);
      background: var(--accent-pale);
      color: var(--accent);
    }

    .subject-library-create-plus {
      font-size: 1rem;
      font-weight: 400;
      line-height: 1;
    }

    .subject-library-empty-note {
      padding: 0.25rem 0 0.15rem;
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .anonymous-create-hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      min-height: 172px;
      padding: 1.45rem 1.55rem;
      overflow: hidden;
      border: var(--card-border-width) solid rgba(var(--accent-rgb), 0.24);
      border-radius: 20px;
      background:
        linear-gradient(
          135deg,
          rgba(var(--accent-rgb), 0.09),
          rgba(var(--accent-rgb), 0.025) 48%,
          transparent 72%
        ),
        var(--card-surface);
      color: var(--text-body);
      text-align: left;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: var(--t);
    }

    .anonymous-create-hero:hover {
      border-color: rgba(var(--accent-rgb), 0.44);
      background:
        linear-gradient(
          135deg,
          rgba(var(--accent-rgb), 0.13),
          rgba(var(--accent-rgb), 0.04) 48%,
          transparent 72%
        ),
        var(--card-surface-hover);
      box-shadow:
        0 0 0 var(--card-emphasis-ring-width)
          rgba(var(--accent-rgb), 0.12),
        var(--card-hover-shadow);
      transform: translateY(-2px);
    }

    .anonymous-create-hero:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.34);
      outline-offset: 3px;
    }

    .anonymous-create-hero-copy {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 0.58rem;
      max-width: 640px;
    }

    .anonymous-create-hero-kicker {
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .anonymous-create-hero-title {
      font-family: var(--font-display);
      font-size: clamp(1.28rem, 2.2vw, 1.52rem);
      font-weight: 400;
      line-height: 1.24;
      color: var(--text-heading);
    }

    .anonymous-create-hero-description {
      max-width: 580px;
      color: var(--text-muted);
      font-size: 0.84rem;
      line-height: 1.62;
    }

    .anonymous-create-hero-action {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      width: fit-content;
      margin-top: 0.12rem;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 650;
      line-height: 1.2;
    }

    .anonymous-create-hero-action svg {
      transition: transform var(--t);
    }

    .anonymous-create-hero:hover
    .anonymous-create-hero-action svg {
      transform: translateX(2px);
    }

    .anonymous-create-hero-mark {
      position: relative;
      z-index: 1;
      display: grid;
      width: 104px;
      height: 104px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(var(--accent-rgb), 0.2);
      border-radius: 50%;
      background: rgba(var(--accent-rgb), 0.07);
      color: var(--accent);
      box-shadow:
        inset 0 0 0 16px rgba(var(--accent-rgb), 0.025);
    }

    .anonymous-create-hero-mark::before,
    .anonymous-create-hero-mark::after {
      position: absolute;
      content: '';
      border: 1px solid rgba(var(--accent-rgb), 0.13);
      border-radius: 50%;
    }

    .anonymous-create-hero-mark::before {
      inset: 14px;
    }

    .anonymous-create-hero-mark::after {
      inset: 28px;
    }

    .anonymous-create-hero-mark svg {
      position: relative;
      z-index: 2;
      width: 34px;
      height: 34px;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.35rem;
    }

    /* ============================================================
       SUBJECT CARDS AND PROGRESS STATES
       ============================================================ */

    .subject-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 230px;
      padding: 1.4rem 1.4rem 1.35rem;
      overflow: hidden;
      border: var(--card-border-width) solid var(--card-border);
      border-radius: 20px;
      background: var(--card-surface);
      color: var(--text-body);
      text-align: left;
      text-decoration: none;
      box-shadow: var(--card-shadow);
      transition: var(--t);
    }

    .subject-card:hover {
      border-color: var(--card-hover-border);
      background: var(--card-surface-hover);
      box-shadow:
        0 0 0 var(--card-emphasis-ring-width) var(--card-hover-border),
        var(--card-hover-shadow);
      transform: translateY(-2px);
    }

    .subject-card:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.34);
      outline-offset: 3px;
    }

    /* Owned cards keep the same visual component, but separate
       the primary open action from subject-management actions. */
    .subject-card--owned {
      cursor: pointer;
    }

    .subject-card--owned:has(
      .subject-card-manage-btn[aria-expanded="true"]
    ) {
      overflow: visible;
      z-index: 30;
    }

    .subject-card-open-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      cursor: pointer;
    }

    .subject-card-open-layer:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.34);
      outline-offset: -4px;
    }

    .subject-card--owned .subject-card-header {
      padding-right: 2.7rem;
    }

    .subject-card-management {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 6;
    }

    .subject-card-manage-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--control-surface);
      color: var(--control-icon);
      cursor: pointer;
      box-shadow: var(--shadow-xs);
      transition: var(--t);
    }

    .subject-card-manage-btn:hover,
    .subject-card-manage-btn[aria-expanded="true"] {
      border-color: var(--control-border-hover);
      background: var(--control-hover);
      color: var(--control-text-hover);
      box-shadow: var(--control-hover-shadow);
    }

    .subject-card-manage-btn:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb), 0.34);
      outline-offset: 2px;
    }

    .subject-card-menu {
      position: absolute;
      top: calc(100% + 0.42rem);
      right: 0;
      width: 154px;
      padding: 0.32rem;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface-panel);
      box-shadow: var(--shadow-md);
    }

    .subject-card-menu.is-flipped {
      top: auto;
      bottom: calc(100% + 0.42rem);
    }

    .subject-card-menu[hidden] {
      display: none;
    }

    .subject-card-menu-meta {
      padding: 0.58rem 0.72rem 0.38rem;
      color: var(--text-subtle);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.085em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .subject-card-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 36px;
      padding: 0.45rem 0.62rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: var(--t);
    }

    .subject-card-menu button:hover,
    .subject-card-menu button:focus-visible {
      background: var(--surface-muted);
      color: var(--text-heading);
      outline: none;
    }

    .subject-card-menu button.is-danger {
      color: var(--danger-text);
    }

    .subject-card-menu button.is-danger:hover,
    .subject-card-menu button.is-danger:focus-visible {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .subject-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.72rem;
    }

    .subject-card-title {
      font-family: var(--font-display);
      font-size: 1.16rem;
      line-height: 1.28;
      font-weight: 400;
      color: var(--text-heading);
    }

    .subject-card-title-block {
      display: grid;
      gap: 0.34rem;
      min-width: 0;
    }

    .subject-card-hook {
      margin-bottom: 0;
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.58;
    }

    .subject-card-header,
    .subject-card-hook,
    .subject-card-footer {
      position: relative;
      z-index: 2;
    }

    .subject-card--has-art .subject-card-header {
      max-width: 78%;
    }

    .subject-card--has-art .subject-card-hook {
      max-width: 68%;
    }

    .subject-card--inprogress .subject-card-hook,
    .subject-card--explored .subject-card-hook {
      padding-bottom: 1.5rem;
    }

    .subject-card-art {
      position: absolute;
      z-index: 1;
      top: 1.05rem;
      right: 1.05rem;
      bottom: 4.15rem;
      width: 31%;
      max-width: 10.5rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: var(--accent);
      opacity: 0;
      pointer-events: none;
      transform: translate3d(9px, 1px, 0) scale(0.96);
      transform-origin: center right;
      transition:
        opacity 0.32s ease,
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .subject-card-art svg {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 7.6rem;
      overflow: visible;
    }

    .subject-card-art path,
    .subject-card-art circle,
    .subject-card-art rect,
    .subject-card-art line {
      vector-effect: non-scaling-stroke;
    }

    .subject-card:is(:hover, :focus-visible) .subject-card-art {
      opacity: var(--subject-art-hover-opacity);
      transform: translate3d(0, 0, 0) scale(1);
    }

    .travel-map,
    .travel-pin,
    .travel-spark {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.3s ease;
    }

    .travel-route {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition:
        stroke-dashoffset 0.78s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .travel-pin {
      transform-origin: center bottom;
      transform: translateY(4px);
    }

    .travel-spark {
      opacity: 0.52;
      transform: rotate(-8deg) scale(0.84);
    }

    .subject-card:is(:hover, :focus-visible) .travel-map {
      transform: translateY(1px);
    }

    .subject-card:is(:hover, :focus-visible) .travel-route {
      stroke-dashoffset: 0;
    }

    .subject-card:is(:hover, :focus-visible) .travel-pin {
      transform: translateY(0);
    }

    .subject-card:is(:hover, :focus-visible) .travel-spark {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .food-pot,
    .food-lid,
    .food-bowl,
    .food-steam {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.34s ease,
        stroke-dashoffset 0.72s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .food-pot {
      transform-origin: center bottom;
      transform: translateY(3px) scale(0.98);
    }

    .food-lid {
      transform-origin: center bottom;
      transform: translateY(4px) rotate(-2deg);
    }

    .food-bowl--left {
      transform: translate(3px, 2px) rotate(2deg);
    }

    .food-bowl--right {
      transform: translate(-3px, 3px) rotate(-3deg);
    }

    .food-steam {
      opacity: 0.38;
    }

    .food-steam path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition:
        stroke-dashoffset 0.76s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.34s ease;
    }

    .subject-card:is(:hover, :focus-visible) .food-pot {
      transform: translateY(0) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .food-lid {
      transform: translateY(-4px) rotate(2deg);
    }

    .subject-card:is(:hover, :focus-visible) .food-bowl--left {
      transform: translate(-2px, 0) rotate(-1deg);
    }

    .subject-card:is(:hover, :focus-visible) .food-bowl--right {
      transform: translate(2px, 0) rotate(1deg);
    }

    .subject-card:is(:hover, :focus-visible) .food-steam {
      opacity: 1;
    }

    .subject-card:is(:hover, :focus-visible) .food-steam path {
      stroke-dashoffset: 0;
    }

    .humour-jester,
    .humour-jester-point,
    .humour-jester-band,
    .humour-jester-fold,
    .humour-jester-spark {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease;
    }

    .humour-jester {
      transform: translateY(3px) rotate(-2deg) scale(0.96);
    }

    .humour-jester-point {
      transform-origin: center bottom;
    }

    .humour-jester-point--left {
      transform: rotate(4deg) translateY(2px);
    }

    .humour-jester-point--centre {
      transform: translateY(4px) scaleY(0.96);
    }

    .humour-jester-point--right {
      transform: rotate(-4deg) translateY(2px);
    }

    .humour-jester-band {
      transform: scaleX(0.98);
    }

    .humour-jester-fold {
      opacity: 0.56;
    }

    .humour-jester-spark {
      opacity: 0.4;
      transform: rotate(-10deg) scale(0.8);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester {
      transform: translateY(0) rotate(0deg) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-point--left {
      transform: rotate(-2deg) translateY(-1px);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-point--centre {
      transform: translateY(-3px) scaleY(1);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-point--right {
      transform: rotate(2deg) translateY(-2px);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-band {
      transform: scaleX(1);
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-fold {
      opacity: 1;
    }

    .subject-card:is(:hover, :focus-visible) .humour-jester-spark {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .work-briefcase,
    .work-handle,
    .work-document,
    .work-latch {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease;
    }

    .work-briefcase {
      transform-origin: center bottom;
      transform: translateY(2px) scale(0.98);
    }

    .work-handle {
      transform-origin: center bottom;
      transform: translateY(4px) scaleY(0.94);
    }

    .work-document {
      opacity: 0;
      transform: translateY(11px);
    }

    .work-latch {
      transform: scale(0.92);
    }

    .subject-card:is(:hover, :focus-visible) .work-briefcase {
      transform: translateY(0) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .work-handle {
      transform: translateY(-2px) scaleY(1);
    }

    .subject-card:is(:hover, :focus-visible) .work-document {
      opacity: 0.88;
      transform: translateY(0);
    }

    .subject-card:is(:hover, :focus-visible) .work-latch {
      transform: scale(1.04);
    }

    .technology-chip,
    .technology-core,
    .technology-trace,
    .technology-node,
    .technology-spark {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease,
        stroke-dashoffset 0.74s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .technology-chip {
      transform: translateY(2px) scale(0.98);
    }

    .technology-core {
      transform: scale(0.93);
    }

    .technology-trace {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .technology-node {
      opacity: 0.48;
      transform: scale(0.82);
    }

    .technology-spark {
      opacity: 0.44;
      transform: rotate(-9deg) scale(0.82);
    }

    .subject-card:is(:hover, :focus-visible) .technology-chip {
      transform: translateY(0) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .technology-core {
      transform: scale(1.03);
    }

    .subject-card:is(:hover, :focus-visible) .technology-trace {
      stroke-dashoffset: 0;
    }

    .subject-card:is(:hover, :focus-visible) .technology-node {
      opacity: 1;
      transform: scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .technology-spark {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .stories-screen,
    .stories-play,
    .stories-page,
    .stories-thread {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.32s ease,
        stroke-dashoffset 0.76s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stories-screen {
      transform: translateY(2px) scale(0.98);
    }

    .stories-play {
      opacity: 0.52;
      transform: scale(0.86);
    }

    .stories-page--left {
      transform-origin: right bottom;
      transform: rotate(1deg);
    }

    .stories-page--right {
      transform-origin: left bottom;
      transform: rotate(-1deg);
    }

    .stories-thread {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0.5;
    }

    .subject-card:is(:hover, :focus-visible) .stories-screen {
      transform: translateY(0) scale(1);
    }

    .subject-card:is(:hover, :focus-visible) .stories-play {
      opacity: 1;
      transform: scale(1.05);
    }

    .subject-card:is(:hover, :focus-visible) .stories-page--left {
      transform: rotate(-1.5deg);
    }

    .subject-card:is(:hover, :focus-visible) .stories-page--right {
      transform: rotate(2deg) translateY(-1px);
    }

    .subject-card:is(:hover, :focus-visible) .stories-thread {
      stroke-dashoffset: 0;
      opacity: 1;
    }

    .subject-card-footer {
      position: absolute;
      left: 1.4rem;
      right: 1.4rem;
      bottom: 1.35rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.8rem;
      margin-top: 0;
    }

    .subject-card-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.14rem;
      min-width: 0;
      transform: translateY(2px);
    }

    .subject-card-progress-label {
      color: var(--accent);
      font-size: 0.69rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .btn-launch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      min-width: 100px;
      min-height: 38px;
      padding: 0.44rem 0.9rem;
      flex-shrink: 0;
      margin-left: auto;
      border: 1px solid var(--launch-border);
      border-radius: 999px;
      background: var(--launch-surface);
      color: var(--launch-text);
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      transition: var(--t);
      box-shadow: var(--launch-shadow);
    }

    .subject-card:hover .btn-launch {
      border-color: var(--launch-hover-border);
      background: var(--launch-hover-surface);
      color: var(--launch-hover-text);
      box-shadow: var(--launch-hover-shadow);
      transform: translateY(-1px);
    }

    /* Progress states */

    .subject-card-progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      overflow: hidden;
      background: rgba(var(--accent-rgb), 0.09);
    }

    .subject-card-progress-fill {
      display: block;
      width: var(--subject-progress);
      height: 100%;
      background: var(--accent);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .subject-card--inprogress {
      border-color: var(--card-inprogress-border);
      box-shadow:
        0 0 0 var(--card-emphasis-ring-width) var(--card-inprogress-border),
        var(--card-shadow);
    }

    .subject-card--inprogress .btn-launch {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      box-shadow: var(--launch-inprogress-shadow);
    }

    .subject-card--inprogress:hover .btn-launch {
      background: var(--accent-soft);
      border-color: var(--accent-soft);
    }

    .subject-card--explored {
      background: var(--card-explored-surface);
      border-color: var(--card-explored-border);
    }

    /* ============================================================
       EMPTY AND ERROR STATES
       ============================================================ */
    .empty-library {
      text-align: center;
      padding: 4rem 1rem;
    }

    .empty-library-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      color: var(--accent);
    }

    .empty-library h2 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--text-heading);
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .empty-library p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 44ch;
      margin: 0 auto;
    }

    /* Bridge error */
    .bridge-error {
      max-width: 480px;
      margin: 4rem auto;
      text-align: center;
      padding: 0 1rem;
    }

    .bridge-error h2 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--text-heading);
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .bridge-error p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    /* ============================================================
       HUB-OWNED DIALOG AND ACTIONS
       ============================================================ */

    .owned-subject-dialog {
      position: fixed;
      inset: 0;
      z-index: 850;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: var(--surface-scrim);
      backdrop-filter: blur(6px);
    }

    .owned-subject-dialog[hidden] {
      display: none;
    }

    .owned-subject-dialog-panel {
      width: min(500px, 100%);
      max-height: calc(100dvh - 2.5rem);
      padding: 1.45rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      border: var(--dialog-border);
      border-radius: var(--radius-lg);
      background: var(--surface-panel);
      box-shadow: var(--shadow-lg);
    }

    .owned-subject-dialog:has(
      #owned-subject-dialog-create-fields:not([hidden])
    ) .owned-subject-dialog-panel {
      width: min(620px, 100%);
    }

    .owned-subject-dialog-kicker {
      margin-bottom: 0.48rem;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .owned-subject-dialog-title {
      margin-bottom: 0.55rem;
      color: var(--text-heading);
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.2;
    }

    .owned-subject-dialog-copy {
      margin-bottom: 1.15rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .owned-subject-dialog-field {
      display: grid;
      gap: 0.42rem;
      margin-bottom: 1.15rem;
    }

    .owned-subject-dialog-field[hidden],
    .owned-subject-dialog-error[hidden] {
      display: none;
    }

    .owned-subject-dialog-field span {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .owned-subject-dialog-field input {
      width: 100%;
      min-height: 44px;
      padding: 0.65rem 0.78rem;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--surface-raised);
      color: var(--text-heading);
      font: inherit;
      outline: none;
      transition: var(--t);
    }

    .owned-subject-dialog-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.10);
    }

    .owned-subject-dialog-create-fields {
      display: grid;
      gap: 0.9rem;
      margin-bottom: 1.15rem;
    }

    .owned-subject-dialog-create-grid {
      display: grid;
      grid-template-columns:
        0.75fr 1.2fr 1.1fr 0.9fr;
      gap: 0.72rem;
    }

    .owned-subject-dialog-create-fields[hidden] {
      display: none;
    }

    .owned-subject-dialog-create-field {
      position: relative;
      display: grid;
      gap: 0.42rem;
    }

    .owned-subject-dialog-create-field > span {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .owned-subject-dialog-create-label {
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      min-width: 0;
    }

    .owned-subject-dialog-info {
      display: inline-grid;
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .owned-subject-dialog-info:hover,
    .owned-subject-dialog-info:focus-visible,
    .owned-subject-dialog-info[aria-expanded="true"] {
      border-color: rgba(var(--accent-rgb), 0.5);
      color: var(--accent);
      outline: none;
    }

    .owned-subject-dialog-info-popover {
      position: absolute;
      z-index: 20;
      top: 1.65rem;
      right: 0;
      width: min(260px, calc(100vw - 2rem));
      padding: 0.78rem 0.82rem;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--surface-panel);
      color: var(--text-body);
      box-shadow: var(--shadow-md);
      font-size: 0.73rem;
      font-weight: 400;
      line-height: 1.45;
    }

    .owned-subject-dialog-info-popover[hidden] {
      display: none;
    }

    .owned-subject-dialog-info-popover strong {
      color: var(--text-heading);
      font-weight: 650;
    }

    .owned-subject-dialog-info-popover p {
      margin: 0;
    }

    .owned-subject-dialog-info-popover p + p {
      margin-top: 0.42rem;
    }

    .owned-subject-dialog-info-popover-intro {
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    .owned-subject-dialog-create-field select,
    .owned-subject-dialog-create-field textarea {
      width: 100%;
      padding: 0.65rem 0.78rem;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--surface-raised);
      color: var(--text-heading);
      font: inherit;
      outline: none;
      transition: var(--t);
    }

    .owned-subject-dialog-create-field select {
      min-height: 44px;
      padding-right: 2.5rem;
      appearance: none;
      -webkit-appearance: none;
      background-image:
        linear-gradient(
          45deg,
          transparent 50%,
          var(--text-muted) 50%
        ),
        linear-gradient(
          135deg,
          var(--text-muted) 50%,
          transparent 50%
        );
      background-position:
        calc(100% - 1.05rem) calc(50% - 0.1rem),
        calc(100% - 0.81rem) calc(50% - 0.1rem);
      background-size:
        0.28rem 0.28rem,
        0.28rem 0.28rem;
      background-repeat: no-repeat;
    }

    .owned-subject-dialog-create-field textarea {
      min-height: 82px;
      resize: vertical;
      line-height: 1.5;
    }

    .owned-subject-dialog-create-field select:focus,
    .owned-subject-dialog-create-field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.10);
    }

    .owned-subject-dialog-compact-option {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      width: fit-content;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .owned-subject-dialog-compact-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .owned-subject-dialog-error {
      margin: -0.55rem 0 1rem;
      color: var(--danger-text);
      font-size: 0.76rem;
    }

    .owned-subject-dialog-upgrade {
      display: grid;
      gap: 0.38rem;
      margin: -0.1rem 0 1.05rem;
      padding: 0.95rem 1rem 0.95rem 1.05rem;
      border: 1px solid rgba(var(--accent-rgb), 0.16);
      border-radius: 14px;
      background:
        linear-gradient(
          135deg,
          rgba(var(--accent-rgb), 0.075),
          rgba(var(--accent-rgb), 0.025)
        );
      box-shadow:
        inset 3px 0 0 rgba(var(--accent-rgb), 0.40),
        0 10px 28px rgba(37, 34, 29, 0.035);
    }

    .owned-subject-dialog-upgrade[hidden] {
      display: none;
    }

    .owned-subject-dialog-upgrade strong {
      color: var(--text-heading);
      font-size: 0.84rem;
      font-weight: 650;
      line-height: 1.35;
      letter-spacing: -0.005em;
    }

    .owned-subject-dialog-upgrade p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.77rem;
      line-height: 1.5;
    }

    .owned-subject-dialog-actions {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 0.7rem 0.9rem;
    }

    .owned-subject-dialog-allowance-status {
      display: grid;
      gap: 0.12rem;
      margin-right: auto;
      padding: 0.45rem 0.62rem 0.48rem;
      border: 1px solid var(--border-faint);
      border-radius: 9px;
      background: var(--surface-raised);
      box-shadow: var(--shadow-xs);
      white-space: nowrap;
    }

    .owned-subject-dialog-allowance-status[hidden] {
      display: none;
    }

    .owned-subject-dialog-allowance-label {
      color: var(--text-subtle);
      font-size: 0.56rem;
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .owned-subject-dialog-allowance-value {
      color: var(--text-muted);
      font-size: 0.74rem;
      font-weight: 550;
      line-height: 1.3;
      letter-spacing: 0.005em;
    }

    .owned-subject-dialog-allowance-status.is-low
    .owned-subject-dialog-allowance-value {
      color: var(--allowance-low-text);
      font-weight: 650;
    }

    .owned-subject-dialog-action-buttons {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-left: auto;
    }

    .owned-subject-dialog-action-buttons .btn-primary,
    .owned-subject-dialog-action-buttons .btn-ghost {
      white-space: nowrap;
    }

    .owned-subject-dialog-choice-fields {
      display: grid;
      gap: 0.7rem;
      margin-bottom: 1.15rem;
    }

    .owned-subject-dialog-choice-fields[hidden] {
      display: none;
    }

    .owned-subject-dialog-choice-btn {
      display: grid;
      gap: 0.2rem;
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface-raised);
      color: var(--text-body);
      font-family: var(--font-body);
      text-align: left;
      cursor: pointer;
      transition: var(--t);
    }

    .owned-subject-dialog-choice-btn:hover,
    .owned-subject-dialog-choice-btn:focus-visible {
      border-color: rgba(var(--accent-rgb), 0.38);
      background: var(--accent-dim);
      outline: none;
    }

    .owned-subject-dialog-choice-btn strong {
      color: var(--text-heading);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .owned-subject-dialog-choice-btn span {
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .btn-danger {
      min-height: 42px;
      padding: 0.58rem 1.05rem;
      border: 1px solid var(--danger-border);
      border-radius: var(--radius-sm);
      background: var(--danger-bg);
      color: var(--danger-text);
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--t);
    }

    .btn-danger:hover {
      background: var(--danger-bg-hover);
    }

    .btn-primary {
      padding: 0.58rem 1.05rem;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--t);
      white-space: nowrap;
      min-height: 42px;
    }

    .btn-primary:hover {
      background: var(--accent-soft);
    }

    .btn-ghost {
      padding: 0.58rem 0.95rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--surface-muted);
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--t);
      min-height: 42px;
    }

    .btn-ghost:hover {
      border-color: var(--border-strong);
      color: var(--text-body);
    }

    /* ============================================================
       HUB COVER PICKER
       ============================================================ */

    .hub-cover-picker-panel {
      width: min(1120px, calc(100vw - 3rem));
      height: min(820px, calc(100dvh - 3rem));
      max-height: calc(100dvh - 3rem);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 1.35rem 1.5rem 1.5rem;
    }

    .hub-cover-picker-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .hub-cover-picker-kicker {
      margin: 0 0 0.45rem;
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .hub-cover-picker-title {
      margin: 0;
      color: var(--text-heading);
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 400;
      line-height: 1.2;
    }

    .hub-cover-picker-close {
      width: 2rem;
      height: 2rem;
      flex: 0 0 auto;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      transition: var(--t);
    }

    .hub-cover-picker-close:hover,
    .hub-cover-picker-close:focus-visible {
      border-color: var(--border-subtle);
      background: var(--surface-muted);
      color: var(--text-body);
      outline: none;
    }

    .hub-cover-picker-close:focus-visible {
      box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.22);
    }

    .hub-cover-picker-providers {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 1rem;
    }

    .hub-cover-picker-provider {
      min-height: 2.25rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--t);
    }

    .hub-cover-picker-provider:hover,
    .hub-cover-picker-provider:focus-visible {
      border-color: rgba(var(--accent-rgb), 0.42);
      color: var(--accent);
      outline: none;
    }

    .hub-cover-picker-provider.is-active {
      border-color: rgba(var(--accent-rgb), 0.42);
      background: rgba(var(--accent-rgb), 0.10);
      color: var(--accent);
    }

    .hub-cover-picker-search,
    .hub-cover-picker-manual-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.55rem;
      margin-top: 0.75rem;
    }

    .hub-cover-picker-search input,
    .hub-cover-picker-manual-row input {
      min-width: 0;
      min-height: 2.7rem;
      padding: 0.58rem 0.78rem;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      outline: none;
      background: var(--surface-raised);
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 0.86rem;
      transition: var(--t);
    }

    .hub-cover-picker-search input:focus,
    .hub-cover-picker-manual-row input:focus {
      border-color: rgba(var(--accent-rgb), 0.58);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.10);
    }

    .hub-cover-picker-search button,
    .hub-cover-picker-manual-row button,
    .hub-cover-picker-upload-button,
    .hub-cover-picker-custom-use,
    .hub-cover-picker-more {
      min-height: 2.7rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background: var(--surface-raised);
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--t);
    }

    .hub-cover-picker-search button:hover,
    .hub-cover-picker-manual-row button:hover,
    .hub-cover-picker-upload-button:hover,
    .hub-cover-picker-custom-use:hover,
    .hub-cover-picker-more:hover {
      border-color: rgba(var(--accent-rgb), 0.42);
      color: var(--accent);
    }

    .hub-cover-picker-layout {
      min-width: 0;
      min-height: 0;
      flex: 1 1 auto;
      margin-top: 1rem;
      overflow: hidden;
    }

    .hub-cover-picker-results-column {
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      padding-right: 0.35rem;
    }

    .hub-cover-picker-status {
      min-height: 1.4rem;
      margin-bottom: 0.75rem;
      color: var(--text-subtle);
      font-size: 0.74rem;
    }

    .hub-cover-picker-error {
      margin: 0 0 0.75rem;
      color: var(--danger-text);
      font-size: 0.76rem;
    }

    .hub-cover-picker-error[hidden] {
      display: none;
    }

    .hub-cover-picker-results {
      display: block;
      width: 100%;
      column-count: 2;
      column-gap: 1rem;
      overflow: visible;
      padding: 0.1rem 0 0.25rem;
    }

    .hub-cover-picker-result {
      position: relative;
      width: 100%;
