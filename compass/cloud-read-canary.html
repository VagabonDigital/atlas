<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compass Cloud Authority Canary</title>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:24px">Opening Compass cloud-authority canary…</p>

  <script>
    'use strict';

    (async () => {
      try {
        const response = await fetch('./index.html?cloud-canary-source=1', {
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`Compass source returned ${response.status}.`);
        }

        let html = await response.text();
        const closeScript = '</scr' + 'ipt>';

        const tutorSubjectsScript =
          '<script src="../shared/atlas-tutor-subjects.js?v=20260911-1">' + closeScript;

        const injection = [
          tutorSubjectsScript,
          '<script src="../shared/atlas-cloud.js?v=20260914-cloudwrite3">' + closeScript,
          '<script src="../shared/atlas-account.js?v=20260914-cloudwrite3">' + closeScript,
          '<script src="../shared/atlas-tutor-subjects-cloud-authority.js?v=20260914-cloudwrite3">' + closeScript,
          '<script src="../shared/atlas-cloud-authority-diagnostics.js?v=20260914-cloudwrite3">' + closeScript
        ].join('');

        if (!html.includes(tutorSubjectsScript)) {
          throw new Error('Compass Tutor Subjects bootstrap marker was not found.');
        }

        html = html.replace(
          '<head>',
          '<head><base href="/compass/">'
        );

        html = html.replace(tutorSubjectsScript, injection);

        // Keep the write proof inside the canary. Any My Subject launch generated
        // by the Hub now opens the matching subject-runtime authority canary.
        html = html.replaceAll(
          'subject/?id=',
          'subject/cloud-authority-canary.html?id='
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '';
        const pre = document.createElement('pre');
        pre.style.cssText = 'white-space:pre-wrap;padding:24px;font:14px/1.5 ui-monospace,monospace;color:#8b1e16';
        pre.textContent = `Compass cloud-authority canary failed:\n${error.message || String(error)}`;
        document.body.appendChild(pre);
      }
    })();
  </script>
</body>
</html>
