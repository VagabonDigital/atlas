<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Inbox</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20x%3D%275%27%20y%3D%275%27%20width%3D%2790%27%20height%3D%2790%27%20rx%3D%2724%27%20fill%3D%27%233F7FA3%27%2F%3E%3Cpath%20d%3D%27M20%2080V48C20%2028%2033%2015%2050%2015S80%2028%2080%2048V80H65V49C65%2039%2059%2033%2050%2033S35%2039%2035%2049V80Z%27%20fill%3D%27%23FFFFFF%27%2F%3E%3Cpath%20d%3D%27M16%2080H84%27%20stroke%3D%27%23DFF4FC%27%20stroke-width%3D%278%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --surface: #f5f1e9;
      --surface-raised: #fffdf9;
      --border: rgba(61, 56, 48, 0.14);
      --heading: #1e1b16;
      --body: #514b42;
      --muted: #7a7268;
      --accent: #4f7772;
      --danger: #b43b32;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--surface);
      color: var(--body);
      font-family: var(--font-body);
    }

    main {
      width: min(820px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 4rem 0 6rem;
    }

    h1 {
      margin: 0;
      color: var(--heading);
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 7vw, 4.8rem);
      font-weight: 400;
      line-height: 1;
    }

    .lede {
      margin: 1rem 0 2.5rem;
      color: var(--muted);
    }

    .access {
      display: flex;
      gap: 0.65rem;
      margin-bottom: 2rem;
    }

    .access[hidden],
    .inbox-toolbar[hidden] {
      display: none;
    }

    .access input {
      flex: 1;
      min-width: 0;
      padding: 0.8rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-raised);
      color: var(--heading);
      font: inherit;
      outline: none;
    }

    .access input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.8rem 1rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .status {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .status:empty {
      display: none;
    }

    .status.error {
      color: var(--danger);
    }

    .inbox-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .message-count {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 500;
    }

    .toolbar-action {
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 500;
    }

    .feedback-list {
      display: grid;
      gap: 1rem;
    }

    .feedback-card {
      padding: 1.35rem 1.4rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-raised);
    }

    .feedback-card-head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .feedback-name {
      color: var(--heading);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .feedback-date {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .feedback-message {
      margin: 0.65rem 0 1rem;
      color: var(--heading);
      font-size: 1rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .feedback-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 1.5rem;
    }

    .feedback-contact {
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
    }

    .feedback-contact:hover {
      text-decoration: underline;
    }

    .delete-action {
      margin-left: auto;
      padding: 0.35rem 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--danger);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .delete-action:hover:not(:disabled) {
      text-decoration: underline;
    }

    .confirm-dialog {
      width: min(380px, calc(100% - 2rem));
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-raised);
      color: var(--body);
      box-shadow: 0 24px 70px rgba(20, 17, 12, 0.18);
    }

    .confirm-dialog::backdrop {
      background: rgba(30, 27, 22, 0.42);
      backdrop-filter: blur(3px);
    }

    .confirm-content {
      padding: 1.4rem;
    }

    .confirm-title {
      margin: 0;
      color: var(--heading);
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 400;
    }

    .confirm-copy {
      margin: 0.55rem 0 1.35rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
    }

    .confirm-cancel {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--body);
    }

    .confirm-delete {
      background: var(--danger);
      color: white;
    }

    .empty {
      padding: 2rem;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 560px) {
      .access {
        flex-direction: column;
      }

      .access button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main>
    <h1>Atlas inbox.</h1>
    <p class="lede">
      Messages from pilot tutors.
    </p>

    <div class="access" id="access">
      <input
        id="admin-key"
        type="password"
        autocomplete="off"
        placeholder="Admin key"
        aria-label="Admin key">
      <button id="load-button" type="button">
        Open inbox
      </button>
    </div>

    <div
      class="inbox-toolbar"
      id="inbox-toolbar"
      hidden>
      <span
        class="message-count"
        id="message-count">
      </span>

      <button
        class="toolbar-action"
        id="refresh-button"
        type="button">
        Refresh
      </button>
    </div>

    <div
      class="status"
      id="status"
      role="status"
      aria-live="polite">
    </div>

    <div
      class="feedback-list"
      id="feedback-list">
    </div>
  </main>

  <dialog
    class="confirm-dialog"
    id="delete-dialog">
    <div class="confirm-content">
      <h2 class="confirm-title">
        Delete this message?
      </h2>

      <p class="confirm-copy">
        This can’t be undone.
      </p>

      <div class="confirm-actions">
        <button
          class="confirm-cancel"
          id="delete-cancel"
          type="button">
          Keep it
        </button>

        <button
          class="confirm-delete"
          id="delete-confirm"
          type="button">
          Delete
        </button>
      </div>
    </div>
  </dialog>

  <script>
    (function () {
      'use strict';

      const ENDPOINT =
        'https://atlas-ai.savvy989.workers.dev/feedback';

      const STORAGE_KEY =
        'atlas::feedbackAdminKey';

      const access =
        document.getElementById('access');

      const keyInput =
        document.getElementById('admin-key');

      const loadButton =
        document.getElementById('load-button');

      const inboxToolbar =
        document.getElementById('inbox-toolbar');

      const messageCount =
        document.getElementById('message-count');

      const refreshButton =
        document.getElementById('refresh-button');

      const status =
        document.getElementById('status');

      const list =
        document.getElementById('feedback-list');

      const deleteDialog =
        document.getElementById('delete-dialog');

      const deleteCancel =
        document.getElementById('delete-cancel');

      const deleteConfirm =
        document.getElementById('delete-confirm');

      let feedbackItems = [];

      function confirmDelete() {
        return new Promise(resolve => {
          function finish(confirmed) {
            deleteDialog.close();

            deleteCancel.removeEventListener(
              'click',
              handleCancel
            );

            deleteConfirm.removeEventListener(
              'click',
              handleConfirm
            );

            deleteDialog.removeEventListener(
              'cancel',
              handleCancel
            );

            resolve(confirmed);
          }

          function handleCancel(event) {
            event?.preventDefault();
            finish(false);
          }

          function handleConfirm() {
            finish(true);
          }

          deleteCancel.addEventListener(
            'click',
            handleCancel
          );

          deleteConfirm.addEventListener(
            'click',
            handleConfirm
          );

          deleteDialog.addEventListener(
            'cancel',
            handleCancel
          );

          deleteDialog.showModal();
        });
      }

      function clean(value) {
        return typeof value === 'string'
          ? value.trim()
          : '';
      }

      function formatDate(value) {
        const date =
          new Date(value);

        if (
          Number.isNaN(
            date.getTime()
          )
        ) {
          return clean(value);
        }

        return date.toLocaleString();
      }

      function render(feedback) {
        feedbackItems =
          Array.isArray(feedback)
            ? feedback
            : [];

        list.innerHTML = '';

        messageCount.textContent =
          `${feedbackItems.length} message${
            feedbackItems.length === 1
              ? ''
              : 's'
          }`;

        if (!feedbackItems.length) {
          list.innerHTML = `
            <div class="empty">
              No messages yet.
            </div>
          `;
          return;
        }

        feedbackItems.forEach(item => {
          const card =
            document.createElement('article');

          card.className =
            'feedback-card';

          const cardHead =
            document.createElement('div');

          cardHead.className =
            'feedback-card-head';

          const replyName =
            clean(item?.replyName);

          if (replyName) {
            const name =
              document.createElement('span');

            name.className =
              'feedback-name';

            name.textContent =
              replyName;

            cardHead.appendChild(name);
          }

          const date =
            document.createElement('time');

          date.className =
            'feedback-date';

          date.dateTime =
            clean(item?.submittedAt);

          date.textContent =
            formatDate(
              item?.submittedAt ||
              item?.clientTimestamp
            );

          cardHead.appendChild(date);

          const message =
            document.createElement('p');

          message.className =
            'feedback-message';

          message.textContent =
            clean(item?.message) ||
            'Empty message';

          const footer =
            document.createElement('div');

          footer.className =
            'feedback-footer';

          const replyEmail =
            clean(item?.replyEmail);

          if (replyEmail) {
            const contact =
              document.createElement('a');

            contact.className =
              'feedback-contact';

            contact.href =
              `mailto:${replyEmail}`;

            contact.textContent =
              `Reply to ${replyEmail}`;

            footer.appendChild(contact);
          }

          const deleteButton =
            document.createElement('button');

          deleteButton.className =
            'delete-action';

          deleteButton.type =
            'button';

          deleteButton.textContent =
            'Delete';

          deleteButton.addEventListener(
            'click',
            () =>
              deleteFeedback(
                item,
                deleteButton
              )
          );

          footer.appendChild(
            deleteButton
          );

          card.appendChild(cardHead);
          card.appendChild(message);
          card.appendChild(footer);
          list.appendChild(card);
        });
      }

      async function deleteFeedback(
        item,
        button
      ) {
        const submittedAt =
          clean(item?.submittedAt);

        const id =
          clean(item?.id);

        if (
          !submittedAt ||
          !id
        ) {
          status.className =
            'status error';

          status.textContent =
            'This message cannot be deleted.';
          return;
        }

        const confirmed =
          await confirmDelete();

        if (!confirmed) {
          return;
        }

        const key =
          clean(keyInput.value);

        button.disabled = true;
        button.textContent = 'Deleting…';

        status.className = 'status';
        status.textContent = '';

        try {
          const params =
            new URLSearchParams({
              submittedAt,
              id
            });

          const response =
            await fetch(
              `${ENDPOINT}?${params.toString()}`,
              {
                method: 'DELETE',

                headers: {
                  Authorization:
                    `Bearer ${key}`
                }
              }
            );

          const result =
            await response.json();

          if (
            !response.ok ||
            result?.ok !== true
          ) {
            throw new Error(
              result?.error ||
              'Could not delete message.'
            );
          }

          render(
            feedbackItems.filter(
              feedback =>
                feedback !== item
            )
          );
        } catch (error) {
          status.className =
            'status error';

          status.textContent =
            error?.message ||
            'Could not delete message.';

          button.disabled = false;
          button.textContent = 'Delete';
        }
      }

      async function loadFeedback() {
        const key =
          clean(keyInput.value);

        if (!key) {
          status.className =
            'status error';

          status.textContent =
            'Enter the admin key.';

          keyInput.focus();
          return;
        }

        status.className =
          'status';

        status.textContent =
          'Loading…';

        loadButton.disabled = true;
        refreshButton.disabled = true;

        try {
          const response =
            await fetch(
              ENDPOINT,
              {
                headers: {
                  Authorization:
                    `Bearer ${key}`
                }
              }
            );

          const result =
            await response.json();

          if (
            !response.ok ||
            result?.ok !== true
          ) {
            throw new Error(
              result?.error ||
              'Could not load messages.'
            );
          }

          sessionStorage.setItem(
            STORAGE_KEY,
            key
          );

          access.hidden = true;
          inboxToolbar.hidden = false;

          status.className = 'status';
          status.textContent = '';

          render(
            Array.isArray(result.feedback)
              ? result.feedback
              : []
          );
        } catch (error) {
          status.className =
            'status error';

          status.textContent =
            error?.message ||
            'Could not load messages.';
        } finally {
          loadButton.disabled = false;
          refreshButton.disabled = false;
        }
      }

      loadButton.addEventListener(
        'click',
        loadFeedback
      );

      refreshButton.addEventListener(
        'click',
        loadFeedback
      );

      keyInput.addEventListener(
        'keydown',
        event => {
          if (event.key === 'Enter') {
            loadFeedback();
          }
        }
      );

      const rememberedKey =
        sessionStorage.getItem(
          STORAGE_KEY
        );

      if (rememberedKey) {
        keyInput.value =
          rememberedKey;

        loadFeedback();
      }
    })();
  </script>

</body>

</html>
