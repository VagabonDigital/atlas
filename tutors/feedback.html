<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Admin</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20x%3D%275%27%20y%3D%275%27%20width%3D%2790%27%20height%3D%2790%27%20rx%3D%2724%27%20fill%3D%27%233F7FA3%27%2F%3E%3Cpath%20d%3D%27M20%2080V48C20%2028%2033%2015%2050%2015S80%2028%2080%2048V80H65V49C65%2039%2059%2033%2050%2033S35%2039%2035%2049V80Z%27%20fill%3D%27%23FFFFFF%27%2F%3E%3Cpath%20d%3D%27M16%2080H84%27%20stroke%3D%27%23DFF4FC%27%20stroke-width%3D%278%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --surface: #f5f1e9;
      --surface-raised: #fffdf9;
      --surface-muted: #ece7de;
      --border: rgba(61, 56, 48, 0.14);
      --border-strong: rgba(61, 56, 48, 0.24);
      --heading: #1e1b16;
      --body: #514b42;
      --muted: #7a7268;
      --accent: #4f7772;
      --accent-soft: rgba(79, 119, 114, 0.10);
      --danger: #b43b32;
      --warning: #8a682d;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--surface);
      color: var(--body);
      font-family: var(--font-body);
    }

    main {
      width: min(1040px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 4rem 0 6rem;
    }

    h1 {
      margin: 0;
      color: var(--heading);
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 7vw, 4.8rem);
      font-weight: 400;
      line-height: 1;
    }

    .lede {
      margin: 1rem 0 2.25rem;
      color: var(--muted);
    }

    .access {
      display: flex;
      gap: 0.65rem;
      margin-bottom: 2rem;
      max-width: 820px;
    }

    .access[hidden],
    .admin-shell[hidden],
    .panel[hidden],
    .toolbar[hidden] { display: none; }

    input,
    textarea,
    select {
      width: 100%;
      min-width: 0;
      padding: 0.78rem 0.88rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-raised);
      color: var(--heading);
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    textarea:focus,
    select:focus { border-color: var(--accent); }

    button {
      padding: 0.78rem 1rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    a { color: inherit; }

    .status {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .status:empty { display: none; }
    .status.error { color: var(--danger); }

    .admin-tabs {
      display: flex;
      gap: 0.4rem;
      padding: 0.35rem;
      width: fit-content;
      margin: 0 0 2rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-muted);
    }

    .admin-tab {
      padding: 0.58rem 0.92rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .admin-tab[aria-selected="true"] {
      background: var(--surface-raised);
      color: var(--heading);
      box-shadow: 0 1px 4px rgba(45, 39, 31, 0.07);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .count {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 500;
    }

    .toolbar-action,
    .filter-button,
    .secondary-action {
      padding: 0.52rem 0.72rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .filter-button {
      color: var(--muted);
    }

    .filter-button.is-active {
      border-color: rgba(79, 119, 114, 0.32);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .feedback-list,
    .candidate-list {
      display: grid;
      gap: 1rem;
    }

    .feedback-card,
    .candidate-card {
      padding: 1.35rem 1.4rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-raised);
    }

    .feedback-card-head,
    .candidate-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .feedback-meta,
    .candidate-title-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .feedback-name,
    .candidate-name {
      color: var(--heading);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .candidate-name { font-size: 1.02rem; }

    .feedback-date,
    .candidate-meta {
      color: var(--muted);
      font-size: 0.76rem;
    }

    .feedback-message {
      margin: 0.65rem 0 1rem;
      color: var(--heading);
      font-size: 1rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .feedback-footer,
    .candidate-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      min-height: 1.5rem;
    }

    .feedback-contact,
    .candidate-link {
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
    }

    .feedback-contact:hover,
    .candidate-link:hover { text-decoration: underline; }

    .delete-action,
    .edit-action {
      padding: 0.35rem 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--danger);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .edit-action { color: var(--accent); }

    .delete-action:hover:not(:disabled),
    .edit-action:hover:not(:disabled) { text-decoration: underline; }

    .candidate-status {
      display: inline-flex;
      align-items: center;
      padding: 0.28rem 0.52rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .candidate-status[data-status="Closed"] {
      background: rgba(81, 75, 66, 0.07);
      color: var(--muted);
    }

    .candidate-status[data-status="Contacted"] {
      background: rgba(138, 104, 45, 0.10);
      color: var(--warning);
    }

    .candidate-body {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem 1.4rem;
      margin: 1rem 0 1.15rem;
    }

    .candidate-field.full { grid-column: 1 / -1; }

    .candidate-label {
      display: block;
      margin-bottom: 0.25rem;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .candidate-value {
      color: var(--heading);
      font-size: 0.88rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .candidate-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-left: auto;
    }

    .empty {
      padding: 2rem;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }

    dialog {
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-raised);
      color: var(--body);
      box-shadow: 0 24px 70px rgba(20, 17, 12, 0.18);
    }

    dialog::backdrop {
      background: rgba(30, 27, 22, 0.42);
      backdrop-filter: blur(3px);
    }

    .confirm-dialog {
      width: min(380px, calc(100% - 2rem));
    }

    .candidate-dialog {
      width: min(680px, calc(100% - 2rem));
      max-height: calc(100vh - 3rem);
      overflow: auto;
    }

    .dialog-content { padding: 1.4rem; }

    .dialog-title {
      margin: 0;
      color: var(--heading);
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 400;
    }

    .dialog-copy {
      margin: 0.5rem 0 1.25rem;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
      margin-top: 1.25rem;
    }

    .dialog-cancel {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--body);
    }

    .dialog-delete {
      background: var(--danger);
      color: white;
    }

    .candidate-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .form-field.full { grid-column: 1 / -1; }

    .form-field label {
      display: block;
      margin: 0 0 0.32rem;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 600;
    }

    @media (max-width: 680px) {
      main { padding-top: 2.5rem; }
      .access { flex-direction: column; }
      .access button { width: 100%; }
      .candidate-body,
      .candidate-form-grid { grid-template-columns: 1fr; }
      .candidate-field.full,
      .form-field.full { grid-column: auto; }
      .toolbar { align-items: flex-start; }
      .candidate-actions { margin-left: 0; }
    }
  </style>
</head>

<body>
  <main>
    <h1>Atlas admin.</h1>
    <p class="lede">Pilot recruitment and tutor feedback in one place.</p>

    <div class="access" id="access">
      <input id="admin-key" type="password" autocomplete="off" placeholder="Admin key" aria-label="Admin key">
      <button id="load-button" type="button">Open admin</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="admin-shell" id="admin-shell" hidden>
      <nav class="admin-tabs" aria-label="Atlas admin sections">
        <button class="admin-tab" type="button" data-panel="feedback" aria-selected="true">Feedback</button>
        <button class="admin-tab" type="button" data-panel="pilot" aria-selected="false">Pilot</button>
      </nav>

      <section class="panel" id="feedback-panel">
        <div class="toolbar" id="inbox-toolbar">
          <div class="toolbar-left">
            <span class="count" id="message-count"></span>
          </div>
          <div class="toolbar-right">
            <button class="toolbar-action" id="refresh-button" type="button">Refresh</button>
          </div>
        </div>
        <div class="feedback-list" id="feedback-list"></div>
      </section>

      <section class="panel" id="pilot-panel" hidden>
        <div class="toolbar">
          <div class="toolbar-left" id="pilot-filters">
            <button class="filter-button is-active" type="button" data-filter="all">All</button>
            <button class="filter-button" type="button" data-filter="prospects">Prospects</button>
            <button class="filter-button" type="button" data-filter="pilot">Pilot</button>
            <button class="filter-button" type="button" data-filter="closed">Closed</button>
          </div>
          <div class="toolbar-right">
            <span class="count" id="candidate-count"></span>
            <button id="add-candidate" type="button">Add candidate</button>
          </div>
        </div>
        <div class="candidate-list" id="candidate-list"></div>
      </section>
    </div>
  </main>

  <dialog class="confirm-dialog" id="confirm-dialog">
    <div class="dialog-content">
      <h2 class="dialog-title" id="confirm-title">Delete?</h2>
      <p class="dialog-copy" id="confirm-copy">This can’t be undone.</p>
      <div class="dialog-actions">
        <button class="dialog-cancel" id="confirm-cancel" type="button">Keep it</button>
        <button class="dialog-delete" id="confirm-delete" type="button">Delete</button>
      </div>
    </div>
  </dialog>

  <dialog class="candidate-dialog" id="candidate-dialog">
    <form class="dialog-content" id="candidate-form">
      <h2 class="dialog-title" id="candidate-dialog-title">Add candidate</h2>
      <p class="dialog-copy">Keep the record practical. Enough to know who they are, why they matter, and what happens next.</p>

      <div class="candidate-form-grid">
        <div class="form-field">
          <label for="candidate-name">Name</label>
          <input id="candidate-name" name="name" required maxlength="160">
        </div>

        <div class="form-field">
          <label for="candidate-status">Status</label>
          <select id="candidate-status" name="status"></select>
        </div>

        <div class="form-field">
          <label for="candidate-website">Website</label>
          <input id="candidate-website" name="website" type="url" placeholder="https://">
        </div>

        <div class="form-field">
          <label for="candidate-email">Email</label>
          <input id="candidate-email" name="email" type="email">
        </div>

        <div class="form-field">
          <label for="candidate-location">Location</label>
          <input id="candidate-location" name="location" maxlength="160">
        </div>

        <div class="form-field">
          <label for="candidate-source">Found via</label>
          <select id="candidate-source" name="source">
            <option>Website</option>
            <option>LinkedIn</option>
            <option>Group</option>
            <option>Referral</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-field full">
          <label for="candidate-why">Why this tutor?</label>
          <textarea id="candidate-why" name="why" maxlength="3000"></textarea>
        </div>

        <div class="form-field">
          <label for="candidate-last-contact">Last contact</label>
          <input id="candidate-last-contact" name="lastContact" type="date">
        </div>

        <div class="form-field">
          <label for="candidate-next-action-date">Next action date</label>
          <input id="candidate-next-action-date" name="nextActionDate" type="date">
        </div>

        <div class="form-field full">
          <label for="candidate-next-action">Next action</label>
          <input id="candidate-next-action" name="nextAction" maxlength="500" placeholder="Send first email, follow up, wait for reply…">
        </div>

        <div class="form-field full">
          <label for="candidate-notes">Notes</label>
          <textarea id="candidate-notes" name="notes" maxlength="8000"></textarea>
        </div>
      </div>

      <div class="dialog-actions">
        <button class="dialog-cancel" id="candidate-cancel" type="button">Cancel</button>
        <button type="submit">Save candidate</button>
      </div>
    </form>
  </dialog>

  <script>
    (function () {
      'use strict';

      const FEEDBACK_ENDPOINT = 'https://atlas-ai.savvy989.workers.dev/feedback';
      const ADMIN_KEY_STORAGE = 'atlas::feedbackAdminKey';
      const PILOT_STORAGE = 'atlas::pilotCandidates:v1';

      const PILOT_STATUSES = [
        'Candidate',
        'Contacted',
        'Replied',
        'Interested',
        'Confirmed',
        'Started',
        'First lesson',
        'Check-in',
        'Closed'
      ];

      const PROSPECT_STATUSES = new Set([
        'Candidate',
        'Contacted',
        'Replied',
        'Interested'
      ]);

      const ACTIVE_PILOT_STATUSES = new Set([
        'Confirmed',
        'Started',
        'First lesson',
        'Check-in'
      ]);

      const access = document.getElementById('access');
      const keyInput = document.getElementById('admin-key');
      const loadButton = document.getElementById('load-button');
      const status = document.getElementById('status');
      const adminShell = document.getElementById('admin-shell');
      const tabs = Array.from(document.querySelectorAll('.admin-tab'));
      const feedbackPanel = document.getElementById('feedback-panel');
      const pilotPanel = document.getElementById('pilot-panel');
      const messageCount = document.getElementById('message-count');
      const refreshButton = document.getElementById('refresh-button');
      const feedbackList = document.getElementById('feedback-list');
      const candidateList = document.getElementById('candidate-list');
      const candidateCount = document.getElementById('candidate-count');
      const pilotFilters = document.getElementById('pilot-filters');
      const addCandidateButton = document.getElementById('add-candidate');
      const candidateDialog = document.getElementById('candidate-dialog');
      const candidateForm = document.getElementById('candidate-form');
      const candidateDialogTitle = document.getElementById('candidate-dialog-title');
      const candidateCancel = document.getElementById('candidate-cancel');
      const candidateStatus = document.getElementById('candidate-status');
      const confirmDialog = document.getElementById('confirm-dialog');
      const confirmTitle = document.getElementById('confirm-title');
      const confirmCopy = document.getElementById('confirm-copy');
      const confirmCancel = document.getElementById('confirm-cancel');
      const confirmDelete = document.getElementById('confirm-delete');

      let feedbackItems = [];
      let candidates = readCandidates();
      let pilotFilter = 'all';
      let editingCandidateId = '';

      PILOT_STATUSES.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        candidateStatus.appendChild(option);
      });

      function clean(value) {
        return typeof value === 'string' ? value.trim() : '';
      }

      function safeUrl(value) {
        const raw = clean(value);
        if (!raw) return '';
        try {
          const parsed = new URL(raw);
          return parsed.protocol === 'http:' || parsed.protocol === 'https:'
            ? parsed.href
            : '';
        } catch {
          return '';
        }
      }

      function formatDateTime(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? clean(value) : date.toLocaleString();
      }

      function formatShortDate(value) {
        if (!clean(value)) return '';
        const date = new Date(`${value}T12:00:00`);
        return Number.isNaN(date.getTime())
          ? clean(value)
          : date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function uid() {
        return typeof crypto.randomUUID === 'function'
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      }

      function readCandidates() {
        try {
          const parsed = JSON.parse(localStorage.getItem(PILOT_STORAGE) || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function writeCandidates() {
        localStorage.setItem(PILOT_STORAGE, JSON.stringify(candidates));
      }

      function confirmAction(title, copy) {
        confirmTitle.textContent = title;
        confirmCopy.textContent = copy;

        return new Promise(resolve => {
          function finish(confirmed) {
            confirmDialog.close();
            confirmCancel.removeEventListener('click', cancel);
            confirmDelete.removeEventListener('click', approve);
            confirmDialog.removeEventListener('cancel', cancel);
            resolve(confirmed);
          }
          function cancel(event) {
            event?.preventDefault();
            finish(false);
          }
          function approve() { finish(true); }
          confirmCancel.addEventListener('click', cancel);
          confirmDelete.addEventListener('click', approve);
          confirmDialog.addEventListener('cancel', cancel);
          confirmDialog.showModal();
        });
      }

      function switchPanel(name) {
        tabs.forEach(tab => {
          tab.setAttribute('aria-selected', tab.dataset.panel === name ? 'true' : 'false');
        });
        feedbackPanel.hidden = name !== 'feedback';
        pilotPanel.hidden = name !== 'pilot';
        if (name === 'pilot') renderCandidates();
      }

      tabs.forEach(tab => {
        tab.addEventListener('click', () => switchPanel(tab.dataset.panel));
      });

      function renderFeedback(feedback) {
        feedbackItems = Array.isArray(feedback) ? feedback : [];
        feedbackList.innerHTML = '';
        messageCount.textContent = `${feedbackItems.length} message${feedbackItems.length === 1 ? '' : 's'}`;

        if (!feedbackItems.length) {
          feedbackList.innerHTML = '<div class="empty">No messages yet.</div>';
          return;
        }

        feedbackItems.forEach(item => {
          const card = document.createElement('article');
          card.className = 'feedback-card';

          const head = document.createElement('div');
          head.className = 'feedback-card-head';

          const meta = document.createElement('div');
          meta.className = 'feedback-meta';

          const replyName = clean(item?.replyName);
          if (replyName) {
            const name = document.createElement('span');
            name.className = 'feedback-name';
            name.textContent = replyName;
            meta.appendChild(name);
          }

          const date = document.createElement('time');
          date.className = 'feedback-date';
          date.dateTime = clean(item?.submittedAt);
          date.textContent = formatDateTime(item?.submittedAt || item?.clientTimestamp);
          meta.appendChild(date);
          head.appendChild(meta);

          const message = document.createElement('p');
          message.className = 'feedback-message';
          message.textContent = clean(item?.message) || 'Empty message';

          const footer = document.createElement('div');
          footer.className = 'feedback-footer';

          const replyEmail = clean(item?.replyEmail);
          if (replyEmail) {
            const contact = document.createElement('a');
            contact.className = 'feedback-contact';
            contact.href = `mailto:${replyEmail}`;
            contact.textContent = `Reply to ${replyEmail}`;
            footer.appendChild(contact);
          }

          const deleteButton = document.createElement('button');
          deleteButton.className = 'delete-action';
          deleteButton.type = 'button';
          deleteButton.textContent = 'Delete';
          deleteButton.addEventListener('click', () => deleteFeedback(item, deleteButton));
          footer.appendChild(deleteButton);

          card.append(head, message, footer);
          feedbackList.appendChild(card);
        });
      }

      async function deleteFeedback(item, button) {
        const submittedAt = clean(item?.submittedAt);
        const id = clean(item?.id);

        if (!submittedAt || !id) {
          status.className = 'status error';
          status.textContent = 'This message cannot be deleted.';
          return;
        }

        if (!(await confirmAction('Delete this message?', 'This can’t be undone.'))) return;

        const key = clean(keyInput.value);
        button.disabled = true;
        button.textContent = 'Deleting…';
        status.className = 'status';
        status.textContent = '';

        try {
          const params = new URLSearchParams({ submittedAt, id });
          const response = await fetch(`${FEEDBACK_ENDPOINT}?${params.toString()}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${key}` }
          });
          const result = await response.json();
          if (!response.ok || result?.ok !== true) {
            throw new Error(result?.error || 'Could not delete message.');
          }
          renderFeedback(feedbackItems.filter(feedback => feedback !== item));
        } catch (error) {
          status.className = 'status error';
          status.textContent = error?.message || 'Could not delete message.';
          button.disabled = false;
          button.textContent = 'Delete';
        }
      }

      async function loadFeedback() {
        const key = clean(keyInput.value);
        if (!key) {
          status.className = 'status error';
          status.textContent = 'Enter the admin key.';
          keyInput.focus();
          return;
        }

        status.className = 'status';
        status.textContent = 'Loading…';
        loadButton.disabled = true;
        refreshButton.disabled = true;

        try {
          const response = await fetch(FEEDBACK_ENDPOINT, {
            headers: { Authorization: `Bearer ${key}` }
          });
          const result = await response.json();
          if (!response.ok || result?.ok !== true) {
            throw new Error(result?.error || 'Could not open Atlas admin.');
          }

          sessionStorage.setItem(ADMIN_KEY_STORAGE, key);
          access.hidden = true;
          adminShell.hidden = false;
          status.className = 'status';
          status.textContent = '';
          renderFeedback(Array.isArray(result.feedback) ? result.feedback : []);
          renderCandidates();
        } catch (error) {
          status.className = 'status error';
          status.textContent = error?.message || 'Could not open Atlas admin.';
        } finally {
          loadButton.disabled = false;
          refreshButton.disabled = false;
        }
      }

      function candidateMatchesFilter(candidate) {
        const candidateStatusValue = clean(candidate?.status) || 'Candidate';
        if (pilotFilter === 'all') return true;
        if (pilotFilter === 'prospects') return PROSPECT_STATUSES.has(candidateStatusValue);
        if (pilotFilter === 'pilot') return ACTIVE_PILOT_STATUSES.has(candidateStatusValue);
        if (pilotFilter === 'closed') return candidateStatusValue === 'Closed';
        return true;
      }

      function renderCandidates() {
        candidateList.innerHTML = '';

        const visible = candidates
          .filter(candidateMatchesFilter)
          .sort((a, b) => {
            const aUpdated = clean(a?.updatedAt) || clean(a?.createdAt);
            const bUpdated = clean(b?.updatedAt) || clean(b?.createdAt);
            return bUpdated.localeCompare(aUpdated);
          });

        candidateCount.textContent = `${candidates.length} candidate${candidates.length === 1 ? '' : 's'}`;

        if (!visible.length) {
          candidateList.innerHTML = '<div class="empty">No candidates in this view.</div>';
          return;
        }

        visible.forEach(candidate => {
          const card = document.createElement('article');
          card.className = 'candidate-card';

          const head = document.createElement('div');
          head.className = 'candidate-head';

          const title = document.createElement('div');
          const titleRow = document.createElement('div');
          titleRow.className = 'candidate-title-row';

          const name = document.createElement('span');
          name.className = 'candidate-name';
          name.textContent = clean(candidate.name) || 'Unnamed candidate';

          const chip = document.createElement('span');
          chip.className = 'candidate-status';
          chip.dataset.status = clean(candidate.status) || 'Candidate';
          chip.textContent = clean(candidate.status) || 'Candidate';

          titleRow.append(name, chip);
          title.appendChild(titleRow);

          const metaParts = [clean(candidate.location), clean(candidate.source)].filter(Boolean);
          if (metaParts.length) {
            const meta = document.createElement('div');
            meta.className = 'candidate-meta';
            meta.textContent = metaParts.join(' · ');
            title.appendChild(meta);
          }

          head.appendChild(title);

          const actions = document.createElement('div');
          actions.className = 'candidate-actions';

          const editButton = document.createElement('button');
          editButton.className = 'edit-action';
          editButton.type = 'button';
          editButton.textContent = 'Edit';
          editButton.addEventListener('click', () => openCandidateDialog(candidate));

          const deleteButton = document.createElement('button');
          deleteButton.className = 'delete-action';
          deleteButton.type = 'button';
          deleteButton.textContent = 'Delete';
          deleteButton.addEventListener('click', async () => {
            const confirmed = await confirmAction(
              `Delete ${clean(candidate.name) || 'this candidate'}?`,
              'This removes the candidate record from this browser.'
            );
            if (!confirmed) return;
            candidates = candidates.filter(item => item.id !== candidate.id);
            writeCandidates();
            renderCandidates();
          });

          actions.append(editButton, deleteButton);
          head.appendChild(actions);

          const body = document.createElement('div');
          body.className = 'candidate-body';

          function appendField(label, value, full) {
            const cleanValue = clean(value);
            if (!cleanValue) return;
            const field = document.createElement('div');
            field.className = `candidate-field${full ? ' full' : ''}`;
            const labelNode = document.createElement('span');
            labelNode.className = 'candidate-label';
            labelNode.textContent = label;
            const valueNode = document.createElement('div');
            valueNode.className = 'candidate-value';
            valueNode.textContent = cleanValue;
            field.append(labelNode, valueNode);
            body.appendChild(field);
          }

          appendField('Why this tutor', candidate.why, true);
          appendField('Last contact', formatShortDate(candidate.lastContact), false);
          appendField('Next action', candidate.nextAction, false);
          appendField('Next action date', formatShortDate(candidate.nextActionDate), false);
          appendField('Notes', candidate.notes, true);

          const footer = document.createElement('div');
          footer.className = 'candidate-footer';

          const links = document.createElement('div');
          links.className = 'toolbar-left';

          const website = safeUrl(candidate.website);
          if (website) {
            const websiteLink = document.createElement('a');
            websiteLink.className = 'candidate-link';
            websiteLink.href = website;
            websiteLink.target = '_blank';
            websiteLink.rel = 'noopener noreferrer';
            websiteLink.textContent = 'Website';
            links.appendChild(websiteLink);
          }

          const email = clean(candidate.email);
          if (email) {
            const emailLink = document.createElement('a');
            emailLink.className = 'candidate-link';
            emailLink.href = `mailto:${email}`;
            emailLink.textContent = email;
            links.appendChild(emailLink);
          }

          footer.appendChild(links);

          card.append(head, body, footer);
          candidateList.appendChild(card);
        });
      }

      function openCandidateDialog(candidate) {
        editingCandidateId = clean(candidate?.id);
        candidateDialogTitle.textContent = editingCandidateId ? 'Edit candidate' : 'Add candidate';
        candidateForm.reset();
        candidateStatus.value = 'Candidate';

        if (candidate) {
          candidateForm.elements.name.value = clean(candidate.name);
          candidateForm.elements.status.value = clean(candidate.status) || 'Candidate';
          candidateForm.elements.website.value = clean(candidate.website);
          candidateForm.elements.email.value = clean(candidate.email);
          candidateForm.elements.location.value = clean(candidate.location);
          candidateForm.elements.source.value = clean(candidate.source) || 'Website';
          candidateForm.elements.why.value = clean(candidate.why);
          candidateForm.elements.lastContact.value = clean(candidate.lastContact);
          candidateForm.elements.nextActionDate.value = clean(candidate.nextActionDate);
          candidateForm.elements.nextAction.value = clean(candidate.nextAction);
          candidateForm.elements.notes.value = clean(candidate.notes);
        }

        candidateDialog.showModal();
        requestAnimationFrame(() => candidateForm.elements.name.focus());
      }

      candidateForm.addEventListener('submit', event => {
        event.preventDefault();
        const data = new FormData(candidateForm);
        const name = clean(data.get('name'));
        if (!name) return;

        const now = new Date().toISOString();
        const existing = editingCandidateId
          ? candidates.find(item => item.id === editingCandidateId)
          : null;

        const record = {
          id: existing?.id || uid(),
          name,
          status: PILOT_STATUSES.includes(clean(data.get('status'))) ? clean(data.get('status')) : 'Candidate',
          website: clean(data.get('website')),
          email: clean(data.get('email')),
          location: clean(data.get('location')),
          source: clean(data.get('source')) || 'Website',
          why: clean(data.get('why')),
          lastContact: clean(data.get('lastContact')),
          nextActionDate: clean(data.get('nextActionDate')),
          nextAction: clean(data.get('nextAction')),
          notes: clean(data.get('notes')),
          createdAt: existing?.createdAt || now,
          updatedAt: now
        };

        if (existing) {
          candidates = candidates.map(item => item.id === existing.id ? record : item);
        } else {
          candidates.unshift(record);
        }

        writeCandidates();
        candidateDialog.close();
        editingCandidateId = '';
        renderCandidates();
      });

      candidateCancel.addEventListener('click', () => {
        candidateDialog.close();
        editingCandidateId = '';
      });

      candidateDialog.addEventListener('cancel', () => {
        editingCandidateId = '';
      });

      addCandidateButton.addEventListener('click', () => openCandidateDialog(null));

      pilotFilters.addEventListener('click', event => {
        const button = event.target.closest('[data-filter]');
        if (!button) return;
        pilotFilter = button.dataset.filter || 'all';
        pilotFilters.querySelectorAll('[data-filter]').forEach(item => {
          item.classList.toggle('is-active', item === button);
        });
        renderCandidates();
      });

      loadButton.addEventListener('click', loadFeedback);
      refreshButton.addEventListener('click', loadFeedback);
      keyInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') loadFeedback();
      });

      const rememberedKey = sessionStorage.getItem(ADMIN_KEY_STORAGE);
      if (rememberedKey) {
        keyInput.value = rememberedKey;
        loadFeedback();
      }
    })();
  </script>
</body>

</html>
