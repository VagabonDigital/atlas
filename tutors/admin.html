<body>
  <main>
    <h1>Atlas admin.</h1>
    <p class="lede">Pilot recruitment and tutor feedback in one place.</p>
    <div class="access" id="access"><input id="admin-key" type="password" autocomplete="off" placeholder="Admin key" aria-label="Admin key"><button id="load-button" type="button">Open admin</button></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div id="admin-shell" hidden>
      <nav class="tabs" aria-label="Atlas admin sections"><button class="tab" type="button" data-panel="feedback" aria-selected="true">Feedback</button><button class="tab" type="button" data-panel="pilot" aria-selected="false">Pilot</button></nav>
      <section id="feedback-panel"><div class="toolbar"><div class="toolbar-left"><span class="count" id="feedback-count"></span></div><div class="toolbar-right"><button class="toolbar-action" id="refresh-feedback" type="button">Refresh</button></div></div><div class="list" id="feedback-list"></div></section>
      <section id="pilot-panel" hidden><div class="toolbar"><div class="toolbar-left" id="pilot-filters"><button class="filter active" type="button" data-filter="all">All</button><button class="filter" type="button" data-filter="prospects">Prospects</button><button class="filter" type="button" data-filter="confirmed">Confirmed</button><button class="filter" type="button" data-filter="archived">Archived</button></div><div class="toolbar-right"><span class="count" id="pilot-count"></span><button class="toolbar-action" id="refresh-pilot" type="button">Refresh</button><button id="add-pilot" type="button">Add candidate</button></div></div><div class="list" id="pilot-list"></div></section>
    </div>
  </main>
  <dialog class="confirm-dialog" id="confirm-dialog"><div class="dialog-content"><h2 class="dialog-title" id="confirm-title">Delete?</h2><p class="dialog-copy" id="confirm-copy">This can’t be undone.</p><div class="dialog-actions"><button class="dialog-cancel" id="confirm-cancel" type="button">Keep it</button><button class="dialog-delete" id="confirm-delete" type="button">Delete</button></div></div></dialog>
  <dialog class="pilot-dialog" id="pilot-dialog"><form class="dialog-content" id="pilot-form"><h2 class="dialog-title" id="pilot-dialog-title">Add candidate</h2><p class="dialog-copy">Keep the record practical: who they are, where the relationship stands, and what happens next.</p><div class="form-grid">
    <div class="form-field"><label for="pilot-name">Name</label><input id="pilot-name" name="name" required maxlength="160"></div>
    <div class="form-field"><label for="pilot-status">Relationship status</label><select id="pilot-status" name="status"></select></div>
    <div class="form-field"><label for="pilot-website">Website</label><input id="pilot-website" name="website" type="url" placeholder="https://"></div>
    <div class="form-field"><label for="pilot-email">Email</label><input id="pilot-email" name="email" type="email"></div>
    <div class="form-field"><label for="pilot-location">Location</label><input id="pilot-location" name="location" maxlength="160"></div>
    <div class="form-field"><label for="pilot-source">Found via</label><input id="pilot-source" name="source" maxlength="120" placeholder="Website, LinkedIn, referral…"></div>
    <div class="form-field full"><label for="pilot-why">Why this tutor?</label><textarea id="pilot-why" name="why" maxlength="3000"></textarea></div>
    <div class="form-field"><label for="pilot-last-contact">Last contact</label><input id="pilot-last-contact" name="lastContact" type="date"></div>
    <div class="form-field"><label for="pilot-next-action-date">Next action date</label><input id="pilot-next-action-date" name="nextActionDate" type="date"></div>
    <div class="form-field full"><label for="pilot-next-action">Next action</label><input id="pilot-next-action" name="nextAction" maxlength="500" placeholder="Send first email, follow up, wait for reply…"></div>
    <div class="form-field"><label for="pilot-real-lesson">Used in a real lesson</label><select id="pilot-real-lesson" name="usedInRealLesson"><option value="false">No</option><option value="true">Yes</option></select></div>
    <div class="form-field"><label for="pilot-feedback-received">Feedback received</label><select id="pilot-feedback-received" name="feedbackReceived"><option value="false">No</option><option value="true">Yes</option></select></div>
    <div class="form-field full"><label for="pilot-notes">Notes</label><textarea id="pilot-notes" name="notes" maxlength="8000"></textarea></div>
  </div><div class="dialog-actions"><button class="dialog-cancel" id="pilot-cancel" type="button">Cancel</button><button id="pilot-save" type="submit">Save candidate</button></div></form></dialog>
  <script>
  (function(){
    'use strict';
    const ROOT='https://atlas-ai.savvy989.workers.dev';
    const FEEDBACK=`${ROOT}/feedback`,PILOT=`${ROOT}/pilot`,KEY_STORE='atlas::feedbackAdminKey';

    const PROSPECTS=new Set(['Candidate','Contacted','Replied','Interested']);
    const $=id=>document.getElementById(id),access=$('access'),keyInput=$('admin-key'),loadButton=$('load-button'),status=$('status'),shell=$('admin-shell'),feedbackPanel=$('feedback-panel'),pilotPanel=$('pilot-panel'),feedbackCount=$('feedback-count'),feedbackList=$('feedback-list'),refreshFeedback=$('refresh-feedback'),pilotCount=$('pilot-count'),pilotList=$('pilot-list'),refreshPilot=$('refresh-pilot'),pilotFilters=$('pilot-filters'),addPilot=$('add-pilot'),pilotDialog=$('pilot-dialog'),pilotForm=$('pilot-form'),pilotDialogTitle=$('pilot-dialog-title'),pilotStatus=$('pilot-status'),pilotCancel=$('pilot-cancel'),pilotSave=$('pilot-save'),confirmDialog=$('confirm-dialog'),confirmTitle=$('confirm-title'),confirmCopy=$('confirm-copy'),confirmCancel=$('confirm-cancel'),confirmDelete=$('confirm-delete');
    let feedbackItems=[],pilotItems=[],filter='all',editingId='';
    STATUSES.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;pilotStatus.appendChild(o)});

    const headers=()=>({Authorization:`Bearer ${clean(keyInput.value)}`});
    const setStatus=(m,e=false)=>{status.className=e?'status error':'status';status.textContent=m||''};
    const readJson=async r=>{try{return await r.json()}catch{return null}};
    const safeUrl=v=>{try{const u=new URL(clean(v));return u.protocol==='http:'||u.protocol==='https:'?u.href:''}catch{return''}};
    const dateTime=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?clean(v):d.toLocaleString()};
    const shortDate=v=>{const s=clean(v);if(!s)return'';const d=new Date(`${s}T12:00:00`);return Number.isNaN(d.getTime())?s:d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})};
    function ask(title,copy){confirmTitle.textContent=title;confirmCopy.textContent=copy;return new Promise(resolve=>{function done(v){confirmDialog.close();confirmCancel.removeEventListener('click',cancel);confirmDelete.removeEventListener('click',yes);confirmDialog.removeEventListener('cancel',cancel);resolve(v)}function cancel(e){e?.preventDefault();done(false)}function yes(){done(true)}confirmCancel.addEventListener('click',cancel);confirmDelete.addEventListener('click',yes);confirmDialog.addEventListener('cancel',cancel);confirmDialog.showModal()})}
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{const name=tab.dataset.panel;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t===tab?'true':'false'));feedbackPanel.hidden=name!=='feedback';pilotPanel.hidden=name!=='pilot'}));
    async function loadFeedback(){refreshFeedback.disabled=true;try{const r=await fetch(FEEDBACK,{headers:headers()}),j=await readJson(r);if(!r.ok||j?.ok!==true)throw new Error(j?.error||'Could not load feedback.');feedbackItems=Array.isArray(j.feedback)?j.feedback:[];renderFeedback()}finally{refreshFeedback.disabled=false}}

    async function openAdmin(){if(!clean(keyInput.value)){setStatus('Enter the admin key.',true);keyInput.focus();return}setStatus('Loading…');loadButton.disabled=true;try{await Promise.all([loadFeedback(),loadPilot()]);sessionStorage.setItem(KEY_STORE,clean(keyInput.value));access.hidden=true;shell.hidden=false;setStatus('')}catch(e){setStatus(e?.message||'Could not open Atlas admin.',true)}finally{loadButton.disabled=false}}
    function renderFeedback(){feedbackList.innerHTML='';feedbackCount.textContent=`${feedbackItems.length} message${feedbackItems.length===1?'':'s'}`;if(!feedbackItems.length){feedbackList.innerHTML='<div class="empty">No messages yet.</div>';return}feedbackItems.forEach(item=>{const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';const meta=document.createElement('div');meta.className='meta-row';const n=document.createElement('span');n.className='name';n.textContent=clean(item?.replyName)||'Legacy anonymous message';const d=document.createElement('time');d.className='date';d.dateTime=clean(item?.submittedAt);d.textContent=dateTime(item?.submittedAt||item?.clientTimestamp);meta.append(n,d);head.appendChild(meta);const msg=document.createElement('p');msg.className='message';msg.textContent=clean(item?.message)||'Empty message';const foot=document.createElement('div');foot.className='footer';const email=clean(item?.replyEmail);if(email){const a=document.createElement('a');a.className='link';a.href=`mailto:${email}`;a.textContent=`Reply to ${email}`;foot.appendChild(a)}else foot.appendChild(document.createElement('span'));const del=document.createElement('button');del.className='text-action danger';del.type='button';del.textContent='Delete';del.addEventListener('click',()=>deleteFeedback(item,del));foot.appendChild(del);card.append(head,msg,foot);feedbackList.appendChild(card)})}
    async function deleteFeedback(item,button){const submittedAt=clean(item?.submittedAt),id=clean(item?.id);if(!submittedAt||!id){setStatus('This message cannot be deleted.',true);return}if(!await ask('Delete this message?','This can’t be undone.'))return;button.disabled=true;button.textContent='Deleting…';try{const p=new URLSearchParams({submittedAt,id}),r=await fetch(`${FEEDBACK}?${p}`,{method:'DELETE',headers:headers()}),j=await readJson(r);if(!r.ok||j?.ok!==true)throw new Error(j?.error||'Could not delete message.');feedbackItems=feedbackItems.filter(x=>x!==item);renderFeedback()}catch(e){setStatus(e?.message||'Could not delete message.',true);button.disabled=false;button.textContent='Delete'}}
    const matches=item=>filter==='all'||filter==='prospects'&&PROSPECTS.has(clean(item?.status)||'Candidate')||filter==='confirmed'&&item?.status==='Confirmed'||filter==='archived'&&item?.status==='Archived';
    function signal(label,value){const s=document.createElement('span');s.className=`signal${value?' yes':''}`;s.textContent=`${label}: ${value?'Yes':'No'}`;return s}
    function addField(parent,label,value,full=false){const text=clean(value);if(!text)return;const f=document.createElement('div');f.className=`field${full?' full':''}`;const l=document.createElement('span');l.className='field-label';l.textContent=label;const v=document.createElement('div');v.className='field-value';v.textContent=text;f.append(l,v);parent.appendChild(f)}
    function renderPilot(){pilotList.innerHTML='';pilotCount.textContent=`${pilotItems.length} record${pilotItems.length===1?'':'s'}`;const visible=pilotItems.filter(matches);if(!visible.length){pilotList.innerHTML='<div class="empty">No pilot records in this view.</div>';return}visible.forEach(item=>{const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';const title=document.createElement('div');const row=document.createElement('div');row.className='title-row';const n=document.createElement('span');n.className='name pilot-name';n.textContent=clean(item.name)||'Unnamed candidate';const chip=document.createElement('span');chip.className='pilot-status';chip.dataset.status=clean(item.status)||'Candidate';chip.textContent=clean(item.status)||'Candidate';row.append(n,chip);title.appendChild(row);const parts=[clean(item.location),clean(item.source)].filter(Boolean);if(parts.length){const m=document.createElement('div');m.className='meta';m.textContent=parts.join(' · ');title.appendChild(m)}const sig=document.createElement('div');sig.className='signals';sig.append(signal('Real lesson',item.usedInRealLesson===true),signal('Feedback received',item.feedbackReceived===true));title.appendChild(sig);head.appendChild(title);const acts=document.createElement('div');acts.className='actions';const edit=document.createElement('button');edit.className='text-action';edit.type='button';edit.textContent='Edit';edit.addEventListener('click',()=>openPilotDialog(item));const del=document.createElement('button');del.className='text-action danger';del.type='button';del.textContent='Delete';del.addEventListener('click',()=>deletePilot(item,del));acts.append(edit,del);head.appendChild(acts);const body=document.createElement('div');body.className='pilot-body';addField(body,'Why this tutor',item.why,true);addField(body,'Last contact',shortDate(item.lastContact));addField(body,'Next action',item.nextAction);addField(bo     function openPilotDialog(item){editingId=clean(item?.id);pilotDialogTitle.textContent=editingId?'Edit pilot record':'Add candidate';pilotForm.reset();pilotForm.elements.status.value='Candidate';pilotForm.elements.usedInRealLesson.value='false';pilotForm.elements.feedbackReceived.value='false';if(item){for(const k of ['name','status','website','email','location','source','why','lastContact','nextActionDate','nextAction','notes'])pilotForm.elements[k].value=clean(item[k]);pilotForm.elements.usedInRealLesson.value=item.usedInRealLesson===true?'true':'false';pilotForm.elements.feedbackReceived.value=item.feedbackReceived===true?'true':'false'}pilotDialog.showModal();requestAnimationFrame(()=>pilotForm.elements.name.focus())}
    async function savePilot(e){e.preventDefault();if(!pilotForm.reportValidity())return;const d=new FormData(pilotForm),payload={...(editingId?{id:editingId}:{}),name:clean(d.get('name')),status:clean(d.get('status'))||'Candidate',website:clean(d.get('website')),email:clean(d.get('email')),location:clean(d.get('location')),source:clean(d.get('source')),why:clean(d.get('why')),lastContact:clean(d.get('lastContact')),nextAction:clean(d.get('nextAction')),nextActionDate:clean(d.get('nextActionDate')),usedInRealLesson:d.get('usedInRealLesson')==='true',feedbackReceived:d.get('feedbackReceived')==='true',notes:clean(d.get('notes'))};pilotSave.disabled=true;pilotSave.textContent='Saving…';try{const r=await fetch(PILOT,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await readJson(r);if(!r.ok||j?.ok!==true||!j?.pilot)throw new Error(j?.error||'Could not save pilot record.');const i=pilotItems.findIndex(x=>x.id===j.pilot.id);if(i>=0)pilotItems[i]=j.pilot;else pilotItems.unshift(j.pilot);pilotItems.sort((a,b)=>clean(b.updatedAt).localeCompare(clean(a.updatedAt)));pilotDialog.close();editingId='';setStatus('');renderPilot()}catch(err){setStatus(err?.message||'Could not save pilot record.',true)}finally{pilotSave.disabled=false;pilotSave.textContent='Save candidate'}}
    async function deletePilot(item,button){const id=clean(item?.id);if(!id){setStatus('This pilot record cannot be deleted.',true);return}if(!await ask(`Delete ${clean(item.name)||'this pilot record'}?`,'Use Archived for relationships you want to keep in the history. Delete removes the record entirely.'))return;button.disabled=true;button.textContent='Deleting…';try{const r=await fetch(`${PILOT}?${new URLSearchParams({id})}`,{method:'DELETE',headers:headers()}),j=await readJson(r);if(!r.ok||j?.ok!==true)throw new Error(j?.error||'Could not delete pilot record.');pilotItems=pilotItems.filter(x=>x.id!==id);renderPilot()}catch(e){setStatus(e?.message||'Could not delete pilot record.',true);button.disabled=false;button.textContent='Delete'}}
    pilotFilters.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter||'all';pilotFilters.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderPilot()});
    addPilot.addEventListener('click',()=>openPilotDialog(null));pilotForm.addEventListener('submit',savePilot);pilotCancel.addEventListener('click',()=>{pilotDialog.close();editingId=''});pilotDialog.addEventListener('cancel',()=>{editingId=''});pilotDialog.addEventListener('click',e=>{const r=pilotDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){pilotDialog.close();editingId=''}});
    refreshFeedback.addEventListener('click',async()=>{try{setStatus('Refreshing feedback…');await loadFeedback();setStatus('')}catch(e){setStatus(e?.message||'Could not refresh feedback.',true)}});refreshPilot.addEventListener('click',async()=>{try{setStatus('Refreshing pilot records…');await loadPilot();setStatus('')}catch(e){setStatus(e?.message||'Could not refresh pilot records.',true)}});
    loadButton.addEventListener('click',openAdmin);keyInput.addEventListener('keydown',e=>{if(e.key==='Enter')openAdmin()});const remembered=sessionStorage.getItem(KEY_STORE);if(remembered){keyInput.value=remembered;openAdmin()}
  })();
  </script>
