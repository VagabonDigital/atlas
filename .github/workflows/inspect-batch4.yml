name: Inspect Batch 4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-batch4.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Batch 4 blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          specs = {
            'compass/index.html': [
              ('function getAtlasSubjects()', 5200),
              ('if (!subject.isOwned && subject.registryId)', 6500),
              ('async function openArchivedSubjectsDialog', 6200),
              ("if (state.mode === 'atlas-restore-original')", 5200),
              ('async function confirmOwnedSubjectDialog', 4200),
            ],
            'index.html': [
              ('<section class="compass-settings-section"', 2700),
              ('async function readArchivedSubjectsForSettings()', 6500),
              ('async function restoreArchivedSubjectFromSettings', 4500),
              ('function openSettingsModal', 3000),
            ]
          }
          for path, items in specs.items():
              text=Path(path).read_text()
              print('\n###', path)
              for needle, span in items:
                  i=text.index(needle)
                  print('\n---', needle, '---\n')
                  print(text[i:i+span])
          PY
