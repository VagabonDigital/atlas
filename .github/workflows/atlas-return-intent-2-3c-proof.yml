name: Atlas Batch 2.3C confirmation handoff proof

on:
  push:
    paths:
      - '.github/workflows/atlas-return-intent-2-3c-proof.yml'

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply Batch 2.3C confirmation handoff
        run: |
          python .github/atlas_patch_return_intent_2_3c.py
          sed -i "1s/^\\\\'use strict\\\\';/'use strict';/" tests/atlas-return-handoff-contract.test.js

      - name: Validate Stage 2 runtime syntax
        run: |
          node --check shared/atlas-access.js
          node --check shared/atlas-access-bootstrap.js
          node --check shared/atlas-account.js
          node --check shared/atlas-account-gate.js
          node --check shared/atlas-account-chrome.js
          node --check shared/atlas-return-intent.js
          node --check shared/atlas-return-handoff.js
          node --check tests/atlas-access-contract.test.js
          node --check tests/atlas-account-gate-contract.test.js
          node --check tests/atlas-account-chrome-contract.test.js
          node --check tests/atlas-return-intent-contract.test.js
          node --check tests/atlas-account-gate-return-intent.test.js
          node --check tests/atlas-return-handoff-contract.test.js

      - name: Run Stage 2 contract proofs
        run: |
          node tests/atlas-access-contract.test.js
          node tests/atlas-account-gate-contract.test.js
          node tests/atlas-account-chrome-contract.test.js
          node tests/atlas-return-intent-contract.test.js
          node tests/atlas-account-gate-return-intent.test.js
          node tests/atlas-return-handoff-contract.test.js

      - name: Verify Batch 2.3C boundaries
        run: |
          grep -q "searchParams.set('ri', intentId)" shared/atlas-account.js
          grep -q "returnIntentId: activeReturnIntentId" shared/atlas-account-gate.js
          grep -q "atlas-return-handoff.js?v=20260916-returnhandoff1" account/index.html
          grep -q "AtlasReturnHandoff.resumeIfAuthenticated(state)" account/index.html
          grep -q "atlas-account.js?v=20260916-returnintent2" account/index.html
          grep -q "atlas-account.js?v=20260916-returnintent2" shared/atlas-access-bootstrap.js
          grep -q "atlas-account.js?v=20260916-returnintent2" shared/atlas-root-runtime.js
          ! grep -q "window.location.href =.*ri" account/index.html
          ! grep -q "window.location.assign.*ri" account/index.html
          ! grep -q "returnUrl" shared/atlas-return-handoff.js

      - name: Commit Batch 2.3C and remove runner
        run: |
          rm -f .github/workflows/atlas-return-intent-2-3c-proof.yml
          rm -f .github/atlas_patch_return_intent_2_3c.py
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Complete confirmation return intent handoff"
          git push origin main
