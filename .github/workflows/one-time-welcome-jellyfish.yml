name: One-time welcome jellyfish refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-welcome-jellyfish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine welcome artwork
        env:
          PATCH_GZ_B64: 
        run: |
          echo "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Polish welcome artwork palette and jellyfish"
          git push
