name: One-time night world card parity

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/night-world-card-parity.yml'

permissions:
  contents: write

jobs:
  patch-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/night_world_patch.py
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Tune Atlas Hub night card parity and rails"
          git push origin HEAD:main
