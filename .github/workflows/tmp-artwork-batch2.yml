name: Temporary artwork batch 2 patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/tmp-artwork-batch2-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python <<'PY'
          import base64
          from pathlib import Path

          def decode(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_once(path, old_value, new_value):
              target = Path(path)
              text = target.read_text()
              old = decode(old_value)
              new = decode(new_value)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 exact match, found {count}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'compass/index.html',
              '',
              ''
          )

          replace_once(
              'compass/index.html',
              '',
              ''
          )

          replace_once(
              'compass/index.html',
              'ICAgICAgICAgICAgICAgICAgPHNwYW4gY2xhc3M9InN1YmplY3QtYXJ0d29yay1maWVsZC1sYWJlbCI+CiAgICAgICAgICAgICAgICAgICAgQ3VzdG9tCiAgICAgICAgICAgICAgICAgIDwvc3Bhbj4K',
              'ICAgICAgICAgICAgICAgICAgPHNwYW4+CiAgICAgICAgICAgICAgICAgICAgQ3VzdG9tCiAgICAgICAgICAgICAgICAgIDwvc3Bhbj4K'
          )

          replace_once(
              'compass/index.html',
              '',
              ''
          )
          PY

          rm .github/workflows/tmp-artwork-batch2.yml
          rm .github/tmp-artwork-batch2-trigger

          git config user.name "Atlas patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html .github/workflows/tmp-artwork-batch2.yml .github/tmp-artwork-batch2-trigger
          git commit -m "Refine artwork studio for phones"
          git push origin main
