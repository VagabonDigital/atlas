name: Temporary Compass hover loop fix

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp-fix-compass-hover-loop-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Compass cloud cache refresh loop
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python .github/tmp-fix-compass-hover-loop.py
          git rm -f \
            .github/tmp-fix-compass-hover-loop.py \
            .github/workflows/tmp-fix-compass-hover-loop.yml \
            .github/tmp-fix-compass-hover-loop-trigger
          git config user.name 'Atlas patch bot'
          git config user.email 'atlas-patch-bot@users.noreply.github.com'
          git add shared/atlas-cloud-cache.js
          git diff --check --cached
          git commit -m 'Stop Compass hub refresh repaint loop'
          git push origin main
