name: One-time Tutor Layer mobile header fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-header-fix.yml'

permissions:
  contents: write

jobs:
  fix-mobile-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Tutor Layer mobile header
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tutors/index.html')
          text = path.read_text()
          old = "      .header-inner {\n        min-height: 60px;\n        flex-wrap: wrap;\n        padding: 10px 15px 8px;\n      }\n\n      .nav {\n        order: 3;\n        width: 100%;\n        margin-left: 0;\n      }\n\n      .theme-toggle {\n        margin-left: auto;\n      }\n"
          new = "      .header-inner {\n        height: 56px;\n        min-height: 0;\n        flex-wrap: nowrap;\n        padding: 0 15px;\n      }\n\n      .nav {\n        order: initial;\n        width: auto;\n        min-width: 0;\n        flex: 1 1 auto;\n        margin-left: .5rem;\n      }\n\n      .theme-toggle {\n        margin-left: .25rem;\n      }\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one mobile header block, found {text.count(old)}; refusing to modify file.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git diff --cached --check
          git commit -m "Compact Tutor Layer mobile header"
          git push origin HEAD:main
