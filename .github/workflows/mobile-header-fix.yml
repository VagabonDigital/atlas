name: One-time Tutor Layer mobile header fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-header-fix.yml'

permissions:
  contents: write

jobs:
  fix-mobile-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Tutor Layer mobile header
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tutors/index.html')
          text = path.read_text()
          old = '''      .header-inner {
        min-height: 60px;
        flex-wrap: wrap;
        padding: 10px 15px 8px;
      }

      .nav {
        order: 3;
        width: 100%;
        margin-left: 0;
      }

      .theme-toggle {
        margin-left: auto;
      }
'''
          new = '''      .header-inner {
        height: 56px;
        min-height: 0;
        flex-wrap: nowrap;
        padding: 0 15px;
      }

      .nav {
        order: initial;
        width: auto;
        min-width: 0;
        flex: 1 1 auto;
        margin-left: .5rem;
      }

      .theme-toggle {
        margin-left: .25rem;
      }
'''
          if old not in text:
              raise SystemExit('Expected mobile header block not found; refusing to modify file.')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one mobile header block; refusing to modify file.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git diff --cached --check
          git commit -m "Compact Tutor Layer mobile header"
          git push origin HEAD:main
