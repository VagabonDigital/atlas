name: Add Layer quantum card

on:
  push:
    paths:
      - '.github/workflows/add-layer-quantum-card.yml'

permissions:
  contents: write

jobs:
  update-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert quantum card after bacon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tutors/index.html')
          text = p.read_text()
          title = 'When Observation Changes Reality'
          if title in text:
              print('Card already present; nothing to do.')
              raise SystemExit(0)

          marker = '<h3 class="library-demo-title">The Couples Who Win Bacon</h3>'
          i = text.find(marker)
          if i == -1:
              raise SystemExit('Bacon card marker not found')
          end = text.find('</article>', i)
          if end == -1:
              raise SystemExit('Could not find end of bacon card')
          end += len('</article>')

          card = '''\n\n            <article class="library-demo-card" tabindex="0">\n              <div class="library-demo-art" aria-hidden="true">\n                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="27" cy="70" r="5"></circle><path d="M36 70h35"></path><path d="M73 22v36M73 67v7M73 78v40"></path><path d="M82 51c10 5 16 11 21 19M82 89c10-5 16-11 21-19"></path><path d="M83 59c7 4 11 7 15 11M83 81c7-4 11-7 15-11"></path><path d="M112 25c9 0 16 6 21 13-5 7-12 13-21 13-9 0-16-6-21-13 5-7 12-13 21-13z"></path><circle cx="112" cy="38" r="4"></circle><path d="M112 51v18" stroke-dasharray="3 5"></path><rect x="151" y="21" width="2" height="98" rx="1" fill="currentColor" stroke="none"></rect><circle cx="160" cy="42" r="2" fill="currentColor" stroke="none"></circle><circle cx="160" cy="58" r="2" fill="currentColor" stroke="none"></circle><circle cx="160" cy="82" r="2" fill="currentColor" stroke="none"></circle><circle cx="160" cy="99" r="2" fill="currentColor" stroke="none"></circle></g></svg>\n              </div>\n\n              <h3 class="library-demo-title">When Observation Changes Reality</h3>\n              <p class="library-demo-copy">In the double-slit experiment, particles behave differently depending on whether their path is measured. The result is one of quantum physics’ strangest ideas: observing a system can change what actually happens.</p>\n\n              <div class="library-demo-footer">\n                <span class="library-demo-explore">Explore <span aria-hidden="true">→</span></span>\n              </div>\n            </article>'''

          text = text[:end] + card + text[end:]
          p.write_text(text)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add quantum subject card to Tutor Layer"
          git push
