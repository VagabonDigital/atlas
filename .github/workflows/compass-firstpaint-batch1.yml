name: Temporary Compass first-paint batch 1

on:
  push:
    paths:
      - '.github/atlas_patch_compass_firstpaint.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply guarded Compass first-paint patch
        run: python .github/atlas_patch_compass_firstpaint.py

      - name: Validate patch
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('compass/index.html').read_text(encoding='utf-8')
          assert "atlas:compass-session-chrome-ready" in text
          head_gate = text.split('</head>', 1)[0]
          assert "DOMContentLoaded" not in head_gate
          assert "document.fonts.load('500 13px \"DM Sans\"')" in head_gate
          assert "window.dispatchEvent(" in text
          PY

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/atlas_patch_compass_firstpaint.py
          rm -f .github/workflows/compass-firstpaint-batch1.yml

      - name: Commit and push product change
        run: |
          git config user.name "Atlas Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html .github
          git diff --cached --check
          git commit -m "Release Compass first paint earlier"
          git push origin HEAD:main
