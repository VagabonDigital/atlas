name: Add Layer bacon card

on:
  push:
    paths:
      - '.github/workflows/add-layer-bacon-card.yml'

permissions:
  contents: write

jobs:
  update-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert bacon card after lightning
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tutors/index.html')
          text = p.read_text()
          title = 'The Couples Who Win Bacon'
          if title in text:
              print('Card already present; nothing to do.')
              raise SystemExit(0)

          marker = '<h3 class="library-demo-title">Lightning That Shoots Into Space</h3>'
          i = text.find(marker)
          if i == -1:
              raise SystemExit('Lightning card marker not found')
          end = text.find('</article>', i)
          if end == -1:
              raise SystemExit('Could not find end of lightning card')
          end += len('</article>')

          card = '''\n\n            <article class="library-demo-card" tabindex="0">\n              <div class="library-demo-art" aria-hidden="true">\n                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M48 31 C51 24 61 21 75 22 L128 27 C137 28 141 34 138 41 L130 59 C127 66 119 68 109 66 L57 61 C47 60 43 53 45 45 Z"></path><path d="M55 34 C66 31 72 38 82 36 C92 34 98 41 108 39 C117 37 123 43 133 41"></path><path d="M51 45 C62 42 70 49 79 47 C89 45 96 52 105 50 C115 48 121 55 132 52"></path><path d="M49 53 C59 51 67 57 77 55 C87 53 95 60 104 57 C114 55 121 62 129 59"></path><circle cx="70" cy="82" r="9"></circle><circle cx="108" cy="82" r="9"></circle><path d="M57 116 C58 101 63 94 70 93 C77 94 82 101 83 116"></path><path d="M95 116 C96 101 101 94 108 93 C115 94 120 101 121 116"></path><path d="M81 101 C88 96 91 96 99 101"></path><path d="M67 101 C74 106 81 108 88 108"></path><path d="M92 108 C99 108 106 106 113 101"></path><path d="M84 75 C87 71 91 71 94 75 C97 71 101 71 104 75 C104 82 94 87 94 87 C94 87 84 82 84 75 Z"></path></g></svg>\n              </div>\n\n              <h3 class="library-demo-title">The Couples Who Win Bacon</h3>\n              <p class="library-demo-copy">In Dunmow, couples who can prove they haven’t regretted their marriage for a year and a day can win a whole flitch of bacon — a centuries-old tradition that turns marital happiness into a very unusual prize.</p>\n\n              <div class="library-demo-footer">\n                <span class="library-demo-explore">Explore <span aria-hidden="true">→</span></span>\n              </div>\n            </article>'''

          text = text[:end] + card + text[end:]
          p.write_text(text)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add bacon subject card to Tutor Layer"
          git push
