name: Inside Atlas anonymous first paint patch

on:
  push:
    paths:
      - '.github/workflows/inside-atlas-anonymous-firstpaint-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply corrected Inside Atlas anonymous first-paint patch
        run: python .github/atlas_patch_inside_anonymous_firstpaint_retry.py

      - name: Validate account chrome syntax
        run: |
          node --check shared/atlas-account-chrome.js
          node --check tests/atlas-account-chrome-contract.test.js

      - name: Run account chrome contract proof
        run: node tests/atlas-account-chrome-contract.test.js

      - name: Verify first-paint boundaries
        run: |
          grep -Fq "sb-jnhjfpagectprceswvqn-auth-token" tutors/index.html
          grep -Fq "atlasAccountHint" tutors/index.html
          grep -Fq 'data-atlas-inside-create>' tutors/index.html
          ! grep -Fq 'data-atlas-inside-create hidden>' tutors/index.html
          grep -Fq "pendingAnonymous" shared/atlas-account-chrome.js
          grep -Fq 'atlas-account-chrome.css?v=20260916-accountchrome6' tutors/index.html
          grep -Fq 'atlas-account-chrome.js?v=20260916-accountchrome6' tutors/index.html

      - name: Commit product change and remove runner
        run: |
          rm -f .github/workflows/inside-atlas-anonymous-firstpaint-patch.yml
          rm -f .github/atlas_patch_inside_anonymous_firstpaint.py
          rm -f .github/atlas_patch_inside_anonymous_firstpaint_retry.py
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Stabilize Inside Atlas anonymous first paint"
          git push origin main
