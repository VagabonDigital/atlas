name: Temporary Compass cloud pending safety A

on:
  push:
    paths:
      - '.github/atlas_patch_compass_cloud_pending_a.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply guarded Compass Pass A patch
        run: python .github/atlas_patch_compass_cloud_pending_a.py

      - name: Validate Pass A
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('compass/index.html').read_text(encoding='utf-8')
          assert "function syncCompassCloudAuthorityState()" in text
          assert "function isCompassCloudAuthorityPending()" in text
          assert "'atlas:compass-cloud-authority-ready'" in text
          assert "if (Subjects && !cloudAuthorityPending)" in text
          assert "cloudAuthorityPending\n          ? ''" in text
          PY

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/atlas_patch_compass_cloud_pending_a.py
          rm -f .github/workflows/compass-cloud-pending-a.yml

      - name: Commit and push product change
        run: |
          git config user.name "Atlas Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html .github
          git diff --cached --check
          git commit -m "Guard Compass signed-in cloud pending state"
          git push origin HEAD:main
