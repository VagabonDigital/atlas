name: One-time Atlas Original session action

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-atlas-original-session-action.yml'

permissions:
  contents: write

jobs:
  patch-compass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_atlas_original_session_action.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compass/index.html
          git diff --cached --check
          git commit -m "Add Atlas Originals directly to session subjects"
          git push origin HEAD:main
