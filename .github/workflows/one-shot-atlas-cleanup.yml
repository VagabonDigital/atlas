name: One-shot Atlas cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message == 'Run Atlas cleanup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          tutor_path = Path('tutors/index.html')
          tutor = tutor_path.read_text(encoding='utf-8')

          css_block = """    #early .origin > .kicker {
              color: var(--text-muted);
            }

          """
          if tutor.count(css_block) != 1:
              raise SystemExit('Expected Story kicker override exactly once')
          tutor = tutor.replace(css_block, '', 1)

          replacements = [
              ('Useful subjects and questions', 'Strong subjects and questions'),
              ('keep the useful parts of the relationship connected', 'keep the parts of the relationship that matter connected'),
              ('href="#" aria-label="Message Atlas Team"', 'href="./feedback.html" aria-label="Message Atlas Team"'),
          ]
          for old, new in replacements:
              if tutor.count(old) != 1:
                  raise SystemExit(f'Expected exactly one Tutor Layer match: {old!r}')
              tutor = tutor.replace(old, new, 1)

          tutor_path.write_text(tutor, encoding='utf-8')

          atlas_path = Path('index.html')
          atlas = atlas_path.read_text(encoding='utf-8')
          stale_line = '  Business may sharpen.\n'
          if atlas.count(stale_line) != 1:
              raise SystemExit('Expected stale Business architecture comment exactly once')
          atlas = atlas.replace(stale_line, '', 1)
          atlas_path.write_text(atlas, encoding='utf-8')
          PY

          git config user.name "Atlas cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add tutors/index.html index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Clean up Tutor Layer pilot details"
          git push origin HEAD:main
