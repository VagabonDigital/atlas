name: Atlas Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas:
    name: Atlas root verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Atlas verification
        run: npm run verify
      - name: Verify Forbidden Words database and transport
        run: |
          npm ci --ignore-scripts --prefix arcade/forbidden-words/dev
          npm test --prefix arcade/forbidden-words/dev

