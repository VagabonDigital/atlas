name: Temporary session fullscreen patch

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp-session-fullscreen-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch shared session panel
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python - <<'PY'
          from pathlib import Path
          import base64

          patches = [
              (
                  Path('shared/atlas-session-panel.css'),
                  '',
                  ''
              ),
              (
                  Path('shared/atlas-session-panel.js'),
                  'ICAgICAgICBlbGVtZW50cy5kaWFsb2cuc3R5bGUubWF4SGVpZ2h0ID0gYCR7TWF0aC5tYXgoMTgwLCBoZWlnaHQgLSA4KX1weGA7',
                  'ICAgICAgICBlbGVtZW50cy5kaWFsb2cuc3R5bGUubWF4SGVpZ2h0ID0gYCR7TWF0aC5tYXgoMTgwLCBoZWlnaHQpfXB4YDs='
              )
          ]

          for path, old_b64, new_b64 in patches:
              text = path.read_text()
              old = base64.b64decode(old_b64).decode()
              new = base64.b64decode(new_b64).decode()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exact block once, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY

          git rm -f .github/workflows/tmp-session-fullscreen.yml .github/tmp-session-fullscreen-trigger
          git config user.name 'Atlas patch bot'
          git config user.email 'atlas-patch-bot@users.noreply.github.com'
          git add shared/atlas-session-panel.css shared/atlas-session-panel.js
          git commit -m 'Make session panel full-screen on phones'
          git push origin main
