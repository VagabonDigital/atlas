name: Temporary Compass theme finish patch

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp-compass-theme-finish-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finish Compass theme transition cleanly
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python .github/tmp-compass-theme-finish.py
          git rm -f \
            .github/tmp-compass-theme-finish.py \
            .github/workflows/tmp-compass-theme-finish.yml \
            .github/tmp-compass-theme-finish-trigger
          git config user.name 'Atlas patch bot'
          git config user.email 'atlas-patch-bot@users.noreply.github.com'
          git add shared/atlas-bridge.js compass/index.html
          git diff --check --cached
          git commit -m 'Smooth Compass theme transition finish'
          git push origin main
