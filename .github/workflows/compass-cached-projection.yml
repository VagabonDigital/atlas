name: Temporary Compass cached projection

on:
  push:
    paths:
      - '.github/atlas_patch_compass_cached_projection.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply guarded Compass cache patch
        run: python .github/atlas_patch_compass_cached_projection.py

      - name: Validate cached projection
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('compass/index.html').read_text(encoding='utf-8')

          assert 'AtlasCompassHubInitialSnapshot' in text
          assert "'atlas::compassHubCache::v1::'" in text
          assert 'function getCompassInitialAccountSnapshot()' in text
          assert 'function getCompassInitialLibraryState(' in text
          assert 'function getCompassInitialSubjectSummaries(' in text
          assert "if (cloudAuthorityPending) {\n          const snapshot" in text
          assert 'isCachedProjection:\n              cloudAuthorityPending' in text
          assert 'canCreate:\n                  !cloudAuthorityPending' in text
          assert 'canAdd:\n              !cloudAuthorityPending' in text
          assert "isCompassCloudAuthorityPending()\n            ? ''" in text
          assert "async function getOwnedSubjects() {\n      if (isCompassCloudAuthorityPending()) {\n        return [];" not in text
          PY

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/atlas_patch_compass_cached_projection.py
          rm -f .github/workflows/compass-cached-projection.yml

      - name: Commit and push product change
        run: |
          git config user.name "Atlas Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html .github
          git diff --cached --check
          git commit -m "Restore Compass cached first paint"
          git push origin HEAD:main
