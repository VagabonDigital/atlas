name: SharedWorker Integration Batch 6

on:
  push:
    branches:
      - integration/shared-worker-subject-builds

jobs:
  batch6-final-integration-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check integrated JavaScript syntax
        run: |
          set -euo pipefail
          node --check shared/atlas-ai.js
          node --check shared/atlas-structured-subject.js
          node --check shared/atlas-subject-build-document-operations.js
          node --check shared/atlas-subject-build-runner.js
          node --check shared/atlas-subject-build-shared-worker.js
          node --check shared/atlas-subject-build-worker-client.js
          node --check shared/atlas-subject-build-resurrection.js
          node --check shared/atlas-subject-runtime-channel.js
          node --check shared/atlas-tutor-subjects-cloud-authority.js
          node --check shared/atlas-cloud-cache.js
          node --check shared/atlas-content-registry.js
          node --check compass/shared/compass-subject-loader.js
          node --check compass/shared/compass-generation-recovery.js
          node --check compass/shared/compass-engine.js

      - name: Run complete SharedWorker integration contract suite
        run: |
          set -euo pipefail
          node tests/atlas-subject-build-worker-neutral.test.js
          node tests/atlas-subject-build-runner-foundation.test.js
          node tests/atlas-subject-checkpoint-persistence.test.js
          node tests/atlas-subject-build-shared-worker-foundation.test.js
          node tests/atlas-subject-loader-foreground-handoff.test.js
          node tests/atlas-subject-build-engine-integration.test.js
          node tests/atlas-subject-build-handoff-document-coherence.test.js
          node tests/atlas-subject-build-foreground-handoff.test.js
          node tests/atlas-incomplete-ai-subject-recovery.test.js
          node tests/atlas-subject-build-resurrection.test.js
          node tests/atlas-subject-build-navigation-bootstrap.test.js
          node tests/atlas-subject-build-worker-reconnect.test.js
          node tests/atlas-subject-build-shared-worker-generation.test.js
          node tests/atlas-subject-build-full-journey.test.js
          node tests/atlas-key-language-worker-resilience.test.js
          node tests/atlas-compass-suggestion-memory.test.js
          node tests/atlas-account-duplicate-signup.test.js
          node tests/atlas-learner-memory-personalization.test.js
