name: Temporary artwork batch 2 typo fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/tmp-artwork-batch2-fix-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python <<'PY'
          import base64
          from pathlib import Path
          path = Path('compass/index.html')
          text = path.read_text()
          old = base64.b64decode('ICAgICAgICBtYXgtaGVpZ2h0OiAxMDBkdnZoOwo=').decode('utf-8')
          new = base64.b64decode('ICAgICAgICBtYXgtaGVpZ2h0OiAxMDBkdmg7Cg==').decode('utf-8')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected 1 exact typo match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-artwork-batch2-fix.yml
          rm .github/tmp-artwork-batch2-fix-trigger
          git config user.name "Atlas patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html .github/workflows/tmp-artwork-batch2-fix.yml .github/tmp-artwork-batch2-fix-trigger
          git commit -m "Fix artwork studio phone viewport"
          git push origin main
