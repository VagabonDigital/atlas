name: Compass overflow clip patch

on:
  push:
    paths:
      - '.github/workflows/compass-overflow-clip-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply guarded overflow fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('compass/index.html')
          text = path.read_text(encoding='utf-8')
          old = "      overflow-x: hidden;\n      padding-top: 56px;"
          new = "      overflow-x: clip;\n      padding-top: 56px;"

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Compass body overflow match, found {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit product change and remove runner
        run: |
          rm -f .github/workflows/compass-overflow-clip-patch.yml
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stabilize Compass card menu overflow"
          git push origin main
