# Batch 5 retry
name: Atlas Batch 5 Patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/atlas-batch5-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Batch 5
        run: python .github/atlas-batch5-patch.py
      - name: Validate JavaScript syntax
        run: |
          node --check shared/atlas-original-curation.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          inline = '\n'.join(s for s in scripts if s.strip())
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
              f.write(inline)
              name = f.name
          subprocess.run(['node','--check',name], check=True)
          PY
      - name: Validate Batch 5 scope
        run: |
          python - <<'PY'
          from pathlib import Path
          hub = Path('index.html').read_text()
          store = Path('shared/atlas-original-curation.js').read_text()
          required = [
              'id="restore-atlas-originals-row" hidden',
              'Restore all Atlas Originals',
              'function renderRestoreAllAtlasOriginalsSetting()',
              'async function restoreAllAtlasOriginals(button)',
              'Curation.restoreAll()',
          ]
          for needle in required:
              assert needle in hub, needle
          assert 'function restoreAll()' in store
          assert "items: {}" in store
          assert "window.AtlasOriginalCuration" in store
          assert "renderRestoreAllAtlasOriginalsSetting();" in hub
          PY
      - name: Commit Batch 5
        run: |
          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/atlas-batch5-patch.py
          rm .github/workflows/atlas-batch5-patch.yml
          git add index.html shared/atlas-original-curation.js .github/atlas-batch5-patch.py .github/workflows/atlas-batch5-patch.yml
          git commit -m "feat: restore all Atlas Originals from settings"
          git push
