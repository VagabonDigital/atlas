name: Fix Game Theory Die Pips
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-game-theory-die-pips.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pip fix
        run: python .github/fix-game-theory-die-pips.py
      - name: Validate targeted SVG change
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('shared/compass-catalog-data.js').read_text()
          block = text.split("'game-theory': `", 1)[1].split('`', 1)[0]
          assert '<circle cx="58" cy="64"' in block
          assert '<circle cx="75" cy="74"' in block
          assert '<circle cx="58" cy="80"' in block
          assert '<circle cx="75" cy="90"' in block
          assert '<circle cx="58" cy="96"' in block
          assert '<circle cx="75" cy="106"' in block
          assert '<circle cx="59" cy="65"' not in block
          PY
      - name: Commit fix
        run: |
          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/fix-game-theory-die-pips.py
          rm .github/workflows/fix-game-theory-die-pips.yml
          git add shared/compass-catalog-data.js .github/fix-game-theory-die-pips.py .github/workflows/fix-game-theory-die-pips.yml
          git commit -m "fix: make game theory die face read as six"
          git push
