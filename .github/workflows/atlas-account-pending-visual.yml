name: Atlas account pending visual polish

on:
  push:
    paths:
      - '.github/workflows/atlas-account-pending-visual.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply pending-state visual polish
        run: python .github/atlas_patch_account_pending_visual.py

      - name: Validate runtime syntax
        run: |
          node --check shared/atlas-account-chrome.js
          node --check shared/atlas-content-registry.js
          node --check shared/atlas-account-gate.js
          node --check tests/atlas-account-chrome-contract.test.js

      - name: Run account chrome proof
        run: node tests/atlas-account-chrome-contract.test.js

      - name: Verify visual and cache boundaries
        run: |
          grep -A2 '.atlas-account-control:disabled' shared/atlas-account-chrome.css | grep -q 'opacity: 1;'
          ! grep -A2 '.atlas-account-control:disabled' shared/atlas-account-chrome.css | grep -q 'opacity: 0.52;'
          grep -q 'atlas-account-chrome.css?v=20260916-accountchrome3' shared/atlas-account-chrome.js
          grep -q 'atlas-account-chrome.js?v=20260916-accountchrome3' shared/atlas-content-registry.js
          grep -q 'atlas-content-registry.js?v=20260916-accountchrome3' index.html
          grep -q 'atlas-content-registry.js?v=20260916-accountchrome3' compass/index.html
          grep -q 'atlas-content-registry.js?v=20260916-accountchrome3' arcade/index.html
          grep -q 'atlas-account-chrome.js?v=20260916-accountchrome3' tutors/index.html

      - name: Commit polish and remove runner
        run: |
          rm -f .github/workflows/atlas-account-pending-visual.yml
          rm -f .github/atlas_patch_account_pending_visual.py
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Keep pending account control visually stable"
          git push origin main
