name: Revert Session Subjects Create Shortcut
on:
  push:
    branches: [main]
    paths: ['.github/workflows/revert-session-create-shortcut.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python .github/revert-session-create-shortcut.py
      - name: Validate targeted behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('compass/index.html').read_text()
          assert "canAdd: true,\n            canCreate: true" not in text
          assert "openCreateSubjectDialog(event, getActiveSession().id)" not in text
          assert "onclick=\"openAddSessionSubjectDialog(event)\"" in text
          assert "Create new subject" in text
          assert "Choose existing subject" in text
          print('Session Subjects restored to single Add gateway.')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/revert-session-create-shortcut.py
          rm .github/workflows/revert-session-create-shortcut.yml
          git add compass/index.html .github/revert-session-create-shortcut.py .github/workflows/revert-session-create-shortcut.yml
          git commit -m "fix: restore single Session Subjects add action"
          git push
