name: One-time cover action emphasis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-cover-action-emphasis.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Emphasize cover action
        run: |
          python - <<'PY'
          from pathlib import Path

          def block(lines):
              return '\n'.join(lines)

          def replace_once(path_str, old, new):
              path = Path(path_str)
              data = path.read_bytes()
              newline = '\r\n' if b'\r\n' in data else '\n'
              old_bytes = old.replace('\n', newline).encode('utf-8')
              new_bytes = new.replace('\n', newline).encode('utf-8')
              count = data.count(old_bytes)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected one match, found {count}')
              path.write_bytes(data.replace(old_bytes, new_bytes, 1))

          shell_old = block([
              '            <button class="atlas-my-version-secondary"',
              '                id="atlas-my-version-cover-action"',
              '                type="button"',
              '                onclick="handleMyVersionCoverAction()">',
              '                Change cover',
              '            </button>',
          ])

          shell_new = block([
              '            <button class="atlas-my-version-secondary atlas-my-version-cover-action"',
              '                id="atlas-my-version-cover-action"',
              '                type="button"',
              '                onclick="handleMyVersionCoverAction()">',
              '                <svg class="atlas-my-version-cover-icon"',
              '                    width="14" height="14"',
              '                    viewBox="0 0 14 14"',
              '                    fill="none" aria-hidden="true">',
              '                    <rect x="1.6" y="2.2" width="10.8" height="9.1" rx="1.7"',
              '                        stroke="currentColor" stroke-width="1.2"/>',
              '                    <circle cx="4.6" cy="5.1" r="1.15"',
              '                        stroke="currentColor" stroke-width="1.05"/>',
              '                    <path d="M3.15 9.7L5.7 7.25L7.45 8.9L8.85 7.55L11.15 9.7"',
              '                        stroke="currentColor" stroke-width="1.05"',
              '                        stroke-linecap="round" stroke-linejoin="round"/>',
              '                </svg>',
              '                <span class="atlas-my-version-cover-label">Change cover</span>',
              '            </button>',
          ])

          engine_old = block([
              '    if (coverActionButton) {',
              '        coverActionButton.disabled =',
              '            myVersionSaving;',
              '',
              '        coverActionButton.textContent =',
              "            'Change cover';",
              '    }',
          ])

          engine_new = block([
              '    if (coverActionButton) {',
              '        coverActionButton.disabled =',
              '            myVersionSaving;',
              '',
              '        const coverActionLabel =',
              '            coverActionButton.querySelector(',
              "                '.atlas-my-version-cover-label'",
              '            );',
              '',
              '        if (coverActionLabel) {',
              '            coverActionLabel.textContent =',
              "                'Change cover';",
              '        }',
              '    }',
          ])

          css_old = block([
              '.atlas-my-version-secondary:hover:not(:disabled) {',
              '    border-color: rgba(var(--accent-rgb), 0.38);',
              '    color: var(--accent);',
              '}',
              '',
              '.atlas-my-version-ai {',
          ])

          css_new = block([
              '.atlas-my-version-secondary:hover:not(:disabled) {',
              '    border-color: rgba(var(--accent-rgb), 0.38);',
              '    color: var(--accent);',
              '}',
              '',
              '.atlas-my-version-cover-action {',
              '    display: inline-flex;',
              '    align-items: center;',
              '    justify-content: center;',
              '    gap: 0.38rem;',
              '    border-color: rgba(var(--accent-rgb), 0.42);',
              '    background: rgba(var(--accent-rgb), 0.085);',
              '    color: var(--accent);',
              '}',
              '',
              '.atlas-my-version-cover-action:hover:not(:disabled) {',
              '    border-color: var(--accent);',
              '    background: rgba(var(--accent-rgb), 0.14);',
              '    color: var(--accent);',
              '}',
              '',
              '.atlas-my-version-cover-icon {',
              '    flex: 0 0 auto;',
              '}',
              '',
              '.atlas-my-version-ai {',
          ])

          replace_once('compass/shared/compass-subject-shell.js', shell_old, shell_new)
          replace_once('compass/shared/compass-engine.js', engine_old, engine_new)
          replace_once('compass/shared/compass-subject.css', css_old, css_new)
          PY

      - name: Validate and commit
        run: |
          node --check compass/shared/compass-subject-shell.js
          node --check compass/shared/compass-engine.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compass/shared/compass-subject-shell.js compass/shared/compass-engine.js compass/shared/compass-subject.css
          git diff --cached --quiet && exit 0
          git commit -m "Emphasize cover customization action"
          git push origin HEAD:main
