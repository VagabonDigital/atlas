name: One-time Tutor Layer demo scroll fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tutor-scroll.yml'

permissions:
  contents: write

jobs:
  patch-tutor-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile demo scroll target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tutors/index.html')
          text = path.read_text()
          old = "      function scrollToCreateResult() {\n        if (!(window.matchMedia && window.matchMedia(\"(max-width: 720px)\").matches)) return;\n        var createResult = document.querySelector(\".create-result\");\n        if (!createResult) return;\n        window.requestAnimationFrame(function () {\n          var header = document.querySelector(\".site-header\");\n          var headerHeight = header ? header.getBoundingClientRect().height : 56;\n          var targetTop = createResult.getBoundingClientRect().top + window.scrollY - headerHeight - 12;\n          window.scrollTo({ top: Math.max(0, targetTop), behavior: reduceMotion ? \"auto\" : \"smooth\" });\n        });\n      }\n"
          new = "      function scrollToCreateResult() {\n        if (!(window.matchMedia && window.matchMedia(\"(max-width: 720px)\").matches)) return;\n        var createCard = document.querySelector(\".create-console\");\n        if (!createCard) return;\n        window.requestAnimationFrame(function () {\n          var header = document.querySelector(\".site-header\");\n          var headerHeight = header ? header.getBoundingClientRect().height : 56;\n          var targetTop = createCard.getBoundingClientRect().top + window.scrollY - headerHeight - 20;\n          window.scrollTo({ top: Math.max(0, targetTop), behavior: reduceMotion ? \"auto\" : \"smooth\" });\n        });\n      }\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one mobile demo scroll helper, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git diff --cached --check
          git commit -m "Fix mobile tutor demo scroll position"
          git push origin HEAD:main
