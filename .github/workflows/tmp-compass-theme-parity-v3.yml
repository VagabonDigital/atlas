name: Temporary Compass theme parity patch v3

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp-compass-theme-parity-v3-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Compass theme geometry and motion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python -c "import base64; exec(base64.b64decode('').decode())"
          git rm -f \
            .github/workflows/tmp-compass-theme-parity.yml \
            .github/tmp-compass-theme-parity-trigger \
            .github/workflows/tmp-compass-theme-parity-v2.yml \
            .github/tmp-compass-theme-parity-v2-trigger \
            .github/workflows/tmp-compass-theme-parity-v3.yml \
            .github/tmp-compass-theme-parity-v3-trigger
          git config user.name 'Atlas patch bot'
          git config user.email 'atlas-patch-bot@users.noreply.github.com'
          git add compass/index.html
          git diff --check --cached
          git commit -m 'Stabilize Compass theme transitions'
          git push origin main
