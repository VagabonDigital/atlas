name: Fix Game Theory Right Face
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-game-theory-right-face.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply face fix
        run: python .github/fix-game-theory-right-face.py
      - name: Validate targeted SVG change
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('shared/compass-catalog-data.js').read_text()
          block = text.split("'game-theory': `", 1)[1].split('`', 1)[0]
          for token in ['<circle cx="59" cy="65"', '<circle cx="74" cy="79"', '<circle cx="59" cy="90"', '<circle cx="74" cy="104"']:
              assert token in block
          for token in ['<circle cx="121" cy="65"', '<circle cx="105" cy="78"', '<circle cx="121" cy="82"', '<circle cx="105" cy="94"', '<circle cx="121" cy="99"', '<circle cx="105" cy="110"']:
              assert token in block
          assert '<circle cx="58" cy="64"' not in block
          assert '<circle cx="121" cy="64"' not in block
          PY
      - name: Commit fix
        run: |
          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/fix-game-theory-right-face.py
          rm .github/workflows/fix-game-theory-right-face.yml
          git add shared/compass-catalog-data.js .github/fix-game-theory-right-face.py .github/workflows/fix-game-theory-right-face.yml
          git commit -m "fix: restore left die face and make right face six"
          git push
