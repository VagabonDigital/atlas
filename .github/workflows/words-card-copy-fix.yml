name: Words That Stick card copy fix

on:
  push:
    branches:
      - astra-greenfield
    paths:
      - .github/workflows/words-card-copy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-greenfield
          fetch-depth: 0

      - name: Tighten card intro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('shared/compass-catalog-data.js')
          text = path.read_text()
          old = "hook: 'For C1+ learners: explore the origins, patterns and stories behind ambitious English words, with a focus on precise meaning, memorable connections and using new vocabulary naturally in real conversations.'"
          new = "hook: 'For C1+ learners: explore the origins and stories behind ambitious English words, with a focus on precise meaning, memorable connections and natural use in conversation.'"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old intro, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          node --check shared/compass-catalog-data.js
          git diff --check
          git rm .github/workflows/words-card-copy-fix.yml
          git config user.name "Atlas Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add shared/compass-catalog-data.js
          git commit -m "Tighten Words That Stick card intro"
          git push origin HEAD:astra-greenfield
