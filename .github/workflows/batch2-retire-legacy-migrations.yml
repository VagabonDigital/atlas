name: Batch 2 retire legacy migrations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch2-retire-legacy-migrations.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove account migration UI and prime guarded script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('account/index.html')
          text = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          def sub(pattern, repl, label):
              global text
              text2, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              text = text2

          once(
              '    .status.error,\n    .migration-status.error {',
              '    .status.error {',
              'status error selector'
          )
          sub(
              r'\n    \.migration-status\.success \{.*?\n    \}\n',
              '\n',
              'migration success CSS'
          )
          once(
              '    .account-view[hidden],\n    .login-view[hidden],\n    .migration-panel[hidden] { display: none; }',
              '    .account-view[hidden],\n    .login-view[hidden] { display: none; }',
              'hidden selector'
          )
          sub(
              r'\n    \.migration-panel \{.*?\n  </style>',
              '\n  </style>',
              'migration CSS block'
          )
          sub(
              r'  <script src="\.\./shared/atlas-structured-subject\.js"></script>\n'
              r'  <script src="\.\./shared/atlas-tutor-subjects\.js"></script>\n'
              r'  <script src="\.\./shared/atlas-bridge\.js"></script>\n'
              r'  <script src="\.\./shared/atlas-cloud\.js"></script>\n'
              r'  <script src="\.\./shared/atlas-account\.js"></script>\n'
              r'  <script src="\.\./shared/atlas-subject-migration\.js"></script>\n'
              r'  <script src="\.\./shared/atlas-library-migration\.js"></script>\n'
              r'  <script src="\.\./shared/atlas-learner-sessions-cloud\.js\?v=20260915-004"></script>\n'
              r'  <script src="\.\./shared/atlas-learner-session-migration\.js\?v=20260915-004"></script>',
              '  <script src="../shared/atlas-cloud.js"></script>\n  <script src="../shared/atlas-account.js"></script>',
              'account migration scripts'
          )
          sub(
              r'\n        <div id="migration-panel".*?\n        <div class="actions">',
              '\n        <div class="actions">',
              'migration panels'
          )
          sub(
              r'\n    const MigrationPanel = document\.getElementById\(\'migration-panel\'\);.*?\n    const MigrateLearners = document\.getElementById\(\'migrate-learners\'\);\n\n    let migrationCheckToken = 0;',
              '',
              'migration DOM bindings'
          )
          sub(
              r'\n    function setMigrationStatus\(node, message, state = \'\'\) \{.*?\n    function render\(state\) \{',
              '\n    function render(state) {',
              'migration preview functions'
          )
          once(
              "        setStatus('Your Atlas account is connected.');\n        void refreshMigrationPreviews();",
              "        setStatus('Your Atlas account is connected.');",
              'authenticated render migration call'
          )
          sub(
              r"      \} else if \(state\.ready\) \{\n        migrationCheckToken \+= 1;\n        MigrationPanel\.hidden = true;\n        LibraryMigrationPanel\.hidden = true;\n        LearnerMigrationPanel\.hidden = true;\n        MigrateSubjects\.hidden = true;\n        MigrateLibrary\.hidden = true;\n        MigrateLearners\.hidden = true;\n        AccountEmail\.textContent = '';\n        setStatus\('Sign in to connect your Atlas work to your account\.'\);",
              "      } else if (state.ready) {\n        AccountEmail.textContent = '';\n        setStatus('Sign in to access your Atlas account.');",
              'signed-out render cleanup'
          )
          sub(
              r'\n    MigrateSubjects\.addEventListener\(\'click\', async \(\) => \{.*?\n    document\.getElementById\(\'return\'\)\.addEventListener',
              "\n    document.getElementById('return').addEventListener",
              'migration action handlers'
          )

          for token in (
              'AtlasSubjectMigration', 'AtlasLibraryMigration',
              'AtlasLearnerSessionMigration', 'migration-panel',
              'migrate-subjects', 'migrate-library', 'migrate-learners'
          ):
              if token in text:
                  raise RuntimeError(f'account cleanup left migration token: {token}')

          p.write_text(text, encoding='utf-8')

          script = Path('.github/scripts/batch2_retire_legacy_migrations.py')
          s = script.read_text(encoding='utf-8')
          old = "if rel in legacy_files or rel.startswith('.github/scripts/batch2_'):"
          new = "if rel in legacy_files or rel.startswith('.github/scripts/batch2_') or rel.startswith('.github/workflows/batch2-'):"
          if old not in s:
              raise RuntimeError('Could not prime guarded cleanup script exclusion')
          script.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply guarded cleanup
        run: python .github/scripts/batch2_retire_legacy_migrations.py

      - name: Static syntax checks
        run: |
          node --check shared/atlas-tutor-content-cloud-sync.js
          node --check shared/atlas-tutor-content-cloud-authority.js
          node --check shared/atlas-learner-sessions-cloud-authority.js
          node --check shared/atlas-learner-continuity-cloud-authority.js
          node --check shared/atlas-shared-continuity-cloud-authority.js
          node --check shared/atlas-shared-session-subjects-cloud-authority.js

      - name: Confirm migration runtime is gone
        run: |
          test ! -e shared/atlas-subject-migration.js
          test ! -e shared/atlas-library-migration.js
          test ! -e shared/atlas-learner-session-migration.js
          ! grep -R --line-number --exclude-dir=.git \
            --exclude='batch2_retire_legacy_migrations.py' \
            --exclude='batch2-retire-legacy-migrations.yml' \
            -E 'atlas-(subject|library|learner-session)-migration\.js|Atlas(Subject|Library|LearnerSession)Migration|legacy-claim' .

      - name: Commit cleanup and remove temporary automation
        run: |
          rm -f .github/workflows/batch2-retire-legacy-migrations.yml
          rm -f .github/scripts/batch2_retire_legacy_migrations.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name 'Atlas Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Retire legacy migration machinery'
          git push origin HEAD:main
