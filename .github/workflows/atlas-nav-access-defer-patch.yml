name: Atlas hub access deferral patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-nav-access-defer-patch.yml'

permissions:
  contents: write

concurrency:
  group: atlas-nav-access-defer-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.head_commit.message == 'Arm Atlas hub access deferral workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase on current main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply guarded patch
        run: python .github/scripts/atlas_nav_access_defer_patch.py

      - name: Validate patch
        run: |
          node --check shared/atlas-access-bootstrap.js
          node --check shared/atlas-content-registry.js
          git diff --check

      - name: Commit product change and remove patch machinery
        run: |
          rm .github/scripts/atlas_nav_access_defer_patch.py
          rm .github/workflows/atlas-nav-access-defer-patch.yml
          git config user.name 'Atlas Patch Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html compass/index.html shared/atlas-access-bootstrap.js shared/atlas-content-registry.js .github/scripts/atlas_nav_access_defer_patch.py .github/workflows/atlas-nav-access-defer-patch.yml
          git commit -m 'Defer hub account bootstrap past first paint'
          git push origin HEAD:main
