name: One-time welcome hover easter eggs

'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-welcome-easter-eggs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add hover easter eggs
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = '''
              /* ATLAS WELCOME HOVER EASTER EGGS START */
              .atlas-welcome-hidden {
                z-index: 0;
                pointer-events: none;
                opacity: 0;
                transition: opacity 420ms cubic-bezier(0.2, 0.75, 0.2, 1), translate 520ms cubic-bezier(0.2, 0.75, 0.2, 1);
              }

              .atlas-welcome-hidden--technology {
                width: clamp(150px, 13vw, 205px);
                left: clamp(-92px, -5vw, -54px);
                top: 43%;
                color: #789996;
                translate: -18px 5px;
              }

              .atlas-welcome-hidden--stories {
                width: clamp(150px, 13vw, 205px);
                right: clamp(-88px, -4.6vw, -48px);
                top: 35%;
                color: #9a806f;
                translate: 18px 4px;
              }

              .atlas-welcome-hidden--humour {
                width: clamp(150px, 13vw, 205px);
                left: clamp(-78px, -4vw, -42px);
                bottom: 13%;
                color: #b47b75;
                translate: -18px 8px;
              }

              .atlas-welcome-hidden--octopus {
                width: clamp(155px, 13.5vw, 210px);
                right: clamp(-82px, -4.2vw, -44px);
                bottom: 13%;
                color: #6f9b94;
                translate: 18px 8px;
              }

              @media (hover: hover) and (pointer: fine) and (min-width: 701px) {
                .atlas-welcome-art--travel,
                .atlas-welcome-art--odyssey,
                .atlas-welcome-art--game-theory,
                .atlas-welcome-art--jellyfish {
                  pointer-events: auto;
                  cursor: default;
                  transition: opacity 360ms ease, translate 480ms cubic-bezier(0.2, 0.75, 0.2, 1);
                }

                .atlas-welcome-art--travel:hover { translate: 14px -4px; opacity: 0.32; }
                .atlas-welcome-art--odyssey:hover { translate: -14px 5px; opacity: 0.29; }
                .atlas-welcome-art--game-theory:hover { translate: 13px -9px; opacity: 0.28; }
                .atlas-welcome-art--jellyfish:hover { translate: -13px -8px; opacity: 0.27; }

                .atlas-welcome-screen:has(.atlas-welcome-art--travel:hover) .atlas-welcome-hidden--technology { opacity: 0.14; translate: 0 0; }
                .atlas-welcome-screen:has(.atlas-welcome-art--odyssey:hover) .atlas-welcome-hidden--stories { opacity: 0.13; translate: 0 0; }
                .atlas-welcome-screen:has(.atlas-welcome-art--game-theory:hover) .atlas-welcome-hidden--humour { opacity: 0.14; translate: 0 0; }
                .atlas-welcome-screen:has(.atlas-welcome-art--jellyfish:hover) .atlas-welcome-hidden--octopus { opacity: 0.14; translate: 0 0; }
              }

              @media (prefers-reduced-motion: reduce) {
                .atlas-welcome-hidden,
                .atlas-welcome-art--travel,
                .atlas-welcome-art--odyssey,
                .atlas-welcome-art--game-theory,
                .atlas-welcome-art--jellyfish {
                  transition: opacity 160ms ease;
                }
                .atlas-welcome-art--travel:hover,
                .atlas-welcome-art--odyssey:hover,
                .atlas-welcome-art--game-theory:hover,
                .atlas-welcome-art--jellyfish:hover {
                  translate: none;
                }
              }
              /* ATLAS WELCOME HOVER EASTER EGGS END */
          '''

          anchor = '    /* ATLAS WELCOME COMPOSITION OVERRIDE END */'
          if 'ATLAS WELCOME HOVER EASTER EGGS START' in text:
              raise SystemExit('already installed')
          if anchor not in text:
              raise SystemExit('composition anchor missing')
          text = text.replace(anchor, css + '\n' + anchor, 1)

          swaps = [
              (
                  '    <div class="atlas-welcome-art atlas-welcome-art--travel" data-compass-art="travel-route" aria-hidden="true"></div>',
                  '    <div class="atlas-welcome-art atlas-welcome-art--travel" data-compass-art="travel-route" aria-hidden="true"></div>\n    <div class="atlas-welcome-art atlas-welcome-hidden atlas-welcome-hidden--technology" data-compass-art="technology-circuit" aria-hidden="true"></div>'
              ),
              (
                  '    <div class="atlas-welcome-art atlas-welcome-art--odyssey" data-compass-art="odyssey-voyage" aria-hidden="true"></div>',
                  '    <div class="atlas-welcome-art atlas-welcome-art--odyssey" data-compass-art="odyssey-voyage" aria-hidden="true"></div>\n    <div class="atlas-welcome-art atlas-welcome-hidden atlas-welcome-hidden--stories" data-compass-art="stories-book-screen" aria-hidden="true"></div>'
              ),
              (
                  '    <div class="atlas-welcome-art atlas-welcome-art--game-theory" data-compass-art="game-theory" aria-hidden="true"></div>',
                  '    <div class="atlas-welcome-art atlas-welcome-art--game-theory" data-compass-art="game-theory" aria-hidden="true"></div>\n    <div class="atlas-welcome-art atlas-welcome-hidden atlas-welcome-hidden--humour" data-compass-art="humour-reactions" aria-hidden="true"></div>'
              )
          ]

          for old, new in swaps:
              if old not in text:
                  raise SystemExit('expected primary artwork block missing')
              text = text.replace(old, new, 1)

          jelly_start = text.find('<div class="atlas-welcome-art atlas-welcome-art--jellyfish"')
          if jelly_start < 0:
              raise SystemExit('jellyfish block missing')
          before = text[:jelly_start]
          after = text[jelly_start:]
          old = '    </div>\n\n    <div class="atlas-welcome-inner">'
          new = '    </div>\n    <div class="atlas-welcome-art atlas-welcome-hidden atlas-welcome-hidden--octopus" data-compass-art="octopus-signals" aria-hidden="true"></div>\n\n    <div class="atlas-welcome-inner">'
          if old not in after:
              raise SystemExit('jellyfish close anchor missing')
          after = after.replace(old, new, 1)
          text = before + after

          for marker in ['technology-circuit', 'stories-book-screen', 'humour-reactions', 'octopus-signals']:
              if marker not in text:
                  raise SystemExit('missing ' + marker)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add playful welcome artwork hover easter eggs"
          git push
