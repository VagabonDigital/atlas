name: One-time clean world card treatment

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-world-cards.yml'

permissions:
  contents: write

jobs:
  patch-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleaner world card system
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          replacements = [
              ('--world-card-surface: rgba(255, 253, 249, 0.74);', '--world-card-surface: rgba(255, 253, 249, 0.96);', 'day world surface'),
              ('--compass-card-start: rgba(255, 253, 249, 0.90);', '--compass-card-start: rgba(255, 253, 249, 1);', 'day compass start'),
              ('--compass-card-end: rgba(92, 122, 110, 0.075);', '--compass-card-end: rgba(92, 122, 110, 0.012);', 'day compass wash'),
              ('--compass-icon-surface: rgba(92, 122, 110, 0.12);', '--compass-icon-surface: rgba(92, 122, 110, 0.045);', 'day compass icon'),
              ('--arcade-card-start: rgba(255, 253, 249, 0.92);', '--arcade-card-start: rgba(255, 253, 249, 1);', 'day arcade start'),
              ('--arcade-card-end: rgba(223, 87, 47, 0.035);', '--arcade-card-end: rgba(223, 87, 47, 0.010);', 'day arcade wash'),
              ('--arcade-icon-surface: rgba(223, 87, 47, 0.09);', '--arcade-icon-surface: rgba(223, 87, 47, 0.040);', 'day arcade icon'),
              ('      /* World navigation cards */\n      --world-card-border: var(--border-faint);', '      /* World navigation cards */\n      --world-card-surface: rgba(37, 40, 38, 0.96);\n      --world-card-border: var(--border-faint);', 'night world surface'),
              ('--compass-card-start: rgba(37, 40, 38, 0.90);', '--compass-card-start: rgba(37, 40, 38, 0.98);', 'night compass start'),
              ('--compass-card-end: rgba(127, 168, 150, 0.085);', '--compass-card-end: rgba(127, 168, 150, 0.018);', 'night compass wash'),
              ('--compass-icon-surface: rgba(141, 183, 167, 0.17);', '--compass-icon-surface: rgba(141, 183, 167, 0.070);', 'night compass icon'),
              ('--arcade-card-start: rgba(37, 40, 38, 0.92);', '--arcade-card-start: rgba(37, 40, 38, 0.98);', 'night arcade start'),
              ('--arcade-card-end: rgba(255, 129, 93, 0.045);', '--arcade-card-end: rgba(255, 129, 93, 0.016);', 'night arcade wash'),
              ('--arcade-icon-surface: rgba(255, 129, 93, 0.11);', '--arcade-icon-surface: rgba(255, 129, 93, 0.065);', 'night arcade icon'),
              ('      --door-c1: var(--surface-raised);\n      --door-c2: var(--surface-muted);\n      background:\n        linear-gradient(145deg,\n          var(--door-c1),\n          var(--door-c2));', '      background: var(--world-card-surface);', 'Inside Atlas surface')
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Clean up Atlas Hub world card surfaces"
          git push origin HEAD:main
