name: Lift Game Theory Right Pips
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lift-game-theory-right-pips.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pip spacing fix
        run: python .github/lift-game-theory-right-pips.py
      - name: Validate targeted SVG change
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('shared/compass-catalog-data.js').read_text()
          block = text.split("'game-theory': `", 1)[1].split('`', 1)[0]
          assert '<circle cx="121" cy="95"' in block
          assert '<circle cx="105" cy="105"' in block
          assert '<circle cx="121" cy="99"' not in block
          assert '<circle cx="105" cy="110"' not in block
          PY
      - name: Commit fix
        run: |
          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/lift-game-theory-right-pips.py
          rm .github/workflows/lift-game-theory-right-pips.yml
          git add shared/compass-catalog-data.js .github/lift-game-theory-right-pips.py .github/workflows/lift-game-theory-right-pips.yml
          git commit -m "fix: lift lower game theory die pips"
          git push
