name: Atlas Batch 4 Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/atlas-batch4-patch.py'
      - '.github/workflows/atlas-batch4-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Batch 4
        run: python .github/atlas-batch4-patch.py
      - name: Validate JavaScript syntax
        run: |
          node --check shared/atlas-original-curation.js
          python - <<'PY'
          from pathlib import Path
          for source, target in [('compass/index.html','/tmp/compass-hub-inline.js'),('index.html','/tmp/atlas-hub-inline.js')]:
              html = Path(source).read_text()
              start = html.index("  <script>\n    'use strict';")
              start = html.index('\n', start) + 1
              end = html.index('\n  </script>', start)
              Path(target).write_text(html[start:end])
          PY
          node --check /tmp/compass-hub-inline.js
          node --check /tmp/atlas-hub-inline.js
      - name: Validate Batch 4 scope
        run: |
          python - <<'PY'
          from pathlib import Path
          hub=Path('compass/index.html').read_text()
          root=Path('index.html').read_text()
          store=Path('shared/atlas-original-curation.js').read_text()
          assert "STATE_ARCHIVED = 'archived'" in store
          assert "STATE_DELETED = 'deleted'" in store
          assert 'atlas::originalCuration' in store
          assert 'archiveAtlasOriginal(' in hub
          assert 'openAtlasOriginalDeleteDialog(' in hub
          assert "mode: 'atlas-delete-original'" in hub
          assert 'removeAtlasOriginalFromAllSessions' in hub
          assert "Curation.restore(expectedRegistryId)" in hub
          assert "kind: 'atlas-original'" in root
          assert 'Curation.listArchived()' in root
          assert 'Restore all Atlas Originals' not in root
          PY
      - name: Commit Batch 4
        run: |
          git config user.name 'Atlas Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add compass/index.html index.html shared/atlas-original-curation.js
          git rm .github/atlas-batch4-patch.py .github/workflows/atlas-batch4-patch.yml .github/workflows/inspect-batch4.yml
          git commit -m 'feat: curate Atlas Originals with archive and delete'
          git push
