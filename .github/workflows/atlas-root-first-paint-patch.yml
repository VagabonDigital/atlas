name: Atlas root first-paint patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-root-first-paint-patch.yml'

permissions:
  contents: write

concurrency:
  group: atlas-root-first-paint-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.head_commit.message == 'Arm Atlas root first-paint patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase on current main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply guarded Atlas root first-paint patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          index_path = Path('index.html')
          index = index_path.read_text()

          bridge = '  <script src="./shared/atlas-bridge.js"></script>\n'
          trust = bridge + '  <script src="./shared/atlas-persistence-trust.js?v=20260916-trust2"></script>\n'
          index = replace_once(
              index,
              bridge,
              trust,
              'early persistence trust'
          )

          index = replace_once(
              index,
              '<script src="./shared/atlas-content-registry.js?v=20260916-accountchrome5"></script>',
              '<script src="./shared/atlas-content-registry.js?v=20260917-rootpaint1"></script>',
              'content registry cache bust'
          )

          index_path.write_text(index)

          runtime_path = Path('shared/atlas-root-runtime.js')
          runtime = runtime_path.read_text()

          runtime = replace_once(
              runtime,
              '    let reviewCompletionInstalled = false;\n',
              '    let reviewCompletionInstalled = false;\n    let rootCloudAuthorityPromise = null;\n',
              'root authority promise state'
          )

          old_release = '''    function releaseRootEntryGate() {
        window.requestAnimationFrame(() => {
            document.documentElement.dataset
                .atlasRootEntryReady = 'true';
        });
    }
'''
          new_release = '''    function releaseRootEntryGate() {
        window.requestAnimationFrame(() => {
            document.documentElement.dataset
                .atlasRootEntryReady = 'true';

            try {
                window.dispatchEvent(
                    new Event('atlas:root-first-paint-ready')
                );
            } catch { }
        });
    }
'''
          runtime = replace_once(
              runtime,
              old_release,
              new_release,
              'root first-paint signal'
          )

          runtime = replace_once(
              runtime,
              '        if (!scripts.length) return;\n',
              '        if (!scripts.length) return Promise.resolve(true);\n',
              'empty root authority result'
          )

          old_chain = '''        scripts.reduce(
            (chain, src) =>
                chain.then(() =>
                    loadScriptSequentially(src)
                ),
            Promise.resolve()
        ).catch(error => {
            console.error(
                '[AtlasRootRuntime] Account persistence bootstrap failed:',
                error
            );
        });
    }
'''
          new_chain = '''        return scripts.reduce(
            (chain, src) =>
                chain.then(() =>
                    loadScriptSequentially(src)
                ),
            Promise.resolve()
        ).then(
            () => true
        ).catch(error => {
            console.error(
                '[AtlasRootRuntime] Account persistence bootstrap failed:',
                error
            );
            return false;
        });
    }

    function ensureRootCloudAuthorityReady() {
        if (!hasStoredAccountSession()) {
            return Promise.resolve(true);
        }

        if (rootCloudAuthorityPromise) {
            return rootCloudAuthorityPromise;
        }

        rootCloudAuthorityPromise = new Promise(resolve => {
            const startAfterPaint = () => {
                window.requestAnimationFrame(() => {
                    window.setTimeout(async () => {
                        try {
                            if (
                                window.AtlasAccessBootstrap &&
                                typeof window.AtlasAccessBootstrap.initialize ===
                                    'function'
                            ) {
                                try {
                                    await window.AtlasAccessBootstrap.initialize();
                                } catch (error) {
                                    console.warn(
                                        '[AtlasRootRuntime] Access bootstrap was not ready before root authority hydration:',
                                        error
                                    );
                                }
                            }

                            const ready = Boolean(
                                await Promise.resolve(
                                    writeRootCloudAuthorityScripts()
                                )
                            );

                            document.documentElement.dataset
                                .atlasRootCloudAuthority = ready
                                    ? 'ready'
                                    : 'failed';

                            if (ready) {
                                try {
                                    window.dispatchEvent(
                                        new Event(
                                            'atlas:root-cloud-authority-ready'
                                        )
                                    );
                                } catch { }
                            }

                            resolve(ready);
                        } catch (error) {
                            console.error(
                                '[AtlasRootRuntime] Root authority hydration failed:',
                                error
                            );
                            document.documentElement.dataset
                                .atlasRootCloudAuthority = 'failed';
                            resolve(false);
                        }
                    }, 0);
                });
            };

            if (
                document.documentElement.dataset
                    .atlasRootEntryReady === 'true'
            ) {
                startAfterPaint();
                return;
            }

            window.addEventListener(
                'atlas:root-first-paint-ready',
                startAfterPaint,
                { once: true }
            );
        });

        return rootCloudAuthorityPromise;
    }

    function patchSettingsAuthorityGate() {
        const original = window.openSettingsModal;

        if (
            typeof original !== 'function' ||
            original.__atlasRootCloudAuthorityPatched
        ) {
            return false;
        }

        function gatedOpenSettingsModal(...args) {
            if (
                !hasStoredAccountSession() ||
                document.documentElement.dataset
                    .atlasRootCloudAuthority === 'ready'
            ) {
                return original.apply(this, args);
            }

            return ensureRootCloudAuthorityReady().then(ready => {
                if (!ready) {
                    try {
                        window.showToast?.(
                            'Atlas account is still getting ready. Try again in a moment.'
                        );
                    } catch { }
                    return false;
                }

                return original.apply(this, args);
            });
        }

        gatedOpenSettingsModal
            .__atlasRootCloudAuthorityPatched = true;

        window.openSettingsModal = gatedOpenSettingsModal;
        return true;
    }
'''
          runtime = replace_once(
              runtime,
              old_chain,
              new_chain,
              'post-paint root authority loader'
          )

          runtime = replace_once(
              runtime,
              '        installReviewCompletion();\n',
              '        installReviewCompletion();\n        patchSettingsAuthorityGate();\n',
              'settings authority gate install'
          )

          runtime = replace_once(
              runtime,
              '''        releaseRootEntryGate();
    }
''',
              '''        releaseRootEntryGate();
        void ensureRootCloudAuthorityReady();
    }
''',
              'schedule root authority after paint'
          )

          old_boot = '''        /*
         * This runtime is injected synchronously while Atlas root is still
         * parsing. Load the account-owned subject, Atlas Original, and Hub
         * personalization authorities here: root Settings reads and restores
         * all three durable objects and must not fall back to browser-only
         * state for signed-in tutors.
         */
        writeRootCloudAuthorityScripts();

'''
          new_boot = '''        /*
         * Account-scoped browser projection safety is established before the
         * root product scripts run. Durable cloud authorities hydrate only
         * after the first visible root frame; signed-in Settings waits at the
         * interaction boundary if that hydration is still pending.
         */
        if (hasStoredAccountSession()) {
            document.documentElement.dataset
                .atlasRootCloudAuthority = 'pending';
        }

'''
          runtime = replace_once(
              runtime,
              old_boot,
              new_boot,
              'remove parser-blocking root authority bootstrap'
          )

          runtime = replace_once(
              runtime,
              '''        markCurrentLanguageReviewComplete,
        readReviewedThrough
''',
              '''        markCurrentLanguageReviewComplete,
        readReviewedThrough,
        ensureRootCloudAuthorityReady
''',
              'export root authority readiness'
          )

          runtime_path.write_text(runtime)

          registry_path = Path('shared/atlas-content-registry.js')
          registry = registry_path.read_text()
          old_version = '/shared/atlas-root-runtime.js?v=20260916-stage1close1'
          new_version = '/shared/atlas-root-runtime.js?v=20260917-rootpaint1'
          count = registry.count(old_version)
          if count != 2:
              raise SystemExit(
                  f'root runtime cache bust: expected 2 matches, found {count}'
              )
          registry = registry.replace(old_version, new_version)
          registry_path.write_text(registry)

          # Contract assertions.
          index = index_path.read_text()
          runtime = runtime_path.read_text()
          registry = registry_path.read_text()

          assert index.count('atlas-persistence-trust.js?v=20260916-trust2') == 1
          assert 'atlas-content-registry.js?v=20260917-rootpaint1' in index
          assert "new Event('atlas:root-first-paint-ready')" in runtime
          assert 'void ensureRootCloudAuthorityReady();' in runtime
          assert 'patchSettingsAuthorityGate();' in runtime
          assert '.atlasRootCloudAuthority = \'pending\'' in runtime
          assert old_version not in registry
          assert registry.count(new_version) == 2
          PY

      - name: Validate patch
        run: |
          node --check shared/atlas-root-runtime.js
          node --check shared/atlas-content-registry.js
          git diff --check
          git diff -- index.html shared/atlas-root-runtime.js shared/atlas-content-registry.js

      - name: Commit product change and remove patch machinery
        run: |
          rm .github/workflows/atlas-root-first-paint-patch.yml
          git config user.name 'Atlas Patch Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html shared/atlas-root-runtime.js shared/atlas-content-registry.js .github/workflows/atlas-root-first-paint-patch.yml
          git commit -m 'Defer Atlas root account hydration'
          git push origin HEAD:main
