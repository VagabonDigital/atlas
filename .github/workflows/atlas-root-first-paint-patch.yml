name: Atlas root first-paint patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-root-first-paint-patch.yml'

permissions:
  contents: write

concurrency:
  group: atlas-root-first-paint-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.head_commit.message == 'Retrigger Atlas root first-paint patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase on current main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply guarded patch
        run: python .github/scripts/patch_atlas_root_first_paint.py

      - name: Validate patch
        run: |
          node --check shared/atlas-root-runtime.js
          node --check shared/atlas-content-registry.js
          git diff --check
          git diff -- index.html shared/atlas-root-runtime.js shared/atlas-content-registry.js

      - name: Commit product change and remove patch machinery
        run: |
          rm .github/scripts/patch_atlas_root_first_paint.py
          rm .github/workflows/atlas-root-first-paint-patch.yml
          git config user.name 'Atlas Patch Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html shared/atlas-root-runtime.js shared/atlas-content-registry.js .github/scripts/patch_atlas_root_first_paint.py .github/workflows/atlas-root-first-paint-patch.yml
          git commit -m 'Defer Atlas root account hydration'
          git push origin HEAD:main
