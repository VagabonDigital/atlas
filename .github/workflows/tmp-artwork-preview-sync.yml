name: Temporary artwork preview sync patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/tmp-artwork-preview-sync-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python <<'PY'
          import base64
          from pathlib import Path

          path = Path('compass/index.html')
          text = path.read_text()

          replacements = [
              (
                  '',
                  ''
              ),
              (
                  'ICAgICAgLnN1YmplY3QtYXJ0d29yay1zdHVkaW8tYm9keSB7CiAgICAgICAgZGlzcGxheTogZmxleDsKICAgICAgICBmbGV4LWRpcmVjdGlvbjogY29sdW1uOwogICAgICAgIGdhcDogMC43MnJlbTsKICAgICAgICBwYWRkaW5nOiAwLjlyZW0gMXJlbSA1LjRyZW07CiAgICAgIH0K',
                  'ICAgICAgLnN1YmplY3QtYXJ0d29yay1zdHVkaW8tYm9keSB7CiAgICAgICAgZGlzcGxheTogZmxleDsKICAgICAgICBmbGV4LWRpcmVjdGlvbjogY29sdW1uOwogICAgICAgIGdhcDogMC43MnJlbTsKICAgICAgICBwYWRkaW5nOiAwLjlyZW0gMXJlbTsKICAgICAgfQo='
              )
          ]

          for old_b64, new_b64 in replacements:
              old = base64.b64decode(old_b64).decode('utf-8')
              new = base64.b64decode(new_b64).decode('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected 1 exact match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/tmp-artwork-preview-sync.yml
          rm .github/tmp-artwork-preview-sync-trigger

          git config user.name "Atlas patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html .github/workflows/tmp-artwork-preview-sync.yml .github/tmp-artwork-preview-sync-trigger
          git commit -m "Align artwork studio preview with mobile cards"
          git push origin main
