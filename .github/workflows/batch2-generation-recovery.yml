name: Batch 2 Compass recovery hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/batch2-generation-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Batch 2 patch
        run: python3 .github/scripts/batch2_generation_recovery.py

      - name: Validate JavaScript
        run: |
          node --check shared/atlas-tutor-subjects.js
          node --check compass/shared/compass-engine.js
          node --check compass/shared/compass-generation-recovery.js
          git diff --check

      - name: Exercise atomic checkpoint recovery
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          class MemoryStorage {
            constructor() { this.map = new Map(); }
            get length() { return this.map.size; }
            key(index) { return Array.from(this.map.keys())[index] ?? null; }
            getItem(key) { return this.map.has(key) ? this.map.get(key) : null; }
            setItem(key, value) { this.map.set(String(key), String(value)); }
            removeItem(key) { this.map.delete(String(key)); }
          }

          global.window = global;
          global.localStorage = new MemoryStorage();
          global.AtlasStructuredSubject = {
            validateDocument() { return { valid: true, errors: [] }; }
          };

          vm.runInThisContext(
            fs.readFileSync('shared/atlas-tutor-subjects.js', 'utf8'),
            { filename: 'atlas-tutor-subjects.js' }
          );

          (async () => {
            const Subjects = global.AtlasTutorSubjects;
            const document = {
              schemaVersion: 1,
              module: {
                title: 'Recovery Test',
                navTitle: 'Recovery Test',
                bgImage: '',
                catalogDescription: ''
              },
              subjectCopy: {},
              discussionSets: [],
              culturalLensCards: []
            };

            const subject = await Subjects.createSubject({
              metadata: { title: 'Recovery Test' },
              document
            });
            if (!subject) throw new Error('Could not create test subject');

            const checkpoint = await Subjects.saveBuildCheckpoint(
              subject.id,
              {
                workingDraft: {
                  baseRevision: 1,
                  document,
                  activeViewId: 'view-orientation'
                },
                buildState: {
                  kind: 'full-subject',
                  completedStep: 7,
                  autoSaveOnComplete: true
                }
              }
            );
            if (checkpoint?.buildState?.completedStep !== 7) {
              throw new Error('Atomic checkpoint was not saved');
            }

            for (const key of Array.from(localStorage.map.keys())) {
              if (key.includes('::buildState::')) localStorage.removeItem(key);
            }
            const recoveredState = await Subjects.getBuildState(subject.id);
            if (recoveredState?.completedStep !== 7) {
              throw new Error('Build state did not recover from checkpoint journal');
            }

            for (const key of Array.from(localStorage.map.keys())) {
              if (key.includes('::workingDraft::')) localStorage.removeItem(key);
            }
            const recoveredDraft = await Subjects.getWorkingDraft(subject.id);
            if (recoveredDraft?.activeViewId !== 'view-orientation') {
              throw new Error('Working draft did not recover from checkpoint journal');
            }

            await Subjects.clearBuildState(subject.id);
            if (await Subjects.getBuildState(subject.id)) {
              throw new Error('Build checkpoint did not clear');
            }

            console.log('Atomic checkpoint recovery test passed');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit Batch 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/atlas-tutor-subjects.js compass/shared/compass-engine.js compass/shared/compass-generation-recovery.js
          git commit -m "🛡️ HARDEN COMPASS GENERATION RECOVERY"
          git push origin HEAD:main
