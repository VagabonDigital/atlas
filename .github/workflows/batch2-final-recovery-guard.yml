name: Batch 2 final recovery guard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/batch2-final-recovery-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final recovery guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          subjects = Path('shared/atlas-tutor-subjects.js')
          text = subjects.read_text(encoding='utf-8')
          replacements = [
              ('checkpoint.workingDraft.updatedAt >=\n                    storedDraft.updatedAt', 'checkpoint.workingDraft.updatedAt >\n                    storedDraft.updatedAt'),
              ('checkpoint.buildState.updatedAt >=\n                    storedState.updatedAt', 'checkpoint.buildState.updatedAt >\n                    storedState.updatedAt')
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one timestamp comparison, found {text.count(old)}')
              text = text.replace(old, new, 1)
          subjects.write_text(text, encoding='utf-8')

          recovery = Path('compass/shared/compass-generation-recovery.js')
          text = recovery.read_text(encoding='utf-8')
          old = """            queueRecoveryCheck({ wake: true });"""
          new = """            clearRecoveryTimer();\n            queueRecoveryCheck({ wake: true });"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one wake queue, found {text.count(old)}')
          recovery.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check shared/atlas-tutor-subjects.js
          node --check compass/shared/compass-generation-recovery.js
          git diff --check

      - name: Commit final guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/atlas-tutor-subjects.js compass/shared/compass-generation-recovery.js
          git commit -m "🛡️ FINALIZE COMPASS RECOVERY WAKE GUARDS"
          git push origin HEAD:main
