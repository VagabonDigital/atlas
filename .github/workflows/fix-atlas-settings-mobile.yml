name: Fix Atlas Settings Mobile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-atlas-settings-mobile.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply settings fix
        run: python .github/fix-atlas-settings-mobile.py
      - name: Validate Atlas inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          inline = '\n'.join(s for s in scripts if s.strip())
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
              f.write(inline)
              name = f.name
          subprocess.run(['node','--check',name], check=True)
          PY
      - name: Validate targeted behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          assert 'Restore all Atlas Subjects' in text
          assert 'Bring back archived and deleted Atlas Original subjects.' in text
          assert "typeof Curation.restore !== 'function'" in text
          assert 'Curation.restore(state.registryId)' in text
          assert "document.querySelector('#settings-modal .modal-close')" in text
          assert "document.getElementById('atmosphere-input');\n        if (el) el.focus();" not in text
          PY
      - name: Commit settings fix
        run: |
          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/fix-atlas-settings-mobile.py
          rm .github/workflows/fix-atlas-settings-mobile.yml
          git add index.html .github/fix-atlas-settings-mobile.py .github/workflows/fix-atlas-settings-mobile.yml
          git commit -m "fix: polish Atlas settings and restore originals"
          git push
