name: Temporary Compass theme performance patch

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp-compass-theme-performance-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match Compass theme motion to Atlas and Arcade
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python .github/tmp-compass-theme-performance.py
          git rm -f \
            .github/tmp-compass-theme-performance.py \
            .github/workflows/tmp-compass-theme-performance.yml \
            .github/tmp-compass-theme-performance-trigger
          git config user.name 'Atlas patch bot'
          git config user.email 'atlas-patch-bot@users.noreply.github.com'
          git add compass/index.html
          git diff --check --cached
          git commit -m 'Refine Compass theme transition performance'
          git push origin main
