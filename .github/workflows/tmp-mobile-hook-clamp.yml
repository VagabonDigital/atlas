name: Temporary mobile hook clamp patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/tmp-mobile-hook-clamp-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python <<'PY'
          import base64
          from pathlib import Path

          path = Path('compass/index.html')
          text = path.read_text()
          old = base64.b64decode('ICAgICAgLnN1YmplY3QtY2FyZC1ob29rIHsKICAgICAgICBtYXJnaW4tYm90dG9tOiAwLjg1cmVtOwogICAgICB9Cg==').decode('utf-8')
          new = base64.b64decode('ICAgICAgLnN1YmplY3QtY2FyZC1ob29rIHsKICAgICAgICBkaXNwbGF5OiAtd2Via2l0LWJveDsKICAgICAgICBtYXJnaW4tYm90dG9tOiAwLjg1cmVtOwogICAgICAgIG92ZXJmbG93OiBoaWRkZW47CiAgICAgICAgLXdlYmtpdC1ib3gtb3JpZW50OiB2ZXJ0aWNhbDsKICAgICAgICAtd2Via2l0LWxpbmUtY2xhbXA6IDU7CiAgICAgIH0K').decode('utf-8')

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected 1 exact match, found {count}')

          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/tmp-mobile-hook-clamp.yml
          rm .github/tmp-mobile-hook-clamp-trigger

          git config user.name "Atlas patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html .github/workflows/tmp-mobile-hook-clamp.yml .github/tmp-mobile-hook-clamp-trigger
          git commit -m "Clamp mobile subject previews to five lines"
          git push origin main
