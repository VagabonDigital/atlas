name: Atlas Originals Batch 1 Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-batch1-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Batch 1
        run: python .github/atlas-batch1-patch.py

      - name: Commit Batch 1
        run: |
          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/atlas-batch1-patch.py .github/workflows/atlas-batch1-patch.yml
          git add compass/index.html compass/shared/compass-engine.js
          git commit -m "feat: add Atlas Original hub controls"
          git push origin main
