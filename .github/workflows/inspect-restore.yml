name: Inspect Restore
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-restore.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show delete integration
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('compass/index.html').read_text()
          needle='const registryId =\n            getOwnedSubjectRegistryId(\n              state.subjectId\n            );'
          i=text.index(needle)
          print(text[i-900:i+3400])
          PY
