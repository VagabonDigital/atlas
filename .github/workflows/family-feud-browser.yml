name: Family Feud Browser Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'arcade/family-feud/**'
      - '.github/workflows/family-feud-browser.yml'
  pull_request:
    paths:
      - 'arcade/family-feud/**'
      - '.github/workflows/family-feud-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-feud-browser:
    name: Family Feud Chromium acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise real Family Feud gameplay and Atlas Continue
        run: |
          node arcade/family-feud/dev/serve.mjs > /tmp/family-feud-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4177/arcade/family-feud/; then break; fi
            sleep 1
          done
          node arcade/family-feud/dev/browser-check.cjs
