name: SharedWorker Integration Batch 4

on:
  push:
    branches:
      - integration/shared-worker-subject-builds

jobs:
  batch4-recovery-resurrection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Batch 4 JavaScript syntax
        run: |
          set -euo pipefail
          node --check compass/shared/compass-generation-recovery.js
          node --check shared/atlas-subject-build-resurrection.js
      - name: Run Batch 4 recovery and resurrection regressions
        run: |
          set -euo pipefail
          node tests/atlas-incomplete-ai-subject-recovery.test.js
          node tests/atlas-subject-build-resurrection.test.js
