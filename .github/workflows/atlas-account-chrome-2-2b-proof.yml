name: Atlas Batch 2.2B account chrome proof

on:
  push:
    paths:
      - '.github/workflows/atlas-account-chrome-2-2b-proof.yml'

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply Batch 2.2B wiring
        run: python .github/atlas_patch_account_chrome_2_2b.py

      - name: Validate Stage 2 runtime syntax
        run: |
          node --check shared/atlas-access.js
          node --check shared/atlas-access-bootstrap.js
          node --check shared/atlas-account-gate.js
          node --check shared/atlas-account-chrome.js
          node --check shared/atlas-content-registry.js
          node --check tests/atlas-access-contract.test.js
          node --check tests/atlas-account-gate-contract.test.js
          node --check tests/atlas-account-chrome-contract.test.js

      - name: Run Stage 2 contract proofs
        run: |
          node tests/atlas-access-contract.test.js
          node tests/atlas-account-gate-contract.test.js
          node tests/atlas-account-chrome-contract.test.js

      - name: Verify account chrome surface boundaries
        run: |
          grep -q 'data-atlas-surface="inside-atlas"' tutors/index.html
          grep -q 'data-atlas-account-entry' tutors/index.html
          grep -q 'atlas-account-chrome.js?v=20260916-accountchrome1' tutors/index.html
          grep -q 'writeAtlasAccountChromeScript();' shared/atlas-content-registry.js
          grep -q 'atlas-access-bootstrap.js?v=20260916-access2' shared/atlas-content-registry.js

      - name: Commit Batch 2.2B and remove runner
        run: |
          rm -f .github/workflows/atlas-account-chrome-2-2b-proof.yml
          rm -f .github/atlas_patch_account_chrome_2_2b.py
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Wire shared account chrome across public Atlas"
          git push origin main
