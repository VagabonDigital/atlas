name: Temporary artwork follow-up patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/tmp-artwork-followup-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python <<'PY'
          import base64
          from pathlib import Path

          def decode(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_once(path, old_value, new_value):
              target = Path(path)
              text = target.read_text()
              old = decode(old_value)
              new = decode(new_value)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 exact match, found {count}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'compass/index.html',
              'ICAgIC5zdWJqZWN0LWFydHdvcmstc3R1ZGlvLWVkaXQtYWN0aW9ucyB7CiAgICAgIGRpc3BsYXk6IGZsZXg7CiAgICAgIGFsaWduLWl0ZW1zOiBjZW50ZXI7CiAgICAgIGZsZXgtd3JhcDogd3JhcDsKICAgICAgZ2FwOiAwLjZyZW07CiAgICAgIG1hcmdpbi10b3A6IDAuMTVyZW07CiAgICB9Cg==',
              'ICAgIC5zdWJqZWN0LWFydHdvcmstc3R1ZGlvLWVkaXQtYWN0aW9ucyB7CiAgICAgIGRpc3BsYXk6IGZsZXg7CiAgICAgIGFsaWduLWl0ZW1zOiBjZW50ZXI7CiAgICAgIGZsZXgtd3JhcDogd3JhcDsKICAgICAgZ2FwOiAwLjZyZW07CiAgICAgIG1hcmdpbi10b3A6IDA7CiAgICAgIG1hcmdpbi1yaWdodDogYXV0bzsKICAgIH0K'
          )

          replace_once(
              'compass/index.html',
              'ICAgICAgLnN1YmplY3QtYXJ0d29yay1zdHVkaW8tZWRpdC1hY3Rpb25zIHsKICAgICAgICBkaXNwbGF5OiBncmlkOwogICAgICAgIGdyaWQtdGVtcGxhdGUtY29sdW1uczogMWZyOwogICAgICAgIGdhcDogMC41NXJlbTsKICAgICAgfQo=',
              'ICAgICAgLnN1YmplY3QtYXJ0d29yay1zdHVkaW8tZWRpdC1hY3Rpb25zIHsKICAgICAgICBkaXNwbGF5OiBncmlkOwogICAgICAgIGdyaWQtdGVtcGxhdGUtY29sdW1uczogMWZyOwogICAgICAgIGdhcDogMC41NXJlbTsKICAgICAgICBtYXJnaW4tcmlnaHQ6IDA7CiAgICAgIH0K'
          )

          replace_once(
              'compass/index.html',
              'ICAgIEBtZWRpYSAoaG92ZXI6IG5vbmUpIGFuZCAocG9pbnRlcjogY29hcnNlKSB7CiAgICAgIC5zdWJqZWN0LWNhcmQtLWhhcy1hcnQgLnN1YmplY3QtY2FyZC1oZWFkZXIsCiAgICAgIC5zdWJqZWN0LWNhcmQtLWhhcy1hcnQgLnN1YmplY3QtY2FyZC1ob29rIHsKICAgICAgICBtYXgtd2lkdGg6IGNhbGMoMTAwJSAtIDcuMnJlbSk7CiAgICAgIH0K',
              ''
          )

          replace_once(
              'compass/index.html',
              'ICAgIGZ1bmN0aW9uIGVuc3VyZVN1YmplY3RBcnR3b3JrU3R1ZGlvKCkgewogICAgICBsZXQgYmFja2Ryb3AgPQogICAgICAgIGRvY3VtZW50LmdldEVsZW1lbnRCeUlkKAogICAgICAgICAgJ3N1YmplY3QtYXJ0d29yay1zdHVkaW8tYmFja2Ryb3AnCiAgICAgICAgKTsKCiAgICAgIGlmIChiYWNrZHJvcCkgcmV0dXJuIGJhY2tkcm9wOwo=',
              ''
          )

          replace_once(
              'compass/index.html',
              'ICAgICAgZG9jdW1lbnQuYm9keS5hcHBlbmRDaGlsZChiYWNrZHJvcCk7CgogICAgICByZXR1cm4gYmFja2Ryb3A7CiAgICB9Cg==',
              ''
          )
          PY

          rm .github/workflows/tmp-artwork-followup.yml
          rm .github/tmp-artwork-followup-trigger

          git config user.name "Atlas patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html .github/workflows/tmp-artwork-followup.yml .github/tmp-artwork-followup-trigger
          git commit -m "Refine artwork actions and mobile title width"
          git push origin main
