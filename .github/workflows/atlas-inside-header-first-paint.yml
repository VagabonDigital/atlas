name: Atlas Inside header first-paint fix

on:
  push:
    paths:
      - '.github/workflows/atlas-inside-header-first-paint.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply Inside Atlas first-paint fix
        run: python .github/atlas_patch_inside_header_first_paint.py

      - name: Validate runtime syntax
        run: |
          node --check shared/atlas-account-chrome.js
          node --check tests/atlas-account-chrome-contract.test.js

      - name: Run account chrome proof
        run: node tests/atlas-account-chrome-contract.test.js

      - name: Verify first-paint boundaries
        run: |
          grep -q 'atlas-account-chrome.css?v=20260916-accountchrome4' tutors/index.html
          grep -q 'data-atlas-account-chrome-styles' tutors/index.html
          grep -q 'data-atlas-account-entry data-account-state="pending"' tutors/index.html
          grep -q 'atlas-account-chrome.js?v=20260916-accountchrome4' tutors/index.html
          grep -q "if (!container.querySelector('[data-atlas-inside-account]'))" shared/atlas-account-chrome.js
          grep -q "signIn.hidden = isAccount || isPending" shared/atlas-account-chrome.js
          grep -q "account.hidden = presentation.kind === 'sign-in'" shared/atlas-account-chrome.js
          ! grep -q 'visibility: hidden;' shared/atlas-account-chrome.css

      - name: Commit fix and remove runner
        run: |
          rm -f .github/workflows/atlas-inside-header-first-paint.yml
          rm -f .github/atlas_patch_inside_header_first_paint.py
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Stabilize Inside Atlas header first paint"
          git push origin main
