name: Atlas Batch 2.3A return intent proof

on:
  push:
    paths:
      - '.github/workflows/atlas-return-intent-2-3a-proof.yml'

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Document return intent contract
        run: python .github/atlas_patch_return_intent_2_3a.py

      - name: Validate Stage 2 runtime syntax
        run: |
          node --check shared/atlas-access.js
          node --check shared/atlas-access-bootstrap.js
          node --check shared/atlas-account-gate.js
          node --check shared/atlas-account-chrome.js
          node --check shared/atlas-return-intent.js
          node --check tests/atlas-access-contract.test.js
          node --check tests/atlas-account-gate-contract.test.js
          node --check tests/atlas-account-chrome-contract.test.js
          node --check tests/atlas-return-intent-contract.test.js

      - name: Run Stage 2 contract proofs
        run: |
          node tests/atlas-access-contract.test.js
          node tests/atlas-account-gate-contract.test.js
          node tests/atlas-account-chrome-contract.test.js
          node tests/atlas-return-intent-contract.test.js

      - name: Verify return intent remains foundation-only
        run: |
          grep -q "AtlasReturnIntent" shared/atlas-return-intent.js
          grep -q "OPEN_ACCOUNT_LIBRARY" shared/atlas-return-intent.js
          grep -q "normalizeDestination" shared/atlas-return-intent.js
          ! grep -q "window.location.href =" shared/atlas-return-intent.js
          ! grep -q "window.location.assign" shared/atlas-return-intent.js
          ! grep -q "AtlasReturnIntent" shared/atlas-account-gate.js
          ! grep -q "AtlasReturnIntent" account/index.html

      - name: Commit documentation and remove runner
        run: |
          rm -f .github/workflows/atlas-return-intent-2-3a-proof.yml
          rm -f .github/atlas_patch_return_intent_2_3a.py
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "Document canonical return intent foundation"
          git push origin main
