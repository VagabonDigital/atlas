name: Fix Session Subjects And Restore Visibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-session-subjects-restore.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .github/fix-session-subjects-restore.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for file in ['index.html', 'compass/index.html']:
              text = Path(file).read_text()
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
              inline = '\n'.join(s for s in scripts if s.strip())
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(inline)
                  name = f.name
              subprocess.run(['node','--check',name], check=True)
          PY
      - name: Validate targeted behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          compass = Path('compass/index.html').read_text()
          atlas = Path('index.html').read_text()
          assert "canAdd: true,\n            canCreate: true" in compass
          assert "openCreateSubjectDialog(event, getActiveSession().id)" in compass
          assert "!atlasSubjects.length &&\n        !ownedSubjects.length" not in compass
          assert "row.style.display = applicable ? '' : 'none';" in atlas
          PY
      - name: Commit fix
        run: |
          git config user.name "Atlas Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/fix-session-subjects-restore.py
          rm .github/workflows/fix-session-subjects-restore.yml
          git add compass/index.html index.html .github/fix-session-subjects-restore.py .github/workflows/fix-session-subjects-restore.yml
          git commit -m "fix: keep Session Subjects available and hide restored control"
          git push
