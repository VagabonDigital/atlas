name: Temporary Compass theme parity patch

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp-compass-theme-parity-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Compass theme geometry and motion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python - <<'PY'
          from pathlib import Path
          import base64

          patches = [
              (
                  Path('compass/index.html'),
                  '',
                  ''
              ),
              (
                  Path('compass/index.html'),
                  'ICAgICAgLS1saWJyYXJ5LWJvcmRlci13aWR0aDogMS41cHg7',
                  'ICAgICAgLS1saWJyYXJ5LWJvcmRlci13aWR0aDogMXB4Ow=='
              ),
              (
                  Path('compass/index.html'),
                  'ICAgICAgLS1jYXJkLWJvcmRlci13aWR0aDogMS41cHg7',
                  'ICAgICAgLS1jYXJkLWJvcmRlci13aWR0aDogMXB4Ow=='
              ),
              (
                  Path('compass/index.html'),
                  'ICAgICAgLS1sYXVuY2gtaW5wcm9ncmVzcy1zaGFkb3c6IHZhcigtLWxhdW5jaC1zaGFkb3cpOwogICAgICAtLXBhZ2UtYmc6IHZhcigtLXBhZ2UtYmctbmlnaHQpOwogICAgICAtLWRpYWxvZy1ib3JkZXI6IDFweCBzb2xpZCB2YXIoLS1ib3JkZXItZmFpbnQpOwoKICAgICAgLyogRWxldmF0aW9uICovCg==',
                  ''
              ),
              (
                  Path('compass/index.html'),
                  '',
                  ''
              ),
              (
                  Path('compass/index.html'),
                  'ICAgIC5zcGluZS1idG4gewogICAgICBkaXNwbGF5OiBpbmxpbmUtZmxleDsKICAgICAgYWxpZ24taXRlbXM6IGNlbnRlcjsKICAgICAganVzdGlmeS1jb250ZW50OiBjZW50ZXI7Cg==',
                  'ICAgIC5zcGluZS1idG4gewogICAgICBwb3NpdGlvbjogcmVsYXRpdmU7CiAgICAgIGRpc3BsYXk6IGlubGluZS1mbGV4OwogICAgICBhbGlnbi1pdGVtczogY2VudGVyOwogICAgICBqdXN0aWZ5LWNvbnRlbnQ6IGNlbnRlcjsK'
              ),
              (
                  Path('compass/index.html'),
                  '',
                  ''
              ),
              (
                  Path('compass/index.html'),
                  'ICAgIC5kcmF3ZXItYXBwZWFyYW5jZS1idG4gewogICAgICB3aWR0aDogNDRweDsKICAgICAgaGVpZ2h0OiA0NHB4Owo=',
                  'ICAgIC5kcmF3ZXItYXBwZWFyYW5jZS1idG4gewogICAgICBwb3NpdGlvbjogcmVsYXRpdmU7CiAgICAgIHdpZHRoOiA0NHB4OwogICAgICBoZWlnaHQ6IDQ0cHg7Cg=='
              ),
              (
                  Path('compass/index.html'),
                  '',
                  'ICAgIC5zdWJqZWN0LWNhcmQ6aXMoOmhvdmVyLCA6Zm9jdXMtdmlzaWJsZSkgLnN1YmplY3QtY2FyZC1hcnQgewogICAgICBvcGFjaXR5OiB2YXIoLS1zdWJqZWN0LWFydC1ob3Zlci1vcGFjaXR5KTsKICAgICAgdHJhbnNmb3JtOiB0cmFuc2xhdGUzZCgwLCAwLCAwKSBzY2FsZSgxKTsKICAgIH0K'
              ),
              (
                  Path('compass/index.html'),
                  'ICAgIC5zdWJqZWN0LWFydHdvcmstcHJldmlldy1jYXJkIC5zdWJqZWN0LWNhcmQtYXJ0IHsKICAgICAgb3BhY2l0eTogMC4xODsKICAgICAgdHJhbnNmb3JtOiBub25lOwogICAgfQoKICAgIGh0bWxhW2RhdGEtdGhlbWU9Im5pZ2h0Il0KICAgIC5zdWJqZWN0LWFydHdvcmstcHJldmlldy1jYXJkCiAgICAuc3ViamVjdC1jYXJkLWFydCB7CiAgICAgIG9wYWNpdHk6IDAuMjU7CiAgICB9Cg==',
                  'ICAgIC5zdWJqZWN0LWFydHdvcmstcHJldmlldy1jYXJkIC5zdWJqZWN0LWNhcmQtYXJ0IHsKICAgICAgb3BhY2l0eTogdmFyKC0tc3ViamVjdC1hcnQtcHJldmlldy1vcGFjaXR5KTsKICAgICAgdHJhbnNmb3JtOiBub25lOwogICAgfQo='
              ),
              (
                  Path('compass/index.html'),
                  '',
                  ''
              )
          ]

          for path, old_b64, new_b64 in patches:
              text = path.read_text()
              old = base64.b64decode(old_b64).decode()
              new = base64.b64decode(new_b64).decode()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exact block once, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY

          git rm -f .github/workflows/tmp-compass-theme-parity.yml .github/tmp-compass-theme-parity-trigger
          git config user.name 'Atlas patch bot'
          git config user.email 'atlas-patch-bot@users.noreply.github.com'
          git add compass/index.html
          git commit -m 'Stabilize Compass theme transitions'
          git push origin main
