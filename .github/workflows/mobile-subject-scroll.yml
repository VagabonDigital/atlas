name: One-time Tutor Layer mobile subject scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-subject-scroll.yml'

permissions:
  contents: write

jobs:
  patch-tutor-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile subject and category interactions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tutors/index.html')
          text = path.read_text()
          old_css = "      .direction-list {\n        grid-template-columns: 1fr;\n      }\n"
          new_css = "      .direction-list {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n      }\n"
          if text.count(old_css) != 1:
              raise SystemExit(f'Expected one mobile direction-list override, found {text.count(old_css)}')
          text = text.replace(old_css, new_css, 1)
          old_choose = "      function chooseSubject(button) {\n        var title = button.getAttribute(\"data-title\");\n        var seed = curatedSubjectSeeds[title] || null;\n        fillSubject(title, null, null, true, seed);\n        showCuratedSubjectInCard(seed);\n      }\n"
          new_choose = "      function scrollToCreateResult() {\n        if (!(window.matchMedia && window.matchMedia(\"(max-width: 720px)\").matches)) return;\n        var createResult = document.querySelector(\".create-result\");\n        if (!createResult) return;\n        window.requestAnimationFrame(function () {\n          createResult.scrollIntoView({ behavior: reduceMotion ? \"auto\" : \"smooth\", block: \"start\" });\n        });\n      }\n\n      function chooseSubject(button) {\n        var title = button.getAttribute(\"data-title\");\n        var seed = curatedSubjectSeeds[title] || null;\n        fillSubject(title, null, null, false, seed);\n        showCuratedSubjectInCard(seed);\n        scrollToCreateResult();\n      }\n"
          if text.count(old_choose) != 1:
              raise SystemExit(f'Expected one chooseSubject block, found {text.count(old_choose)}')
          text = text.replace(old_choose, new_choose, 1)
          old_status = "        setDirectionDemoStatus(\"Working…\");\n\n        try {\n"
          new_status = "        setDirectionDemoStatus(\"Working…\");\n        scrollToCreateResult();\n\n        try {\n"
          if text.count(old_status) != 1:
              raise SystemExit(f'Expected one category loading block, found {text.count(old_status)}')
          text = text.replace(old_status, new_status, 1)
          path.write_text(text)
          PY
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git diff --cached --check
          git commit -m "Improve Tutor Layer mobile subject navigation"
          git push origin HEAD:main
