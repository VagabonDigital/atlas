name: Temporary artwork batch 1 patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare artwork batch 1 patch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 exact match, found {count}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'compass/index.html',
              '''    @media (hover: none) and (pointer: coarse) {
      .subject-card--has-art .subject-card-header {
        max-width: none;
      }

      .subject-card--has-art .subject-card-hook {
        max-width: calc(100% - 7.2rem);
      }

      .subject-card-art {
        display: none;
      }
    }
''',
              '''    @media (hover: none) and (pointer: coarse) {
      .subject-card--has-art .subject-card-header,
      .subject-card--has-art .subject-card-hook {
        max-width: calc(100% - 7.2rem);
      }

      .subject-card--has-art .subject-card-art {
        display: flex;
        opacity: 0.14;
        transform: none;
      }

      html[data-theme="night"]
      .subject-card--has-art
      .subject-card-art {
        opacity: 0.22;
      }

      .subject-artwork-preview-card .subject-card-art {
        opacity: 0.18;
      }

      html[data-theme="night"]
      .subject-artwork-preview-card
      .subject-card-art {
        opacity: 0.25;
      }
    }
'''
          )

          replace_once(
              'compass/index.html',
              '''      .subject-card--has-art .subject-card-hook,
      .subject-card--new:not(.subject-card--has-art) .subject-card-hook {
        max-width: none;
      }
''',
              '''      .subject-card--new:not(.subject-card--has-art) .subject-card-hook {
        max-width: none;
      }
'''
          )

          replace_once(
              'shared/atlas-subject-artwork.js',
              '''            @media (max-width: 640px) {
                .subject-artwork-display-control-label {
                    display: none;
                }

                .subject-artwork-studio-head-actions {
                    gap: 0.45rem;
                }
            }
''',
              '''            @media (hover: none) and (pointer: coarse) {
                .subject-artwork-display-control {
                    display: none;
                }

                html[data-subject-artwork-display]
                .hub-main
                .subject-card--has-art
                .subject-card-art {
                    opacity: 0.14;
                }

                html[data-theme="night"][data-subject-artwork-display]
                .hub-main
                .subject-card--has-art
                .subject-card-art {
                    opacity: 0.22;
                }
            }

            @media (max-width: 640px) {
                .subject-artwork-display-control-label {
                    display: none;
                }

                .subject-artwork-studio-head-actions {
                    gap: 0.45rem;
                }
            }
'''
          )
          PY

          rm .github/workflows/tmp-artwork-batch1.yml

          git config user.name "Atlas patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html shared/atlas-subject-artwork.js .github/workflows/tmp-artwork-batch1.yml
          git commit -m "Support subject artwork on touch devices"
          git push origin main
