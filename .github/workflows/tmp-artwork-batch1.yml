name: Temporary artwork batch 1 patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/tmp-artwork-batch1-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          python <<'PY'
          import base64
          from pathlib import Path

          def decode(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_once(path, old_value, new_value):
              target = Path(path)
              text = target.read_text()
              old = decode(old_value)
              new = decode(new_value)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 exact match, found {count}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'compass/index.html',
              '',
              ''
          )

          replace_once(
              'compass/index.html',
              'ICAgICAgLnN1YmplY3QtY2FyZC0taGFzLWFydCAuc3ViamVjdC1jYXJkLWhvb2ssCiAgICAgIC5zdWJqZWN0LWNhcmQtLW5ldzpub3QoLnN1YmplY3QtY2FyZC0taGFzLWFydCkgLnN1YmplY3QtY2FyZC1ob29rIHsKICAgICAgICBtYXgtd2lkdGg6IG5vbmU7CiAgICAgIH0K',
              'ICAgICAgLnN1YmplY3QtY2FyZC0tbmV3Om5vdCguc3ViamVjdC1jYXJkLS1oYXMtYXJ0KSAuc3ViamVjdC1jYXJkLWhvb2sgewogICAgICAgIG1heC13aWR0aDogbm9uZTsKICAgICAgfQo='
          )

          replace_once(
              'shared/atlas-subject-artwork.js',
              '',
              ''
          )
          PY

          rm .github/workflows/tmp-artwork-batch1.yml
          rm .github/tmp-artwork-batch1-trigger

          git config user.name "Atlas patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html shared/atlas-subject-artwork.js .github/workflows/tmp-artwork-batch1.yml .github/tmp-artwork-batch1-trigger
          git commit -m "Support subject artwork on touch devices"
          git push origin main
