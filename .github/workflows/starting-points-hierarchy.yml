name: One-time Tutor Layer starting points hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/starting-points-hierarchy.yml'

permissions:
  contents: write

jobs:
  patch-tutor-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine starting points heading hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tutors/index.html')
          text = path.read_text()
          old = """    .direction-head strong {
      color: var(--text-heading);
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 400;
    }
"""
          new = """    .direction-head strong {
      color: var(--text-body);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.25;
    }
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one direction-head strong block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git diff --cached --check
          git commit -m "Refine starting points heading hierarchy"
          git push origin HEAD:main
