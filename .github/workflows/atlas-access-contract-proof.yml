name: Atlas Batch 2.1C access contract proof

on:
  push:
    paths:
      - '.github/workflows/atlas-access-contract-proof.yml'

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply guarded access contract documentation patch
        run: python .github/atlas_patch_access_contract.py

      - name: Validate access runtime syntax
        run: |
          node --check shared/atlas-access.js
          node --check shared/atlas-access-bootstrap.js
          node --check tests/atlas-access-contract.test.js

      - name: Run canonical access state proof
        run: node tests/atlas-access-contract.test.js

      - name: Commit documentation and remove runner
        run: |
          rm -f .github/workflows/atlas-access-contract-proof.yml
          rm -f .github/atlas_patch_access_contract.py
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Document and prove canonical Atlas access state"
          git push origin main
