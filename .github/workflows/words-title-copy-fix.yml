name: Words That Stick title and card copy fix

on:
  push:
    branches:
      - astra-greenfield
    paths:
      - .github/workflows/words-title-copy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-greenfield
          fetch-depth: 0

      - name: Shorten title and restore card intro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path('shared/compass-catalog-data.js')
          text = catalog.read_text()
          old_title = "title: 'Words That Stick: Advanced Vocabulary Through Roots & Stories',"
          new_title = "title: 'Words That Stick: Vocabulary Through Roots & Stories',"
          old_hook = "hook: 'For C1+ learners: explore the origins and stories behind ambitious English words, with a focus on precise meaning, memorable connections and natural use in conversation.'"
          new_hook = "hook: 'For C1+ learners: explore the origins, patterns and stories behind ambitious English words, with a focus on precise meaning, memorable connections and using new vocabulary naturally in real conversations.'"
          if text.count(old_title) != 1:
              raise SystemExit(f'Expected one catalogue title, found {text.count(old_title)}')
          if text.count(old_hook) != 1:
              raise SystemExit(f'Expected one current card intro, found {text.count(old_hook)}')
          text = text.replace(old_title, new_title).replace(old_hook, new_hook)
          catalog.write_text(text)

          subject = Path('compass/words-that-stick/subject-data.js')
          text = subject.read_text()
          replacements = {
              'Words That Stick: Advanced Vocabulary Through Roots & Stories': 'Words That Stick: Vocabulary Through Roots & Stories',
              'title: `Words That Stick: Advanced Vocabulary Through Roots & Stories`,': 'title: `Words That Stick: Vocabulary Through Roots & Stories`,',
              'titleHtml: `Words That Stick: <em>Advanced Vocabulary Through Roots & Stories</em>`,': 'titleHtml: `Words That Stick: <em>Vocabulary Through Roots & Stories</em>`,'
          }
          # Header phrase and module title phrase overlap, so do the specific fields first.
          old_field = 'title: `Words That Stick: Advanced Vocabulary Through Roots & Stories`,'
          old_html = 'titleHtml: `Words That Stick: <em>Advanced Vocabulary Through Roots & Stories</em>`,'
          if text.count(old_field) != 1:
              raise SystemExit(f'Expected one module title field, found {text.count(old_field)}')
          if text.count(old_html) != 1:
              raise SystemExit(f'Expected one titleHtml field, found {text.count(old_html)}')
          text = text.replace(old_field, 'title: `Words That Stick: Vocabulary Through Roots & Stories`,')
          text = text.replace(old_html, 'titleHtml: `Words That Stick: <em>Vocabulary Through Roots & Stories</em>`,')
          text = text.replace('Words That Stick: Advanced Vocabulary Through Roots & Stories', 'Words That Stick: Vocabulary Through Roots & Stories')
          subject.write_text(text)
          PY
          node --check shared/compass-catalog-data.js
          node --check compass/words-that-stick/subject-data.js
          git diff --check
          git rm .github/workflows/words-title-copy-fix.yml
          git config user.name "Atlas Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add shared/compass-catalog-data.js compass/words-that-stick/subject-data.js
          git commit -m "Shorten Words That Stick title"
          git push origin HEAD:astra-greenfield
