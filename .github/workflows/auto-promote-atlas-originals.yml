name: One-time Atlas Original auto-promotion

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-promote-atlas-originals.yml'

permissions:
  contents: write

jobs:
  patch-compass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/auto_promote_atlas_originals.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compass/index.html
          git diff --cached --check
          git commit -m "Auto-promote active Atlas Originals into session subjects"
          git push origin HEAD:main

# retry after CSS matcher fix
