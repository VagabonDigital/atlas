name: Batch 5 SharedWorker Experiment

on:
  push:
    branches:
      - experiment/service-worker-subject-builds

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full Atlas regression suite
        run: |
          failed=0

          for test_file in tests/*.test.js; do
            echo "::group::${test_file}"

            if node "${test_file}"; then
              echo "PASS ${test_file}"
            else
              echo "FAIL ${test_file}"
              failed=1
            fi

            echo "::endgroup::"
          done

          exit "${failed}"
