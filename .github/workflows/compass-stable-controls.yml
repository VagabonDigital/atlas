name: Temporary Compass stable controls

on:
  push:
    paths:
      - '.github/compass_stable_controls.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply guarded Compass controls patch
        run: python .github/atlas_patch_compass_stable_controls.py

      - name: Validate stable first-paint controls
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('compass/index.html').read_text(encoding='utf-8')
          assert 'function ensureCompassCloudAuthorityReady()' in text
          assert "'atlas:compass-cloud-authority-ready'" in text
          assert "'.subject-library button'" in text
          assert "'subject-card-manage-btn'" in text
          assert 'canCreate: true,' in text
          assert 'canManageCategory: true,' in text
          assert 'canAdd: true' in text
          assert 'canCreate:\n                  !cloudAuthorityPending' not in text
          assert 'canAdd:\n              !cloudAuthorityPending' not in text
          assert text.count('const managementHtml =\n          \'<div class="subject-card-management">\' +') == 2
          PY

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/atlas_patch_compass_stable_controls.py
          rm -f .github/compass_stable_controls.trigger
          rm -f .github/workflows/compass-stable-controls.yml

      - name: Commit and push product change
        run: |
          git config user.name "Atlas Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html .github
          git diff --cached --check
          git commit -m "Stabilize Compass first-paint controls"
          git push origin HEAD:main
