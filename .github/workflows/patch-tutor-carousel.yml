name: One-time Tutor Layer mobile carousel fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tutor-carousel.yml'

permissions:
  contents: write

jobs:
  patch-tutor-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make mobile teaching-library carousel free-scroll at Compass card size
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tutors/index.html')
          text = path.read_text()

          old = (
              "      .library-demo-row {\n"
              "        grid-auto-columns: min(84vw, 350px);\n"
              "        gap: 12px;\n"
              "        margin-inline: -15px;\n"
              "        padding-inline: 15px;\n"
              "        padding-bottom: 8px;\n"
              "        scroll-padding-inline: 15px;\n"
              "      }\n"
              "\n"
              "      .library-demo-card {\n"
              "        min-height: 230px;\n"
              "      }\n"
          )

          new = (
              "      .library-demo-row {\n"
              "        grid-auto-columns: 446px;\n"
              "        gap: 16px;\n"
              "        margin-inline: -15px;\n"
              "        padding-inline: 15px;\n"
              "        padding-bottom: 8px;\n"
              "        scroll-padding-inline: 0;\n"
              "        scroll-snap-type: none;\n"
              "      }\n"
              "\n"
              "      .library-demo-card {\n"
              "        min-height: 230px;\n"
              "        scroll-snap-align: none;\n"
              "      }\n"
          )

          if text.count(old) == 1:
              path.write_text(text.replace(old, new, 1))
          elif text.count(new) == 1:
              print('Tutor Layer mobile carousel already patched.')
          else:
              raise SystemExit(
                  f'Expected one current or patched mobile carousel block; '
                  f'found old={text.count(old)}, new={text.count(new)}'
              )
          PY
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Tutor Layer change needed."
            exit 0
          fi
          git commit -m "Fix Tutor Layer mobile library carousel"
          git push origin HEAD:main
