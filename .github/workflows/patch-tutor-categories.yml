name: One-time Tutor Layer category sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tutor-categories.yml'

permissions:
  contents: write

jobs:
  patch-tutor-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync Tutor Layer creator categories with Compass
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tutors/index.html')
          text = path.read_text()

          old_categories = '''      var demoCategories = [
        { label: "Current affairs", cue: "Live web · ~15 sec", mode: "current-affairs" },
        { label: "Science & Nature", cue: "Real phenomena", mode: "science-nature" },
        { label: "Technology & Future", cue: "What’s coming next", mode: "technology-future" },
        { label: "Culture & Society", cue: "How people live", mode: "culture-society" },
        { label: "History & Civilization", cue: "Specific past worlds", mode: "history-civilization" },
        { label: "Business & Politics", cue: "Power, markets, systems", mode: "business-politics" },
        { label: "Travel & Experiences", cue: "Places and encounters", mode: "travel-experiences" },
        { label: "Language & Communication", cue: "How we use language", mode: "culture-society", topicFocus: "language, communication, linguistics and practical English learning" }
      ];'''

          new_categories = '''      var demoCategories = [
        { label: "Surprise me", cue: "Something unexpected", mode: "surprise" },
        { label: "Current affairs", cue: "Live web · ~15 sec", mode: "current-affairs" },
        { label: "Science & Nature", cue: "Real phenomena", mode: "science-nature" },
        { label: "Technology & Future", cue: "What’s coming next", mode: "technology-future" },
        { label: "Culture & Society", cue: "How people live", mode: "culture-society" },
        { label: "History & Civilization", cue: "Specific past worlds", mode: "history-civilization" },
        { label: "Business & Politics", cue: "Power, markets, systems", mode: "business-politics" },
        { label: "Travel & Experiences", cue: "Places and encounters", mode: "travel-experiences" }
      ];'''

          old_status = '''        setResultCardStatus(
          category.mode === "current-affairs"
            ? "Checking what’s current… Usually about 15 seconds"
            : "Finding a " + category.label.toLowerCase() + " idea…",
          true
        );'''

          new_status = '''        setResultCardStatus(
          category.mode === "current-affairs"
            ? "Checking what’s current… Usually about 15 seconds"
            : category.mode === "surprise"
              ? "Finding something unexpected…"
              : "Finding a " + category.label.toLowerCase() + " idea…",
          true
        );'''

          if text.count(old_categories) != 1:
              raise SystemExit(f'Expected one Tutor Layer category array, found {text.count(old_categories)}')
          if text.count(old_status) != 1:
              raise SystemExit(f'Expected one Tutor Layer category status block, found {text.count(old_status)}')

          text = text.replace(old_categories, new_categories, 1)
          text = text.replace(old_status, new_status, 1)
          path.write_text(text)
          PY
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git diff --cached --check
          git commit -m "Sync Tutor Layer creator categories with Compass"
          git push origin HEAD:main
