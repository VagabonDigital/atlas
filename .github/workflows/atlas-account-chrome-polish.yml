name: Atlas account chrome polish

on:
  push:
    paths:
      - '.github/workflows/atlas-account-chrome-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply account chrome polish
        run: |
          python .github/atlas_patch_account_chrome_polish.py

      - name: Validate runtime syntax
        run: |
          node --check shared/atlas-account-chrome.js
          node --check shared/atlas-account-gate.js
          node --check shared/atlas-content-registry.js
          node --check tests/atlas-account-chrome-contract.test.js

      - name: Run Stage 2 account proofs
        run: |
          node tests/atlas-access-contract.test.js
          node tests/atlas-account-gate-contract.test.js
          node tests/atlas-account-chrome-contract.test.js
          node tests/atlas-return-intent-contract.test.js
          node tests/atlas-account-gate-return-intent.test.js
          node tests/atlas-return-handoff-contract.test.js

      - name: Verify polish boundaries
        run: |
          grep -q "mobile-header-btn'" shared/atlas-account-chrome.js
          grep -q "spine-btn'" shared/atlas-account-chrome.js
          grep -q "MutationObserver" shared/atlas-account-chrome.js
          grep -q "Gate.closeAccountMenu()" shared/atlas-account-chrome.js
          grep -q "focus({ preventScroll: true })" shared/atlas-account-gate.js
          grep -q "atlas-inside-account-action\[hidden\]" shared/atlas-account-chrome.css
          grep -q "accountchrome2" shared/atlas-content-registry.js
          grep -q "accountchrome2" tutors/index.html
          grep -q "accountchrome2" index.html
          grep -q "accountchrome2" compass/index.html
          grep -q "accountchrome2" arcade/index.html

      - name: Commit polish and remove runner
        run: |
          rm -f .github/workflows/atlas-account-chrome-polish.yml
          rm -f .github/atlas_patch_account_chrome_polish.py
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Polish account chrome behavior and loading"
          git push origin main
