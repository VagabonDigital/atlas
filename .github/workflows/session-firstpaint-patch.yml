name: Session first-paint patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/session-firstpaint-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run session first-paint patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to current main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Patch Compass and Arcade first paint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('compass/index.html'),
              Path('arcade/index.html'),
          ]

          html_old = '<html lang="en">'
          html_new = '<html lang="en" class="atlas-session-fonts-pending">'

          viewport_anchor = '''  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">'''
          viewport_replacement = '''  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <style>\n    html.atlas-session-fonts-pending body {\n      visibility: hidden;\n    }\n  </style>'''

          font_anchor = '''  <link\n    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap"\n    rel="stylesheet">'''

          gate_script = '''  <link\n    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap"\n    rel="stylesheet">\n  <script>\n    (function () {\n      var root = document.documentElement;\n      var released = false;\n      var sessionFont = null;\n      var safetyTimer = window.setTimeout(release, 1500);\n\n      function release() {\n        if (released) return;\n        released = true;\n        window.clearTimeout(safetyTimer);\n        window.requestAnimationFrame(function () {\n          root.classList.remove('atlas-session-fonts-pending');\n        });\n      }\n\n      if (document.fonts && typeof document.fonts.load === 'function') {\n        sessionFont = document.fonts.load('500 13px "DM Sans"');\n      }\n\n      function finishFirstPaint() {\n        Promise.resolve(sessionFont).then(release, release);\n      }\n\n      if (document.readyState === 'loading') {\n        document.addEventListener(\n          'DOMContentLoaded',\n          finishFirstPaint,\n          { once: true }\n        );\n      } else {\n        finishFirstPaint();\n      }\n    })();\n  </script>'''

          for path in paths:
              text = path.read_text(encoding='utf-8')

              for old, new, label in [
                  (html_old, html_new, 'html pending class'),
                  (viewport_anchor, viewport_replacement, 'pending visibility gate'),
                  (font_anchor, gate_script, 'session font readiness gate'),
              ]:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f'{path}: expected 1 exact match for {label}, found {count}'
                      )
                  text = text.replace(old, new, 1)

              required = [
                  'class="atlas-session-fonts-pending"',
                  'html.atlas-session-fonts-pending body',
                  'document.fonts.load(\'500 13px "DM Sans"\')',
                  "root.classList.remove('atlas-session-fonts-pending')",
                  'finishFirstPaint',
                  'window.setTimeout(release, 1500)',
              ]
              for needle in required:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing expected result: {needle}')

              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/session-firstpaint-patch.yml

      - name: Validate diff
        run: |
          git add compass/index.html arcade/index.html .github/workflows/session-firstpaint-patch.yml
          git diff --cached --check
          git diff --cached --stat
          grep -Fq 'class="atlas-session-fonts-pending"' compass/index.html
          grep -Fq 'class="atlas-session-fonts-pending"' arcade/index.html
          grep -Fq 'document.fonts.load('\''500 13px "DM Sans"'\'')' compass/index.html
          grep -Fq 'document.fonts.load('\''500 13px "DM Sans"'\'')' arcade/index.html

      - name: Commit and push
        run: |
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git commit -m "Stabilize hub session first paint"
          git push origin HEAD:main
