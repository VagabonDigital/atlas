name: One-time Atlas welcome screen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-atlas-welcome.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add first-visit welcome screen
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pairs = [
              ('welcome anti-flash state', 'ICAgICAgZG9jdW1lbnQuZG9jdW1lbnRFbGVtZW50LmRhdGFzZXQudGhlbWUgPSAobSA9PT0gJ25pZ2h0JykgPyAnbmlnaHQnIDogJ2xpZ2h0JzsKCiAgICAgIC8vIFJlZ2lzdGVyIGFuaW1hdGFibGUgY3VzdG9tIGNvbG9ycyBpbiBKUyByYXRoZXIgdGhhbiBpbmxpbmUgQHByb3BlcnR5Lg==', ''),
              ('welcome styles', 'ICA8L3N0eWxlPgoKICA8IS0tIFNoYXJlZCwgZml4ZWQgZ2VvbWV0cnkgZm9yIHRoZSBBdGxhcyAvIENvbXBhc3MgLyBBcmNhZGUgcmFpbCAtLT4=', ''),
              ('welcome markup', 'PGJvZHkgZGF0YS1hdGxhcy13b3JsZD0iYXRsYXMiIGRhdGEtYXRsYXMtc3VyZmFjZT0iaHViIj4KICA8ZGl2IGNsYXNzPSJhdG1vc3BoZXJlLWxheWVyIiBpZD0iYXRtb3NwaGVyZS1sYXllciIgYXJpYS1oaWRkZW49InRydWUiPjwvZGl2Pg==', '')
          ]
          for label, old64, new64 in pairs:
              old = base64.b64decode(old64).decode('utf-8')
              new = base64.b64decode(new64).decode('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add first-visit Atlas welcome screen"
          git push origin HEAD:main
