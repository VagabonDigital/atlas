name: Atlas clear feedback patch

on:
  push:
    paths:
      - '.github/workflows/atlas-clear-feedback-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply guarded patch
        env:
          PATCH_B64: "  "
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/atlas_patch.py
          python /tmp/atlas_patch.py

      - name: Commit product change and remove runner
        run: |
          rm -f .github/workflows/atlas-clear-feedback-patch.yml
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Confirm Compass activity clears"
          git push origin main
