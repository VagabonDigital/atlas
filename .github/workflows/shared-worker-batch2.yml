name: SharedWorker Integration Batch 2

on:
  push:
    branches:
      - integration/shared-worker-subject-builds

jobs:
  batch2-subject-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Batch 2 loader regression
        run: |
          set -euo pipefail
          node tests/atlas-subject-loader-foreground-handoff.test.js
