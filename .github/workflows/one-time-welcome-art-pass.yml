name: One-time welcome artwork pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-welcome-art-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine welcome artwork composition
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          markup = base64.b64decode('').decode('utf-8')
          override = base64.b64decode('').decode('utf-8')
          hydrator = base64.b64decode('').decode('utf-8')

          section_pattern = re.compile(r'  <section class="atlas-welcome-screen".*?</section>', re.S)
          text, count = section_pattern.subn(markup, text, count=1)
          if count != 1:
              raise SystemExit(f'welcome section: expected 1 match, found {count}')

          text = re.sub(
              r'\n    /\* ATLAS WELCOME COMPOSITION OVERRIDE START \*/.*?'
              r'/\* ATLAS WELCOME COMPOSITION OVERRIDE END \*/\n?',
              '\n', text, flags=re.S
          )
          style_anchor = '  </style>\n\n  <!-- Shared, fixed geometry for the Atlas / Compass / Arcade rail -->'
          if text.count(style_anchor) != 1:
              raise SystemExit(f'style anchor: expected 1 match, found {text.count(style_anchor)}')
          text = text.replace(style_anchor, override + '\n  </style>\n\n  <!-- Shared, fixed geometry for the Atlas / Compass / Arcade rail -->', 1)

          text = re.sub(
              r'\n  <!-- ATLAS WELCOME ART HYDRATOR START -->.*?'
              r'<!-- ATLAS WELCOME ART HYDRATOR END -->\n?',
              '\n', text, flags=re.S
          )
          catalog_script = '  <script src="./shared/compass-catalog-data.js"></script>'
          if text.count(catalog_script) != 1:
              raise SystemExit(f'catalog script: expected 1 match, found {text.count(catalog_script)}')
          text = text.replace(catalog_script, catalog_script + '\n\n' + hydrator, 1)

          for required in [
              'data-compass-art="travel-route"',
              'data-compass-art="odyssey-voyage"',
              'data-compass-art="game-theory"',
              'class="welcome-mars-child"',
              'atlasWelcomeDriftOdyssey',
              'atlasWelcomeDriftGameTheory',
              'atlasWelcomeDriftMars'
          ]:
              if required not in text:
                  raise SystemExit('missing expected welcome element: ' + required)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          assert text.count('id="atlas-welcome-screen"') == 1
          assert text.count('ATLAS WELCOME ART HYDRATOR START') == 1
          section = re.search(r'<section class="atlas-welcome-screen".*?</section>', text, re.S).group(0)
          assert 'atlas-welcome-art--humour' not in section
          assert 'atlas-welcome-art--truth' not in section
          assert 'atlas-welcome-art--food' not in section
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine Atlas welcome artwork composition"
          git push origin HEAD:main
