name: Temporary Compass cloud bootstrap batch B

on:
  push:
    paths:
      - '.github/atlas_patch_compass_cloud_batch_b.py'
      - '.github/compass_cloud_batch_b.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply guarded Compass Batch B patch
        run: python .github/atlas_patch_compass_cloud_batch_b.py

      - name: Validate Batch B
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          compass = Path('compass/index.html').read_text(encoding='utf-8')
          registry = Path('shared/atlas-content-registry.js').read_text(encoding='utf-8')

          assert "root.dataset.atlasCompassFirstPaintReady = 'true';" in compass
          assert "'atlas:compass-first-paint-ready'" in compass
          assert 'atlas-content-registry.js?v=20260916-compassperf1' in compass
          assert "window.requestAnimationFrame(function () {\n          root.classList.remove('atlas-session-fonts-pending');" not in compass

          assert 'function isCompassHubPath()' in registry
          assert 'function loadRuntimeScript(src, globalName)' in registry
          assert 'async function loadCompassHubCloudAuthorityScripts()' in registry
          assert 'function scheduleCompassHubCloudAuthorityScripts()' in registry
          assert registry.count('scheduleCompassHubCloudAuthorityScripts();') == 1
          assert "requestCompassHubRefresh('cloud-authority')" in registry
          assert "document.write(scripts.join(''))" in registry
          PY

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/atlas_patch_compass_cloud_batch_b.py
          rm -f .github/compass_cloud_batch_b.trigger
          rm -f .github/workflows/compass-cloud-batch-b.yml

      - name: Commit and push product change
        run: |
          git config user.name "Atlas Patch Runner"
          git config user.email "actions@users.noreply.github.com"
          git add compass/index.html shared/atlas-content-registry.js .github
          git diff --cached --check
          git commit -m "Defer Compass signed-in cloud bootstrap"
          git push origin HEAD:main
