name: Atlas final header first-paint polish

on:
  push:
    paths:
      - '.github/workflows/atlas-final-header-first-paint.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Apply hub account shells
        run: python .github/atlas_patch_hub_account_shells.py
      - name: Apply Inside Atlas theme SVG
        run: python .github/atlas_patch_inside_theme_svg.py
      - name: Validate syntax
        run: |
          node --check shared/atlas-account-chrome.js
          node --check shared/atlas-content-registry.js
          node --check tests/atlas-account-chrome-contract.test.js
      - name: Run account chrome proof
        run: node tests/atlas-account-chrome-contract.test.js
      - name: Verify first-paint boundaries
        run: |
          grep -Fq 'data-atlas-account-control="desktop" data-account-state="pending"' index.html
          grep -Fq 'data-atlas-account-control="desktop" data-account-state="pending"' compass/index.html
          grep -Fq 'data-atlas-account-control="desktop" data-account-state="pending"' arcade/index.html
          grep -Fq 'atlasAccountHint' index.html
          grep -Fq 'atlasAccountHint' compass/index.html
          grep -Fq 'atlasAccountHint' arcade/index.html
          grep -Fq 'appearance-icon appearance-icon--moon' tutors/index.html
          grep -Fq 'appearance-icon appearance-icon--sun' tutors/index.html
          ! grep -Fq 'aria-hidden="true">☼</span>' tutors/index.html
      - name: Commit polish and remove runner
        run: |
          rm -f .github/workflows/atlas-final-header-first-paint.yml
          rm -f .github/atlas_patch_hub_account_shells.py
          rm -f .github/atlas_patch_inside_theme_svg.py
          git config user.name "Atlas Patch Runner"
          git config user.email "atlas-patch@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stabilize account and theme controls at first paint"
          git push origin main
