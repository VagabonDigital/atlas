name: Batch 3 runtime audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch3-runtime-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime wrapper references
        run: |
          echo '--- core/sync filename references ---'
          grep -R --line-number --exclude-dir=.git -E 'atlas-(content-registry|session-panel)-core\.js|atlas-tutor-content-cloud-(authority-core|sync)\.js' . || true
          echo '--- direct renderHub calls outside Compass hub ---'
          grep -R --line-number --exclude-dir=.git -E 'renderHub\s*\(' shared account arcade memory tutors index.html || true
          echo '--- canonical runtime references ---'
          grep -R --line-number --exclude-dir=.git -E 'atlas-(content-registry|session-panel|tutor-content-cloud-authority)\.js' . || true

# audit-trigger: 2
