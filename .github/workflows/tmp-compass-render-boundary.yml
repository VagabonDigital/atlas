name: Temporary Compass render boundary fix

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp-compass-render-boundary-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Compass render and refresh boundaries
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python .github/tmp-compass-render-boundary.py
          git rm -f \
            .github/tmp-compass-render-boundary.py \
            .github/workflows/tmp-compass-render-boundary.yml \
            .github/tmp-compass-render-boundary-trigger
          git config user.name 'Atlas patch bot'
          git config user.email 'atlas-patch-bot@users.noreply.github.com'
          git add \
            compass/index.html \
            shared/atlas-content-registry-core.js \
            shared/atlas-content-registry.js \
            shared/atlas-learner-continuity-cloud-authority.js \
            shared/atlas-shared-continuity-cloud-authority.js \
            shared/atlas-shared-session-subjects-cloud-authority.js
          git diff --check --cached
          git commit -m 'Stabilize Compass render boundary'
          git push origin main
