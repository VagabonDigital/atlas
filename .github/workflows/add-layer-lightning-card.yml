name: Add Layer lightning card

on:
  push:
    paths:
      - '.github/workflows/add-layer-lightning-card.yml'

permissions:
  contents: write

jobs:
  update-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add lightning card after Mars card
        shell: python
        run: |
          from pathlib import Path

          path = Path('tutors/index.html')
          text = path.read_text(encoding='utf-8')

          title = 'Lightning That Shoots Into Space'
          if title in text:
              print('Lightning card already present; nothing to do.')
              raise SystemExit(0)

          mars_title = 'The First Human Born on Mars'
          marker = text.find(mars_title)
          if marker < 0:
              raise SystemExit('Mars card title not found')

          article_end = text.find('</article>', marker)
          if article_end < 0:
              raise SystemExit('Mars card closing article not found')
          article_end += len('</article>')

          card = r'''

            <article class="library-demo-card" tabindex="0">
              <div class="library-demo-art" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M28 116c0-7 6-12 13-12 2-10 10-16 20-16 8 0 15 4 19 11 3-3 7-5 12-5 9 0 16 7 16 16 8 0 14 4 14 10 0 2-1 4-2 5H33c-3-2-5-5-5-9Z" stroke-width="2.4"></path><path d="M20 125h136" stroke-width="2"></path><path d="M89 101 78 88l13-15-5-13 15-17-5-13 10-16" stroke-width="3.2"></path><path d="M91 74 72 63 58 48M86 60l-1-18-12-12M96 57l17-14 14-17M101 43l20-8 10-13M106 31l3-14" stroke-width="2.2"></path><path d="M78 88 61 80 48 68M104 85l17-10 15-15M84 70l-13-5-7-12M99 69l10-4 11-11" stroke-width="1.7"></path><path d="M58 48 49 39M72 63l-4-15M113 43l5 9M121 35l12 3" stroke-width="1.5"></path></g></svg>
              </div>

              <h3 class="library-demo-title">Lightning That Shoots Into Space</h3>
              <p class="library-demo-copy">Most lightning strikes downward. But above powerful storms, strange flashes called sprites and blue jets shoot upward through the atmosphere, creating enormous bursts of light that can reach far beyond the clouds.</p>

              <div class="library-demo-footer">
                <span class="library-demo-explore">Explore <span aria-hidden="true">→</span></span>
              </div>
            </article>'''

          text = text[:article_end] + card + text[article_end:]
          path.write_text(text, encoding='utf-8')
      - name: Commit Layer update
        run: |
          if git diff --quiet -- tutors/index.html; then
            echo "No Layer change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutors/index.html
          git commit -m "Add lightning subject to Tutor Layer carousel"
          git push
