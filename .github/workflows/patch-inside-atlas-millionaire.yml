name: Patch Inside Atlas Millionaire

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-inside-atlas-millionaire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Millionaire to Inside Atlas carousel
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('inside-atlas/index.html')
          text = page.read_text(encoding='utf-8')

          if 'title: "Millionaire"' not in text:
              needle = '''      var teachArcadeGames = [\n        {\n          title: "Would You Rather",'''
              replacement = '''      var teachArcadeGames = [\n        {\n          title: "Millionaire",\n          premise: "Ten questions. Three lifelines. Decide how far to climb toward a million.",\n          unit: "10 questions",\n          cover: "../assets/hub/millionaire.png"\n        },\n        {\n          title: "Would You Rather",'''
              if needle not in text:
                  raise SystemExit('teachArcadeGames insertion point not found')
              page.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          Path('.github/workflows/patch-inside-atlas-millionaire.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "Atlas patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Millionaire to Inside Atlas Arcade carousel"
          git push
